# XcodeGen spec for the Right Suite iOS app template. It carries NO product behaviour and no brand.
# Every bundle id, the App Group, and the iCloud container below are PLACEHOLDERS: rename them
# (search "com.rightsuite.template") before shipping.
# Generate with: xcodegen generate --spec project.yml
name: RightAppTemplate
options:
  bundleIdPrefix: com.rightsuite.template
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  RightKitSwift:
    # Git URL + EXACT tag, per docs/RIGHTKIT-SHARED-PACKAGES.md (Swift section). Never a local path:
    # scripts/check-package-pin.sh fails if one appears.
    # Tag 0.3.0 exists on the distribution repo (verified 2026-10-10 with `git ls-remote --tags`),
    # so a fresh clone resolves it. The pin is deliberately exact and lags newer published tags:
    # raise it only with a template build proof (scripts/build-with-local-mirror.sh builds the
    # current RightKitSwift source under the pinned tag name, for use before a pin is raised).
    url: https://github.com/bogusyogi/rightkit-swift.git
    exactVersion: 0.3.0
targets:
  RightAppTemplate:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/Shared, Sources/ShareShared, Config/Template.storekit]
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rightsuite.template]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.rightsuite.template]
        com.apple.developer.icloud-services: [CloudKit]
    dependencies:
      - package: RightKitSwift
        product: RightKitLicense
      - package: RightKitSwift
        product: RightKitDiagnostics
      - package: RightKitSwift
        product: RightKitArtifacts
      - package: RightKitSwift
        product: RightKitStore
      - package: RightKitSwift
        product: RightKitImportQueue
      - package: RightKitSwift
        product: RightKitLiveActivity
      - package: RightKitSwift
        product: RightKitWatchBridge
      - package: RightKitSwift
        product: RightKitPurchases
      - package: RightKitSwift
        product: RightKitCloudSync
      - target: ShareExtension
      - target: Widgets
      - target: WatchApp
    info:
      path: Config/App-Info.plist
      properties:
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightsuite.template.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      storeKitConfiguration: Config/Template.storekit
      testTargets: [RightAppTemplateUITests]
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [Sources/ShareExtension, Sources/Shared, Sources/ShareShared]
    entitlements:
      path: Config/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rightsuite.template]
    dependencies:
      - package: RightKitSwift
        product: RightKitStore
      - package: RightKitSwift
        product: RightKitImportQueue
    info:
      path: Config/ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightsuite.template.app.share
        SKIP_INSTALL: "YES"
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Sources/Widgets, Sources/Shared]
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rightsuite.template]
    dependencies:
      - package: RightKitSwift
        product: RightKitStore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Widgets
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightsuite.template.app.widgets
        SKIP_INSTALL: "YES"
  WatchApp:
    type: application
    platform: watchOS
    sources: [Sources/WatchApp]
    entitlements:
      path: Config/WatchApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rightsuite.template]
    dependencies:
      - package: RightKitSwift
        product: RightKitWatchBridge
    info:
      path: Config/WatchApp-Info.plist
      properties:
        CFBundleDisplayName: Template
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rightsuite.template.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightsuite.template.app.watchkitapp
        SKIP_INSTALL: "YES"
  # End-to-end only (workspace rule): XCUITest drives the real app. No unit-test target.
  RightAppTemplateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: RightAppTemplate
    dependencies:
      - target: RightAppTemplate
