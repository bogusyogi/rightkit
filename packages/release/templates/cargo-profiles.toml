# RightKit standard Cargo profile for every app workspace (Adrian, 2026-10-16; GATE-CONTRACT GC-A01, GC-A07).
# One build output and one warm cache per app per host: every gate compile (check, clippy, rustdoc, the test compile and
# both installers, dev and release) uses [profile.release] for the host's target (cross-targets.mjs oneOutput). The dev
# installer is the release profile plus `qa-native`. An app carries no [profile.dev], [profile.test] or other custom
# profile: the RightKit ownership scanner refuses them. `release-iterate` is retired. Panic behaviour is the same in every
# app: unwind. Keep the app's existing [profile.release] optimization keys, but set panic = "unwind".

[profile.release]
panic = "unwind"
