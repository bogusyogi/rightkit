# RightKit standard Cargo profiles for every app workspace (Adrian, 2026-10-16; Astra-reviewed option C).
# One development profile: Cargo's built-in `dev`, used by build, test, check, clippy and `right-release dev`.
# `release-iterate` is retired. Panic behaviour is the same in every app: unwind.
# Copy these tables verbatim into the app's workspace-root Cargo.toml; the RightKit ownership scanner
# flags any deviation. Keep the app's existing [profile.release] optimization keys, but set panic = "unwind".

[profile.dev]
opt-level = 1
debug = "line-tables-only"
strip = "none"
debug-assertions = true
overflow-checks = true
lto = "off"
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

# Dependencies: non-incremental so sccache can cache them across apps.
[profile.dev.package."*"]
incremental = false
codegen-units = 16

# No test-profile overrides: test inherits dev.
# The retired release-iterate profile must not appear: delete it and its package overrides.

[profile.release]
panic = "unwind"
