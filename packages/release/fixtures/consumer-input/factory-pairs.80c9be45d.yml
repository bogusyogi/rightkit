# Factory pair sweeps on GitHub runners: long batches (many cases, N runs) sharded one case per job, so
# cases run in parallel across runners. Hand-written (public repository: builds run only in Actions; docs/rules/public-ci.md).
# Per case: a Mac job (xcode-27) captures the Mac reference at the pinned scale 2.5 (decision C12, ScalePin.swift) and a Windows job
# (windows-2025) builds the Windows side against the pinned renderer and captures in the runner's interactive session. The runner's display
# cannot reach 240 dpi, so the Windows capture host passes the explicit render scale 2.5 to the renderer (ABI 0.10, decision H17).
# A compare job applies pair.py's gates (pixel, semantic, scale guard) and writes results.jsonl beside the runs/ tree.
# Fetch a run locally with: python3 factory/tools/ci_fetch.py <run-id>   (downloads only; builds nothing).
# No secrets, no signing, no publication. Read-only repository permissions; actions: read lets the Windows job fetch the pinned renderer artifact.
name: factory-pairs

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case directories, repository-relative (whitespace or comma separated). Empty: use cases_file."
        required: false
        default: ""
        type: string
      cases_file:
        description: "Repository-relative list file, one case per line (# comments allowed). Used when cases is empty."
        required: false
        default: ""
        type: string
      runs:
        description: "Runs per case (1-60)"
        required: true
        default: "3"
        type: string
      max_parallel:
        description: "Concurrent case jobs per platform"
        required: false
        default: "6"
        type: string
      renderer_label:
        description: "Pinned renderer label (factory/tools/ci_pair.py RENDERERS)"
        required: false
        default: "renderer-0.10-c13b62a4"
        type: string
      flicker_probe:
        description: "Windows capture: also BitBlt the screen at each settle poll, logged beside PrintWindow (flicker-*.tsv). Diagnostic; off for normal runs."
        required: false
        default: false
        type: boolean
      screen_record:
        description: "Windows interact capture: record per run, diagnostic, off for normal runs. none = no recording. gdigrab = whole desktop at 60 fps (ffmpeg gdigrab, ffv1) to windows/record-NN.mkv. wgc = every Windows.Graphics.Capture frame of the host HWND (FactoryWGCRecord.exe, factory/native/windows/wgc-record) to windows/record-NN-wgc/ (frames.jsonl + PNGs). Each has a record-NN.json sidecar."
        required: false
        default: "none"
        type: choice
        options:
          - none
          - gdigrab
          - wgc

permissions:
  contents: read
  actions: read

concurrency:
  group: factory-pairs-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      ts: ${{ steps.plan.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            factory/pipeline
            factory/tools
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      # Guards before any capture (the mac and windows jobs need plan): a fixed capture lease or a missing render scale fails the run here.
      - name: Guards (fixed capture lease, render scale)
        run: |
          set -euo pipefail
          python3 factory/tools/pass_capture_lease.py --check
          python3 factory/tools/pass_render_scale.py --check
      - id: plan
        env:
          CASES: ${{ inputs.cases }}
          CASES_FILE: ${{ inputs.cases_file }}
          RUNS: ${{ inputs.runs }}
        run: python3 factory/tools/ci_pair.py plan

  mac:
    needs: [plan]
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            factory/resources/fonts
            factory/pipeline
            factory/tools
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Record runner and require the local toolchain (Swift 6.4.0)
        run: |
          set -euo pipefail
          sw_vers
          v="$(xcrun swiftc --version 2>&1 | head -n 1)"
          echo "$v"
          case "$v" in *"Swift version 6.4 (swiftlang-6.4.0"*) ;; *) echo "::error::Mac toolchain is not Swift 6.4.0 (local: Apple Swift version 6.4 (swiftlang-6.4.0.34.1)): $v"; exit 1 ;; esac
      # Reduce Motion and the other accessibility display settings change SwiftUI's transitions (a move becomes a crossfade). The
      # reference is the local Mac with all four off. Logs before/after, sets any on setting off, and fails closed before capture.
      - name: Mac accessibility environment (log, match the reference, fail closed)
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pairs"
          bash factory/tools/mac-accessibility.sh "$RUNNER_TEMP/pairs/mac-accessibility.txt"
      - name: Mac capture (pinned scale 2.5)
        env:
          CASE: ${{ matrix.case }}
          RUNS: ${{ inputs.runs }}
          TS: ${{ needs.plan.outputs.ts }}
          SWIFTRIGHT_CACHE_ROOT: ${{ runner.temp }}/swiftright-cache
          SWIFTRIGHT_CACHE_MOVED: ${{ runner.temp }}/swiftright-cache-moved
        run: |
          set -euo pipefail
          python3 factory/tools/ci_pair.py mac --case "$CASE" --runs "$RUNS" --ts "$TS" --root "$RUNNER_TEMP/pairs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac-${{ matrix.idx }}
          path: ${{ runner.temp }}/pairs
          retention-days: 30
          if-no-files-found: ignore

  windows:
    needs: [plan]
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable Windows long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packages
            probes/sr0-s/fresh-runtime
            factory/pipeline
            factory/tools
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Install Swift 6.4.0 (swift.org release installer, sha256 pinned as in scripts/release/windows-candidate.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.swift.org/swift-6.4.0-release/windows10/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-windows10.exe'
          $pin = '76169A85BCBA82854A0CD8F9655FFB74B3758D60C35A245457510095F2823C03'
          $installer = Join-Path $env:RUNNER_TEMP 'swift-6.4.0-RELEASE-windows10.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actual -ne $pin) { throw "Swift installer sha256 $actual does not match the pin $pin" }
          $log = Join-Path $env:RUNNER_TEMP 'swift-install.log'
          $p = Start-Process -FilePath $installer -ArgumentList @('/quiet', '/norestart', '/log', $log) -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { if (Test-Path $log) { Get-Content $log -Tail 60 }; throw "Swift installer exit code $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          if (-not (Test-Path $root)) { $root = Join-Path $env:ProgramFiles 'Swift' }
          $swift = Get-ChildItem -Path (Join-Path $root 'Toolchains') -Recurse -Filter swift.exe | Select-Object -First 1
          if (-not $swift) { throw 'swift.exe not found after the installer ran' }
          # The installer sets machine/user environment variables (windows-candidate.ps1 Merge-InstallerEnvironment); steps only inherit
          # PATH from GITHUB_PATH, so export the rest too. Values are not printed.
          $exported = @()
          foreach ($level in 'Machine', 'User') {
            [Environment]::GetEnvironmentVariables($level).GetEnumerator() | Where-Object { $_.Name -ne 'Path' -and $_.Name -match '^[A-Za-z_][A-Za-z0-9_]*$' -and ([string]$_.Value) -notmatch "[\r\n]" } | ForEach-Object {
              Add-Content -Path $env:GITHUB_ENV -Value "$($_.Name)=$($_.Value)"; $exported += $_.Name
            }
          }
          Write-Host "exported installer env: $(($exported | Where-Object { $_ -match 'SWIFT|SDK|VC|WIN|UCRT|Platform' }) -join ', ')"
          Get-ChildItem -Path $root -Depth 2 -Directory | ForEach-Object { Write-Host $_.FullName }
          $runtime = Get-ChildItem -Path (Join-Path $root 'Runtimes') -Directory | ForEach-Object { Join-Path $_.FullName 'usr\bin' } | Where-Object { Test-Path (Join-Path $_ 'swiftCore.dll') } | Select-Object -First 1
          if (-not $runtime) { $runtime = Join-Path $root 'Runtimes\6.4.0\usr\bin' }
          Write-Host "swift runtime bin: $runtime (swiftCore.dll present: $(Test-Path (Join-Path $runtime 'swiftCore.dll')))"
          Add-Content -Path $env:GITHUB_PATH -Value $swift.DirectoryName
          if ($runtime) { Add-Content -Path $env:GITHUB_PATH -Value $runtime }
          & $swift.FullName --version
      - name: Toolchain
        run: swift --version
      # ffmpeg is not in the windows-2025 image readme (checked 17 Oct 2026), so the screen recording installs it from Chocolatey (Chocolatey 2.7.4 is listed).
      # Runs only when the screen_record input is gdigrab; the version is logged here and written into each record-NN.json sidecar.
      - name: Install ffmpeg for the screen recording (screen_record only)
        if: ${{ inputs.screen_record == 'gdigrab' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg exit code $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
          $env:Path = 'C:\ProgramData\chocolatey\bin;' + $env:Path
          $ff = Get-Command ffmpeg -ErrorAction Stop
          $fp = Get-Command ffprobe -ErrorAction Stop
          Write-Host "ffmpeg: $($ff.Source)"
          & $ff.Source -hide_banner -version | Select-Object -First 1
          & $fp.Source -hide_banner -version | Select-Object -First 1
      # screen_record=wgc: compile the WGC recorder with the runner's Visual Studio (vswhere -> vcvars64.bat) into $RUNNER_TEMP\wgc-record and export its path
      # to the job as SWIFTRIGHT_WGC_RECORDER (read by job-interact.ps1). The compile log is printed; a failed compile fails the job before any capture.
      - name: Compile the WGC recorder (screen_record=wgc only)
        if: ${{ inputs.screen_record == 'wgc' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the C++ x64 tools found by vswhere' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "vcvars64.bat missing: $vcvars" }
          $outDir = Join-Path $env:RUNNER_TEMP 'wgc-record'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE 'factory\native\windows\wgc-record\wgc-record.cpp'
          $exe = Join-Path $outDir 'FactoryWGCRecord.exe'
          $bat = Join-Path $outDir 'build.bat'
          $line = "cl /nologo /std:c++17 /EHsc /O2 /W3 /DUNICODE /D_UNICODE `"$src`" /Fo`"$outDir\wgc-record.obj`" /Fe`"$exe`" /link /SUBSYSTEM:CONSOLE windowsapp.lib d3d11.lib dxgi.lib windowscodecs.lib ole32.lib"
          Set-Content -LiteralPath $bat -Value @('@echo off', "call `"$vcvars`" >nul", $line, 'exit /b %ERRORLEVEL%') -Encoding ASCII
          & cmd.exe /c $bat
          if ($LASTEXITCODE -ne 0) { throw "cl exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $exe)) { throw "FactoryWGCRecord.exe not produced at $exe" }
          Write-Host "wgc recorder: $exe sha256 $((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "SWIFTRIGHT_WGC_RECORDER=$exe"
      # The runner's display (Hyper-V: 1024x768 at 125% at most) cannot reach 240 dpi, so the capture host does not depend on it: it passes the
      # explicit render scale 2.5 through the public API (decision H17; HOST_SCALE_GUARD in the host log must read PASS). This step only logs
      # what the display is, so a result can be read against it. It cannot fail the job.
      - name: Display scale (log only)
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -Namespace Probe -Name Native -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetDpiForSystem(); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern int GetSystemMetrics(int i);'
          Write-Host "display: $([Probe.Native]::GetSystemMetrics(0))x$([Probe.Native]::GetSystemMetrics(1)) system dpi $([Probe.Native]::GetDpiForSystem()) (the capture host renders at the explicit scale 2.5 regardless)"
      - name: Stage the product tree (git archive HEAD)
        id: stage
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ci-work"
          mkdir -p "$work"
          # A stage attempt can die with a native exit (0x80000004) before Python prints anything (CI 38854967920, focus-state/shift-tab-v1; the
          # windows job then has no product stage). The stage is idempotent (ci_pair.py keeps an existing STAGE.json), so up to three attempts.
          for attempt in 1 2 3; do
            if python factory/tools/ci_pair.py stage --work "$work" > "$RUNNER_TEMP/stage-out.txt"; then break; fi
            echo "stage attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          { read -r name; read -r dest; } < "$RUNNER_TEMP/stage-out.txt"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - name: Pinned renderer (render-windows artifact)
        id: renderer
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.renderer_label }}
        run: |
          set -euo pipefail
          dll="$(python factory/tools/ci_pair.py renderer --label "$LABEL" --dest "$RUNNER_TEMP/renderer" | tail -n 1)"
          echo "dll=$dll" >> "$GITHUB_OUTPUT"
      - name: Windows build and interactive capture
        env:
          CASE: ${{ matrix.case }}
          RUNS: ${{ inputs.runs }}
          TS: ${{ needs.plan.outputs.ts }}
          LABEL: ${{ inputs.renderer_label }}
          STAGE_DIR: ${{ steps.stage.outputs.dest }}
          WORK: ${{ steps.stage.outputs.work }}
          DLL: ${{ steps.renderer.outputs.dll }}
          FLICKER_PROBE: ${{ inputs.flicker_probe }}
          SWIFTRIGHT_SCREEN_RECORD: ${{ (inputs.screen_record == 'gdigrab' || inputs.screen_record == 'wgc') && inputs.screen_record || '' }}
        run: |
          set -euo pipefail
          probe=()
          if [ "$FLICKER_PROBE" = "true" ]; then probe=(--flicker-probe); fi
          python factory/tools/ci_pair.py windows --case "$CASE" --runs "$RUNS" --ts "$TS" --root "$RUNNER_TEMP/pairs" \
            --work "$WORK" --stage-dir "$STAGE_DIR" --renderer "$DLL" --renderer-label "$LABEL" "${probe[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-${{ matrix.idx }}
          path: ${{ runner.temp }}/pairs
          retention-days: 30
          if-no-files-found: ignore

  compare:
    needs: [plan, mac, windows]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MATRIX: ${{ needs.plan.outputs.matrix }}
      RUNS: ${{ inputs.runs }}
      TS: ${{ needs.plan.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packages/SwiftRightHost/Assets
            factory/pipeline
            factory/tools
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: mac-*
          merge-multiple: true
          path: ${{ runner.temp }}/pairs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: windows-*
          merge-multiple: true
          path: ${{ runner.temp }}/pairs
      - name: Compare every case (pair.py gates)
        run: |
          set -uo pipefail
          pairs="$RUNNER_TEMP/pairs"
          mkdir -p "$pairs"
          : > "$pairs/results.jsonl"
          fail=0
          while IFS= read -r case; do
            if python3 factory/tools/ci_pair.py compare --case "$case" --runs "$RUNS" --ts "$TS" --root "$pairs" --results "$pairs/results.jsonl"; then
              :
            else
              fail=1
            fi
          done < <(echo "$MATRIX" | python3 -c 'import json,sys; [print(c["case"]) for c in json.load(sys.stdin)["include"]]')
          cat "$pairs/results.jsonl"
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compare-results
          path: ${{ runner.temp }}/pairs
          retention-days: 30
          if-no-files-found: ignore
