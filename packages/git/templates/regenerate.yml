# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: regenerate.yml | Template version: ${TEMPLATE_VERSION}
# Manual only. Runs the repository's regenerate script (derived artifacts,
# formatting, lockfile repair) and, when tracked files change, runs the test
# script on the result, pushes it to a right-git/regenerate-<run> branch and
# opens a pull request. It never writes to the default branch. Pull requests
# opened with the workflow token do not trigger pull_request workflows, which
# is why the checks run here and the PR body links this run.
name: ${ARTIFACT_PREFIX}-regenerate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${ARTIFACT_PREFIX}-regenerate
  cancel-in-progress: false
jobs:
  private-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::right-git: repository is private; managed public-only workflows must not run here."
          exit 1
  regenerate:
    needs: [private-repo-guard]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${NODE_PUBLISH_VERSION}
          package-manager-cache: false
${PACKAGE_MANAGER_SETUP}
      - run: ${INSTALL_COMMAND}
${OWNERSHIP_STEP}${SWIFT_PRIVATE_CONFIGURE_STEP}
      - name: Regenerate derived artifacts
        run: ${PM_RUN} ${REGENERATE_SCRIPT}
      - name: Detect regenerated files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Derived artifacts are already current."
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Test the regenerated tree
        if: steps.changes.outputs.changed == 'true'
        run: ${PM_RUN} test${SWIFT_PRIVATE_CLEANUP_STEP}
      - name: Open a pull request with the regenerated files
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHT_GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RIGHT_GIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="right-git/regenerate-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Regenerate derived artifacts"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$RIGHT_GIT_DEFAULT_BRANCH" --head "$branch" \
            --title "Regenerate derived artifacts" \
            --body "Opened by the right-git regenerate lane. The test script passed on this tree in $RIGHT_GIT_RUN_URL (pull requests opened with the workflow token do not trigger pull_request workflows)."
