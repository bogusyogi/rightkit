# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/release-candidate.yml | Template version: ${TEMPLATE_VERSION}
# Public CI always produces unsigned candidates. Opt-in finalization signs Windows
# through Azure OIDC & macOS through environment-scoped Apple credentials.
name: release-candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  candidate:
    needs: [private-repo-guard]
    strategy:
      fail-fast: false
      matrix:
${CANDIDATE_MATRIX}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
${PACKAGE_MANAGER_SETUP}
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
      - run: ${INSTALL_COMMAND}
      - name: Build unsigned release candidate
        run: ${PM_RUN} ${CANDIDATE_BUILD_SCRIPT}
        env:
          RIGHT_GIT_ARTIFACT_ROOT: ${{ runner.temp }}/${CANDIDATE_ARTIFACT_ROOT}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
      - name: Check unsigned release candidate
        run: ${PM_RUN} ${CANDIDATE_CHECK_SCRIPT}
        env:
          RIGHT_GIT_ARTIFACT_ROOT: ${{ runner.temp }}/${CANDIDATE_ARTIFACT_ROOT}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
      - name: Upload unsigned candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${ARTIFACT_PREFIX}-unsigned-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/${CANDIDATE_ARTIFACT_ROOT}/**
          if-no-files-found: error
${WINDOWS_SIGNING_JOB}
${MACOS_SIGNING_JOB}
${RELEASE_CHAIN_JOBS}
