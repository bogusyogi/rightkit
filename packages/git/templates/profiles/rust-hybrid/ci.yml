# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/ci.yml | Template version: ${TEMPLATE_VERSION}
name: ${ARTIFACT_PREFIX}-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  ci:
    needs: [private-repo-guard]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        # Full validation stays on one declared runner; prefer configured
        # Windows when available, otherwise preserve first configured OS.
        os: ${CI_OS_MATRIX}
        node: ${NODE_MATRIX}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
${PACKAGE_MANAGER_SETUP}
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
${RUST_CACHE_WORKSPACES}
          shared-key: ${ARTIFACT_PREFIX}-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - run: bash ./${GATE_PATH}
