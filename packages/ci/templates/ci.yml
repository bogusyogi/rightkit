# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: ci.yml | Template version: ${TEMPLATE_VERSION}
name: ci
on:
  pull_request:
  push:
    branches: [${DEFAULT_BRANCH}]
permissions:
  contents: read
${CI_CONCURRENCY_COMMENT}concurrency:
  group: ${CI_CONCURRENCY_GROUP}
  cancel-in-progress: ${CI_CANCEL_IN_PROGRESS}
# F5 fix: `private-repo-guard` carries no job-level `if`, so it always runs.
# Its one step's own `if` fires only when the repo is private, and `exit 1`
# then fails the JOB (loud, visible, non-zero) rather than the previous
# design of gating the whole job with `if: !private`, which made the guard
# step unreachable and left the run merely SKIPPED — indistinguishable from
# "nothing to do" instead of a failure nobody can miss. Every other job below
# depends on this one, so a skipped-by-failure guard blocks them too
# (GitHub's default `needs` semantics require the needed job to succeed).
jobs:
  private-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::right-git: repository is private; managed public-only workflows must not run here."
          exit 1
${CHECK_JOB}${CI_SUPERSEDE_JOB}  test:
    needs: [private-repo-guard, check]
    strategy:
      fail-fast: false
      matrix:
        os: ${OS_MATRIX}
        node: ${NODE_MATRIX}
    runs-on: ${{ matrix.os }}
${CI_JOB_CONCURRENCY}    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
${PACKAGE_MANAGER_SETUP}
      - run: ${INSTALL_COMMAND}${PNPM_LOCK_PATCH_STEP}${SWIFT_PRIVATE_CONFIGURE_STEP}
      - run: ${PM_RUN} test
      - run: ${PM_RUN} test:random
      - run: ${PM_RUN} test:all
      - run: node scripts/ci/check-generated.mjs
      - run: node scripts/ci/check-network-boundary.mjs${OWNERSHIP_STEP}${SWIFT_PRIVATE_CLEANUP_STEP}
