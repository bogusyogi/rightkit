# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: publish-npm.yml | Template version: ${TEMPLATE_VERSION}
# OIDC trusted publishing is the sole publish credential —
# no long-lived npm token, no signing material (invariant I2). Runs after
# right-release has already built/signed/notarized locally and attached
# artifacts to the GitHub Release (DESIGN.md §7); this job publishes the
# source npm package itself.
name: publish-npm
on:
  release:
    types: [published]
permissions:
  contents: read
# F5 fix: see ci.yml for why the guard is its own always-runs job rather
# than a job-level `if: !private` (which only skipped instead of failing).
jobs:
  private-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::right-git: repository is private; managed public-only workflows must not run here."
          exit 1
  publish-npm:
    needs: [private-repo-guard]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${NODE_PUBLISH_VERSION}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
${PACKAGE_MANAGER_SETUP}
      - run: ${INSTALL_COMMAND}
${OWNERSHIP_STEP}
      - run: node scripts/release/build-candidate.mjs --version "${{ github.event.release.tag_name }}" --platform current --out "release/candidates/publish"
      - run: node scripts/release/check-release.mjs release/candidates/publish
      # check-release must supply publication-evidence.json with artifactSha256.
      # Capture gated bytes before publication; never hash the source path during readback.
      - id: tarball
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { prepareNpmPublication } from '@rightkit/release/publication-gate.mjs';
          const root = 'release/candidates/publish';
          const c = JSON.parse(fs.readFileSync(`${root}/compatibility.json`));
          const tarball = `${root}/${c.packageName.replace(/^@/, '').replace('/', '-')}-${c.version}.tgz`;
          const proof = prepareNpmPublication({ name: c.packageName, version: c.version, tarball, evidencePath: `${root}/publication-evidence.json` });
          // Only safe single-line metadata may enter GitHub outputs.
          for (const value of [tarball, proof.name, proof.version]) if (/[\r\n]/.test(value)) throw new Error('unsafe npm publication identity');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${tarball}\nname=${proof.name}\nversion=${proof.version}\nsha1=${proof.sha1}\n`);
          NODE
      - run: npm publish "${{ steps.tarball.outputs.path }}"${NPM_PROVENANCE_FLAG} --access public
      - name: Require registry byte equality
        env:
          NPM_PUBLICATION_NAME: ${{ steps.tarball.outputs.name }}
          NPM_PUBLICATION_VERSION: ${{ steps.tarball.outputs.version }}
          NPM_PUBLICATION_SHA1: ${{ steps.tarball.outputs.sha1 }}
        run: |
          node --input-type=module <<'NODE'
          import { verifyNpmRegistryBytes } from '@rightkit/release/publication-gate.mjs';
          verifyNpmRegistryBytes({ name: process.env.NPM_PUBLICATION_NAME, version: process.env.NPM_PUBLICATION_VERSION, sha1: process.env.NPM_PUBLICATION_SHA1 });
          NODE
