# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/release.yml | Template version: ${TEMPLATE_VERSION}
# The trusted publisher, the last stage of the one door. A native host signs, seals and qualifies through
# `rightkit-gate --to qualify`, then `rightkit-gate stage` puts the sealed set and its receipt in the draft
# release rightkit-staging-<commit> and dispatches this workflow. Only this job, in the protected publication
# environment, holds the R2 write credential: it re-checks class A on the commit, then `rightkit-gate --to release`
# takes the receipt only for this commit and source, refuses bytes that differ from the sealed digest or were
# never qualified, and uploads exactly them. The staging draft is deleted after every platform published.
name: ${ARTIFACT_PREFIX}-release
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full commit sha the host staged (40 lowercase hex characters)
        required: true
        type: string
      tier:
        description: Update tier, chosen explicitly
        required: true
        type: choice
        options: [patch, update]
      platforms:
        description: Staged platforms to publish, space separated (mac, win)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${ARTIFACT_PREFIX}-release-${{ inputs.source_revision }}
  cancel-in-progress: false
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
${CHECK_JOB}  publish:
    needs: [private-repo-guard, check]
    environment: ${RELEASE_PUBLICATION_ENVIRONMENT}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Refuse a malformed request
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_revision must be a full lowercase commit sha"; exit 1; }
          [[ "$PLATFORMS" =~ ^(mac|win)( (mac|win))?$ ]] || { echo "::error::platforms must be mac, win or both"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${NODE_PUBLISH_VERSION}
          package-manager-cache: false
${PACKAGE_MANAGER_SETUP}
      - run: ${INSTALL_COMMAND} --ignore-scripts
      - name: Publish each staged platform through the door
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHTKIT_PUBLISHER: github-environment
          SOURCE_REVISION: ${{ inputs.source_revision }}
          TIER: ${{ inputs.tier }}
          PLATFORMS: ${{ inputs.platforms }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          staging="rightkit-staging-$SOURCE_REVISION"
          staged="$RUNNER_TEMP/staged"
          for platform in $PLATFORMS; do
            gh release download "$staging" --pattern "sealed-$platform.tar.gz" --pattern "receipt-$platform.json" --dir "$staged" --clobber
            tar -xzf "$staged/sealed-$platform.tar.gz" --no-same-owner
            ${GATE_BIN} --to release --platform "$platform" --tier "$TIER" --receipt-in "$staged/receipt-$platform.json"
          done
          gh release delete "$staging" --yes --cleanup-tag
