# One Cargo workspace, one lockfile, one target tree (HeardRight/GenRight/ScrapeRight convention).
# Profiles live HERE only (Cargo honours the root's profile) and are copied verbatim from
# packages/release/templates/cargo-profiles.toml; the RightKit ownership scanner flags any deviation.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/protocol", "crates/engine"]

# One build output (GATE-CONTRACT GC-A07): every gate build uses [profile.release]; no other profile table.
[profile.release]
panic = "unwind"
