# Rust QA harness config (`rightkit-qa run --tier fast`). Replaces every Node e2e harness.
# Scenarios are declarative TOML in tests/scenarios; the real engine binary runs in a fresh
# per-scenario data dir, with system audio muted and no network.
app = "rightapp"
app_root = "."
scenarios = ["tests/scenarios"]
default_tier = "fast"

[engine]
package = "rightapp-engine"
# `test-mode` (QA only) lets rightkit-qa bind the engine's data root to the scenario's isolated directory through
# rightkit_daemon::mode. The engine reads no data-root override of its own, in any build.
build = ["rustright", "cargo", "build", "-p", "rightapp-engine", "--features", "test-mode"]
data_dir_env = "RIGHTKIT_QA_DATA_DIR"

# The real app, launched hidden on the scenario's isolated data and driven by rightkit-qa's control server, which only the
# off-by-default `qa-native` feature compiles in (never a release build). `custom-protocol` embeds the built frontend (`pnpm
# build` runs first), because a hidden run has no dev server.
[ui]
mode = "hidden"
feature = "qa-native"
window_label = "main"
package = "rightapp"
build = ["rustright", "cargo", "build", "--manifest-path", "Cargo.toml", "-p", "rightapp", "--features", "qa-native,custom-protocol"]
cargo_toml = "src-tauri/Cargo.toml"
rust_sources = ["src-tauri/src/lib.rs"]
package_json = "package.json"
workspace_root = "."

[audio]
system_mute = true
