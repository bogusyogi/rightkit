# Rust QA harness config (`rightkit-qa run --tier fast`). Replaces every Node e2e harness.
# Scenarios are declarative TOML in tests/scenarios; the real engine binary runs on the owner's real data
# under the [snapshot] below, with system audio muted and no network.
app = "rightapp"
app_root = "."
scenarios = ["tests/scenarios"]
default_tier = "fast"

[engine]
package = "rightapp-engine"
build = ["rustright", "cargo", "build", "-p", "rightapp-engine"]

# The real app, launched hidden on the real data and driven by rightkit-qa's control server, which only the
# off-by-default `qa-native` feature compiles in (never a release build). `custom-protocol` embeds the built frontend (`pnpm
# build` runs first), because a hidden run has no dev server.
[ui]
mode = "hidden"
feature = "qa-native"
window_label = "main"
package = "rightapp"
build = ["rustright", "cargo", "build", "--manifest-path", "Cargo.toml", "-p", "rightapp", "--features", "qa-native,custom-protocol"]
cargo_toml = "src-tauri/Cargo.toml"
rust_sources = ["src-tauri/src/lib.rs"]
package_json = "package.json"
workspace_root = "."

[audio]
system_mute = true

# Real data, snapshot and restore (rightkit#1437): required. The run refuses to start while the app runs.
[snapshot]
app_name = "rightapp"
process_names = ["RightApp", "rightapp-engine"]
