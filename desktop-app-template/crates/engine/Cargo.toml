[package]
name = "rightapp-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = false

[[bin]]
name = "rightapp-engine"
path = "src/main.rs"

[dependencies]
rightapp-protocol = { path = "../protocol" }
serde_json = "1"
