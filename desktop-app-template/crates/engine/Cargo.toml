[package]
name = "rightapp-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = false

[[bin]]
name = "rightapp-engine"
path = "src/main.rs"

[features]
default = []
# QA and dev only (never in default): lets rightkit-qa bind the engine's data root to an isolated directory.
test-mode = ["rightapp-protocol/test-mode"]

[dependencies]
rightapp-protocol = { path = "../protocol" }
# Serves the rightkit-job-queue contract: one command table for the sidecar and the CLI (M3, M4).
rightkit-job-queue = { version = "=0.5.1", default-features = false, features = ["contract"] }
# The engine is a process boundary: it installs its own crash hook (M16).
rightkit-crash = { version = "=0.3.6", default-features = false }
# Owners the job store and the serve contract reach through rightkit-job-queue, declared here so the mandatory set sees them:
# rightkit-db is the job store's SQLite owner (M9); rightkit-sidecar is the framed JSON-line transport (M4).
rightkit-db = "=0.5.2"
rightkit-sidecar = "=0.3.0"
# The app CLI contract owner (M22): `contract` prints the manifest; `host::run` replaces the local builder at 0.4.0.
rightkit-agent-tools = { version = "=0.3.0", default-features = false }
serde_json = "1"
