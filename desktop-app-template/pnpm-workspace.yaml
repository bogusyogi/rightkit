# This template is its own workspace root, so pnpm never resolves the enclosing RightKit workspace.
packages:
  - "."

allowBuilds:
  esbuild: true
# Pin-by-exact-version is the RightKit rule; the release-age guard needs an explicit allowance for
# each freshly published @rightkit version this app pins. Keep this list equal to package.json.
minimumReleaseAgeExclude:
  - '@rightkit/app-update@0.4.2'
  - '@rightkit/legal-ui@0.4.1'
  - '@rightkit/legal@0.6.3'
  - '@rightkit/license@0.3.0'
  - '@rightkit/logs@0.1.6'
  - '@rightkit/onboarding@0.6.3'
  - '@rightkit/platform-ui@0.4.0'
  - '@rightkit/qa-chrome@0.1.11'
  - '@rightkit/qa@0.6.1'
  - '@rightkit/react-shell@0.7.2'
  - '@rightkit/release@0.6.5'
  - '@rightkit/settings-ui@0.7.0'
  - '@rightkit/tauri-shell@0.1.3'
  - '@rightkit/tauri@0.3.0'
  - '@rightkit/theme@0.3.1'
