[package]
name = "rightapp"
version = "0.1.0"
description = "RightApp desktop shell"
edition = "2021"
rust-version = "1.98.0"
publish = false

[lib]
name = "rightapp"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rightapp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rightapp-protocol = { path = "../crates/protocol" }
tauri = { version = "2", features = ["protocol-asset"] }

# Tauri plugin crates: exact, equal to their npm counterparts (@tauri-apps/plugin-*).
tauri-plugin-os = "=2.4.0"

# RightKit shared crates: exact crates.io pins only (no path/git/vendored copies).
# Versions must equal packages/release/rightkit-versions.json `registry` (the published set).
#
# M1 window host + M3 engine supervision + M15 logging + M16 crash: one shell crate. wv2-0_39 matches Tauri 2.12
# (the locked tauri version); `engine` supervises the sidecar, `logs` registers the renderer log commands and
# `crash` adds the watchdog's stall capture. host-services, license and update are not enabled here.
rightkit-tauri-shell = { version = "=0.6.0", default-features = false, features = ["wv2-0_39", "engine", "logs", "crash"] }
# M1/M12 device: DeviceService, with the credentials adapter whose set_if_absent is atomic.
rightkit-device = { version = "=0.4.0", features = ["credentials"] }
# M11 secrets: the OS credential store behind the device identity.
rightkit-credentials = "=0.4.2"
# M5 child process: OwnedCommand, the ownership-safe spawn of the engine sidecar.
rightkit-child-process = "=0.5.6"
# M21/M23 mode: the first call of run is rightkit_daemon::mode::init_or_exit.
rightkit-daemon = "=0.4.0"
# M16 crash: the process hook of the window host.
rightkit-crash = { version = "=0.3.6", default-features = false }
# M15 logging: declared; wired through rightkit-tauri-shell `logs` (the shell pulls this crate itself).
rightkit-logs = { version = "=0.3.5", default-features = false }
# M12 licence: declared; native wiring lands with the per-app trust roots lane (the shell's host-services, license and update wiring).
rightkit-license = "=0.2.5"
# M17 http: declared; native wiring lands with the per-app trust roots lane (the shell's host-services, license and update wiring).
rightkit-http = "=0.3.8"
# M10 settings: declared; native wiring lands with the per-app trust roots lane (the shell's host-services, license and update wiring).
rightkit-app-settings = "=0.3.0"

# QA control never ships. The in-app control server (rightkit-qa, feature `control`) is for the internal QA
# harness only: an optional dependency behind the off-by-default `qa-native` feature, never in `default`.
# `qa-native` also compiles the protocol crate's `test-mode`, the only way the isolated test root is read.
# The dev lane builds with `--features qa-native`; `right-release` fails any release or update seal that
# contains the server. wv2-0_39 matches Tauri 2.12.
rightkit-qa = { version = "=0.9.0", optional = true, default-features = false, features = ["control", "wv2-0_39"] }

[features]
default = []
qa-native = ["dep:rightkit-qa", "rightkit-qa/control", "rightapp-protocol/test-mode"]
