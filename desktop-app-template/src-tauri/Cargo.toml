[package]
name = "rightapp"
version = "0.1.0"
description = "RightApp desktop shell"
edition = "2021"
rust-version = "1.98.0"
publish = false

[lib]
name = "rightapp"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rightapp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
rightapp-protocol = { path = "../crates/protocol" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# RightKit shared crates: exact registry pins only (no path/git/vendored copies).
# Versions must equal packages/release/rightkit-versions.json `cargo`/`stagedCargo`;
# `pnpm check:template` enforces this.
rightkit-logs = "=0.2.0"
rightkit-process = "=0.2.1"
rightkit-tauri = "=0.1.1"

# --- Optional / upcoming shared crates (add-ons; pin exactly from rightkit-versions.json). ---
# rightkit-db = "=0.2.1"             # SQLite/SQLCipher bootstrap; add when the app owns a DB.
# rightkit-jobs = "=PLACEHOLDER"     # UPCOMING: durable job store/queue; replaces per-app job code.
