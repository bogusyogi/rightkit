[package]
name = "rightapp"
version = "0.1.0"
description = "RightApp desktop shell"
edition = "2021"
rust-version = "1.98.0"
publish = false

[lib]
name = "rightapp"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rightapp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rightapp-protocol = { path = "../crates/protocol" }
tauri = { version = "2", features = ["protocol-asset"] }
serde_json = "1"

# Tauri plugin crates: exact, equal to their npm counterparts (@tauri-apps/plugin-*).
tauri-plugin-os = "=2.4.0"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"

# RightKit shared crates: exact registry pins only (no path/git/vendored copies), equal to
# packages/release/rightkit-versions.json `registry` (the published set). The mandatory owners (ownership-mandatory-set.json,
# profile desktop) are all declared in this workspace; the three marked "declared" are not wired yet, see README "Foundation owners".
# M1 window host: rightkit-tauri-shell hosts the window (hardened webview, window state, single instance, watchdog) and, with
# `logs`, registers the renderer log commands @rightkit/logs invokes (M15). Its default `wv2-0_39` matches Tauri 2.12.
rightkit-tauri-shell = { version = "=0.6.0", features = ["logs"] }
# M1 device identity (rightkit-device `credentials` keeps it in the OS credential store, M11).
rightkit-device = { version = "=0.4.0", features = ["credentials"] }
rightkit-credentials = "=0.4.2"
# M3 engine supervision: EngineSupervisor over the owned sidecar (restart budget, per-call deadline, no replay).
rightkit-job-queue = { version = "=0.5.1", default-features = false, features = ["supervisor"] }
rightkit-child-process = "=0.5.6"
# M6 the release-or-test decision (rightkit_daemon::mode) is reached through rightapp-protocol; M8 safe file writes likewise.
rightkit-daemon = "=0.4.0"
rightkit-fs = { version = "=0.4.7", features = ["fs"] }
# M16 crash reporting: the window host installs the process hook first thing.
rightkit-crash = { version = "=0.3.6", default-features = false }
# M15 logging (the shell's `logs` feature brings it in; declared so the owner is visible here).
rightkit-logs = { version = "=0.3.5", default-features = false }
# Declared, not wired yet: M10 settings, M12/M13 licence and entitlement, M17 HTTP. An app adds the wiring when it has the
# feature (README "Foundation owners"); the declarations keep the mandatory set complete from the first commit.
rightkit-app-settings = { version = "=0.3.0", default-features = false }
rightkit-license = { version = "=0.2.5", default-features = false }
rightkit-http = "=0.3.8"
# M20 QA: the in-app control server, compiled only by the off-by-default `qa-native` feature below.
rightkit-qa = { version = "=0.9.0", default-features = false, optional = true }

[features]
default = []
# QA and dev only, never in `default`: registers rightkit-qa's control server (launched hidden by `rightkit-qa journeys run`)
# and compiles the data-root test capability. `right-release` fails any release or update build whose graph or binary carries it.
# rightkit-qa/wv2-0_39 selects the WebView2 generation of Tauri 2.12 (Windows); macOS ignores it.
qa-native = ["dep:rightkit-qa", "rightkit-qa/control", "rightkit-qa/wv2-0_39", "rightapp-protocol/test-mode"]
# Tauri's embedded-frontend mode (`tauri build` selects it). A QA UI build names it too: a hidden run has no dev server.
custom-protocol = ["tauri/custom-protocol"]
