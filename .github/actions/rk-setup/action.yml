# Shared job setup for .github/workflows/ci.yml: Node, pnpm, the frozen install, and (when asked) the Rust
# toolchain with a cache of its own. Every pinned action here is the one the rendered ci.yml pinned before the
# gate was sharded. The caller checks the repository out first (a local action is read from the checkout).
name: rk-setup
description: Node, optional pnpm install and Rust toolchain with per-shard caches
inputs:
  node-version:
    description: Node version
    required: true
  rust:
    description: "true installs the Rust toolchain and restores the Rust build cache"
    default: "false"
  cache-key:
    description: Rust cache key of this job (one per shard, stable across pushes)
    default: ""
  rust-workspaces:
    description: "Rust cache workspaces, one `crates/<x> -> crates/<x>/target` line per crate of the job (rightkit#1285); empty skips the Rust cache"
    default: ""
  save-cache:
    description: "true saves the Rust cache at the end of the job"
    default: "false"
  restore-cache:
    description: "false skips restoring the Rust build cache (push-triggered shared CI: each restore is hundreds of MB of Actions storage egress per shard)"
    default: "true"
  derived-data:
    description: "Runner label for SwiftPM build cache (Swift package jobs); empty disables it"
    default: ""
  install-dependencies:
    description: "true installs the frozen pnpm workspace dependencies"
    default: "true"
  install-filter:
    description: "Optional pnpm filter arguments for the frozen dependency install"
    default: ""
  ignore-install-scripts:
    description: "true passes --ignore-scripts to the frozen pnpm install"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: ${{ inputs.install-dependencies == 'true' }}
      with:
        version: 11.25.0
    - name: Locate pnpm store
      id: pnpm-store
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      # A probe of the store, before the protected install: run with pnpmfile hooks, scripts and corepack auto-pinning off, like
      # every other pnpm call ahead of class A.
      env:
        npm_config_ignore_scripts: "true"
        npm_config_ignore_pnpmfile: "true"
        pnpm_config_ignore_scripts: "true"
        pnpm_config_ignore_pnpmfile: "true"
        COREPACK_ENABLE_AUTO_PIN: "0"
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      if: ${{ inputs.install-dependencies == 'true' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-11.25.0-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install frozen pnpm dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      env:
        RK_INSTALL_FILTER: ${{ inputs.install-filter }}
        RK_IGNORE_INSTALL_SCRIPTS: ${{ inputs.ignore-install-scripts }}
      run: |
        args=(install --frozen-lockfile)
        if [[ -n "$RK_INSTALL_FILTER" ]]; then
          read -r -a filter_args <<< "$RK_INSTALL_FILTER"
          args+=("${filter_args[@]}")
        fi
        # No candidate code during setup: with scripts off, the repository's pnpmfile hooks are off too (flag and environment, so
        # no project .npmrc can turn them back on before class A has run).
        if [[ "$RK_IGNORE_INSTALL_SCRIPTS" == "true" ]]; then
          args+=(--ignore-scripts --ignore-pnpmfile)
          export npm_config_ignore_scripts=true npm_config_ignore_pnpmfile=true pnpm_config_ignore_scripts=true pnpm_config_ignore_pnpmfile=true
        fi
        pnpm "${args[@]}"
    - name: Print pnpm-lock.yaml patch when the lockfile is stale
      if: ${{ failure() && inputs.install-dependencies == 'true' }}
      shell: bash
      env:
        RK_INSTALL_FILTER: ${{ inputs.install-filter }}
        RK_IGNORE_INSTALL_SCRIPTS: ${{ inputs.ignore-install-scripts }}
      run: |
        args=(install --lockfile-only)
        if [[ -n "$RK_INSTALL_FILTER" ]]; then
          read -r -a filter_args <<< "$RK_INSTALL_FILTER"
          args+=("${filter_args[@]}")
        fi
        # No candidate code during setup: with scripts off, the repository's pnpmfile hooks are off too (flag and environment, so
        # no project .npmrc can turn them back on before class A has run).
        if [[ "$RK_IGNORE_INSTALL_SCRIPTS" == "true" ]]; then
          args+=(--ignore-scripts --ignore-pnpmfile)
          export npm_config_ignore_scripts=true npm_config_ignore_pnpmfile=true pnpm_config_ignore_scripts=true pnpm_config_ignore_pnpmfile=true
        fi
        if pnpm "${args[@]}"; then
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::notice::pnpm-lock.yaml already matches package.json; the frozen install failed for another reason."
          else
            echo "::group::pnpm-lock.yaml patch (apply and commit)"
            git diff -- pnpm-lock.yaml
            echo "::endgroup::"
            echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml is stale; commit the patch above."
          fi
        else
          echo "::error::pnpm install --lockfile-only failed; no lockfile patch was produced."
        fi
    - name: Cache SwiftPM build products
      if: ${{ inputs.derived-data != '' && runner.os == 'macOS' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .build
          swift/RightKitSwift/.build
          swift/RightKitCloudKitHelper/.build
        key: ${{ runner.os }}-${{ inputs.derived-data }}-swiftpm-${{ hashFiles('rust-toolchain.toml', 'Package.swift', '**/Package.resolved', 'swift/**/Package.swift', 'swift/**/*.swift', 'swift/**/Resources/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.derived-data }}-swiftpm-
    - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      if: ${{ inputs.rust == 'true' }}
      with:
        components: rustfmt, clippy
    - name: Select native Windows Perl for vendored OpenSSL
      if: ${{ inputs.rust == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE/scripts/ci/select-native-perl.ps1"
    - name: Locate native Windows OpenSSL for SQLCipher system crypto
      if: ${{ inputs.rust == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE/scripts/ci/locate-native-openssl.ps1"
    # rightkit#1285: no root Cargo workspace any more; each crate is its own workspace with crates/<x>/target. The caller names
    # its shard's crates as `crates/<x> -> crates/<x>/target` lines. Without them the cache is not restored (never the root `.`).
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: ${{ inputs.rust == 'true' && inputs.restore-cache == 'true' && inputs.rust-workspaces != '' }}
      with:
        workspaces: ${{ inputs.rust-workspaces }}
        shared-key: ${{ inputs.cache-key }}
        add-job-id-key: false
        cache-workspace-crates: true
        cache-on-failure: true
        save-if: ${{ inputs.save-cache == 'true' }}
