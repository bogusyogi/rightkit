# Shared job setup for .github/workflows/ci.yml: Node, pnpm, the frozen install, and (when asked) the Rust
# toolchain with a cache of its own. Every pinned action here is the one the rendered ci.yml pinned before the
# gate was sharded. The caller checks the repository out first (a local action is read from the checkout).
name: rk-setup
description: Node, optional pnpm install and Rust toolchain with per-shard caches
inputs:
  node-version:
    description: Node version
    required: true
  rust:
    description: "true installs the Rust toolchain and restores the Rust build cache"
    default: "false"
  cache-key:
    description: Rust cache key of this job (one per shard, stable across pushes)
    default: ""
  save-cache:
    description: "true saves the Rust cache at the end of the job (pushes only)"
    default: "false"
  derived-data:
    description: "Runner label for SwiftPM build cache (Swift package jobs); empty disables it"
    default: ""
  install-dependencies:
    description: "true installs the frozen pnpm workspace dependencies"
    default: "true"
  install-filter:
    description: "Optional pnpm filter arguments for the frozen dependency install"
    default: ""
  ignore-install-scripts:
    description: "true passes --ignore-scripts to the frozen pnpm install"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: ${{ inputs.install-dependencies == 'true' }}
      with:
        version: 11.24.0
    - name: Locate pnpm store
      id: pnpm-store
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      if: ${{ inputs.install-dependencies == 'true' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-11.24.0-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install frozen pnpm dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      env:
        RK_INSTALL_FILTER: ${{ inputs.install-filter }}
        RK_IGNORE_INSTALL_SCRIPTS: ${{ inputs.ignore-install-scripts }}
      run: |
        args=(install --frozen-lockfile)
        if [[ -n "$RK_INSTALL_FILTER" ]]; then
          read -r -a filter_args <<< "$RK_INSTALL_FILTER"
          args+=("${filter_args[@]}")
        fi
        if [[ "$RK_IGNORE_INSTALL_SCRIPTS" == "true" ]]; then args+=(--ignore-scripts); fi
        pnpm "${args[@]}"
    - name: Print pnpm-lock.yaml patch when the lockfile is stale
      if: ${{ failure() && inputs.install-dependencies == 'true' }}
      shell: bash
      env:
        RK_INSTALL_FILTER: ${{ inputs.install-filter }}
        RK_IGNORE_INSTALL_SCRIPTS: ${{ inputs.ignore-install-scripts }}
      run: |
        args=(install --lockfile-only)
        if [[ -n "$RK_INSTALL_FILTER" ]]; then
          read -r -a filter_args <<< "$RK_INSTALL_FILTER"
          args+=("${filter_args[@]}")
        fi
        if [[ "$RK_IGNORE_INSTALL_SCRIPTS" == "true" ]]; then args+=(--ignore-scripts); fi
        if pnpm "${args[@]}"; then
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::notice::pnpm-lock.yaml already matches package.json; the frozen install failed for another reason."
          else
            echo "::group::pnpm-lock.yaml patch (apply and commit)"
            git diff -- pnpm-lock.yaml
            echo "::endgroup::"
            echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml is stale; commit the patch above."
          fi
        else
          echo "::error::pnpm install --lockfile-only failed; no lockfile patch was produced."
        fi
    - name: Cache SwiftPM build products
      if: ${{ inputs.derived-data != '' && runner.os == 'macOS' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .build
          swift/RightKitSwift/.build
          swift/RightKitCloudKitHelper/.build
        key: ${{ runner.os }}-${{ inputs.derived-data }}-swiftpm-${{ hashFiles('rust-toolchain.toml', 'Package.swift', '**/Package.resolved', 'swift/**/Package.swift', 'swift/**/*.swift', 'swift/**/Resources/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.derived-data }}-swiftpm-
    - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      if: ${{ inputs.rust == 'true' }}
      with:
        components: rustfmt, clippy
    - name: Select native Windows Perl for vendored OpenSSL
      if: ${{ inputs.rust == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        # Git's MSYS Perl is incomplete for OpenSSL Configure. Use the hosted
        # image's native Strawberry Perl explicitly, including from bash jobs.
        $perl = 'C:\Strawberry\perl\bin\perl.exe'
        if (-not (Test-Path -LiteralPath $perl)) {
          throw "Hosted native Strawberry Perl is missing: $perl"
        }
        & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "$^X\n"'
        if ($LASTEXITCODE -ne 0) { throw 'Native Perl lacks OpenSSL Configure prerequisites' }
        "PERL=$perl" >> $env:GITHUB_ENV
        (Split-Path -Parent $perl) >> $env:GITHUB_PATH
    - name: Locate native Windows OpenSSL for SQLCipher system crypto
      if: ${{ inputs.rust == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        # bundled-sqlcipher needs native OpenSSL headers and an MSVC import
        # library. Do not select Strawberry/MinGW .a archives or disable vendoring.
        $roots = @(Get-ChildItem -LiteralPath $env:ProgramFiles -Directory -Filter 'OpenSSL*')
        $selected = $null
        foreach ($root in ($roots | Sort-Object FullName)) {
          $include = Join-Path $root.FullName 'include'
          $bin = Join-Path $root.FullName 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $include 'openssl/ssl.h'))) { continue }
          $library = @('lib/VC/x64/MD', 'lib/VC/x64') |
            ForEach-Object { Join-Path $root.FullName $_ } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'libcrypto.lib') } |
            Select-Object -First 1
          if (-not $library) { continue }
          $runtime = Get-ChildItem -LiteralPath $bin -Filter 'libcrypto*.dll' -File -ErrorAction SilentlyContinue |
            Where-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              if ($bytes.Length -lt 64) { return $false }
              $pe = [BitConverter]::ToInt32($bytes, 60)
              $pe -ge 0 -and $pe -le ($bytes.Length - 6) -and
                [BitConverter]::ToUInt32($bytes, $pe) -eq 0x00004550 -and
                [BitConverter]::ToUInt16($bytes, $pe + 4) -eq 0x8664
            } | Select-Object -First 1
          if (-not $runtime) { continue }
          $selected = @{ Include = $include; Library = $library; Bin = $bin; Runtime = $runtime }
          break
        }
        if (-not $selected) {
          Write-Warning 'Native SQLCipher system crypto unavailable: require Program Files/OpenSSL*/include/openssl/ssl.h, lib/VC/x64/MD/libcrypto.lib (or lib/VC/x64/libcrypto.lib), and matching x64 bin/libcrypto*.dll. OpenSSL paths were not exported; required SQLCipher feature checks will report missing prerequisites. Restore hosted image native OpenSSL; do not substitute MinGW libraries.'
        } else {
          "OPENSSL_INCLUDE_DIR=$($selected.Include)" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$($selected.Library)" >> $env:GITHUB_ENV
          $selected.Bin >> $env:GITHUB_PATH
          Write-Host "OpenSSL headers: $($selected.Include)"
          Write-Host "OpenSSL MSVC x64 import library: $($selected.Library)/libcrypto.lib"
          Write-Host "OpenSSL runtime: $($selected.Runtime.FullName) version $($selected.Runtime.VersionInfo.FileVersion)"
        }
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: ${{ inputs.rust == 'true' }}
      with:
        workspaces: |
          . -> target
        shared-key: ${{ inputs.cache-key }}
        add-job-id-key: false
        cache-workspace-crates: true
        cache-on-failure: true
        save-if: ${{ inputs.save-cache == 'true' }}
