# actionlint configuration for the deterministic scans (packages/release/deterministic-scans.mjs passes
# it with -config-file, since the exported commit has no .git for discovery).
self-hosted-runner:
  # The macOS runner label this repository uses; newer than actionlint's built-in label list.
  labels:
    - xcode-27
paths:
  # GitHub's concurrency `queue` key (single | max) is newer than actionlint 1.7.12's schema. Ignored only in
  # the two workflows that use it, where their contracts pin `queue: max` with `cancel-in-progress: false`.
  .github/workflows/publish-reviewed.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/publish-swift.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
