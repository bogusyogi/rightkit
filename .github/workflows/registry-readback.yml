name: registry-readback
on:
  workflow_dispatch:
    inputs:
      publication_run:
        description: Reviewed successful publish run (react-shell 0.7.2 or license 0.3.0)
        type: string
        required: true
        default: "39403051223"
permissions: {}
jobs:
  provenance:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Authenticate publication before artifact download
        env:
          READBACK_BUNDLE: ${{ runner.temp }}/readback-bundle
          PUBLICATION_RUN: ${{ inputs.publication_run }}
        run: node scripts/ci/registry-readback.mjs authenticate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: bogusyogi/rightkit
          run-id: ${{ inputs.publication_run }}
          github-token: ${{ github.token }}
          name: publication-receipt
          path: ${{ runner.temp }}/readback-bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: bogusyogi/rightkit
          run-id: ${{ inputs.publication_run }}
          github-token: ${{ github.token }}
          name: publish-packed
          path: ${{ runner.temp }}/readback-packed
      - name: Check pinned receipt & manifest; bundle trusted consumer
        shell: bash
        env:
          READBACK_BUNDLE: ${{ runner.temp }}/readback-bundle
        run: |
          cp "$RUNNER_TEMP/readback-packed/manifest.json" "$READBACK_BUNDLE/manifest.json"
          node scripts/ci/registry-readback.mjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-readback-input
          path: ${{ runner.temp }}/readback-bundle
          if-no-files-found: error
          retention-days: 30
  consumer:
    needs: provenance
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: registry-readback-input
          path: ${{ runner.temp }}/readback-bundle
      - name: Install from public npm & qualify installed consumer
        shell: bash
        env:
          READBACK_BUNDLE: ${{ runner.temp }}/readback-bundle
          READBACK_OUTPUT: ${{ runner.temp }}/readback-output
        run: node "$READBACK_BUNDLE/registry-readback.mjs" consume
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: registry-readback-${{ matrix.os }}
          path: ${{ runner.temp }}/readback-output
          if-no-files-found: error
          retention-days: 30
