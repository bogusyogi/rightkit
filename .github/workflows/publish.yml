# Publishes selected @rightkit npm packages or rightkit crates. Manual dispatch from main only.
# docs/CI.md ("Publishing") explains dispatch, what each job proves and how the ledger is updated.
#
# Trust boundary: the registry tokens are read only by the two real-publish steps of the `publish`
# job, which sits behind the `release` environment. plan and verify hold no secret. A dry run
# executes no step that references one, and scripts/ci/publish.mjs refuses a dry run that finds a
# token in its environment. Request inputs reach scripts only through env, never through run text.
name: publish

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        type: choice
        options: [npm, crates]
        required: true
      units:
        description: Space-separated package names (npm) or crate names (crates)
        type: string
        required: true
      dry_run:
        description: Verify and package only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

# A publish is never cancelled half-way; a second dispatch waits.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse anything but main of a public repository
        env:
          REF: ${{ github.ref }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::publish runs from refs/heads/main only, not $REF"
            exit 1
          fi
          if [ "$PRIVATE" != "false" ]; then
            echo "::error::publish runs in the public repository only"
            exit 1
          fi

  plan:
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      count: ${{ steps.plan.outputs.count }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Validate the request and order the units
        id: plan
        env:
          PUBLISH_REGISTRY: ${{ inputs.registry }}
          PUBLISH_UNITS: ${{ inputs.units }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/ci/publish.mjs plan

  verify:
    needs: [guard, plan]
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: ["xcode-27", "windows-2025"]
        node: ["26.8.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: ${{ needs.plan.outputs.registry == 'crates' }}
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.plan.outputs.registry == 'crates' }}
        with:
          workspaces: |
            . -> target
          shared-key: rightkit-shared-rust
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Build and test exactly the planned units
        shell: bash
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --registry "$PUBLISH_REGISTRY" --units "$PUBLISH_UNITS"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-verify-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [guard, plan, verify]
    if: ${{ needs.plan.outputs.count != '0' && github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: ${{ needs.plan.outputs.registry == 'crates' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        with:
          version: 11.24.0
      - name: Install and build the workspace
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 run build
      - name: Pack the planned packages, in order
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
        run: node scripts/ci/publish.mjs pack
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: ${{ needs.plan.outputs.registry == 'crates' }}

      # Dry run: this step runs when dry_run is true and references no secret.
      - name: Dry-run publish (no secret)
        if: ${{ needs.plan.outputs.dry_run == 'true' }}
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_DRY_RUN: "true"
        run: node scripts/ci/publish.mjs publish

      # Real publish: the only steps that read a registry token.
      - name: Publish to npm
        if: ${{ needs.plan.outputs.dry_run == 'false' && needs.plan.outputs.registry == 'npm' }}
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_DRY_RUN: "false"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/ci/publish.mjs publish
      - name: Publish to crates.io
        if: ${{ needs.plan.outputs.dry_run == 'false' && needs.plan.outputs.registry == 'crates' }}
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_DRY_RUN: "false"
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/ci/publish.mjs publish

      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore
