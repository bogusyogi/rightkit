# Publishes selected @rightkit npm packages or rightkit crates. Manual dispatch from main only.
# docs/CI.md ("Publishing") explains dispatch, what each job proves and how the ledger is updated.
#
# Trust boundary. Bytes are built once, then only moved:
#   sign-swap   the ONLY job besides upload with a secret (environment: release, the three Apple signing
#               secrets, no id-token). Runs for npm runs that name @rightkit/release: builds the
#               rightkit-swap helper with no secret in scope, then installs the Developer ID identity,
#               signs and verifies that one binary, removes the keychain and hands the bytes over as an artifact
#   pack        no secret, no id-token: builds the npm tarballs / .crate files, seals them with a manifest.
#               It receives the signed rightkit-swap only by artifact download (hash re-checked), never signs
#   verify      no secret, no id-token: on macOS AND Windows re-hashes the sealed bytes, checks them, runs
#               the unit gate, and writes a per-host receipt bound to the manifest hash
#   seal-check  no secret, no id-token: the upload script in dry-run mode (hash, receipt and provenance
#               checks, the exact commands and request bodies, nothing sent)
#   upload      the ONLY job with a registry token or id-token (environment: release). Fresh runner, checks
#               out one dependency-free script, installs and builds nothing, re-checks the hashes and both
#               receipts, then uploads the sealed bytes. It runs only when dry_run is false.
# Request inputs reach scripts only through env, never through run text. scripts/ci/workflow-contract.mjs
# asserts all of the above on this file's parsed structure; plan runs it before anything else.
name: publish

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        type: choice
        options: [npm, crates]
        required: true
      units:
        description: Space-separated package names (npm) or crate names (crates)
        type: string
        required: true
      dry_run:
        description: Pack, verify and check the upload; publish nothing
        type: boolean
        default: true
      allow_host_exclusion:
        description: Crates that ci/gate.config.json keeps off one verify host; each must be named to publish
        type: string
        default: ""
      allow_no_test:
        description: npm packages with no test script; each must be named to publish untested
        type: string
        default: ""
      allow_ignored:
        description: Units allowed to have ignored tests (libtest ignored); each must be named, and the count is recorded
        type: string
        default: ""
      allow_missing_assets:
        description: Units whose tests may skip for a missing asset, sibling checkout or platform; ci/asset-gated.json units must be named
        type: string
        default: ""

permissions:
  contents: read

# A publish is never cancelled half-way; a second dispatch waits.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse anything but main of a public repository
        env:
          REF: ${{ github.ref }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::publish runs from refs/heads/main only, not $REF"
            exit 1
          fi
          if [ "$PRIVATE" != "false" ]; then
            echo "::error::publish runs in the public repository only"
            exit 1
          fi

  plan:
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      count: ${{ steps.plan.outputs.count }}
      units: ${{ steps.plan.outputs.units }}
      allow_host_exclusion: ${{ steps.plan.outputs.allow_host_exclusion }}
      allow_no_test: ${{ steps.plan.outputs.allow_no_test }}
      allow_ignored: ${{ steps.plan.outputs.allow_ignored }}
      allow_missing_assets: ${{ steps.plan.outputs.allow_missing_assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Check the publish route's own contract
        run: |
          node scripts/ci/workflow-contract.mjs .github/workflows/publish.yml
          node --test scripts/ci/publish.test.mjs scripts/ci/select.test.mjs scripts/ci/test-results.test.mjs
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: ${{ inputs.registry == 'crates' }}
      - name: Validate the request and order the units
        id: plan
        env:
          PUBLISH_REGISTRY: ${{ inputs.registry }}
          PUBLISH_UNITS: ${{ inputs.units }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_ALLOW_HOST_EXCLUSION: ${{ inputs.allow_host_exclusion }}
          PUBLISH_ALLOW_NO_TEST: ${{ inputs.allow_no_test }}
          PUBLISH_ALLOW_IGNORED: ${{ inputs.allow_ignored }}
          PUBLISH_ALLOW_MISSING_ASSETS: ${{ inputs.allow_missing_assets }}
        run: node scripts/ci/publish.mjs plan
      # Licence gate (rightkit#264): a crates run that includes rightkit-typeset stops here, before pack,
      # verify and upload can exist, if any dependency licence violates deny.toml.
      - name: Install the pinned licence checker
        if: ${{ inputs.registry == 'crates' && contains(steps.plan.outputs.units, 'rightkit-typeset') }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Check rightkit-typeset dependency licences
        if: ${{ inputs.registry == 'crates' && contains(steps.plan.outputs.units, 'rightkit-typeset') }}
        run: cargo deny --manifest-path crates/rightkit-typeset/Cargo.toml check --config deny.toml licenses

  sign-swap:
    needs: [guard, plan]
    if: ${{ needs.plan.outputs.count != '0' && needs.plan.outputs.registry == 'npm' && contains(needs.plan.outputs.units, '@rightkit/release') }}
    environment: release
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - name: Build rightkit-swap with no secret in scope
        run: cargo build --release --locked -p rightkit-fs --bin rightkit-swap --features fs
      - name: Install Apple signing identity in temporary keychain
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          rm -f "$certificate_path"
      - name: Developer ID sign and verify rightkit-swap
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/swap-signed"
          rm -rf "$out" && mkdir -p "$out"
          cp target/release/rightkit-swap "$out/rightkit-swap"
          codesign --force --strict --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID" "$out/rightkit-swap"
          codesign --verify --strict --verbose=2 "$out/rightkit-swap"
          details="$(codesign -dvv "$out/rightkit-swap" 2>&1)"
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -q 'Authority=Developer ID Application'
          printf '%s\n' "$details" | grep -Eq 'flags=0x[0-9a-f]+\(.*runtime'
          (cd "$out" && shasum -a 256 rightkit-swap > rightkit-swap.sha256 && cat rightkit-swap.sha256)
          { echo '### rightkit-swap (Developer ID signed)'; echo '```'; cat "$out/rightkit-swap.sha256"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove Apple signing material
        if: ${{ always() }}
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          security delete-keychain "$keychain_path" || true
          rm -f "$RUNNER_TEMP/apple-signing.p12"
      - name: Hand over the signed helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rightkit-swap-signed
          path: ${{ runner.temp }}/swap-signed
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  pack:
    needs: [guard, plan, sign-swap]
    if: ${{ always() && needs.guard.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.count != '0' && (needs.sign-swap.result == 'success' || needs.sign-swap.result == 'skipped') }}
    runs-on: ${{ needs.plan.outputs.registry == 'crates' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        with:
          version: 11.24.0
      - name: Install and build the workspace
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 run build
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: ${{ needs.plan.outputs.registry == 'crates' }}
      - name: Fetch the signed rightkit-swap
        if: ${{ needs.sign-swap.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rightkit-swap-signed
          path: ${{ runner.temp }}/swap-signed
      - name: Place the signed rightkit-swap in @rightkit/release after re-checking its hash
        if: ${{ needs.sign-swap.result == 'success' }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/swap-signed" && sha256sum -c rightkit-swap.sha256)
          install -d packages/release/bin/darwin
          install -m 0755 "$RUNNER_TEMP/swap-signed/rightkit-swap" packages/release/bin/darwin/rightkit-swap
      - name: Pack the planned units once and seal them
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
        run: node scripts/ci/publish.mjs pack
      - name: Keep the sealed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-packed
          path: ${{ runner.temp }}/rk-pack
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  verify:
    needs: [guard, plan, pack]
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: ["xcode-27", "windows-2025"]
        node: ["26.8.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        with:
          version: 11.24.0
      - name: Install the workspace
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: ${{ needs.plan.outputs.registry == 'crates' }}
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.plan.outputs.registry == 'crates' }}
        with:
          workspaces: |
            . -> target
          shared-key: rightkit-shared-rust
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Fetch the sealed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-packed
          path: ${{ runner.temp }}/rk-pack
      - name: Cache the pinned Chrome for Testing
        if: ${{ (needs.plan.outputs.registry == 'npm' && contains(needs.plan.outputs.units, '@rightkit/qa')) || (needs.plan.outputs.registry == 'crates' && contains(needs.plan.outputs.units, 'rightkit-browser')) }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('ci/chrome-for-testing.json') }}
      - name: Provision the pinned Chrome for Testing
        if: ${{ (needs.plan.outputs.registry == 'npm' && contains(needs.plan.outputs.units, '@rightkit/qa')) || (needs.plan.outputs.registry == 'crates' && contains(needs.plan.outputs.units, 'rightkit-browser')) }}
        shell: bash
        env:
          RIGHTKIT_CHROME_FOR_TESTING_ROOT: ${{ runner.temp }}/chrome-for-testing
          PUBLISH_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: node scripts/ci/provision-chrome.mjs
      - name: Build and test exactly the planned units
        shell: bash
        env:
          RIGHTKIT_CHROME_FOR_TESTING_ROOT: ${{ runner.temp }}/chrome-for-testing
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_ALLOW_HOST_EXCLUSION: ${{ needs.plan.outputs.allow_host_exclusion }}
          PUBLISH_ALLOW_NO_TEST: ${{ needs.plan.outputs.allow_no_test }}
          PUBLISH_ALLOW_IGNORED: ${{ needs.plan.outputs.allow_ignored }}
          PUBLISH_ALLOW_MISSING_ASSETS: ${{ needs.plan.outputs.allow_missing_assets }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --registry "$PUBLISH_REGISTRY" --units "$PUBLISH_UNITS" --allow-host-exclusion "$PUBLISH_ALLOW_HOST_EXCLUSION" --allow-no-test "$PUBLISH_ALLOW_NO_TEST" --allow-ignored "$PUBLISH_ALLOW_IGNORED" --allow-missing-assets "$PUBLISH_ALLOW_MISSING_ASSETS"
      - name: Verify the sealed bytes and write this host's receipt
        shell: bash
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_ALLOW_HOST_EXCLUSION: ${{ needs.plan.outputs.allow_host_exclusion }}
          PUBLISH_ALLOW_NO_TEST: ${{ needs.plan.outputs.allow_no_test }}
          PUBLISH_ALLOW_IGNORED: ${{ needs.plan.outputs.allow_ignored }}
          PUBLISH_ALLOW_MISSING_ASSETS: ${{ needs.plan.outputs.allow_missing_assets }}
        run: node scripts/ci/publish.mjs verify
      - name: Keep this host's receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-receipt-verify-${{ matrix.os }}
          path: ${{ runner.temp }}/verify-receipt
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-verify-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  seal-check:
    needs: [guard, plan, pack, verify]
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/upload.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Fetch the sealed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-packed
          path: ${{ runner.temp }}/sealed/packed
      - name: Fetch both hosts' receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: publish-receipt-verify-*
          path: ${{ runner.temp }}/sealed/receipts
      - name: Dry-run the upload with no credentials
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_ALLOW_HOST_EXCLUSION: ${{ needs.plan.outputs.allow_host_exclusion }}
          PUBLISH_ALLOW_NO_TEST: ${{ needs.plan.outputs.allow_no_test }}
          PUBLISH_ALLOW_IGNORED: ${{ needs.plan.outputs.allow_ignored }}
          PUBLISH_ALLOW_MISSING_ASSETS: ${{ needs.plan.outputs.allow_missing_assets }}
        run: node scripts/ci/upload.mjs run --dry-run
      - name: Keep the dry-run receipt
        if: ${{ needs.plan.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-receipt-dry-run
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  upload:
    needs: [guard, plan, pack, verify, seal-check]
    if: ${{ needs.plan.outputs.count != '0' && needs.plan.outputs.dry_run == 'false' && github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/upload.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Fetch the sealed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-packed
          path: ${{ runner.temp }}/sealed/packed
      - name: Fetch both hosts' receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: publish-receipt-verify-*
          path: ${{ runner.temp }}/sealed/receipts
      - name: Fetch the earlier attempt publication receipt if any
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: publication-receipt
          path: ${{ runner.temp }}/sealed/previous
      - name: Upload to npm
        if: ${{ needs.plan.outputs.registry == 'npm' }}
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_ALLOW_HOST_EXCLUSION: ${{ needs.plan.outputs.allow_host_exclusion }}
          PUBLISH_ALLOW_NO_TEST: ${{ needs.plan.outputs.allow_no_test }}
          PUBLISH_ALLOW_IGNORED: ${{ needs.plan.outputs.allow_ignored }}
          PUBLISH_ALLOW_MISSING_ASSETS: ${{ needs.plan.outputs.allow_missing_assets }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/ci/upload.mjs run
      - name: Upload to crates.io
        if: ${{ needs.plan.outputs.registry == 'crates' }}
        env:
          PUBLISH_REGISTRY: ${{ needs.plan.outputs.registry }}
          PUBLISH_UNITS: ${{ needs.plan.outputs.units }}
          PUBLISH_ALLOW_HOST_EXCLUSION: ${{ needs.plan.outputs.allow_host_exclusion }}
          PUBLISH_ALLOW_NO_TEST: ${{ needs.plan.outputs.allow_no_test }}
          PUBLISH_ALLOW_IGNORED: ${{ needs.plan.outputs.allow_ignored }}
          PUBLISH_ALLOW_MISSING_ASSETS: ${{ needs.plan.outputs.allow_missing_assets }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/ci/upload.mjs run
      - name: Keep the publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore
