  qualified:
    needs: [guard, plan, pack, verify, verify-linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require completed packing & both native verification hosts, and Linux where the plan requires it
        env:
          GUARD_RESULT: ${{ needs.guard.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PACK_RESULT: ${{ needs.pack.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_LINUX_RESULT: ${{ needs.verify-linux.result }}
          UNIT_COUNT: ${{ needs.plan.outputs.count }}
          LINUX_COUNT: ${{ needs.plan.outputs.linux_count }}
          LINUX_EXPECTED_RESULT: ${{ needs.plan.outputs.linux_count != '0' && 'success' || 'skipped' }}
        run: |
          test "$GUARD_RESULT" = success
          test "$PLAN_RESULT" = success
          test "$PACK_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$UNIT_COUNT" -gt 0
          test "$LINUX_COUNT" -ge 0
          test "$VERIFY_LINUX_RESULT" = "$LINUX_EXPECTED_RESULT"
