# Windows x64 LGPL FFmpeg/FFprobe builds for the rightkit-media artifact catalog.
# Manual dispatch only: a push never starts it, so pushes do not queue builds.
# The recipe verifies every pinned source digest, gates the linkage and licence, and writes the
# evidence files; this workflow only provides the toolchain and keeps the outputs as an artifact.
name: ffmpeg-windows

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Recipe variant
        type: choice
        options: [export-ass-zimg, decode]
        default: export-ass-zimg
      tool:
        description: Tool to build
        type: choice
        options: [ffmpeg, ffprobe]
        default: ffmpeg

permissions:
  contents: read

concurrency:
  group: ffmpeg-windows-${{ inputs.variant }}-${{ inputs.tool }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VARIANT: ${{ inputs.variant }}
      TOOL: ${{ inputs.tool }}
    steps:
      # The recipe is a bash script: a CRLF checkout would break it.
      - name: Check out with LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same versions as the macOS recipe run and the local Windows run. pkgconf is the native
      # Windows pkg-config the recipe needs (MSYS2's /usr/bin/pkgconf hands meson POSIX paths).
      - name: meson, ninja and native pkg-config in a throwaway venv
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install meson==1.12.1 ninja==1.13.2 pkgconf==3.0.7.post0

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc make nasm diffutils autoconf automake libtool

      - name: Fetch pinned sources and build
        shell: msys2 {0}
        run: |
          temp="$(cygpath -u "$RUNNER_TEMP")"
          venv="$temp/venv"
          export PYTHON="$venv/Scripts/python.exe" MESON="$venv/Scripts/meson.exe" NINJA="$venv/Scripts/ninja.exe"
          export PKG_CONFIG="$venv/Lib/site-packages/pkgconf/.bin/pkgconf.exe"
          recipe=crates/rightkit-media/recipes/build-ffmpeg-windows.sh
          bash "$recipe" fetch --variant "$VARIANT" --sources "$temp/sources"
          bash "$recipe" build --variant "$VARIANT" --tool "$TOOL" \
            --sources "$temp/sources" --work "$temp/work" --out "$(pwd)/ffmpeg-out"

      # Promotion evidence for the catalogue row (crates/rightkit-media/tests/promote_evidence_windows.rs):
      # the crate's own content identity, sha256 and size of the built binary; ffprobe reads a committed
      # fixture; ffmpeg runs the h264_mf, subtitles, drawtext and zscale+tonemap smokes. Evidence lands in
      # the .evidence folder that the artifact already uploads. A hosted runner has only the software MFT.
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: ${{ inputs.tool == 'ffprobe' || (inputs.tool == 'ffmpeg' && inputs.variant == 'export-ass-zimg') }}
      - name: Promotion evidence on the built binary
        if: ${{ inputs.tool == 'ffprobe' || (inputs.tool == 'ffmpeg' && inputs.variant == 'export-ass-zimg') }}
        shell: pwsh
        env:
          RIGHTKIT_MEDIA_PROMOTE_EVIDENCE: ${{ github.workspace }}\ffmpeg-out\${{ inputs.tool }}-${{ inputs.variant }}-windows-x64.evidence
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "ffmpeg-out\$env:TOOL-$env:VARIANT-windows-x64.exe"
          if ($env:TOOL -eq 'ffprobe') { $env:RIGHTKIT_MEDIA_PROMOTE_FFPROBE = $exe } else { $env:RIGHTKIT_MEDIA_PROMOTE_FFMPEG = $exe }
          cargo test -p rightkit-media --test promote_evidence_windows -- --nocapture

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.tool }}-${{ inputs.variant }}-windows-x64
          path: ffmpeg-out/
          if-no-files-found: error
          retention-days: 30
