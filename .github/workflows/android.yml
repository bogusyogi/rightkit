# Android compile lane (rightkit#203, docs/design/android-minimum.md section 6 item 1).
# Runs `cargo ndk ... check` for every crate HeardRight's Android shell needs. Every crate is
# checked even when an earlier one fails, and the failing crates are named in the summary.
# Pins come from crates/rightkit-android/scripts/toolchain.versions.
name: android-compile
run-name: android-compile ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Broker request correlation ID (not signed authority)
        type: string
        required: true
      expected_sha:
        description: Full commit SHA admitted by broker
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-ndk-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate broker dispatch correlation
        shell: bash
        env:
          RK_REQUEST_ID: ${{ inputs.request_id }}
          RK_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$RK_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$RK_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RK_EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Android toolchain
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^(NDK_VERSION|CARGO_NDK_VERSION|MIN_SDK)=' crates/rightkit-android/scripts/toolchain.versions >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install pinned NDK
        shell: bash
        env:
          NDK_VERSION: ${{ steps.pins.outputs.NDK_VERSION }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        env:
          CARGO_NDK_VERSION: ${{ steps.pins.outputs.CARGO_NDK_VERSION }}
        run: cargo install --locked cargo-ndk --version "$CARGO_NDK_VERSION"
      - name: cargo ndk check, per crate
        shell: bash
        env:
          MIN_SDK: ${{ steps.pins.outputs.MIN_SDK }}
        run: |
          set -uo pipefail
          failed=()
          check() {
            local name="$1"; shift
            echo "::group::$name"
            if ! cargo ndk -t arm64-v8a -t x86_64 --platform "$MIN_SDK" check --locked "$@"; then
              failed+=("$name")
              echo "::error title=Android compile failed::$name"
            fi
            echo "::endgroup::"
          }
          for crate in rightkit-android rightkit-fs rightkit-credentials rightkit-http rightkit-models \
                       rightkit-app-settings rightkit-license rightkit-device rightkit-vad rightkit-logs; do
            check "$crate" -p "$crate"
          done
          check "rightkit-sync (drive)" -p rightkit-sync --no-default-features --features drive
          if (( ${#failed[@]} )); then
            printf 'Android compile failed for: %s\n' "${failed[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All Android crates compile." >> "$GITHUB_STEP_SUMMARY"
