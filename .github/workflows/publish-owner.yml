# One-off owner-approved crate publication outside the gate and broker (rightkit#1322), with Class A kept. It uploads only
# the #1322 crates a committed ci/owner-approvals/*.json names, after scripts/ci/owner-approval.mjs proves the source
# commit (which already contains this workflow and its checker, so its Class A covers them), the green hand-dispatched
# native CI attempt of that commit (Class A jobs plus a green macOS and Windows shard for every crate), and that only
# approval files changed since. publish.yml (broker admission) is untouched.
name: publish-owner
run-name: publish-owner ${{ inputs.approval }}
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Approval file on main (ci/owner-approvals/<name>.json)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      crates: ${{ steps.check.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
      - id: check
        env:
          APPROVAL: ${{ inputs.approval }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/owner-approval.mjs
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          toolchain: 1.98.0
      - name: Package each approved crate once and check the archive against registry dependencies
        env:
          CRATES: ${{ needs.verify.outputs.crates }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/owner-publish"
          mkdir -p "$out"
          for crate in $CRATES; do
            version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' "crates/$crate/Cargo.toml" | head -1)
            (cd "crates/$crate" && cargo package --locked)
            archive="$PWD/crates/$crate/target/package/$crate-$version.crate"
            sum=$(sha256sum "$archive" | cut -d' ' -f1)
            printf '{"archive":"%s","sha256":"%s","version":"%s"}\n' "$archive" "$sum" "$version" > "$out/$crate.json"
            extracted="$PWD/crates/$crate/target/package/$crate-$version"
            # The feature rows gate.mjs runs: featureSets (default [[]]), then checkFeatureSets (default [["--all-features"]]) unless a test row already uses --all-features.
            node -e 'const c=require("./ci/gate.config.json");const e=c.rust?.[process.argv[1]];if(!e){console.error("no ci/gate.config.json rust entry for "+process.argv[1]);process.exit(1)}const t=e.featureSets??[[]];const k=t.some(s=>s.includes("--all-features"))?[]:(e.checkFeatureSets??[["--all-features"]]);for(const s of [...t,...k])console.log(s.join(" ")||"(default)")' "$crate" > "$out/$crate.features"
            test -s "$out/$crate.features"
            while IFS= read -r set; do
              [ "$set" = "(default)" ] && set=""
              echo "cargo check $crate ${set:-default features}"
              cargo check --manifest-path "$extracted/Cargo.toml" $set
            done < "$out/$crate.features"
          done
      - name: Upload the exact checked archives and read the index checksum back
        env:
          CRATES: ${{ needs.verify.outputs.crates }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/ci/owner-upload.mjs "$RUNNER_TEMP/owner-publish" $CRATES
