name: publish-direct
run-name: publish-direct ${{ github.event.workflow_run.id || inputs.run_id }} ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
# Direct publication. Every publish.yml qualification run that completes green on main is uploaded to its registry
# here, with no committed candidate, approval pin or publish-reviewed dispatch between qualification and upload
# (Adrian, 2026-10-22: "As soon as the qualification passes on GitHub, GitHub can directly push it to npm and crates").
# The uploader (scripts/ci/reviewed-candidate.mjs run-qualified) reads only that run's own sealed artifact and verify
# receipts, re-checks the run's provenance and job conclusions through the API, and publishes the exact sealed bytes.
# The verifier code is checked out at the qualified commit: the code that qualified the bytes is the code that uploads.
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
    branches: [main]
  # A publish.yml run dispatched by a workflow token (qualify-direct.yml) raises no workflow_run event, so a maintainer names the
  # completed run here. The uploader re-reads that run through the API and refuses anything but a green workflow_dispatch run of
  # publish.yml on main at this sha and attempt, exactly as for the workflow_run event (scripts/ci/reviewed-candidate.mjs prepareQualified).
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed publish.yml run id
        type: string
        required: true
      run_attempt:
        description: Its attempt number
        type: string
        required: true
      head_sha:
        description: Its head commit SHA
        type: string
        required: true
      gate_acceptance:
        description: "Only for a run that sealed @rightkit/release: base64 of a gzip tar of the acceptance folder (acceptance-result.json, job-claims/, gate-seal/) that packages/release/acceptance-result.mjs writes"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  # GATE-CONTRACT NN31, first half. @rightkit/release is uploaded only against a record that a passing acceptance result admits this exact sealed
  # archive (scripts/ci/upload.mjs gateAdmissionProblem). This job writes that record and holds nothing the upload job holds: no environment, no
  # id-token, no secret, read-only repository and Actions scopes. It fetches the run's sealed archive through the uploader's own fetch and checks
  # (reviewed-candidate.mjs export-gate-archive = prepareQualified), then runs packages/release/gate-release-admission.mjs on the maintainer's acceptance
  # folder (inputs.gate_acceptance). It runs only for a dispatch that names an acceptance folder; for a run that sealed no gate package it does nothing.
  gate-admission:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate_acceptance != '' && github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      record_artifact: ${{ steps.record.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          # The same sparse list as the upload job (everything reviewed-candidate.mjs reaches), with the whole of packages/release in place of its listed
          # files: gate-release-admission.mjs reads contract-nn.json and the acceptance judge files from there, docs/GATE-CONTRACT.md and the committed
          # ci/rk-pipeline.json (the host keys it trusts). Nothing here holds a credential, so the wider checkout opens nothing.
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            crates/*/Cargo.toml
            crates/*/Cargo.lock
            /package.json
            /pnpm-workspace.yaml
            /pnpm-lock.yaml
            packages/*/package.json
            scripts/ci/scan-receipt.mjs
            scripts/ci/crate-scan-workspaces.mjs
            scripts/ci/upload.mjs
            scripts/ci/registry-spec.mjs
            scripts/ci/reviewed-candidate.mjs
            scripts/ci/publish-admission.mjs
            scripts/ci/supplemental-proof.mjs
            ci/linux-required.json
            /packages/release/
            docs/GATE-CONTRACT.md
            ci/rk-pipeline.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.16.1
          package_json_file: package.json
          run_install: false
      - name: Install the RightKit release closure without lifecycle scripts
        run: pnpm install --filter rightkit-shared --filter @rightkit/release... --frozen-lockfile --ignore-scripts
      - name: Fetch the sealed gate archive of the qualified run
        id: archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ inputs.head_sha }}
        run: node scripts/ci/reviewed-candidate.mjs export-gate-archive
      - name: Admit the archive against the acceptance result
        id: record
        if: ${{ steps.archive.outputs.has_gate == 'true' }}
        env:
          GATE_ACCEPTANCE: ${{ inputs.gate_acceptance }}
          GATE_ARCHIVE: ${{ steps.archive.outputs.archive }}
          GATE_COMMIT: ${{ steps.archive.outputs.commit }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/gate-acceptance"; out="${RUNNER_TEMP}/gate-admission"
          mkdir "$dir" "$out"
          # The folder is the maintainer's input and is judged by the admission; here it is only unpacked: capped at 64 MiB, and a tar with any member
          # that is not a plain file or directory (a link, a device) is refused before anything is extracted.
          printf '%s' "$GATE_ACCEPTANCE" | base64 -d | gzip -dc | head -c 67108864 > "${RUNNER_TEMP}/gate-acceptance.tar"
          if tar -tvf "${RUNNER_TEMP}/gate-acceptance.tar" | grep -qv '^[-d]'; then echo "the acceptance folder holds a member that is neither a file nor a directory" >&2; exit 1; fi
          tar -xf "${RUNNER_TEMP}/gate-acceptance.tar" --no-same-owner --no-same-permissions -C "$dir"
          node packages/release/gate-release-admission.mjs --receipt "$dir/acceptance-result.json" --archive "$GATE_ARCHIVE" --commit "$GATE_COMMIT" --pipeline ci/rk-pipeline.json --record "$out/gate-admission.json"
          echo "artifact=gate-admission-record-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Keep the admission record
        if: ${{ steps.record.outputs.artifact != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: ${{ runner.temp }}/gate-admission/gate-admission.json
          retention-days: 7
          if-no-files-found: error
  upload:
    # The gate admission runs before the upload for a dispatch that carries an acceptance folder, and is skipped otherwise: a skipped gate-admission lets every
    # other run through, and a failed one stops the upload.
    needs: [gate-admission]
    if: ${{ !cancelled() && (needs.gate-admission.result == 'success' || needs.gate-admission.result == 'skipped') && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'bogusyogi/rightkit' && github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit')) }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
          persist-credentials: false
          # The scan receipt binds each crate unit to the lock of the Cargo workspace that owns it (scripts/ci/scan-receipt.mjs): the root
          # Cargo.lock for a member of the one root workspace (rightkit#1505), crates/<x>/Cargo.lock for a crate that is its own workspace.
          # RA-21: the packages/release entries are the complete static import closure of `reviewed-candidate.mjs run-qualified`,
          # checked by scripts/ci/publish-admission.test.mjs; keep the list in step with any new static import.
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            crates/*/Cargo.toml
            crates/*/Cargo.lock
            /package.json
            /pnpm-workspace.yaml
            /pnpm-lock.yaml
            packages/*/package.json
            packages/release/scan-digest.mjs
            packages/release/feature-sets.mjs
            packages/release/protected-credentials.mjs
            packages/release/runtime-manifest-refresh.mjs
            packages/release/adapter-env.mjs
            packages/release/adhoc-entitlements.mjs
            packages/release/admission-host.mjs
            packages/release/atomic-write.mjs
            packages/release/background-process.mjs
            packages/release/broker-client.mjs
            packages/release/broker-pins.mjs
            packages/release/build-launch.mjs
            packages/release/cache-policy.mjs
            packages/release/cargo-contract.mjs
            packages/release/cargo-ledger.mjs
            packages/release/cargo-manifest-text.mjs
            packages/release/cargo-registry-readback.mjs
            packages/release/cargo-target-shim.mjs
            packages/release/committed-cargo-workspace.mjs
            packages/release/feature-coverage.mjs
            packages/release/gate-seam.mjs
            packages/release/receipt-signature.mjs
            packages/release/seam-broker.mjs
            packages/release/stage-seam.mjs
            packages/release/cargo-target.mjs
            packages/release/codesign-argv.mjs
            packages/release/committed-source.mjs
            packages/release/crate-graph.mjs
            packages/release/credential-provider.mjs
            packages/release/cross-targets.mjs
            packages/release/development-signing.mjs
            packages/release/devtools-policy.mjs
            packages/release/execution-policy.mjs
            packages/release/external-bin.mjs
            packages/release/gate-executor.mjs
            packages/release/gate-stages.mjs
            packages/release/host-upload-refusal.mjs
            packages/release/local-publish.mjs
            packages/release/mac-bundle-signing.mjs
            packages/release/mac-sign-core.mjs
            packages/release/mac-signing-matrix.mjs
            packages/release/macos-file-evidence.mjs
            packages/release/macos-signing-identity.mjs
            packages/release/macos-signing-session.mjs
            packages/release/managed-cargo.mjs
            packages/release/managed-host-secrets.mjs
            packages/release/managed-roots.mjs
            packages/release/managed-target-stage.mjs
            packages/release/media-sidecar-catalog.mjs
            packages/release/media-sidecar.mjs
            packages/release/msix-config.mjs
            packages/release/native-adapters.mjs
            packages/release/native-cargo-layout.mjs
            packages/release/native-helpers.mjs
            packages/release/notary-auth.mjs
            packages/release/outdated-command.mjs
            packages/release/ownership-approval.mjs
            packages/release/ownership-dependency-allowlist.mjs
            packages/release/ownership-evidence.mjs
            packages/release/ownership-git-inventory.mjs
            packages/release/ownership-key-authority.mjs
            packages/release/ownership-key-log.mjs
            packages/release/ownership-key-trust.mjs
            packages/release/ownership-lockfiles.mjs
            packages/release/ownership-policy-bundle.mjs
            packages/release/ownership-scope.mjs
            packages/release/ownership-source.mjs
            packages/release/ownership-verdict.mjs
            packages/release/ownership-windows-presence.mjs
            packages/release/ownership.mjs
            packages/release/pack-digest.mjs
            packages/release/platform-dir.mjs
            packages/release/preflight.mjs
            packages/release/progress-control.mjs
            packages/release/project-type.mjs
            packages/release/publication-artifacts.mjs
            packages/release/publication-gate.mjs
            packages/release/publish-cargo.mjs
            packages/release/qa-build-features.mjs
            packages/release/qa-control-scan.mjs
            packages/release/qualification-verify.mjs
            packages/release/direct-origin.mjs
            packages/release/recipe-build.mjs
            packages/release/release-cache-mode.mjs
            packages/release/release-checks.mjs
            packages/release/release-source-brand.mjs
            packages/release/release-state.mjs
            packages/release/release-switch-registry.json
            packages/release/rightkit-registry-resolver.mjs
            packages/release/rightkit-signing-agent.mjs
            packages/release/rightkit-sync.mjs
            packages/release/runtime-budget-crates.mjs
            packages/release/runtime-budgets.mjs
            packages/release/rustright-names.mjs
            packages/release/sign-windows.mjs
            packages/release/signing-agent-client.mjs
            packages/release/signing-agent-install.mjs
            packages/release/signing-env.mjs
            packages/release/signing-identity.mjs
            packages/release/snapshot-metadata.mjs
            packages/release/source-gate.mjs
            packages/release/stage-commands.mjs
            packages/release/suite-signing-policy.mjs
            packages/release/swap-helper-bundle.mjs
            packages/release/swift-mac-app.mjs
            packages/release/swift-scratch.mjs
            packages/release/tauri-locked.mjs
            packages/release/test-env.mjs
            scripts/ci/scan-receipt.mjs
            scripts/ci/crate-scan-workspaces.mjs
            scripts/ci/upload.mjs
            scripts/ci/registry-spec.mjs
            scripts/ci/reviewed-candidate.mjs
            scripts/ci/publish-admission.mjs
            packages/release/pack-digest.mjs
            packages/release/qualification-verify.mjs
            packages/release/direct-origin.mjs
            packages/release/swap-helper-bundle.mjs
            scripts/ci/supplemental-proof.mjs
            ci/linux-required.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.16.1
          package_json_file: package.json
          run_install: false
      # RA-21: the install that puts smol-toml (packages/release/package.json) where the run-qualified modules resolve it. It runs before
      # any step that holds a token, and it is the same frozen, script-free install publish-reviewed.yml runs.
      - name: Install the RightKit release closure without lifecycle scripts
        run: pnpm install --filter rightkit-shared --filter @rightkit/release... --frozen-lockfile --ignore-scripts
      # GATE-CONTRACT NN31, second half: the record the gate-admission job wrote, when it wrote one. The path reaches only the two steps that check it
      # (the identification, which refuses a gate run before any credential step, and the npm upload); a run without a record names no path, and
      # upload.mjs refuses the gate package for want of one. The record is re-compared there with the sealed bytes this job fetched itself.
      - name: Fetch the gate admission record
        if: ${{ needs.gate-admission.outputs.record_artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.gate-admission.outputs.record_artifact }}
          path: ${{ runner.temp }}/gate-admission
      - name: Identify the green qualification run without registry credentials
        id: qualified
        env:
          RK_GATE_ADMISSION_RECORD: ${{ needs.gate-admission.outputs.record_artifact != '' && format('{0}/gate-admission/gate-admission.json', runner.temp) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
        run: node scripts/ci/reviewed-candidate.mjs run-qualified --identify
      - name: Publish the sealed npm archives of the qualified run
        if: ${{ steps.qualified.outputs.registry == 'npm' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
          PUBLISH_REGISTRY: npm
          RK_GATE_ADMISSION_RECORD: ${{ needs.gate-admission.outputs.record_artifact != '' && format('{0}/gate-admission/gate-admission.json', runner.temp) || '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/ci/reviewed-candidate.mjs run-qualified
      - name: Publish the sealed Cargo archives of the qualified run
        if: ${{ steps.qualified.outputs.registry == 'crates' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
          PUBLISH_REGISTRY: crates
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/ci/reviewed-candidate.mjs run-qualified
      - name: Keep publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-receipt-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 90
          if-no-files-found: ignore
