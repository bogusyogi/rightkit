name: publish-direct
run-name: publish-direct ${{ github.event.workflow_run.id }} ${{ github.event.workflow_run.run_attempt }}
# Direct publication. Every publish.yml qualification run that completes green on main is uploaded to its registry
# here, with no committed candidate, approval pin or publish-reviewed dispatch between qualification and upload
# (Adrian, 2026-10-22: "As soon as the qualification passes on GitHub, GitHub can directly push it to npm and crates").
# The uploader (scripts/ci/reviewed-candidate.mjs run-qualified) reads only that run's own sealed artifact and verify
# receipts, re-checks the run's provenance and job conclusions through the API, and publishes the exact sealed bytes.
# The verifier code is checked out at the qualified commit: the code that qualified the bytes is the code that uploads.
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  queue: max
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'bogusyogi/rightkit' && github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          # rightkit#1285: each crate is its own Cargo workspace; the scan receipt binds each unit to its own crates/<x>/Cargo.lock.
          # RA-21: the packages/release entries are the complete static import closure of `reviewed-candidate.mjs run-qualified`,
          # checked by scripts/ci/publish-admission.test.mjs; keep the list in step with any new static import.
          sparse-checkout: |
            crates/*/Cargo.toml
            crates/*/Cargo.lock
            /package.json
            /pnpm-workspace.yaml
            /pnpm-lock.yaml
            packages/*/package.json
            packages/release/scan-digest.mjs
            packages/release/adapter-env.mjs
            packages/release/adhoc-entitlements.mjs
            packages/release/admission-host.mjs
            packages/release/atomic-write.mjs
            packages/release/background-process.mjs
            packages/release/broker-client.mjs
            packages/release/broker-pins.mjs
            packages/release/broker-wire.mjs
            packages/release/build-launch.mjs
            packages/release/cache-policy.mjs
            packages/release/cargo-contract.mjs
            packages/release/cargo-ledger.mjs
            packages/release/cargo-manifest-text.mjs
            packages/release/cargo-registry-readback.mjs
            packages/release/cargo-shapes.mjs
            packages/release/cargo-target-shim.mjs
            packages/release/cargo-target.mjs
            packages/release/carried-cargo.mjs
            packages/release/carrier-census.mjs
            packages/release/codesign-argv.mjs
            packages/release/committed-source.mjs
            packages/release/crate-graph.mjs
            packages/release/development-signing.mjs
            packages/release/devtools-policy.mjs
            packages/release/execution-policy.mjs
            packages/release/gate-executor.mjs
            packages/release/gate-stages.mjs
            packages/release/host-upload-refusal.mjs
            packages/release/local-publish.mjs
            packages/release/lock-identity.mjs
            packages/release/mac-bundle-signing.mjs
            packages/release/mac-sign-core.mjs
            packages/release/mac-signing-matrix.mjs
            packages/release/macos-file-evidence.mjs
            packages/release/macos-signing-identity.mjs
            packages/release/macos-signing-session.mjs
            packages/release/managed-cargo.mjs
            packages/release/managed-host-secrets.mjs
            packages/release/managed-roots.mjs
            packages/release/managed-target-stage.mjs
            packages/release/media-sidecar-catalog.mjs
            packages/release/media-sidecar.mjs
            packages/release/msix-config.mjs
            packages/release/native-adapters.mjs
            packages/release/native-cargo-layout.mjs
            packages/release/native-helpers.mjs
            packages/release/notary-auth.mjs
            packages/release/outdated-command.mjs
            packages/release/ownership-approval.mjs
            packages/release/ownership-dependency-allowlist.mjs
            packages/release/ownership-evidence.mjs
            packages/release/ownership-git-inventory.mjs
            packages/release/ownership-key-authority.mjs
            packages/release/ownership-key-log.mjs
            packages/release/ownership-key-trust.mjs
            packages/release/ownership-lockfiles.mjs
            packages/release/ownership-mark.mjs
            packages/release/ownership-policy-bundle.mjs
            packages/release/ownership-scope.mjs
            packages/release/ownership-source.mjs
            packages/release/ownership-verdict.mjs
            packages/release/ownership-windows-presence.mjs
            packages/release/ownership.mjs
            packages/release/pack-digest.mjs
            packages/release/platform-dir.mjs
            packages/release/pnpm-adapter-grammar.mjs
            packages/release/preflight.mjs
            packages/release/progress-control.mjs
            packages/release/project-type.mjs
            packages/release/provenance-verify.mjs
            packages/release/publication-artifacts.mjs
            packages/release/publication-gate.mjs
            packages/release/publish-cargo.mjs
            packages/release/qa-build-features.mjs
            packages/release/qa-control-scan.mjs
            packages/release/qa-journeys-prebuilt.mjs
            packages/release/qa-snapshot.mjs
            packages/release/qualification-verify.mjs
            packages/release/recipe-build.mjs
            packages/release/release-cache-mode.mjs
            packages/release/release-checks.mjs
            packages/release/release-source-brand.mjs
            packages/release/release-state.mjs
            packages/release/rightkit-registry-resolver.mjs
            packages/release/rightkit-signing-agent.mjs
            packages/release/rightkit-sync.mjs
            packages/release/runtime-budget-crates.mjs
            packages/release/runtime-budgets.mjs
            packages/release/rustright-names.mjs
            packages/release/sign-windows.mjs
            packages/release/signing-agent-client.mjs
            packages/release/signing-agent-install.mjs
            packages/release/signing-env.mjs
            packages/release/signing-identity.mjs
            packages/release/snapshot-broker.mjs
            packages/release/snapshot-metadata.mjs
            packages/release/snapshot-request.mjs
            packages/release/source-gate.mjs
            packages/release/stage-commands.mjs
            packages/release/suite-signing-policy.mjs
            packages/release/suite-signing.mjs
            packages/release/swap-helper-bundle.mjs
            packages/release/swift-mac-app.mjs
            packages/release/swift-scratch.mjs
            packages/release/tauri-locked.mjs
            scripts/ci/scan-receipt.mjs
            scripts/ci/upload.mjs
            scripts/ci/registry-spec.mjs
            scripts/ci/reviewed-candidate.mjs
            scripts/ci/publish-admission.mjs
            scripts/ci/supplemental-proof.mjs
            ci/linux-required.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.25.0
          package_json_file: package.json
          run_install: false
      # RA-21: the install that puts smol-toml (packages/release/package.json) where the run-qualified modules resolve it. It runs before
      # any step that holds a token, and it is the same frozen, script-free install publish-reviewed.yml runs.
      - name: Install the RightKit release closure without lifecycle scripts
        run: pnpm install --filter rightkit-shared --filter @rightkit/release... --frozen-lockfile --ignore-scripts
      - name: Identify the green qualification run without registry credentials
        id: qualified
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/reviewed-candidate.mjs run-qualified --identify
      - name: Publish the sealed npm archives of the qualified run
        if: ${{ steps.qualified.outputs.registry == 'npm' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISH_REGISTRY: npm
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/ci/reviewed-candidate.mjs run-qualified
      - name: Publish the sealed Cargo archives of the qualified run
        if: ${{ steps.qualified.outputs.registry == 'crates' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_QUALIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_QUALIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLISH_QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISH_REGISTRY: crates
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/ci/reviewed-candidate.mjs run-qualified
      - name: Keep publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-receipt-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 90
          if-no-files-found: ignore
