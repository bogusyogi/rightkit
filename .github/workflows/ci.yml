# Hand-owned: this workflow is no longer rendered by right-git (the rust-hybrid ci template runs the whole gate
# in one job per OS, which cannot fan out). Edit it here; docs/CI.md "Sharded CI" describes the design.
name: rightkit-shared-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
env:
  NODE_VERSION: "26.8.1"
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1

  # Decides what this run has to verify and cuts it into jobs; compiles and tests nothing.
  plan:
    needs: [private-repo-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      windows_shards: ${{ steps.plan.outputs.windows_shards }}
      windows_shard_count: ${{ steps.plan.outputs.windows_shard_count }}
      windows_closure: ${{ steps.plan.outputs.windows_closure }}
      windows_closure_count: ${{ steps.plan.outputs.windows_closure_count }}
      windows_base: ${{ steps.plan.outputs.windows_base }}
      macos_shards: ${{ steps.plan.outputs.macos_shards }}
      macos_shard_count: ${{ steps.plan.outputs.macos_shard_count }}
      macos_closure: ${{ steps.plan.outputs.macos_closure }}
      macos_closure_count: ${{ steps.plan.outputs.macos_closure_count }}
      macos_base: ${{ steps.plan.outputs.macos_base }}
      hygiene_tokens: ${{ steps.plan.outputs.hygiene_tokens }}
      scan_crates: ${{ steps.plan.outputs.scan_crates }}
      evidence: ${{ steps.plan.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # One last-green marker per runner OS: a push is compared with the last commit THAT OS passed on, so a red
      # run is repeated in full for the units it covered until they pass. Pull requests use their merge base.
      - name: Restore last green commit marker (windows-2025)
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.right-git-last-green/windows-2025
          key: rightkit-shared-last-green-windows-2025-${{ env.NODE_VERSION }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            rightkit-shared-last-green-windows-2025-${{ env.NODE_VERSION }}-${{ github.ref_name }}-
      - name: Restore last green commit marker (xcode-27)
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.right-git-last-green/xcode-27
          key: rightkit-shared-last-green-xcode-27-${{ env.NODE_VERSION }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            rightkit-shared-last-green-xcode-27-${{ env.NODE_VERSION }}-${{ github.ref_name }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Plan shards
        id: plan
        shell: bash
        run: node scripts/ci/ci-plan.mjs

  # Windows: one job per group of crates / npm packages (a crate's feature rows always stay together).
  # max-parallel bounds this matrix; GitHub admits jobs under account-wide concurrency.
  shards-windows:
    needs: [plan]
    if: ${{ needs.plan.outputs.windows_shard_count != '0' }}
    name: windows ${{ matrix.id }}
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.windows_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: ${{ matrix.rust }}
          cache-key: ${{ matrix.cacheKey }}
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Gate shard
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.windows_base }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps test ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-windows-2025-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # macOS matrix caps are 3 shard jobs + 2 closure jobs; GitHub controls actual admission.
  shards-macos:
    needs: [plan]
    if: ${{ needs.plan.outputs.macos_shard_count != '0' }}
    name: macos ${{ matrix.id }}
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.macos_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: ${{ matrix.rust }}
          cache-key: ${{ matrix.cacheKey }}
          save-cache: ${{ github.event_name != 'pull_request' }}
          derived-data: ${{ matrix.swift && 'xcode-27' || '' }}
      - name: Gate shard
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.macos_base }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps test ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-xcode-27-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Dependents of a changed crate must still compile: default features, then the crate's checkFeatureSets
  # rows (all features unless ci/gate.config.json says otherwise). Separate from the crates' own test jobs.
  closure-windows:
    needs: [plan]
    if: ${{ needs.plan.outputs.windows_closure_count != '0' }}
    name: windows ${{ matrix.id }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.windows_closure) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: "true"
          cache-key: ${{ matrix.cacheKey }}
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Dependent closure check
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.windows_base }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps closure ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-windows-2025-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  closure-macos:
    needs: [plan]
    if: ${{ needs.plan.outputs.macos_closure_count != '0' }}
    name: macos ${{ matrix.id }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.macos_closure) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: "true"
          cache-key: ${{ matrix.cacheKey }}
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Dependent closure check
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.macos_base }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps closure ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-xcode-27-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Checks that do not depend on the OS, once for the whole run: RightKit ownership, the Cargo.lock check, rustfmt
  # and the secret scan of every selected crate and package, and the best-effort owner dependency graphs.
  hygiene:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: "true"
          cache-key: rk-ubuntu-hygiene
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: RightKit ownership (protected registry roots)
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app . --advisory-when-pending
      - name: Cargo.lock and rustfmt (selected crates)
        if: ${{ !cancelled() && needs.plan.outputs.hygiene_tokens != '' }}
        shell: bash
        env:
          HYGIENE_TOKENS: ${{ needs.plan.outputs.hygiene_tokens }}
        run: node scripts/ci/gate.mjs --select "$HYGIENE_TOKENS" --steps lock,fmt
      - name: Secret scan (selected crates)
        if: ${{ !cancelled() && needs.plan.outputs.scan_crates != '' }}
        shell: bash
        env:
          SCAN_CRATES: ${{ needs.plan.outputs.scan_crates }}
        run: node scripts/ci/secret-scan.mjs --crates "$SCAN_CRATES"
      - name: Owner dependency graphs (best effort)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/ci/owner-dep-graphs.sh || echo "owner-dep-graphs: warning: skipped"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-hygiene-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          if-no-files-found: ignore

  # A runner OS's marker moves to this commit only when everything that OS had to verify passed
  # (hygiene covers both OSes). Known-red units do not fail a job, so they do not hold the marker back.
  mark-green-windows:
    needs: [plan, hygiene, shards-windows, closure-windows, summary]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.hygiene.result == 'success' && needs.summary.outputs.windows_green == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record last green commit marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.right-git-last-green/windows-2025"
          printf '%s\n' "$GITHUB_SHA" > "$HOME/.right-git-last-green/windows-2025/sha"
      - name: Save last green commit marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.right-git-last-green/windows-2025
          key: rightkit-shared-last-green-windows-2025-${{ env.NODE_VERSION }}-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  mark-green-macos:
    needs: [plan, hygiene, shards-macos, closure-macos, summary]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.hygiene.result == 'success' && needs.summary.outputs.macos_green == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record last green commit marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.right-git-last-green/xcode-27"
          printf '%s\n' "$GITHUB_SHA" > "$HOME/.right-git-last-green/xcode-27/sha"
      - name: Save last green commit marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.right-git-last-green/xcode-27
          key: rightkit-shared-last-green-xcode-27-${{ env.NODE_VERSION }}-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The one required check: it fails unless the guard, the plan and hygiene passed and every shard and closure
  # job passed or was legitimately not needed (skipped). A cancelled or failed matrix leg fails its job.
  summary:
    outputs:
      windows_green: ${{ steps.verdict.outputs.windows_green }}
      macos_green: ${{ steps.verdict.outputs.macos_green }}
    if: ${{ always() }}
    needs: [private-repo-guard, plan, hygiene, shards-windows, closure-windows, shards-macos, closure-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qa-evidence-*
          path: ci-evidence
      - name: Verdict
        id: verdict
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-summary.mjs
