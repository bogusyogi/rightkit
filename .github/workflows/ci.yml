# Hand-owned: this workflow is no longer rendered by right-git (the rust-hybrid ci template runs the whole gate
# in one job per OS, which cannot fan out). Edit it here; docs/CI.md "Sharded CI" describes the design.
name: rightkit-shared-ci
run-name: rightkit-shared-ci ${{ inputs.request_id || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Broker request correlation ID (not signed authority)
        type: string
        required: true
      expected_sha:
        description: Full commit SHA admitted by broker
        type: string
        required: true
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main establish a green baseline; default single pending slot coalesces newer pushes.
  # Superseded PR runs may cancel. Immutable qualification uses separate per-run groups.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NODE_VERSION: "26.8.1"
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate broker dispatch correlation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RK_REQUEST_ID: ${{ inputs.request_id }}
          RK_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$RK_REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$RK_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RK_EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1

  # Decides what this run has to verify and cuts it into jobs; compiles and tests nothing.
  plan:
    needs: [private-repo-guard]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      windows_shards: ${{ steps.plan.outputs.windows_shards }}
      windows_shard_count: ${{ steps.plan.outputs.windows_shard_count }}
      windows_closure: ${{ steps.plan.outputs.windows_closure }}
      windows_closure_count: ${{ steps.plan.outputs.windows_closure_count }}
      windows_base: ${{ steps.plan.outputs.windows_base }}
      macos_shards: ${{ steps.plan.outputs.macos_shards }}
      macos_shard_count: ${{ steps.plan.outputs.macos_shard_count }}
      macos_closure: ${{ steps.plan.outputs.macos_closure }}
      macos_closure_count: ${{ steps.plan.outputs.macos_closure_count }}
      macos_base: ${{ steps.plan.outputs.macos_base }}
      hygiene_tokens: ${{ steps.plan.outputs.hygiene_tokens }}
      scan_base: ${{ steps.plan.outputs.scan_base }}
      scan_crates: ${{ steps.plan.outputs.scan_crates }}
      scan_packages: ${{ steps.plan.outputs.scan_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Seconds, committed files only (scripts/preflight.mjs, the pre-push hook's first step). Every other job needs plan,
      # so a push that skipped the hook stops here, before any shard or hosted runner starts.
      - name: Preflight (committed files only)
        run: node scripts/preflight.mjs
      - name: Resolve authenticated per-OS baseline
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/last-green.mjs resolve --out last-green.json
      - name: Plan shards
        id: plan
        shell: bash
        run: node scripts/ci/ci-plan.mjs --last-green "$RUNNER_TEMP/last-green.json" --evidence-out "$RUNNER_TEMP/ci-plan/evidence.json"
      # The evidence plan reaches the summary as a file: as a job output it exceeds the 128 KiB one environment string holds
      # once a run touches most units (run 40034020934, "Argument list too long").
      - name: Upload evidence plan
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan/evidence.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Windows: one job per group of crates / npm packages (a crate's feature rows always stay together).
  # max-parallel bounds this matrix; GitHub admits jobs under account-wide concurrency.
  shards-windows:
    needs: [plan, hygiene]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.windows_shard_count != '0' }}
    name: windows ${{ matrix.id }}
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.windows_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: ${{ matrix.kind == 'npm' || matrix.kind == 'root' }}
          rust: ${{ matrix.rust }}
          cache-key: ${{ matrix.cacheKey }}
          # Push-triggered runs build without the Rust cache: 61 pushes on 2026-10-23 each restored hundreds of MB per
          # shard and exhausted the account's Actions storage egress (macOS verify of @rightkit/legal 0.6.3 could not fetch its
          # artifact). Broker-requested runs restore and save; pull requests restore only.
          save-cache: ${{ github.event_name == 'workflow_dispatch' }}
          restore-cache: ${{ github.event_name != 'push' }}
      - name: Gate shard
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.windows_base }}
          RK_SCANS_JOB_RESULT: ${{ needs.hygiene.result }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps test ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-windows-2025-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Offer all five standard macOS slots; GitHub controls account-wide admission, including closure jobs.
  shards-macos:
    needs: [plan, hygiene]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.macos_shard_count != '0' }}
    name: macos ${{ matrix.id }}
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.macos_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: ${{ matrix.kind == 'npm' || matrix.kind == 'root' }}
          rust: ${{ matrix.rust }}
          cache-key: ${{ matrix.cacheKey }}
          # Push-triggered runs build without the Rust cache: 61 pushes on 2026-10-23 each restored hundreds of MB per
          # shard and exhausted the account's Actions storage egress (macOS verify of @rightkit/legal 0.6.3 could not fetch its
          # artifact). Broker-requested runs restore and save; pull requests restore only.
          save-cache: ${{ github.event_name == 'workflow_dispatch' }}
          restore-cache: ${{ github.event_name != 'push' }}
          derived-data: ${{ matrix.swift && 'xcode-27' || '' }}
      - name: Gate shard
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.macos_base }}
          RK_SCANS_JOB_RESULT: ${{ needs.hygiene.result }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps test ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-xcode-27-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Dependents of a changed crate must still compile: default features, then the crate's checkFeatureSets
  # rows (all features unless ci/gate.config.json says otherwise). Separate from the crates' own test jobs.
  closure-windows:
    needs: [plan, hygiene]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.windows_closure_count != '0' }}
    name: windows ${{ matrix.id }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.windows_closure) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: "false"
          rust: "true"
          cache-key: ${{ matrix.cacheKey }}
          # Push-triggered runs build without the Rust cache: 61 pushes on 2026-10-23 each restored hundreds of MB per
          # shard and exhausted the account's Actions storage egress (macOS verify of @rightkit/legal 0.6.3 could not fetch its
          # artifact). Broker-requested runs restore and save; pull requests restore only.
          save-cache: ${{ github.event_name == 'workflow_dispatch' }}
          restore-cache: ${{ github.event_name != 'push' }}
      - name: Dependent closure check
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.windows_base }}
          RK_SCANS_JOB_RESULT: ${{ needs.hygiene.result }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps closure ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-windows-2025-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  closure-macos:
    needs: [plan, hygiene]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.macos_closure_count != '0' }}
    name: macos ${{ matrix.id }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.macos_closure) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: "false"
          rust: "true"
          cache-key: ${{ matrix.cacheKey }}
          # Push-triggered runs build without the Rust cache: 61 pushes on 2026-10-23 each restored hundreds of MB per
          # shard and exhausted the account's Actions storage egress (macOS verify of @rightkit/legal 0.6.3 could not fetch its
          # artifact). Broker-requested runs restore and save; pull requests restore only.
          save-cache: ${{ github.event_name == 'workflow_dispatch' }}
          restore-cache: ${{ github.event_name != 'push' }}
      - name: Dependent closure check
        shell: bash
        env:
          SHARD_TOKENS: ${{ matrix.tokens }}
          SHARD_BASE: ${{ needs.plan.outputs.macos_base }}
          RK_SCANS_JOB_RESULT: ${{ needs.hygiene.result }}
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: node scripts/ci/gate.mjs --select "$SHARD_TOKENS" --steps closure ${SHARD_BASE:+--base "$SHARD_BASE"}
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-xcode-27-${{ matrix.id }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Cheap required compile admission; ownership remains required separately by summary.
  hygiene:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: "true"
          install-filter: --filter @rightkit/release...
          ignore-install-scripts: "true"
          cache-key: rk-ubuntu-hygiene
          # Push-triggered runs build without the Rust cache: 61 pushes on 2026-10-23 each restored hundreds of MB per
          # shard and exhausted the account's Actions storage egress (macOS verify of @rightkit/legal 0.6.3 could not fetch its
          # artifact). Broker-requested runs restore and save; pull requests restore only.
          save-cache: ${{ github.event_name == 'workflow_dispatch' }}
          restore-cache: ${{ github.event_name != 'push' }}
      - name: Install the pinned Cargo scan tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Install the pinned workflow linter
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      # Class A scans run for EVERY change (Rust, npm, workflow, scripts, docs), never only for crates: with no base they
      # cover every tracked file. Shard and closure jobs need this job and receive its result (RK_SCANS_JOB_RESULT).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
          run_install: false
      - name: Install workspace dependencies without lifecycle scripts (for the import-effects check)
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Seconds; hygiene gates every native shard, so a module that runs at import stops the run before any runner starts.
      - name: Exported modules import without side effects
        run: node scripts/ci/exports-import-effects.mjs
      - name: Class A deterministic scans (every change)
        shell: bash
        env:
          HYGIENE_TOKENS: ${{ needs.plan.outputs.hygiene_tokens }}
          SCAN_BASE: ${{ needs.plan.outputs.scan_base }}
        run: node scripts/ci/gate.mjs --select "$HYGIENE_TOKENS" --steps scans ${SCAN_BASE:+--base "$SCAN_BASE"}
      - name: Cargo.lock and rustfmt (selected crates)
        if: ${{ !cancelled() && needs.plan.outputs.hygiene_tokens != '' }}
        shell: bash
        env:
          HYGIENE_TOKENS: ${{ needs.plan.outputs.hygiene_tokens }}
        run: node scripts/ci/gate.mjs --select "$HYGIENE_TOKENS" --steps lock,fmt
      - name: Secret scan (selected crates & packages)
        if: ${{ !cancelled() && (needs.plan.outputs.scan_crates != '' || needs.plan.outputs.scan_packages != '') }}
        shell: bash
        env:
          SCAN_CRATES: ${{ needs.plan.outputs.scan_crates }}
          SCAN_PACKAGES: ${{ needs.plan.outputs.scan_packages }}
        run: node scripts/ci/secret-scan.mjs --crates "$SCAN_CRATES" --dirs "$SCAN_PACKAGES"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-hygiene-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rightkit-ci
          retention-days: 7
          if-no-files-found: ignore

  # Coverage refusal stays blocking; it does not prevent independent compile evidence being collected.
  ownership:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rk-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          rust: "false"
          ignore-install-scripts: "true"
      - name: RightKit ownership (protected registry roots)
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app .
      - name: Owner dependency graphs (best effort)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/ci/owner-dep-graphs.sh || echo "owner-dep-graphs: warning: skipped"

  # Compile baselines prove this OS's exact shard/closure reports plus shared admission.
  # Known-red failures & missing reports block markers. Ownership still blocks overall summary.
  mark-green-windows:
    needs: [private-repo-guard, plan, hygiene, shards-windows, closure-windows, summary]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.private-repo-guard.result == 'success' && needs.plan.result == 'success' && needs.hygiene.result == 'success' && needs.summary.outputs.windows_green == 'true' && (needs.shards-windows.result == 'success' || needs.closure-windows.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record successful Windows compile baseline in Actions job history
        run: echo Windows compile evidence passed

  mark-green-macos:
    needs: [private-repo-guard, plan, hygiene, shards-macos, closure-macos, summary]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.private-repo-guard.result == 'success' && needs.plan.result == 'success' && needs.hygiene.result == 'success' && needs.summary.outputs.macos_green == 'true' && (needs.shards-macos.result == 'success' || needs.closure-macos.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record successful macOS compile baseline in Actions job history
        run: echo macOS compile evidence passed

  # The one required check: it fails unless guard, plan, hygiene & ownership passed and every shard and closure
  # job passed or was legitimately not needed (skipped). A cancelled or failed matrix leg fails its job.
  summary:
    outputs:
      windows_green: ${{ steps.verdict.outputs.windows_green }}
      macos_green: ${{ steps.verdict.outputs.macos_green }}
    if: ${{ always() }}
    needs: [private-repo-guard, plan, hygiene, ownership, shards-windows, closure-windows, shards-macos, closure-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          pattern: qa-evidence-*
          path: ci-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: ci-plan
          path: ci-plan
      - name: Verdict
        id: verdict
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVIDENCE_PLAN: ci-plan/evidence.json
        run: node scripts/ci/ci-summary.mjs
      - name: Static validation verdict
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'const needs = JSON.parse(process.env.NEEDS); for (const name of ["private-repo-guard", "plan", "hygiene", "ownership"]) { if (needs[name]?.result !== "success") throw new Error(name + " did not pass"); } for (const name of ["shards-windows", "closure-windows", "shards-macos", "closure-macos"]) { if (needs[name]?.result !== "skipped") throw new Error(name + " unexpectedly ran"); } console.log("Static validation passed; native qualification requires broker dispatch.");'
