name: chrome-pins
# Records the SHA-256 and size of every pinned Chrome for Testing archive (#267) from the real
# downloads. Apply the result locally: node scripts/chrome-pins.mjs --apply chrome-pins.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/rightkit-browser/src/install.rs
      - packages/qa-chrome/src/install.ts
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
      - name: Extract pinned URLs
        run: node scripts/chrome-pins.mjs --tsv > pins.tsv
      - name: Download and hash
        shell: bash
        run: |
          set -euo pipefail
          prefix='https://storage.googleapis.com/chrome-for-testing-public/'
          mkdir -p dl
          : > entries.jsonl
          while IFS=$'\t' read -r kind platform version url; do
            case "$url" in
              "$prefix"*) ;;
              *) echo "refusing URL outside ${prefix}: $url" >&2; exit 1 ;;
            esac
            file="dl/${kind}-${platform}.zip"
            final=$(curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --write-out '%{url_effective}' --output "$file" "$url")
            case "$final" in
              "$prefix"*) ;;
              *) echo "download of $url ended at a different host: $final" >&2; exit 1 ;;
            esac
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(stat -c%s "$file")
            jq -cn --arg kind "$kind" --arg platform "$platform" --arg version "$version" \
              --arg url "$url" --arg sha256 "$sha" --argjson size "$size" \
              '{kind: $kind, platform: $platform, version: $version, url: $url, sha256: $sha256, size: $size}' \
              >> entries.jsonl
            rm -f "$file"
          done < pins.tsv
          jq -s '.' entries.jsonl > chrome-pins.json
      - name: Summary
        shell: bash
        run: |
          {
            echo '| kind | platform | version | sha256 | size |'
            echo '| --- | --- | --- | --- | ---: |'
            jq -r '.[] | "| \(.kind) | \(.platform) | \(.version) | `\(.sha256)` | \(.size) |"' chrome-pins.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-pins
          path: chrome-pins.json
          if-no-files-found: error
