# Hand-written security boundary: trusted main code promotes pinned, previously verified bytes.
name: publish-reviewed
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Committed schema 2 candidate ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish
  queue: max
  cancel-in-progress: false
jobs:
  seal-check:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      registry: ${{ steps.check.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/upload.mjs
            scripts/ci/registry-spec.mjs
            scripts/ci/reviewed-candidate.mjs
            ci/approved-artifacts.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Authenticate original run & check exact reviewed bytes without registry credentials
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: node scripts/ci/reviewed-candidate.mjs run --dry-run
      - name: Keep admission receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-admission-receipt
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 90
          if-no-files-found: error
  upload:
    needs: [seal-check]
    if: ${{ needs.seal-check.result == 'success' && github.ref == 'refs/heads/main' && github.repository == 'bogusyogi/rightkit' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/upload.mjs
            scripts/ci/registry-spec.mjs
            scripts/ci/reviewed-candidate.mjs
            ci/approved-artifacts.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - name: Reauthenticate candidate & publish original npm archives
        if: ${{ needs.seal-check.outputs.registry == 'npm' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_CANDIDATE_ID: ${{ inputs.candidate_id }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/ci/reviewed-candidate.mjs run
      - name: Reauthenticate candidate & publish original Cargo archives
        if: ${{ needs.seal-check.outputs.registry == 'crates' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_CANDIDATE_ID: ${{ inputs.candidate_id }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/ci/reviewed-candidate.mjs run
      - name: Keep publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication-receipt
          retention-days: 90
          if-no-files-found: error
