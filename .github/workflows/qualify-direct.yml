# Linux direct origin on GitHub runners (GATE-CONTRACT GB-29, rightkit#1341): one job per unit runs
# `rightkit-gate --to release --unit <unit>` exactly as a Linux developer host does (the snapshot route, never the
# hosted-checkout route, so the qualified archive is the one publish.yml packs), then dispatches publish.yml with
# admission=direct and that qualification. Mac and Windows still qualify in publish.yml's own native verify jobs.
name: qualify-direct
run-name: qualify-direct ${{ inputs.units }}

on:
  workflow_dispatch:
    inputs:
      units:
        description: "Space-separated gate units (cargo:<crate> or npm:@rightkit/<name>), each independent of the others in this run"
        type: string
        required: true
      dispatch:
        description: "Dispatch publish.yml for each qualified unit"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: qualify-direct-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = "refs/heads/main"
      - name: Units as a matrix
        id: units
        env:
          UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          json="["
          sep=""
          for u in $UNITS; do
            [[ "$u" =~ ^(cargo:rightkit-[a-z0-9-]+|npm:@rightkit/[a-z0-9-]+)$ ]] || { echo "::error::bad unit $u"; exit 1; }
            json="$json$sep\"$u\""
            sep=","
          done
          echo "units=$json]" >> "$GITHUB_OUTPUT"

  qualify:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      # Deleting these trees took 60-120 s of each 210-270 s job (runs 41324657453, 41325170872). Each tree is deleted in
      # parallel in the background while setup runs; the gate step waits for every deletion before it compiles anything.
      - name: Free runner disk for crate builds (background)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/disk-free"
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            n=$(basename "$d")
            nohup sh -c "sudo rm -rf '$d'; echo \$? > '$RUNNER_TEMP/disk-free/$n.done'" > /dev/null 2>&1 &
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - name: Install workspace dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - name: Use the qualification toolchain by default
        run: rustup default 1.98.0
      - name: Install the pinned Cargo scan tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Install the pinned workflow linter
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Install the pinned ShellCheck analyzer
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/shellcheck-bin"
          tar -xJf "$archive" -C "$RUNNER_TEMP/shellcheck-bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$RUNNER_TEMP/shellcheck-bin/shellcheck"
          "$RUNNER_TEMP/shellcheck-bin/shellcheck" --version | grep -Fx "version: ${SHELLCHECK_VERSION}"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
      # The snapshot route (not the hosted-checkout route): the gate builds the commit's snapshot, as on any Linux host, so the
      # archive it qualifies carries no .cargo_vcs_info.json and equals publish.yml's pack.
      - name: Wait for the runner disk to be freed
        run: |
          set -euo pipefail
          for n in dotnet android ghc CodeQL; do
            for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/disk-free/$n.done" ] && break; sleep 1; done
            test -f "$RUNNER_TEMP/disk-free/$n.done" || { echo "::error::freeing $n did not finish"; exit 1; }
            test "$(cat "$RUNNER_TEMP/disk-free/$n.done")" = 0 || { echo "::error::freeing $n failed"; exit 1; }
          done
          df -h / | tail -1
      - name: Qualify the unit (Linux direct origin)
        id: gate
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          set -uo pipefail
          git config --global user.email "qualify-direct@users.noreply.github.com"
          git config --global user.name "qualify-direct"
          # Exit 1 is expected: RK_DIRECT_RELEASE_HELD after the qualification is written; the file decides, not the exit code.
          env -u GITHUB_ACTIONS node packages/release/bin/rightkit-gate.mjs --to release --unit "$UNIT" 2>&1 | tee "$RUNNER_TEMP/gate.log" || true
          q=$(grep -o "direct-origin qualification [^ ]*qualification.json" "$RUNNER_TEMP/gate.log" | tail -1 | awk '{print $3}')
          if [ -z "$q" ] || [ ! -f "$q" ]; then echo "::error::no direct-origin qualification for $UNIT"; exit 1; fi
          node -e 'const fs=require("fs");fs.writeFileSync(process.argv[2], JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1],"utf8"))))' "$q" "$RUNNER_TEMP/qualification.json"
      - name: Keep the qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ strategy.job-index }}
          path: ${{ runner.temp }}/qualification.json
          retention-days: 30
          if-no-files-found: error
      - name: Dispatch publish.yml (direct admission)
        if: ${{ inputs.dispatch }}
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT: ${{ matrix.unit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "::error::main moved past $GITHUB_SHA; requalify"; exit 1; }
          kind="${UNIT%%:*}"; name="${UNIT#*:}"
          registry=crates; [ "$kind" = npm ] && registry=npm
          allow=$(node --input-type=module -e '
            import fs from "node:fs";
            import { exceptionAllowsets } from "./scripts/ci/rk-preflight.mjs";
            const q = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const a = exceptionAllowsets(q.unit.name, q.unit.version, JSON.parse(fs.readFileSync("ci/gate.config.json","utf8")), JSON.parse(fs.readFileSync("ci/rk-pipeline.json","utf8")));
            console.log([a.allow_missing_assets.join(" "), a.allow_ignored.join(" "), a.allow_no_test.join(" "), a.allow_host_exclusion.join(" ")].join("|"));
          ' "$RUNNER_TEMP/qualification.json")
          IFS='|' read -r missing ignored notest hostex <<< "$allow"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f admission=direct -f request_id= -f expected_sha="$GITHUB_SHA" -f registry="$registry" -f units="$name" \
            -f qualification="$(cat "$RUNNER_TEMP/qualification.json")" \
            -f allow_missing_assets="$missing" -f allow_ignored="$ignored" -f allow_no_test="$notest" -f allow_host_exclusion="$hostex"
          echo "dispatched publish.yml for $UNIT at $GITHUB_SHA"
