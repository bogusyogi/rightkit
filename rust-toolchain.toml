[toolchain]
# One Rust for every RightKit crate on every host, the same release the broker pins (defaults.toolchain, 1.99.1 since 2026-11-03) and CI installs:
# without it rustup used each machine's default "stable" (1.97.1 on the Dell), so direct cargo and the broker disagreed.
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]
