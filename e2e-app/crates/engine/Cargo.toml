rightkit-workflow = { path = "../../../crates/rightkit-workflow" }
rightkit-app-settings = { path = "../../../crates/rightkit-app-settings" }
rightkit-child-process = { path = "../../../crates/rightkit-child-process" }
rightkit-credentials = { path = "../../../crates/rightkit-credentials" }
rightkit-daemon = { path = "../../../crates/rightkit-daemon" }
rightkit-device = { path = "../../../crates/rightkit-device", features = ["credentials"] }
rightkit-fs = { path = "../../../crates/rightkit-fs", features = ["fs"] }
rightkit-http = { path = "../../../crates/rightkit-http" }
rightkit-license = { path = "../../../crates/rightkit-license", default-features = false, features = ["client"] }
rightkit-logs = { path = "../../../crates/rightkit-logs" }
rightkit-qa = { path = "../../../crates/rightkit-qa" }
rightkit-tauri-shell = { path = "../../../crates/rightkit-tauri-shell" }

[target.'cfg(target_os = "android")'.dependencies]
rightkit-android = { path = "../../../crates/rightkit-android" }

[target.'cfg(windows)'.dependencies]
rightkit-overlay-win = { path = "../../../crates/rightkit-overlay-win" }
