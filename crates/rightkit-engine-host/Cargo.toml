[package]
name = "rightkit-engine-host"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Engine binary framework: one command registry served as a headless JSON CLI and as a stdio sidecar, shared wire types, contract and TypeScript export, isolated-data-folder rule"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_engine_host"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rightkit-job-queue = { version = "0.5.1", features = ["contract", "doctor"], path = "../rightkit-job-queue" }
rightkit-daemon = { version = "0.5.1", path = "../rightkit-daemon" }

rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project", optional = true }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline", optional = true }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript", optional = true }
rightkit-app-settings = { version = "0.3.1", path = "../rightkit-app-settings", optional = true }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs", "blake3"], optional = true }
rightkit-cache = { version = "0.2.3", path = "../rightkit-cache", optional = true }

[features]
default = []
# Project-method support (`project`): JSON/transcript helpers, analysis layout, clip ranges, flat settings files, project
# font, media tools and the renders listing, for command modules built on rightkit-video-project.
project-cmd = ["dep:rightkit-video-project", "dep:rightkit-timeline", "dep:rightkit-transcript", "dep:rightkit-app-settings", "dep:rightkit-fs", "dep:rightkit-cache"]
