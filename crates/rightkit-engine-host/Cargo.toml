[package]
name = "rightkit-engine-host"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Engine binary framework: one command registry served as a headless JSON CLI and as a stdio sidecar, shared wire types, contract and TypeScript export, and the caller side of the same CLI for engine-to-engine calls"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_engine_host"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rightkit-job-queue = { version = "0.6.0", features = ["contract", "doctor"], path = "../rightkit-job-queue" }
rightkit-daemon = { version = "0.9.0", path = "../rightkit-daemon" }
rightkit-roots = { version = "0.2.0", path = "../rightkit-roots" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }

