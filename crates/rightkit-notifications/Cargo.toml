[package]
name = "rightkit-notifications"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Neutral native notifications owner usable without Tauri: Client, Notification builder with actions and replace keys, Handle update and close, permission state, capabilities, and dock and taskbar badges (macOS UserNotifications, Windows WinRT toasts, Linux freedesktop)."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["notifications", "toast", "badge", "desktop"]
categories = ["os", "gui"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSBundle", "NSError", "NSObject", "NSSet"] }
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "Posts a notification per call through the OS notification service; no polling loop, no network, spawns no thread of its own (permission waits block the caller)."

# One Cargo workspace and lock per crate (rightkit#1285).
