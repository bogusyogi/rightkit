[package]
name = "rightkit-device"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.0"
description = "Native host services for Right Suite Tauri license and device adapters."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
credentials = ["dep:rightkit-credentials"]
# `impl rightkit_license::DeviceIdSource for DeviceService<CredentialStore>`: the licence client's device source,
# so an app stops hand-writing the adapter. Needs the licence crate's native client.
license-client = ["credentials", "rightkit-license/client"]

[dependencies]
getrandom = "0.4"
rightkit-credentials = { version = "0.4.0", path = "../rightkit-credentials", optional = true }
rightkit-license = { version = "0.2.2", path = "../rightkit-license" }

[package.metadata.rightkit]
continuous = false
continuous_reason = "no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src: stateless storage, device-identity, authorization and log-bridge services that delegate to host traits per call, the only state is a creation Mutex (reviewed 2026-10-11)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
