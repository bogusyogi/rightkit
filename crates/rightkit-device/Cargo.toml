[package]
name = "rightkit-device"
version = "0.4.2"
edition = "2021"
rust-version = "1.98.0"
description = "Native host services for Right Suite Tauri license and device adapters."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
credentials = ["dep:rightkit-credentials"]
# `impl rightkit_license::DeviceIdSource for DeviceService<CredentialStore>`: the licence client's device source,
# so an app stops hand-writing the adapter. Needs the licence crate's native client.
license-client = ["credentials", "rightkit-license/client"]

[dependencies]
getrandom = "0.4"
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials", optional = true }
rightkit-license = { version = "0.2.6", path = "../rightkit-license" }
# The log/diagnostic bridges moved there; re-exported here for one release.
rightkit-logs = { version = "0.4.0", path = "../rightkit-logs", default-features = false }

[package.metadata.rightkit]
continuous = false
continuous_reason = "no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src: stateless storage and device-identity services that delegate to host traits per call, the only state is a creation Mutex (reviewed 2026-10-11)"

# One Cargo workspace and lock per crate (rightkit#1285).
