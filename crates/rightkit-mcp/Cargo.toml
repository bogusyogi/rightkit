[package]
name = "rightkit-mcp"
version = "0.6.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shared MCP client (stdio + streamable HTTP, trust gate, pool, OAuth hook) and server host (stdio + loopback HTTP, per-tool admission) for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["mcp", "agent", "tools", "json-rpc"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["digest", "fs"] }
rightkit-http = { version = "0.3.0", path = "../rightkit-http", default-features = false }
http = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
url = "2"

[features]
default = ["advanced-http"]
# Opt-in HTTP transport (streamable HTTP with extensions, legacy SSE): tokio runtime,
# rightkit-http async client, http, futures-util. Stdio-only consumers can build with
# `default-features = false`; `ServerSpec::Http` with `ClientExtensions` then fails with
# `McpError::Config` and plain blocking HTTP stays available.
advanced-http = ["dep:tokio", "dep:http", "dep:futures-util", "rightkit-http/async"]
# Echo JSON-RPC ids with their exact numeric spelling (e.g. 1e+2, >u64 integers).
# Off by default: serde_json arbitrary_precision is unified across the whole
# dependency graph and changes number round-tripping for every crate.
exact-json-ids = ["serde_json/arbitrary_precision"]
# Test-only seam: `ClientExtensions::address_policy` overrides the HTTP client's address
# policy. Absent from the default build; enabled for this crate's own tests only.
testing = []

[dev-dependencies]
tempfile = "3"
rightkit-mcp = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[[example]]
name = "example_server"
