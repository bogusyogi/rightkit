[package]
name = "rightkit-mcp"
version = "0.7.1"
edition = "2021"
rust-version = "1.98.0"
description = "Shared MCP client (stdio + streamable HTTP, trust gate, pool, OAuth hook) and server host (stdio + loopback HTTP, per-tool admission) for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["mcp", "agent", "tools", "json-rpc"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "McpClient"
file = "src/client.rs"
holds = ["child", "thread", "memory"]
scale = "per connected stdio server: one child process, one reader thread that lives until the child's stdout closes, plus short-lived helper threads (a bounded launch thread per connect, a blocked-write thread per cancellable send, one thread per in-flight elicitation callback); a 20 ms crash-status poll of at most 25 iterations inside the reader on unexpected EOF, and a 10 ms try_lock poll bounded by the call's cancellation token; pending-call and handler maps hold only in-flight requests; fixed per McpClient, independent of how many calls are made"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "AdvancedHttp"
file = "src/advanced_http.rs"
holds = ["thread", "task", "memory"]
scale = "feature advanced-http only: one multi-thread tokio runtime with one worker thread per HTTP McpClient, one SSE reader task per legacy-SSE session (aborted when the session drops), a scoped thread per synchronous block_on, and a spawn_blocking or spawned task per elicitation callback; none grows with the number of calls"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "RawJson"
file = "src/raw.rs"
holds = "memory"
scale = "one boxed raw JSON value per RawJson the caller builds, sized by that message and dropped with it; no thread, task or child"
release = "Drop"
static_note = "marker_key() holds a single OnceLock<String>, a 16-byte random key rendered to one fixed-length string, built once on first use and never grown; it is process-wide but fixed size and not tied to any McpClient"

[[package.metadata.rightkit.resources]]
api = "ConnectionPool"
file = "src/pool.rs"
holds = ["child", "thread", "memory"]
scale = "at most PoolConfig::max_connections (default 16) shared McpClient values, one per (source, name, fingerprint), each with the resources listed for McpClient; least-recently-used idle clients are evicted; no thread or task of its own"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "ServerHost::serve_http"
file = "src/server.rs"
holds = ["thread", "listener"]
scale = "one loopback TcpListener and one accept thread per HttpServer, plus one short-lived thread per accepted connection that ends with that request; stdio serving runs on the caller's thread; fixed per HttpServer"
release = "HttpServer::shutdown or Drop"

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["digest", "fs"] }
rightkit-http = { version = "0.3.0", path = "../rightkit-http", default-features = false }
http = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
url = "2"

[features]
default = []
# Opt-in HTTP transport (streamable HTTP with extensions, legacy SSE): tokio runtime,
# rightkit-http async client, http, futures-util. Stdio-only consumers can build with
# `default-features = false`; `ServerSpec::Http` with `ClientExtensions` then fails with
# `McpError::Config` and plain blocking HTTP stays available.
advanced-http = ["dep:tokio", "dep:http", "dep:futures-util", "rightkit-http/async"]
# Echo JSON-RPC ids with their exact numeric spelling (e.g. 1e+2, >u64 integers).
# Off by default: serde_json arbitrary_precision is unified across the whole
# dependency graph and changes number round-tripping for every crate.
exact-json-ids = ["serde_json/arbitrary_precision"]
# Test-only seam: `ClientExtensions::address_policy` overrides the HTTP client's address
# policy. Absent from the default build; enabled for this crate's own tests only.
testing = []

[dev-dependencies]
tempfile = "3"
rightkit-mcp = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[[example]]
name = "example_server"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
