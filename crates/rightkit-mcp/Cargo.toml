[package]
name = "rightkit-mcp"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shared MCP client (stdio + streamable HTTP, trust gate, pool, OAuth hook) and server host (stdio + loopback HTTP, per-tool admission) for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["mcp", "agent", "tools", "json-rpc"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "examples/**", "README.md"]

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "example_server"
