[package]
name = "rightkit-hotkeys"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Global shortcuts and low-level input hooks for Right Suite apps: chord parsing, conflict detection, CGEventTap/WH_KEYBOARD_LL primitives, push-to-talk state."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["hotkey", "shortcut", "eventtap", "push-to-talk"]
categories = ["os"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "macos_e2e"
path = "tests/macos_e2e.rs"
harness = false
