[package]
name = "rightkit-context-federation"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "Context federation coordinator: immutable provider registry, fan-out of context operations across providers, and skill ranking."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_context_federation"
path = "src/lib.rs"

[dependencies]
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
rightkit-context-core = { version = "0.2.0", path = "../rightkit-context-core" }
rightkit-context-protocol = { version = "0.2.0", path = "../rightkit-context-protocol" }
rightkit-context-provider-sdk = { version = "0.2.0", path = "../rightkit-context-provider-sdk" }
rightkit-repo-graph = { version = "0.3.0", path = "../rightkit-repo-graph" }
async-trait = { version = "0.1" }
gix = { version = "0.90", default-features = false, features = ["sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-util = { version = "0.7" }
regex = { version = "1" }
