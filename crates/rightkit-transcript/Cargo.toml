[package]
name = "rightkit-transcript"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Product-neutral word-timed transcript contract, cue segmentation, and SRT/VTT/JSON import and export for Right Suite applications"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
homepage = "https://github.com/Orthic-Labs/rightkit/tree/main/crates/rightkit-transcript"
documentation = "https://docs.rs/rightkit-transcript"
keywords = ["transcript", "captions", "subtitles", "srt", "webvtt"]
categories = ["multimedia", "text-processing"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "rightkit_transcript"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[package.metadata.rightkit]
continuous = false
continuous_reason = "transcript contract, cue segmentation and SRT/VTT/JSON import/export per call; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
