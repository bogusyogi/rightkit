[package]
name = "rightkit-transcript"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Product-neutral word-timed transcript contract, cue segmentation, and SRT/VTT/JSON import and export for Right Suite applications"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-transcript"
documentation = "https://docs.rs/rightkit-transcript"
keywords = ["transcript", "captions", "subtitles", "srt", "webvtt"]
categories = ["multimedia", "text-processing"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "rightkit_transcript"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[package.metadata.rightkit]
continuous = false
continuous_reason = "transcript contract, cue segmentation and SRT/VTT/JSON import/export per call; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
