[package]
name = "rightkit-transcript"
version = "0.0.0"
edition = "2021"
rust-version = "1.98.0"
publish = false
license = "MIT"
description = "Product-neutral word-timed transcript contract, cue segmentation, and SRT/VTT/JSON import and export for Right Suite applications"
repository = "https://github.com/adrdsouza/claude"
include = ["src/**", "tests/**", "Cargo.toml"]

[lib]
name = "rightkit_transcript"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "2"

[dev-dependencies]
hound = "3.5"
rightkit-asr = { path = "../rightkit-asr" }
