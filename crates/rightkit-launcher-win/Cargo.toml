[package]
name = "rightkit-launcher-win"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "The Windows launcher panel over rightkit-launcher: a layered search window with apps, files, notes, snippets, the in-launcher assistant and Store apps; product name, pages and readings come from the host."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
qa-views = []

[lib]
name = "rightkit_launcher_win"
path = "src/lib.rs"

[dependencies]
rightkit-launcher = { version = "0.2.0", path = "../rightkit-launcher" }
serde_json = { version = "1.0" }

[target.'cfg(windows)'.dependencies]
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-hotkeys = { version = "0.1.4", path = "../rightkit-hotkeys" }
rightkit-overlay = { version = "0.2.0", path = "../rightkit-overlay" }
rightkit-overlay-win = { version = "0.1.5", path = "../rightkit-overlay-win" }
rightkit-win-ui = { version = "0.1.0", path = "../rightkit-win-ui" }
rightkit-clipboard-history = { version = "0.2.0", path = "../rightkit-clipboard-history" }
rightkit-automation = { version = "0.6.4", path = "../rightkit-automation" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
