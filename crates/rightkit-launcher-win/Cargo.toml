[package]
name = "rightkit-launcher-win"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
description = "Windows launcher services for Store apps, snippet expansion, type-ahead and launcher chat."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_launcher_win"
path = "src/lib.rs"

[dependencies]
rightkit-launcher = { version = "0.2.0", path = "../rightkit-launcher" }
serde_json = { version = "1.0" }

[target.'cfg(windows)'.dependencies]
rightkit-fs = { version = "0.5.0", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-hotkeys = { version = "0.1.4", path = "../rightkit-hotkeys" }
rightkit-clipboard-history = { version = "0.4.0", path = "../rightkit-clipboard-history" }
rightkit-automation = { version = "0.7.0", path = "../rightkit-automation" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
