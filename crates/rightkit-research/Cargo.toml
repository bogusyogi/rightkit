[package]
name = "rightkit-research"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Research pipeline: sources, claims and evidence with provenance"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_research"
path = "src/lib.rs"

[dependencies]
serde_yaml = { version = "0.9.34" }
hmac = { version = "0.13.0" }
regex = { version = "1.13.1" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
rightkit-code-audit-provider-sdk = { version = "0.1.0", path = "../rightkit-code-audit-provider-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
hex = { version = "0.4.3" }
sha2 = { version = "0.11" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls", "stream"] }
zip = { version = "9.0.4", default-features = false, features = ["aes-crypto", "deflate64", "deflate-flate2-zlib-rs", "deflate-zopfli", "lzma", "time", "zstd", "xz"] }
