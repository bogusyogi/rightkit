# cargo-deny policy for this RightKit crate workspace (rightkit#1285; same policy in every crate).

[graph]
all-features = true

[advisories]
# Generated from .rightkit/advisory-exceptions.json when the crate has one; packages/release/advisory-exceptions.mjs fails on any mismatch.
# Do not add an ignore here without an entry there (owner, evidence, absolute reviewBy date).
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, plus OFL for fonts (Typst embeds fonts, with notices in THIRD-PARTY).
# MPL-2.0 is file-level copyleft and allowed for unmodified dependencies.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OFL-1.1",
  "MPL-2.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Anything not allowed fails, including GPL, AGPL and LGPL crates. LGPL ffmpeg ships only as a separate sidecar process, never linked.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
