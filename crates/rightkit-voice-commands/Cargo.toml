[package]
name = "rightkit-voice-commands"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Voice command recognition: typed command actions, spoken-command catalog and matching, app-launch and shortcut queries, external link allowlist check."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_voice_commands"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
