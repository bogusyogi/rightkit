[package]
name = "rightkit-desktop-tweaks"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.0"
description = "Desktop tweaks for Windows: Mac-style editing shortcuts (left Alt as Ctrl, terminal-aware) on the rightkit-hotkeys hook hub, with tagged key injection."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_desktop_tweaks"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
rightkit-automation = { version = "0.7.0", path = "../rightkit-automation" }
rightkit-hotkeys = { version = "0.1.4", path = "../rightkit-hotkeys" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
