[package]
name = "rightkit-desktop-tweaks"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Desktop tweaks: the Windows global keyboard layer with Mac-style editing shortcuts, screenshot hot keys, hook hub and key injection."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_desktop_tweaks"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
rightkit-automation = { version = "0.6.4", path = "../rightkit-automation" }
rightkit-hotkeys = { version = "0.1.2", path = "../rightkit-hotkeys" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
