[package]
name = "rightkit-dictation-models"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation model store: speech model catalog, shared model leases and paths, downloads with grants and verification, on top of rightkit-models."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_models"
path = "src/lib.rs"

[features]
dev-worker-override = ["rightkit-models/dev-worker-override"]

[dependencies]
rightkit-dictation-core = { version = "0.3.0", path = "../rightkit-dictation-core" }
rightkit-dictation-telemetry = { version = "0.2.0", path = "../rightkit-dictation-telemetry" }
rightkit-transcript-library = { version = "0.1.0", path = "../rightkit-transcript-library" }
rightkit-models = { version = "0.7.0", path = "../rightkit-models" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-http = { version = "0.4.0", default-features = false, features = ["gzip"], path = "../rightkit-http" }
dirs = { version = "7" }

[dev-dependencies]
tempfile = { version = "3" }
tar = { version = "0.4" }
rightkit-models = { version = "0.7.0", features = [], path = "../rightkit-models" }
