[package]
name = "rightkit-dictation-models"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation model store: speech model catalog, shared model leases and paths, downloads with grants and verification, on top of rightkit-models."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_models"
path = "src/lib.rs"

[features]
dev-worker-override = ["rightkit-models/dev-worker-override"]
test-mode = ["rightkit-dictation-core/test-mode"]

[dependencies]
rightkit-dictation-core = { version = "0.2.0", path = "../rightkit-dictation-core" }
rightkit-dictation-telemetry = { version = "0.1.0", path = "../rightkit-dictation-telemetry" }
rightkit-transcript-library = { version = "0.1.0", path = "../rightkit-transcript-library" }
rightkit-models = { version = "0.5.2", path = "../rightkit-models" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-http = { version = "0.3.9", default-features = false, features = ["gzip"], path = "../rightkit-http" }
dirs = { version = "7" }

[dev-dependencies]
rightkit-dictation-core = { version = "0.2.0", path = "../rightkit-dictation-core", features = ["test-mode"] }
tempfile = { version = "3" }
flate2 = { version = "1" }
tar = { version = "0.4" }
rightkit-models = { version = "0.5.2", features = ["test-mode"], path = "../rightkit-models" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
