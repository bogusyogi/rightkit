[package]
name = "rightkit-agent-engine-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine core: the agent turn loop, tool dispatch, permission and approval flow, compaction, goals, guardian and worker agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_core"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = {version = "0.1.0", path = "../rightkit-crypto"}
rightkit-child-process = {version = "0.5.7", features = ["tokio"], path = "../rightkit-child-process"}
rightkit-agent-engine-protocol = {version = "0.1.1", path = "../rightkit-agent-engine-protocol"}
rightkit-cache = {version = "0.2.3", path = "../rightkit-cache"}
rightkit-fs = {version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs"}
rightkit-agent-policy = {version = "0.1.0", path = "../rightkit-agent-policy"}
rightkit-agent-engine-history = {version = "0.1.1", path = "../rightkit-agent-engine-history"}
rightkit-mcp = {version = "0.7.2", features = ["advanced-http", "agent_mcp"], path = "../rightkit-mcp"}
rightkit-agent-tools = {version = "0.3.1", path = "../rightkit-agent-tools", features = ["coding_tools"]}
rightkit-sandbox = {version = "0.6.3", path = "../rightkit-sandbox", features = ["execution"]}
rightkit-hooks = {version = "0.2.1", path = "../rightkit-hooks", features = ["agent_hooks"]}
rightkit-agent-host-traits = {version = "0.1.0", path = "../rightkit-agent-host-traits"}
rightkit-agent-engine-runtime-middleware = {version = "0.1.0", path = "../rightkit-agent-engine-runtime-middleware"}
rightkit-logs = {version = "0.3.7", path = "../rightkit-logs", features = ["agent_telemetry"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
toml = {version = "1.1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["full"]}
async-trait = {version = "0.1"}
futures = {version = "0.3"}
rquickjs = {version = "=0.14.0", features = ["futures"], optional = true}
tracing = {version = "0.1"}

[features]
default = ["host"]
host = ["rightkit-agent-tools/coding_tools-host", "rightkit-mcp/agent_mcp-os-keyring", "rightkit-mcp/agent_mcp-host-env", "rightkit-hooks/agent_hooks-host-env", "dep:rquickjs"]
qualification = []
