[package]
name = "rightkit-agent-engine-runtime-middleware"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine runtime middleware: request and turn interception hooks"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_runtime_middleware"
path = "src/lib.rs"

[dependencies]
rightkit-fs = { version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
