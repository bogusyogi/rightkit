[package]
name = "rightkit-context-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Context budget and lane reconciliation: one cross-provider attention budget whose explicit lanes reconcile every receipt's selected and delivered tokens."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_context_core"
path = "src/lib.rs"

[dependencies]
rightkit-context-protocol = { version = "0.1.0", path = "../rightkit-context-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
