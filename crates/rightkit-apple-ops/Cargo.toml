[package]
name = "rightkit-apple-ops"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Apple ops: App Store Connect API and upload, build analysis, preflight, profiling and SwiftUI traces"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_apple_ops"
path = "src/lib.rs"

[dependencies]
rightkit-engine-host = { version = "0.1.0", path = "../rightkit-engine-host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = { version = "1.13.1" }
tokio = { version = "1.53.3", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "query", "form"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem"] }
base64 = { version = "0.22.1" }
rusqlite = { version = "0.41", features = ["bundled"] }
brotli = { version = "9.0.0" }
futures-util = { version = "0.3.34" }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
md-5 = { version = "0.11" }
libc = { version = "1.0.0-alpha.5" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
