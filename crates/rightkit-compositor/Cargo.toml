[package]
name = "rightkit-compositor"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "Native wgpu layer compositor for Right Suite video apps: GPU context, layer blending, effect passes and SDF mask feathering, rendering evaluated frame descriptors. Adapted from OpenCut Classic (MIT)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["wgpu", "compositor", "video", "gpu"]
categories = ["graphics", "multimedia::video"]
include = ["src/**", "README.md", "CHANGELOG.md", "PROVENANCE.md", "LICENSE-MIT", "LICENSE-APACHE", "LICENSE-OpenCut"]

[lib]
name = "rightkit_compositor"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
wgpu = "30.0.1"
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
