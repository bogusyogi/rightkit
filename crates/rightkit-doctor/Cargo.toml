[package]
name = "rightkit-doctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Doctor framework for RightKit engines and CLIs: check rows, verdicts and exit codes, host-supplied checks, the engine doctor report, and neutral probes (toolchains, writable folders, bounded child processes, clipboard)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_doctor"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rightkit-engine-host = { version = "0.1.0", path = "../rightkit-engine-host" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
