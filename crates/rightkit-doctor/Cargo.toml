[package]
name = "rightkit-doctor"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Doctor framework for RightKit engines and CLIs: check rows, verdicts and exit codes, host-supplied checks, the engine doctor report, and neutral probes (toolchains, writable folders, bounded child processes, clipboard)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_doctor"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rightkit-engine-host = { version = "0.1.0", path = "../rightkit-engine-host" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
