[package]
name = "rightkit-record"
version = "0.3.3"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT OR Apache-2.0"
description = "Per-window screen capture for any app, chosen by window id and pid: ScreenCaptureKit on macOS, Windows.Graphics.Capture on Windows. Record lifecycle, session bundles, redaction, verification and frame reader. Never sends input; needs Screen Recording permission."
keywords = ["screen-capture", "recording", "screencapturekit", "graphics-capture"]
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "rightkit-ownership.json", "helpers/macos/Package.swift", "helpers/macos/build.sh", "helpers/macos/Sources/**", "helpers/macos/Tests/**"]

[lib]
name = "rightkit_record"
path = "src/lib.rs"

[[bin]]
name = "rightkit-record-helper"
path = "src/bin/rightkit-record-helper/main.rs"

[dependencies]
rightkit-contracts = { version = "0.1.5", path = "../rightkit-contracts" }
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8"
hmac-sha256 = "1.1.15"
rightkit-credentials = { version = "0.4.0", path = "../rightkit-credentials" }

# The macOS backend launches its Swift helper through rightkit-child-process.
[target.'cfg(target_os = "macos")'.dependencies]
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }

# WGC + Media Foundation capture; folded in from the retired helpers/record-windows (RK3).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Security_Authorization_AppCapabilityAccess",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Class: held-resource (docs/RUNTIME-BUDGETS.md). A take exists only between Backend::start and
# Backend::stop or abort; nothing runs while the host holds no take.
[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "WindowsBackend"
file = "src/windows/mod.rs"
holds = ["thread", "memory"]
scale = "one take: a Windows.Graphics.Capture session and frame pool on one HWND, SLOTS = 6 staging slots, one Media Foundation MP4 writer and one worker thread; fixed per take, independent of take length because frames are paced, hashed, encoded and dropped (backpressure counted), not retained"
release = "Backend::stop or Backend::abort (stop joins the worker)"

[[package.metadata.rightkit.resources]]
api = "ProcessBackend::connect"
file = "src/process.rs"
holds = ["thread", "memory"]
scale = "one reader thread and two channels per helper connection (the helper process itself is launched and owned by the host through rightkit-child-process, not here); the thread ends when the helper's stream closes on stop, abort or helper loss; queued events grow only with undrained helper events"
release = "helper stream closes (stop, abort or helper exit); the host owns the child"

[[package.metadata.rightkit.resources]]
api = "serve_backend"
file = "src/process.rs"
holds = ["thread"]
scale = "helper side: one request-reader thread for the duration of one serve call, ended when the input closes"
release = "function return (stop, abort or input closed)"

[[package.metadata.rightkit.resources]]
api = "run"
file = "src/bin/rightkit-record-helper/main.rs"
holds = ["memory"]
scale = "one-shot capture CLI: polls a WindowsBackend every 100 ms until the --seconds deadline, then stops it; bounded by the requested duration"
release = "function return"
