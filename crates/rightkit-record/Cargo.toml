[package]
name = "rightkit-record"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Platform-neutral core of the RightKit recorder (RK3): record lifecycle, quarantine and recovery, session bundle writer, per-field redaction, bundle verification and frame reader. OS capture lives in per-platform helpers behind the Backend trait."
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "rightkit-ownership.json"]

[lib]
name = "rightkit_record"
path = "src/lib.rs"

[[bin]]
name = "rightkit-record-helper"
path = "src/bin/rightkit-record-helper/main.rs"

[dependencies]
rightkit-contracts = { path = "../rightkit-contracts" }
rightkit-framed-sidecar = { path = "../rightkit-framed-sidecar" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
blake3 = "1.8"
hmac-sha256 = "1.1.14"
rightkit-secrets = { path = "../rightkit-secrets" }

# The macOS backend launches its Swift helper through rightkit-process.
[target.'cfg(target_os = "macos")'.dependencies]
rightkit-process = { path = "../rightkit-process" }

# WGC + Media Foundation capture; folded in from the retired helpers/record-windows (RK3).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Security_Authorization_AppCapabilityAccess",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
