[package]
name = "rightkit-agent-recipes"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent recipes: reusable, parameterised task recipes with validation"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_recipes"
path = "src/lib.rs"

[dependencies]
rightkit-fs = {version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
jsonschema = {version = "0.59", default-features = false}

[features]
default = []
