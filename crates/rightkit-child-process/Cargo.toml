[package]
name = "rightkit-child-process"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.0"
description = "Ownership-safe child lifecycle, restart, and health primitives for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["process", "supervisor", "lifecycle", "sidecar"]
categories = ["os"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
trybuild = "=1.0.116"
