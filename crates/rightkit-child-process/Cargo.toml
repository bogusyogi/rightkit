[package]
name = "rightkit-child-process"
version = "0.5.6"
edition = "2021"
rust-version = "1.98.0"
description = "Ownership-safe child lifecycle, restart, and health primitives for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["process", "supervisor", "lifecycle", "sidecar"]
categories = ["os"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: per-call pipe drain threads (capture.rs OutputCapture) and the macOS kqueue exit watcher (exit_watch.rs), each ending with its child or stream, plus the opt-in macOS parent-death watchdog process (process_unix.rs arm_parent_death_watch, one per tied child, exits with its child or its owner); power-assertion holder thread (power.rs, Windows only, one per live PowerAssertion, joined on drop); detached-child: spawning and owning children is this crate's purpose, every child is owned by an OwnedChild/job object and torn down with a bounded staged kill; task-spawn/runtime-builder: none, the optional tokio feature only awaits tokio::time::sleep inside terminate_tree; no listener, resident cache or model (reviewed 2026-10-16); event-loop: the macOS kqueue in src/exit_watch.rs is one descriptor per watched child, registered with a single EVFILT_PROC NOTE_EXIT event and read only with a bounded wait or a zero-timeout receipt, closed when the watch drops; no loop of its own; resident-static: OWNED in src/registry.rs is a Mutex<Vec<Entry>> of Weak references, one entry per live OwnedChild, removed by forget on drop and pruned of dead entries on every register and count, so its size is the number of children this process currently owns (reviewed 2026-10-17)"

[features]
# Async helpers for callers that build tokio commands: `NoWindow` for `tokio::process::Command`
# and `tokio_support::terminate_tree` / `terminate_process_group`. Off by default.
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["process", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
trybuild = "=1.0.116"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
