[package]
name = "rightkit-child-process"
version = "0.4.1"
edition = "2021"
rust-version = "1.98.0"
description = "Ownership-safe child lifecycle, restart, and health primitives for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["process", "supervisor", "lifecycle", "sidecar"]
categories = ["os"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: per-call pipe drain threads (capture.rs OutputCapture) and the macOS kqueue exit watcher (exit_watch.rs), each ending with its child or stream; detached-child: spawning and owning children is this crate's purpose, every child is owned by an OwnedChild/job object and torn down with a bounded staged kill; task-spawn/runtime-builder: none, the optional tokio feature only awaits tokio::time::sleep inside terminate_tree; no listener, resident cache or model (reviewed 2026-10-16)"

[features]
# Async helpers for callers that build tokio commands: `NoWindow` for `tokio::process::Command`
# and `tokio_support::terminate_tree` / `terminate_process_group`. Off by default.
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["process", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
trybuild = "=1.0.116"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
