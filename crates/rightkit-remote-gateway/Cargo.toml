[package]
name = "rightkit-remote-gateway"
version = "0.1.2"
edition = "2024"
rust-version = "1.98.0"
description = "Remote tools for agents on this computer: files, documents, terminals, processes, screen, app launch, media, clipboard, chat read and start, saved logins and payments; folder confinement, per-chat unlock, local approvals, owner settings and the activity trail."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_remote_gateway"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
ring = "0.17"
sysinfo = { version = "0.40" }
portable-pty = "=0.9.0"
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-owner-approvals = { version = "0.1.0", path = "../rightkit-owner-approvals" }
rightkit-chat-bridge = { version = "0.1.0", path = "../rightkit-chat-bridge" }
rightkit-device-link-types = { version = "0.1.0", path = "../rightkit-device-link-types" }
rightkit-system-monitor = { version = "0.2.0", path = "../rightkit-system-monitor" }
rightkit-automation = { version = "0.6.2", default-features = false, path = "../rightkit-automation" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-daemon = { version = "0.7.0", default-features = false, path = "../rightkit-daemon" }
rightkit-docs = { version = "0.1.3", path = "../rightkit-docs" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }
rightkit-http = { version = "0.3.9", default-features = false, path = "../rightkit-http" }
rightkit-logs = { version = "0.4.0", default-features = false, path = "../rightkit-logs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
trash = "=5.2.9"
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
