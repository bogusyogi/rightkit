[package]
name = "rightkit-onnx"
version = "0.2.8"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral ONNX Runtime dynamic-library resolution, environment, execution-provider and session setup (single suite ort pin)"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# DEVELOPMENT/QA BUILDS ONLY. Honors `ORT_DYLIB_PATH` as a developer runtime override
# (`developer_override_candidate`) and stops `clear_inherited_runtime_for_release` from clearing it.
# Never implied by a build profile (a dev profile has debug_assertions on and still gets release behavior)
# and never a default feature. An app enables it only from its QA/test configuration.
dev-overrides = []
# Catalog verification for `bind_installed_runtime` (`BindVerification::Catalog`): the runtime file and
# its companion files are checked against the native-library catalog. Off by default so runtime builds
# that only want the manifest check pull no catalog.
catalog = ["dep:rightkit-ffmpeg"]
# Build-time runtime provisioning (`rightkit_onnx::provision`, the `rightkit-onnx-provision` bin):
# catalog row lookup, HTTPS download, archive extraction. Off by default so app runtime builds
# pull no HTTP, tar or zip code. Use it from a build.rs or xtask, as a build-dependency.
provision = ["dep:rightkit-ffmpeg", "dep:rightkit-models"]
# `session` pulls in the pinned `ort` crate (load-dynamic only: no download, no
# static link). Disable it to keep only the path/diagnostic resolver.
default = ["session"]
session = ["dep:ort"]
# Explicit per-OS execution-provider features. The matching provider is already on by
# default for its own OS target (CoreML on Apple, DirectML on Windows); these forward
# to `ort/coreml` / `ort/directml` for consumers that name the provider explicitly.
coreml = ["session", "ort/coreml"]
directml = ["session", "ort/directml"]
# f16 tensors (e.g. Parakeet f16 encoders): forwards ort/half and re-exports `half`, so apps
# use rightkit_onnx::half::f16 and never declare ort or half directly.
half = ["session", "ort/half", "dep:half"]
# ndarray tensors (Tensor::from_array, try_extract_array): forwards ort/ndarray and re-exports
# `ndarray`, so apps use rightkit_onnx::ndarray and never declare ort or ndarray directly.
ndarray = ["session", "ort/ndarray", "dep:ndarray"]

# Pass-through ort features for consumers that name one (asr/qts), so no crate declares ort.
tracing = ["session", "ort/tracing"]
download-binaries = ["session", "ort/download-binaries"]
tls-native = ["session", "ort/tls-native"]
copy-dylibs = ["session", "ort/copy-dylibs"]
preload-dylibs = ["session", "ort/preload-dylibs"]
acl = ["session", "ort/acl"]
armnn = ["session", "ort/armnn"]
azure = ["session", "ort/azure"]
cann = ["session", "ort/cann"]
cuda = ["session", "ort/cuda"]
migraphx = ["session", "ort/migraphx"]
nnapi = ["session", "ort/nnapi"]
nvrtx = ["session", "ort/nvrtx"]
onednn = ["session", "ort/onednn"]
openvino = ["session", "ort/openvino"]
qnn = ["session", "ort/qnn"]
rknpu = ["session", "ort/rknpu"]
tensorrt = ["session", "ort/tensorrt"]
tvm = ["session", "ort/tvm"]
vitis = ["session", "ort/vitis"]
webgpu = ["session", "ort/webgpu"]
xnnpack = ["session", "ort/xnnpack"]

[dependencies]
half = { version = "2", optional = true }
# Same major as ort rc.14's own ndarray dependency, so the re-exported types are ort's.
ndarray = { version = "0.17", optional = true }
# SUITE PIN: every Right Suite crate and app uses exactly this ort version.
# See README.md "Version policy".
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic"] }
# Runtime bundle manifests (`verify_runtime_manifest`): JSON parsing and streaming SHA-256.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
# `catalog` and `provision`: the native-library catalog. `provision` also needs the vetted download and
# archive extraction.
rightkit-ffmpeg = { path = "../rightkit-ffmpeg", version = "0.2.11", optional = true }
rightkit-models = { path = "../rightkit-models", version = "0.5.0", optional = true, default-features = false }

# Platform accelerators. ort rc.14 compiles an execution provider only when its
# Cargo feature is on, so each OS enables its own EP on the same pinned dep:
# CoreML on Apple targets, DirectML on Windows. CPU is always present.
[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "coreml"] }

# Android: the CPU provider with the XNNPACK extension (`SessionOptions::with_xnnpack`). The Cargo
# feature only compiles ort's wrapper (load-dynamic links nothing); whether the shipped
# `libonnxruntime.so` contains the XNNPACK provider is checked at run time by `probe_providers`.
# NNAPI is deliberately not enabled here (later step, see README "Android").
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "xnnpack"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "directml"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[[bin]]
name = "rightkit-onnx-provision"
path = "src/bin/rightkit-onnx-provision.rs"
required-features = ["provision"]

[[test]]
name = "provision"
required-features = ["provision"]

[dev-dependencies]
# E2E checks the real runtime file against the approved native-library catalog.
rightkit-ffmpeg = { path = "../rightkit-ffmpeg", version = "0.2.11" }
# `provision` test fixtures: a tiny zip and tar.gz built in the test, and a scratch directory.
tempfile = "3"
tar = "0.4"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "ort_environment"
file = "src/environment.rs"
holds = ["memory", "thread"]
scale = "the one process-wide ONNX Runtime environment: the loaded runtime library and, when a shared pool is requested, one global intra and inter-op thread pool sized by the caller; built on first use, never rebuilt"
release = "process exit (ONNX Runtime allows one environment per process and a dropped one cannot be rebuilt, so it is never dropped)"
static_note = "ENVIRONMENT is one OnceLock holding the single ORT environment handle and PENDING is one Mutex<Option<options>> holding a small options struct until it is built: neither is a collection and neither grows; sessions built from the environment are released by their own Drop"

[[package.metadata.rightkit.resources]]
api = "configured_runtime"
file = "src/lib.rs"
holds = ["memory"]
scale = "one Option<PathBuf> naming the selected runtime library; a few hundred bytes"
release = "process exit"
static_note = "CONFIGURED_RUNTIME is one Mutex<Option<PathBuf>> set once when the runtime is selected; it holds no thread and cannot grow"

[[package.metadata.rightkit.resources]]
api = "kleidiai_forced_off"
file = "src/kleidiai.rs"
holds = ["memory"]
scale = "one AtomicBool recording that a known-bad runtime was bound through the documented opt-out; one byte"
release = "process exit"
static_note = "FORCED_OFF is one AtomicBool set at most to true; it holds no thread and cannot grow"

[[package.metadata.rightkit.resources]]
api = "kleidiai::read_runtime_version"
file = "src/kleidiai.rs"
holds = ["memory"]
scale = "one dlopen handle per bind of an existing runtime file on an SME2 Mac; the same library ort maps right after, so the file is mapped once"
release = "process exit (the handle is deliberately never closed: this crate does not unload ONNX Runtime)"
static_note = "no static: the handle is a local that is leaked on purpose, bounded by the number of runtime binds, which is one per process in practice"

[[package.metadata.rightkit.resources]]
api = "SessionOptions::build_from_file"
file = "src/session.rs"
holds = ["memory", "thread"]
scale = "one ONNX Runtime session per call: the model weights, execution-provider state and intra-op threads (the caller sets the count, or the shared pool is used); fixed by the model, independent of the number of inferences"
release = "Drop of the returned ort Session"
