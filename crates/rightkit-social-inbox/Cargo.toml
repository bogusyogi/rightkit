[package]
name = "rightkit-social-inbox"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
description = "Signed social webhook inbox core: constant-time HMAC-SHA256 signature verification, bounded body decoding, app-secret handling, Meta delivery parsing into bounded events, and keyword matching for comment automation."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_social_inbox"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-social-publish = { version = "0.2.0", path = "../rightkit-social-publish" }
rightkit-social-analytics = { version = "0.3.0", path = "../rightkit-social-analytics" }
rightkit-http = { version = "0.3.9", path = "../rightkit-http" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-logs = { version = "0.4.0", default-features = false, path = "../rightkit-logs" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
