[package]
name = "rightkit-social-inbox"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Signed social webhook inbox core: constant-time HMAC-SHA256 signature verification, bounded body decoding, app-secret handling, Meta delivery parsing into bounded events, and keyword matching for comment automation."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_social_inbox"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-social-publish = { version = "0.1.1", path = "../rightkit-social-publish" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-logs = { version = "0.3.6", default-features = false, path = "../rightkit-logs" }
rightkit-time = { version = "0.1.0", path = "../rightkit-time" }

[features]
# QA builds: the lowered body limit of `inbox.receive` and the `test_sign` payload shape.
test-mode = []

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
