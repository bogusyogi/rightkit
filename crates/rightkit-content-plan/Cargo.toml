[package]
name = "rightkit-content-plan"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Store-free content planning rules: manual draft approval gate, first-sentence disclosure check and per-platform posted-link host table."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_content_plan"
path = "src/lib.rs"

[dependencies]
rightkit-social-analytics = { version = "0.2.0", path = "../rightkit-social-analytics" }
rightkit-social-publish = { version = "0.1.1", path = "../rightkit-social-publish" }
rightkit-platform-rules = { version = "0.1.0", path = "../rightkit-platform-rules" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["digest"], path = "../rightkit-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
