[package]
name = "rightkit-content-plan"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Store-free content planning rules: manual draft approval gate, first-sentence disclosure check and per-platform posted-link host table."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_content_plan"
path = "src/lib.rs"

[dependencies]
rightkit-social-analytics = { version = "0.1.1", path = "../rightkit-social-analytics" }
rightkit-social-publish = { version = "0.1.1", path = "../rightkit-social-publish" }
rightkit-platform-rules = { version = "0.1.0", path = "../rightkit-platform-rules" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["digest"], path = "../rightkit-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
