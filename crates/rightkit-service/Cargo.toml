[package]
name = "rightkit-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "One discovery/auth convention for Right Suite local services: service.json, ranking and takeover, current-user-only Unix socket / named pipe, per-app request allowlist."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/claude"
publish = false

[dependencies]
rightkit-framed-sidecar = { version = "=0.1.0", path = "../rightkit-framed-sidecar" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows named pipes with a current-user-only DACL. cfg(windows) only: this
# backend compiles on the Windows host (see API.md for the exact command).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
