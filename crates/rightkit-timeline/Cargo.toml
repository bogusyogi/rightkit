[package]
name = "rightkit-timeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Portable video timeline core: tracks, clips, rational time, revisions, ripple edits, titles and visuals, and the render-plan compiler with its FFmpeg argument builder. Pure computation."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_timeline"
path = "src/lib.rs"

[dependencies]
rightkit-fs = { version = "0.4.7", default-features = false, features = ["blake3"], path = "../rightkit-fs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
rightkit-ffmpeg = { version = "0.3.0", default-features = false, features = ["native"], path = "../rightkit-ffmpeg" }

[dev-dependencies]
tempfile = "3"
blake3 = "1.8"
quick-xml = "0.41"

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
