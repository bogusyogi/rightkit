[package]
name = "rightkit-overlay"
version = "0.1.0"
edition = "2021"
description = "Shared overlay state, hit testing, and placement policy for Right Suite apps"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
