[package]
name = "rightkit-overlay"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Shared overlay state, hit testing, and placement policy for Right Suite apps"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src: pure geometry and hover models plus, on Windows only, a window-procedure subclass installed on the caller's own window by make_noactivate (lib.rs) that runs only when that window receives a message and holds one map entry per window (reviewed 2026-10-11); resident-static: ORIGINAL_WNDPROCS in src/lib.rs (Windows only) is a OnceLock Mutex HashMap with one entry per subclassed caller window, inserted by install_noactivate_mouse_guard and removed on WM_NCDESTROY, so it holds no more entries than live subclassed windows (reviewed 2026-10-17)"
