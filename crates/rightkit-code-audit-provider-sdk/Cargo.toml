[package]
name = "rightkit-code-audit-provider-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Code audit provider SDK: provider registry, source and effect interfaces for audit providers"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_code_audit_provider_sdk"
path = "src/lib.rs"

[dependencies]
regex = { version = "1.13.1" }
async-trait = { version = "0.1.92" }
futures-util = { version = "0.3.34" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
rightkit-evidence-effects = { version = "0.1.0", path = "../rightkit-evidence-effects" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "query", "form"] }
secrecy = { version = "0.10.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
