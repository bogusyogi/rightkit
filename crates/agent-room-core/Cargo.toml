[package]
name = "agent-room-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
license = "UNLICENSED"
publish = false

[features]
default = ["http"]
# The HTTP/SSE server (`server` module) and the `room` bin. Library-only users opt out with
# `default-features = false`, which drops axum, tokio and tokio-stream from the tree.
http = ["dep:axum", "dep:tokio", "dep:tokio-stream"]

[[bin]]
name = "room"
path = "src/bin/room.rs"
required-features = ["http"]

[dependencies]
axum = { version = "0.8", optional = true }
rand = "0.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
