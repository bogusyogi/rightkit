[package]
name = "rightkit-web-session"
version = "0.1.2"
edition = "2024"
rust-version = "1.98.0"
description = "Agent browser logins: one owner-approved Chromium session at a time on the login profile, with a network policy limited to the approved sites, a live view for the owner and signed approvals."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_web_session"
path = "src/lib.rs"

[features]
default = []
# Chromium sessions through rightkit-browser, on a Mac or a Linux computer. Without it every build answers `unsupported`
# and keeps no tokio or CDP stack.
browser = ["dep:rightkit-browser", "dep:tokio"]

[dependencies]
serde_json = { version = "1" }
ring = "0.17"
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-owner-approvals = { version = "0.1.3", path = "../rightkit-owner-approvals" }
rightkit-remote-gateway = { version = "0.1.4", path = "../rightkit-remote-gateway" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The typed secret fill (`BrowserPage::fill_secret`) of rightkit-browser is always on for this crate's sessions.
# tokio runs the crate's futures on a runtime that exists only while a session does.
rightkit-browser = { version = "0.3.12", path = "../rightkit-browser", optional = true, features = ["secret-fill"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"], optional = true }
libc = "0.2"
