[package]
name = "rightkit-web-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Agent browser logins: one owner-approved Chromium session at a time on the login profile, with a network policy limited to the approved sites, a live view for the owner and signed approvals."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_web_session"
path = "src/lib.rs"

[features]
default = []
# Chromium sessions through rightkit-browser, on a Mac or a Linux computer. Without it every build answers `unsupported`
# and keeps no tokio or CDP stack.
browser = ["dep:rightkit-browser", "dep:chromiumoxide", "dep:tokio"]

[dependencies]
serde_json = { version = "1" }
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-owner-approvals = { version = "0.1.0", path = "../rightkit-owner-approvals" }
rightkit-remote-gateway = { version = "0.1.0", path = "../rightkit-remote-gateway" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# chromiumoxide is the crate's own CDP dependency, named here only for the JPEG screenshot parameters of the live view
# (its `raw()` page), at the version rightkit-browser requires; tokio runs the crate's futures on a runtime that exists
# only while a session does.
rightkit-browser = { version = "0.3.7", path = "../rightkit-browser", optional = true }
chromiumoxide = { version = "0.9", default-features = false, optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"], optional = true }
libc = "0.2"

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
