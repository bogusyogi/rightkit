[package]
name = "rightkit-crash"
version = "0.3.6"
edition = "2021"
rust-version = "1.98.0"
description = "Privacy-first panic capture, redacted crash reports, native dumps and support bundles for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["crash", "panic", "diagnostics", "privacy"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_crash"
path = "src/lib.rs"

[[bin]]
name = "rightkit-dump-helper"
path = "src/bin/rightkit-dump-helper.rs"

[features]
default = ["support-bundle"]
# User-initiated redacted support ZIP: `build_support_bundle`, `SupportBundleOptions`,
# `BundleManifest`, `create_zip` and the `zip` dependency. Off for apps that only capture crashes.
support-bundle = ["dep:zip"]
# Renderer/webview error capture: `record_window_error`, `WindowErrorGate`, `WindowErrorReport`.
# Off by default; adds no dependency.
window-errors = []
# One-call process diagnostics: `init_diagnostics` installs the crash hook and rightkit-logs' daily-rolling
# `tracing` file logs under one data root, and writes each crash report to the log. Off by default.
diagnostics = ["dep:tracing", "rightkit-logs/tracing"]

[dependencies]
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-logs = { version = "0.3.4", path = "../rightkit-logs", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[dev-dependencies]
rightkit-logs = { version = "0.3.4", path = "../rightkit-logs", features = ["testing"] }
# Emits events in the `diagnostics` integration test.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "HangWatchdog"
file = "src/hang.rs"
holds = ["thread"]
scale = "one watchdog thread (rightkit-hang-watchdog) plus one poster thread (rightkit-hang-pump) per pump_via loop while a HangWatchdog lives; each registered loop adds one small registry entry; nothing runs unless the app starts the watchdog"
release = "HangWatchdog::stop or Drop (joins the watchdog thread; a capture in flight finishes first, bounded by the native helper timeout; pump threads end at stop or their next wake)"

[[package.metadata.rightkit.resources]]
api = "record_report"
file = "src/hook.rs"
holds = ["thread"]
scale = "one short-lived sink thread (rightkit-crash-sink) per recorded report, bounded by SINK_TIMEOUT; the panic hook runs only on panic"
release = "the sink thread ends when the sink returns; the report call returns after SINK_TIMEOUT at most"
static_note = "IN_HOOK is a thread_local Cell<bool> re-entrancy flag, one bool per panicking thread, reset when the capture guard drops (reviewed 2026-10-17); it holds no thread and cannot grow"

[[package.metadata.rightkit.resources]]
api = "capture_native"
file = "src/native.rs"
holds = ["child"]
scale = "one one-shot native dump helper or sample child at a time (single-flight guard), polled with a 40 ms try_wait sleep and bounded by the platform TIMEOUT"
release = "capture_native returns when the child exits or the TIMEOUT kills it"
static_note = "DUMP_HELPER is one RwLock<Option<PathBuf>> and IN_FLIGHT is one AtomicBool per platform: single values, not collections, so they cannot grow"

[[package.metadata.rightkit.resources]]
api = "run"
file = "src/dump_helper.rs"
holds = ["memory"]
scale = "the rightkit-dump-helper process holds one minidump write at a time"
release = "run returns when the dump is written"
static_note = "DUMP_LOCK is one Mutex<()> serialising DbgHelp dumps: no data, cannot grow"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
