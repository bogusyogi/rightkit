[package]
name = "rightkit-crash"
version = "0.3.2"
edition = "2021"
rust-version = "1.98.0"
description = "Privacy-first panic capture, redacted crash reports, native dumps and support bundles for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["crash", "panic", "diagnostics", "privacy"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_crash"
path = "src/lib.rs"

[[bin]]
name = "rightkit-dump-helper"
path = "src/bin/rightkit-dump-helper.rs"

[features]
default = ["support-bundle"]
# User-initiated redacted support ZIP: `build_support_bundle`, `SupportBundleOptions`,
# `BundleManifest`, `create_zip` and the `zip` dependency. Off for apps that only capture crashes.
support-bundle = ["dep:zip"]
# Renderer/webview error capture: `record_window_error`, `WindowErrorGate`, `WindowErrorReport`.
# Off by default; adds no dependency.
window-errors = []

[dependencies]
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-logs = { version = "0.3.0", path = "../rightkit-logs", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[dev-dependencies]
rightkit-logs = { version = "0.3.0", path = "../rightkit-logs", features = ["testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: 40 ms try_wait poll while the one-shot native dump helper runs (native.rs), bounded by the platform TIMEOUT and a single-flight guard; the panic hook runs only on panic; no thread-spawn, task-spawn, timer, listener or watcher (reviewed 2026-10-11); resident-static: IN_HOOK in src/hook.rs is a thread_local Cell<bool> re-entrancy flag, one bool per panicking thread, reset when the capture guard drops (reviewed 2026-10-17)"
