[package]
name = "rightkit-pipeline"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Deprecated: renamed rightkit-media-gen-client (the generation engine client). Re-exports it for one release."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_pipeline"
path = "src/lib.rs"

[features]
default = []
# The 0.1.x `channel_recipe` module at its old path: re-exports `rightkit_video_project::channel_recipe`
# (`rightkit-video-project` feature `channel-recipe`), for one release.
channel-recipe = ["dep:rightkit-video-project", "rightkit-video-project/channel-recipe"]

[dependencies]
rightkit-media-gen-client = { version = "0.1.0", path = "../rightkit-media-gen-client" }
rightkit-video-project = { version = "0.1.3", path = "../rightkit-video-project", default-features = false, optional = true }
