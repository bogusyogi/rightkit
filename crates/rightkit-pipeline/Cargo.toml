[package]
name = "rightkit-pipeline"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Generation pipeline client: drive an installed generation engine (submit, follow, import), crash-safe journal and recovery, model catalog checks."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_pipeline"
path = "src/lib.rs"

[features]
# Channel recipe validation (`channel_recipe`): checks a recipe body against the presets a render accepts.
channel-recipe = ["dep:rightkit-captions", "dep:rightkit-color", "dep:rightkit-audio"]
default = []

[dependencies]
rightkit-captions = { version = "0.1.0", path = "../rightkit-captions", optional = true }
rightkit-color = { version = "0.1.0", path = "../rightkit-color", optional = true }
rightkit-audio = { version = "0.3.1", path = "../rightkit-audio", default-features = false, optional = true }
tempfile = { version = "3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "lock", "digest", "blake3"], path = "../rightkit-fs" }
thiserror = { version = "2.0" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-job-queue = { version = "0.5.1", default-features = false, features = ["doctor"], path = "../rightkit-job-queue" }

# Citationberg is pulled by rightkit-typeset through rightkit-captions; see the vendored fix.
