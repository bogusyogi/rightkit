[package]
name = "rightkit-context-protocol"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Context protocol contract: typed scope-grant, candidate-set, packet, receipt and knowledge-emission shapes, their canonical JSON Schemas, and the canonical byte/digest contract."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "assets/**", "schemas/**"]

[lib]
name = "rightkit_context_protocol"
path = "src/lib.rs"

[dependencies]
rightkit-logs = { version = "0.3.7", default-features = false, path = "../rightkit-logs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rightkit-fs = { version = "0.4.9", features = ["digest"], path = "../rightkit-fs" }
