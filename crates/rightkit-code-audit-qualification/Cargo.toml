[package]
name = "rightkit-code-audit-qualification"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Qualification tooling for the code audit engine: fixture bench scoring, semantic capsule bridge, assurance record validation and security-control observation"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_code_audit_qualification"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
walkdir = { version = "2.5.0" }
ed25519-dalek = { version = "=3.0.0" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-code-audit-engine = { version = "0.1.0", path = "../rightkit-code-audit-engine" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
