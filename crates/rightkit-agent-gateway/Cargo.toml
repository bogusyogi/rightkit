[package]
name = "rightkit-agent-gateway"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
description = "Core of a local agent gateway, with no product verbs: agent registry (hashed pairing keys, levels, scopes, revoke), the gate's ordered checks over a static method table, one audit row per call, the door a call came by, stable refusal codes, untrusted-content wrapping and secret redaction."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["agent", "gateway", "audit", "pairing"]
categories = ["authentication"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_gateway"
path = "src/lib.rs"

[features]
default = ["sql"]
# The agent registry, pairing and the SQL audit sink over the host's tables.
sql = ["dep:rightkit-db", "dep:rightkit-crypto", "dep:getrandom", "dep:rightkit-fs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rightkit-approvals = { version = "0.2.0", default-features = false, path = "../rightkit-approvals" }
getrandom = { version = "0.4", optional = true }
rightkit-db = { version = "0.5.2", default-features = false, path = "../rightkit-db", optional = true }
rightkit-fs = { version = "0.4.7", default-features = false, features = ["digest"], path = "../rightkit-fs", optional = true }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto", optional = true }
