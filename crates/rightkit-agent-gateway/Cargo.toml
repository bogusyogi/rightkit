[package]
name = "rightkit-agent-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Remote tools for agents on this computer: files, documents, terminals, processes, screen, app launch, media, clipboard, chat read and start, saved logins and payments; folder confinement, per-chat unlock, local approvals, owner settings and the activity trail."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_gateway"
path = "src/lib.rs"

[features]
default = []
# Test builds only: a protected-settings keychain check is relaxed and dev approver keys are trusted (and
# `RIGHTKIT_CLAUDE_BIN` names the Claude program `chat_start` runs). Refused at compile time in a release build.
test-overrides = ["rightkit-approvals/test-overrides"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
ring = "0.17"
sysinfo = { version = "0.39" }
portable-pty = "=0.9.0"
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-approvals = { version = "0.1.0", path = "../rightkit-approvals" }
rightkit-chat-bridge = { version = "0.1.0", path = "../rightkit-chat-bridge" }
rightkit-device-link-types = { version = "0.1.0", path = "../rightkit-device-link-types" }
rightkit-system-monitor = { version = "0.1.0", path = "../rightkit-system-monitor" }
rightkit-automation = { version = "0.6.2", default-features = false, path = "../rightkit-automation" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-credentials = { version = "0.4.2", path = "../rightkit-credentials" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-daemon = { version = "0.5.0", default-features = false, path = "../rightkit-daemon" }
rightkit-docs = { version = "0.1.3", path = "../rightkit-docs" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }
rightkit-http = { version = "0.3.9", default-features = false, path = "../rightkit-http" }
rightkit-logs = { version = "0.3.6", default-features = false, path = "../rightkit-logs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
trash = "=5.2.9"
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
