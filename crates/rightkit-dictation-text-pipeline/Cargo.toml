[package]
name = "rightkit-dictation-text-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation text pipeline: LLM cleanup (L1-L3) with provider transports and policy, provider keys, runtime settings, screen-context vocabulary and the text polish orchestration."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_text_pipeline"
path = "src/lib.rs"

[features]
test-mode = ["rightkit-dictation-core/test-mode"]

[dependencies]
rightkit-dictation-core = { version = "0.2.0", path = "../rightkit-dictation-core" }
rightkit-text-polish = { version = "0.1.0", path = "../rightkit-text-polish" }
rightkit-voice-commands = { version = "0.1.0", path = "../rightkit-voice-commands" }
rightkit-transcript-library = { version = "0.1.0", path = "../rightkit-transcript-library" }
rightkit-automation = { version = "0.6.4", path = "../rightkit-automation", features = ["desktop-context"] }
rightkit-credentials = { version = "0.4.3", path = "../rightkit-credentials" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
rightkit-llm = { version = "0.3.2", path = "../rightkit-llm" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs"], path = "../rightkit-fs" }
rightkit-logs = { version = "0.3.7", default-features = false, path = "../rightkit-logs" }
parking_lot = { version = "0.13" }
chrono = { version = "0.4" }
iana-time-zone = { version = "0.1" }
sys-locale = { version = "0.3" }

[dev-dependencies]
rightkit-dictation-core = { version = "0.2.0", path = "../rightkit-dictation-core", features = ["test-mode"] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
