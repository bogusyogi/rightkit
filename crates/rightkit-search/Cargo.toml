[package]
name = "rightkit-search"
version = "0.4.1"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral search query language: lexer, AST, operator values, SQL/FTS5 predicate compiler, snippets, and an in-memory filename index."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["sqlite"]
# `Param: rusqlite::ToSql` so compiled predicates bind directly.
sqlite = ["dep:rusqlite"]
# Cockpit-derived in-memory filename index (substring/extension/size/kind, pagination).
filename-index = []

[dependencies]
rusqlite = { version = "0.41", default-features = false, optional = true }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure query lexer, parser, SQL compiler and bounded scan helpers over caller-supplied data; spawns no continuous work, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
