[package]
name = "rightkit-search"
version = "0.4.5"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral search query language: lexer, AST, operator values, SQL/FTS5 predicate compiler, snippets, and an in-memory filename index."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["sqlite"]
# `Param: rusqlite::ToSql` so compiled predicates bind directly.
sqlite = ["dep:rusqlite"]
# `grep`: gitignore-aware, budgeted, resumable regex content search over a workspace (CodeRight port).
workspace-grep = ["dep:ignore", "dep:regex", "dep:sha2"]
# Cockpit-derived in-memory filename index (substring/extension/size/kind, pagination).
filename-index = []

[dependencies]
rusqlite = { version = "0.41", default-features = false, optional = true }
ignore = { version = "=0.4.33", optional = true }
regex = { version = "1.13.1", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
# The library leaves the SQLite backend to the application (`default-features = false` above). The test build links one itself, so
# the crate's test build links on a host with no system SQLite (Windows: `LNK1181 sqlite3.lib`) and runs the same bundled version
# everywhere. Dev-dependencies do not reach the published library's features.
rusqlite = { version = "0.41", features = ["bundled"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure query lexer, parser, SQL compiler and bounded scan helpers over caller-supplied data; spawns no continuous work, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
