[package]
name = "rightkit-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shared audio for Right Suite apps: typed FFmpeg filter graphs, loudness gates, room tone, ducking, WAV I/O, and cpal capture with resample/downmix/recovery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/claude"
keywords = ["audio", "ffmpeg", "capture", "loudness"]
categories = ["multimedia::audio"]
readme = "README.md"
include = ["src/**", "tests/**", "presets/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["capture"]
# Live microphone capture (cpal + rubato + ringbuf). Off for pure filter-graph consumers.
capture = ["dep:cpal", "dep:rubato", "dep:ringbuf"]

[dependencies]
rightkit-media = { path = "../rightkit-media", version = "=0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
hound = "3"
cpal = { version = "0.18.2", optional = true }
rubato = { version = "5.0.0", optional = true }
ringbuf = { version = "0.5", optional = true }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3.2"
objc2-core-foundation = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-implement = "0.60"

[dev-dependencies]
tempfile = "3"
