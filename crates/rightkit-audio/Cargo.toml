[package]
name = "rightkit-audio"
version = "0.2.2"
edition = "2021"
rust-version = "1.98.0"
description = "Shared audio for Right Suite apps: typed FFmpeg filter graphs, loudness gates, room tone, ducking, WAV I/O, and cpal capture with resample/downmix/recovery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["audio", "ffmpeg", "capture", "loudness"]
categories = ["multimedia::audio"]
readme = "README.md"
include = ["src/**", "tests/**", "presets/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["capture"]
# Live microphone capture (cpal + rubato + ringbuf + tracing), the macOS CoreAudio device probe,
# and the Windows endpoint/power lifecycle adapter. Off for pure filter-graph consumers.
capture = ["dep:tracing", "dep:cpal", "dep:rubato", "dep:ringbuf", "dep:objc2-core-audio", "dep:objc2-core-foundation", "dep:windows", "dep:windows-core"]

[dependencies]
rightkit-media = { path = "../rightkit-media", version = "0.2.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
hound = "3"
cpal = { version = "0.18.2", optional = true }
rubato = { version = "5.0.0", optional = true }
ringbuf = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62.2", optional = true }

[dev-dependencies]
tempfile = "3"
