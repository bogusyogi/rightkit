[package]
name = "rightkit-audio"
version = "0.3.1"
edition = "2021"
rust-version = "1.98.0"
description = "Shared audio for Right Suite apps: typed FFmpeg filter graphs, loudness gates, room tone, ducking, WAV I/O, and cpal capture with resample/downmix/recovery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["audio", "ffmpeg", "capture", "playback", "loudness"]
categories = ["multimedia::audio"]
readme = "README.md"
include = ["src/**", "tests/**", "presets/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["capture"]
# Live microphone capture (cpal + rubato + ringbuf + tracing), the macOS CoreAudio device probe,
# and the Windows endpoint/power lifecycle adapter. Off for pure filter-graph consumers.
capture = ["dep:tracing", "dep:cpal", "dep:rubato", "dep:ringbuf", "dep:objc2-core-audio", "dep:objc2-core-foundation", "dep:windows", "dep:windows-core"]
# Audio output (cpal only, no new dependency): OutputSession with a lock-free sample ring, a
# latency-adjusted playback clock, pause/volume/mute/flush and device-loss recovery. Off by default.
playback = ["dep:cpal"]

[dependencies]
rightkit-ffmpeg = { path = "../rightkit-ffmpeg", version = "0.2.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
hound = "3"
cpal = { version = "0.18.2", optional = true }
rubato = { version = "5.0.1", optional = true }
ringbuf = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62.2", optional = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "CaptureSession::open_paused"
file = "src/capture/session.rs"
holds = ["thread", "memory"]
scale = "one open cpal input stream: the OS audio callback thread, a 4 s mono f32 ring buffer at the device rate (about 768 KB at 48 kHz), the resample and staging buffers and one Metrics block; fixed per session, independent of recording length. stop() only pauses it"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "list_input_devices"
file = "src/capture/device.rs"
holds = ["memory"]
scale = "one cpal host enumeration per call: a Vec of DeviceInfo returned to the caller; no stream is opened and nothing is retained after the call"
release = "function return"

[[package.metadata.rightkit.resources]]
api = "MonoDownmix::new"
file = "src/capture/downmix.rs"
holds = ["memory"]
scale = "per-channel energy accumulators sized by the device channel count; created and used only inside one CaptureSession's data callback, no allocation per callback"
release = "Drop of the CaptureSession that owns it"

[[package.metadata.rightkit.resources]]
api = "Metrics::new"
file = "src/capture/metrics.rs"
holds = ["memory"]
scale = "one block of atomic counters per CaptureSession, shared with its callback; fixed size"
release = "Drop of the CaptureSession that owns it"
static_note = "METRICS_CLOCK_ORIGIN is one OnceLock<Instant> (metrics.rs:8) set at the first callback: a single timestamp, not a collection, so it cannot grow; it holds no thread and no stream"

[[package.metadata.rightkit.resources]]
api = "OutputSession::open"
file = "src/playback/session.rs"
holds = ["thread", "memory"]
scale = "one open cpal output stream: the OS audio callback thread, an interleaved f32 ring of the requested duration (2 s by default, at most 60 s; about 768 KB for 2 s of 48 kHz stereo), one 16 KB callback scratch buffer and one block of atomic counters; fixed per session, independent of how much audio is played"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "list_output_devices"
file = "src/playback/session.rs"
holds = ["memory"]
scale = "one cpal host enumeration per call: a Vec of OutputDeviceInfo returned to the caller; no stream is opened and nothing is retained after the call"
release = "function return"
