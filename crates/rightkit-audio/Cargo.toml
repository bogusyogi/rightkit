[package]
name = "rightkit-audio"
version = "0.4.5"
edition = "2021"
rust-version = "1.98.0"
description = "Reusable audio primitives: typed FFmpeg filter graphs, loudness gates, room tone, ducking, WAV I/O, and cpal capture with resample/downmix/recovery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["audio", "ffmpeg", "capture", "playback", "loudness"]
categories = ["multimedia::audio"]
readme = "README.md"
include = ["src/**", "presets/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["capture"]
# Live microphone capture (cpal + rubato + ringbuf + tracing), the macOS CoreAudio device probe,
# and the Windows endpoint/power lifecycle adapter. Off for pure filter-graph consumers.
capture = ["dep:tracing", "dep:cpal", "dep:rubato", "dep:ringbuf", "dep:objc2-core-audio", "dep:objc2-core-foundation", "dep:windows", "dep:windows-core", "dep:rightkit-child-process", "dep:objc2", "dep:objc2-foundation", "dep:block2", "dep:rightkit-fs"]
# Audio output (cpal only, no new dependency): OutputSession with a lock-free sample ring, a
# latency-adjusted playback clock, pause/volume/mute/flush and device-loss recovery. Off by default.
playback = ["dep:cpal"]

[dependencies]
rightkit-child-process = { path = "../rightkit-child-process", version = "0.5.12", optional = true }
rightkit-fs = { path = "../rightkit-fs", version = "0.5.0", default-features = false, features = ["fs"], optional = true }
rightkit-ffmpeg = { path = "../rightkit-ffmpeg", version = "0.3.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
hound = "3"
cpal = { version = "0.18.2", optional = true }
rubato = { version = "5.0.1", optional = true }
ringbuf = { version = "0.6", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }
objc2-core-audio = { version = "0.3.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
  "Foundation",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62.2", optional = true }

[package.metadata.rightkit]
continuous = "held-resource"

# Permissions an app that enables a feature must declare (rightkit#1346 item 5). The release tooling checks each
# entry against the app's Info.plist keys and signing entitlements for the features the app enables.
[[package.metadata.rightkit.permissions]]
feature = "capture"
platform = "macos"
info_plist = ["NSMicrophoneUsageDescription"]
entitlements = ["com.apple.security.device.audio-input"]
reason = "cpal opens the default input device, which macOS gates behind the microphone privacy prompt and, under the hardened runtime, the audio-input entitlement"

[[package.metadata.rightkit.resources]]
api = "CaptureSession::open_paused"
file = "src/capture/session.rs"
holds = ["thread", "memory"]
scale = "one open cpal input stream: OS audio callback thread, 4 s native-rate mono ring, 4096 callback metadata slots, resample/staging buffers and metrics; legacy mode is fixed per session. Opt-in precise epochs additionally retain native mono samples and callback stamps for recording duration, then cache full target-rate clip until next epoch or Drop. Cut handles hold Weak stream references. stop() only pauses it"
release = "Drop"
static_note = "Windows MMCSS registration is one fixed thread-local guard per active CPAL callback thread; CPAL drops and joins that thread, and the guard reverts registration at thread exit"

[[package.metadata.rightkit.resources]]
api = "list_input_devices"
file = "src/capture/device.rs"
holds = ["memory"]
scale = "one cpal host enumeration per call: a Vec of DeviceInfo returned to the caller; no stream is opened and nothing is retained after the call"
release = "function return"

[[package.metadata.rightkit.resources]]
api = "MonoDownmix::new"
file = "src/capture/downmix.rs"
holds = ["memory"]
scale = "per-channel energy accumulators sized by the device channel count; created and used only inside one CaptureSession's data callback, no allocation per callback"
release = "Drop of the CaptureSession that owns it"

[[package.metadata.rightkit.resources]]
api = "Metrics::new"
file = "src/capture/metrics.rs"
holds = ["memory"]
scale = "one block of atomic counters per CaptureSession, shared with its callback; fixed size"
release = "Drop of the CaptureSession that owns it"
static_note = "METRICS_CLOCK_ORIGIN is one OnceLock<Instant> (metrics.rs:8) set at the first callback: a single timestamp, not a collection, so it cannot grow; it holds no thread and no stream"

[[package.metadata.rightkit.resources]]
api = "OutputSession::open"
file = "src/playback/session.rs"
holds = ["thread", "memory"]
scale = "one open cpal output stream: the OS audio callback thread, an interleaved f32 ring of the requested duration (2 s by default, at most 60 s; about 768 KB for 2 s of 48 kHz stereo), one 16 KB callback scratch buffer and one block of atomic counters; fixed per session, independent of how much audio is played"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "list_output_devices"
file = "src/playback/session.rs"
holds = ["memory"]
scale = "one cpal host enumeration per call: a Vec of OutputDeviceInfo returned to the caller; no stream is opened and nothing is retained after the call"
release = "function return"

[[package.metadata.rightkit.resources]]
api = "play_once"
file = "src/playback/oneshot.rs"
holds = ["thread", "memory"]
scale = "one OutputSession (cpal output stream, its ring and callback thread) plus the decoded file: mono f32 at file rate and a device-rate interleaved copy, about (samples x device channels + samples) x 4 bytes for the file length; the call blocks for the file duration"
release = "function return (the OutputSession drops before play_once returns)"

[[package.metadata.rightkit.resources]]
api = "SetupAudioScope"
file = "src/setup/scope.rs"
holds = ["memory"]
scale = "fixed setup lifecycle state, one MicMeter and at most one active or retiring permission session; no scope-owned thread, queue or growing retired collection. The hosted executor supplies admitted blocking operations, and retained primitives have their own resource entries"
release = "suspend or close invalidates admission and cancels work; drain waits off UI and releases the retired scope work, and Drop frees remaining lifecycle state"

[[package.metadata.rightkit.resources]]
api = "MicMeter::start"
file = "src/setup/mic_meter.rs"
holds = ["thread", "memory"]
scale = "one owned meter worker and at most one CaptureSession at a time; up to 4096 RMS history entries, including on device repair"
release = "stop invalidates without blocking; the worker releases capture on cancellation, replacement drains its predecessor, and close or Drop joins; callback self-close completes as its callback unwinds"
static_note = "METER_WORKER is one pointer per meter worker thread, identity-only and never dereferenced; it owns no resource and expires at worker exit"

[[package.metadata.rightkit.resources]]
api = "Recorder::start"
file = "src/setup/calibration_capture.rs"
holds = ["thread", "memory"]
scale = "one onboarding-recognition-capture thread and one CaptureSession, plus mono f32 samples bounded by sample_rate times max_seconds"
release = "Recorder::stop, Recorder::cancel, superseding start, or Drop stops and joins the worker; capture error or length ceiling drops the stream"

[[package.metadata.rightkit.resources]]
api = "MicrophonePermissionSession::request"
file = "src/setup/permissions/mod.rs"
holds = ["thread", "memory"]
scale = "one request admission and platform consent operation per current ticket; macOS uses the calling worker and an OS-owned completion block, Windows delegates the follow-up watch to an owned session"
release = "request return releases the synchronous wait; on macOS the OS-owned completion may remain until the user answers; see the Windows session worker entry"

[[package.metadata.rightkit.resources]]
api = "PermissionSession"
file = "src/setup/permissions/winrt.rs"
holds = ["thread", "memory"]
scale = "one lazy runner thread per session, a single replaceable grant watch with a 60 second consent observation window, a pending native operation, and bounded transient capture probe workers joined per probe; idle runner sleeps without a timer"
release = "cancel suppresses new work and wakes waits; close or Drop drains admitted native calls and callbacks and joins the runner off UI, with callback self-close completing as it unwinds"

[[package.metadata.rightkit.resources]]
api = "run_engine_calibration"
file = "src/setup/calibration_engine.rs"
holds = ["child", "thread", "memory"]
scale = "one owned engine child, two output drain workers, stdout bounded by EngineRun::stdout_cap plus 1 MiB stderr; macOS parent-death watchdog owns one helper process; execution deadline followed by bounded tree termination and pipe cleanup"
release = "runner return after tree termination/reap and output cleanup; parent death terminates owned child through OS job or parent-death mechanism"

[[package.metadata.rightkit.resources]]
api = "calibration_session::finish"
file = "src/setup/calibration_session.rs"
holds = ["memory"]
scale = "one owned on-disk PCM file and a sample buffer bounded by sample rate times maximum capture length"
release = "discard is attempted on every normal exit after reservation and before any resident restart; failures are reported and retained ownership evidence allows recovery once the process is confirmed dead"

[[package.metadata.rightkit.resources]]
api = "ReferenceTap"
file = "src/echo.rs"
holds = ["memory"]
scale = "a 2 s mono 16 kHz history (128 KB) behind one mutex, plus one 1024-tap filter (4 KB) per EchoCanceller; fixed, independent of how much audio is played"
release = "Drop"
static_note = "reference_tap() is one OnceLock<ReferenceTap> (echo.rs): a single fixed-size ring, not a collection that grows; it holds no thread and no stream"

[[package.metadata.rightkit.resources]]
api = "TurnTracker"
file = "src/turn.rs"
holds = ["memory"]
scale = "at most tail_secs (default 8 s) of 16 kHz mono f32 (512 KB) per tracker, plus the model a host gives it"
release = "Drop"
