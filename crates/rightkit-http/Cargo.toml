[package]
name = "rightkit-http"
version = "0.2.6"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral blocking HTTP client for Right Suite apps: timeouts, retry/backoff with Retry-After, SSE streaming, resumable downloads, multipart bodies, redacted secrets, and untrusted web-text wrapping."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["http", "retry", "sse", "streaming"]
categories = ["web-programming::http-client"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "API.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["gzip", "untrusted"]
# `untrusted` module: tamper-evident wrapping of external text for model input. Its only
# dependency is `rightkit-fs` (SHA-256 digest); HTTP-only consumers can opt out.
untrusted = ["dep:rightkit-fs"]
# Automatic gzip negotiation and transparent response decoding, matching ureq defaults.
gzip = ["ureq/gzip", "reqwest?/gzip"]
# Async client (reqwest + tokio, rustls only) with the same policy layer, body
# streaming and an async SSE stream. Needs a tokio runtime at call time.
async = ["dep:reqwest", "dep:tokio", "dep:futures-util", "dep:bytes"]
# In-process mock HTTP server for tests of this crate and its consumers.
testing = []

[dependencies]
rightkit-fs = { version = "0.3", path = "../rightkit-fs", default-features = false, features = ["digest"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
getrandom = "0.4"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
tokio = { version = "1", default-features = false, features = ["time", "net"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
rightkit-http = { path = ".", default-features = false, features = ["testing"] }
