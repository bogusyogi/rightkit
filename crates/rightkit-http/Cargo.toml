[package]
name = "rightkit-http"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral blocking HTTP client for Right Suite apps: timeouts, retry/backoff with Retry-After, SSE streaming, redacted secrets, and untrusted web-text wrapping."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["http", "retry", "sse", "streaming"]
categories = ["web-programming::http-client"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "API.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["gzip"]
# Automatic gzip negotiation and transparent response decoding, matching ureq defaults.
gzip = ["ureq/gzip"]
# In-process mock HTTP server for tests of this crate and its consumers.
testing = []

[dependencies]
rightkit-fs = { version = "0.3", path = "../rightkit-fs", default-features = false, features = ["digest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
getrandom = "0.3"

[dev-dependencies]
rightkit-http = { path = ".", default-features = false, features = ["testing"] }
