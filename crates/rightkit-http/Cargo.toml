[package]
name = "rightkit-http"
version = "0.3.9"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral blocking HTTP client for Right Suite apps: timeouts, retry/backoff with Retry-After, SSE streaming, multipart bodies, redacted secrets, and untrusted web-text wrapping."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["http", "retry", "sse", "streaming"]
categories = ["web-programming::http-client"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "API.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# `untrusted` module: tamper-evident wrapping of external text for model input. Its only
# dependency is `rightkit-fs` (SHA-256 digest); HTTP-only consumers can opt out.
untrusted = ["dep:rightkit-fs"]
# Automatic gzip negotiation and transparent response decoding, matching ureq defaults.
gzip = ["ureq/gzip", "reqwest?/gzip"]
# Async client (reqwest + tokio, rustls only) with the same policy layer, body
# streaming and an async SSE stream. Needs a tokio runtime at call time.
async = ["dep:reqwest", "dep:tokio", "dep:futures-util", "dep:bytes", "dep:rustls", "dep:rustls-platform-verifier", "dep:webpki-roots"]
# In-process mock HTTP server for tests of this crate and its consumers.
testing = []

[dependencies]
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["digest"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
tokio = { version = "1", default-features = false, features = ["time", "net"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
bytes = { version = "1", optional = true }
# Async `TrustRoots::Platform`: the same OS verifier the blocking client gets through ureq,
# installed into reqwest with `use_preconfigured_tls`. Same rustls 0.23 as reqwest 0.13 (`rustls-no-provider`: the ring provider is installed here, not aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", default-features = false, optional = true }
# Async `TrustRoots::Bundled`: Mozilla roots, installed explicitly (same crate ureq uses).
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
# Throwaway CAs and leaf certificates for the local TLS server in tests/tls_local.rs.
rcgen = "0.14"
# The test TLS server speaks rustls directly (ring), whatever features are on.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
rightkit-http = { path = ".", default-features = false, features = ["testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: cancellation-poll and retry waits inside one request (async_client.rs, cancel.rs), bounded by the request deadline; timer: a 25 ms tokio Sleep re-armed only while a cancellable async BodyStream is polled and pending (async_client.rs), gone when the stream is dropped; thread-spawn: one DNS-lookup thread per resolve with a timeout (netpolicy.rs), ends when getaddrinfo returns; thread-spawn: one body-reader thread per stream while ClientConfig::idle_timeout is set (idle.rs), ends at EOF, error or consumer drop, and no thread exists when it is None; listener: the loopback mock server in the opt-in testing feature, stopped and joined on drop; no free-running timer, watcher or long-lived memory (reviewed 2026-10-11); conn-pool: the reqwest Clients in src/async_client.rs (direct, plus at most one per configured proxy route) are owned by one AsyncClient and keep only idle keep-alive connections that reqwest closes after its default idle timeout, and all of them drop with the client, so the pool is idle when unused and holds no thread of its own beyond the DNS and body-reader threads named above; resident-static: CONNECT_STATE in src/client.rs is a thread_local Cell holding one three-state enum per calling thread (reviewed 2026-10-17)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
