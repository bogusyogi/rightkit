[package]
name = "rightkit-secrets"
version = "0.1.4"
edition = "2021"
rust-version = "1.98.0"
description = "Per-app OS credential storage for Right Suite apps: Keychain / Credential Manager, passive presence checks, non-interactive mode, test guards, DB-key provisioning, and migration."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["keychain", "credentials", "secrets", "credential-manager"]
categories = ["os", "authentication"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# `impl rightkit_settings::SecretProbe for Store` (presence-only adapter).
settings-probe = ["dep:rightkit-settings"]

[[bin]]
name = "rightkit-secrets"
path = "src/bin/rightkit-secrets.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
getrandom = "0.3"
zeroize = "1.8"
rightkit-settings = { version = "0.2.0", path = "../rightkit-settings", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
keyring-core = "1"
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tempfile = "3"

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: one thread per keychain or helper call so the call can time out (store.rs run, apple_helper.rs), ends when the OS call or helper returns; the process-wide MemoryBackend holds only the secrets the caller stores; no sleep, listener, timer or watcher (reviewed 2026-10-11)"
