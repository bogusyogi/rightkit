[package]
name = "rightkit-agent-host-traits"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Host traits for agent runtimes: a skill catalog the host implements and installs, so RightKit agent crates never load skills themselves."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_host_traits"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0" }
