[package]
name = "rightkit-chat-bridge"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
description = "Chat between AI chats: envelopes, linked computers and the device link, native delivery into running Claude and Codex chats (hooks, desktop), receipts, the chat skill and hook installer. The host app supplies its brand and state folder."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_chat_bridge"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
ring = "0.17"
sysinfo = { version = "0.40" }
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-ai-accounts = { version = "0.1.0", path = "../rightkit-ai-accounts" }
rightkit-device-link-types = { version = "0.1.0", path = "../rightkit-device-link-types" }
rightkit-app-settings = { version = "0.4.0", path = "../rightkit-app-settings" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-daemon = { version = "0.6.0", default-features = false, path = "../rightkit-daemon" }
rightkit-db = { version = "0.5.3", features = ["bundled", "statement-cache"], path = "../rightkit-db" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }
rightkit-hooks = { version = "0.2.0", path = "../rightkit-hooks" }
rightkit-logs = { version = "0.4.0", default-features = false, path = "../rightkit-logs" }
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
rightkit-time = { version = "0.1.0", path = "../rightkit-time" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }
