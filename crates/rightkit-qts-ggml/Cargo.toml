[package]
name = "rightkit-qts-ggml"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/Orthic-Labs/rightkit"
description = "DEPRECATED: use rightkit-qts-ggml-sys directly. Thin safe wrappers over rightkit-qts-ggml-sys for rightkit-qts, vendored from yet-another-ai/qts v0.2.0"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "PINNED.md"]

[lib]
name = "qts_ggml"

[features]
default = []
metal = ["rightkit-qts-ggml-sys/metal"]
vulkan = ["rightkit-qts-ggml-sys/vulkan"]
blas = ["rightkit-qts-ggml-sys/blas"]
native = ["rightkit-qts-ggml-sys/native"]

[dependencies]
rightkit-qts-ggml-sys = { path = "../rightkit-qts-ggml-sys", version = "0.1.0", default-features = false }

[package.metadata.rightkit]
continuous = false
continuous_reason = "no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src: deprecated facade whose only resource is a caller-owned fixed-size ggml_context arena freed on drop (lib.rs Context), the resident model and thread use belong to rightkit-qts (reviewed 2026-10-11)"
