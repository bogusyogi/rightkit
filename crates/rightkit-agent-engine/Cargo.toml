[package]
name = "rightkit-agent-engine"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
description = "Always-on agent contracts: task envelope and transitions, principals, intents, effects, device and approval binding, voice hand-off."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine"
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
thiserror = { version = "2.0" }
# The core binding record (`ApprovalBinding::core_binding`); no store, no file IO.
rightkit-approvals = { version = "0.2.0", default-features = false, path = "../rightkit-approvals" }
