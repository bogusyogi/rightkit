[package]
name = "rightkit-agent-engine-runtime-resources"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine runtime resources: resource discovery and limits for agent turns"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_runtime_resources"
path = "src/lib.rs"

[dependencies]
rightkit-fs = { version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs" }
