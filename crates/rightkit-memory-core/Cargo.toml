[package]
name = "rightkit-memory-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Durable-memory core: memory tiers, retrieval ranking, a quality eval gate and token accounting, with no I/O."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_memory_core"
path = "src/lib.rs"

[dependencies]
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
tiktoken-rs = { version = "0.12" }
rayon = { version = "=1.12.0" }
rightkit-embed = { version = "0.6.2", path = "../rightkit-embed" }
rightkit-fs = { version = "0.4.9", features = ["digest"], path = "../rightkit-fs" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
