[package]
name = "rightkit-notch-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Notch drawing core: edge-aware geometry, spring motion, hover card model and a software renderer for ring gauges and cards."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_notch_ui"
path = "src/lib.rs"

[features]
default = []
qa-views = []

[target.'cfg(windows)'.dependencies]
rightkit-win-ui = { version = "0.1.0", path = "../rightkit-win-ui" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
