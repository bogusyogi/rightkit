[package]
name = "rightkit-notch-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Notch drawing core: edge-aware geometry, spring motion, hover card model and a software renderer for ring gauges and cards."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_notch_ui"
path = "src/lib.rs"

[features]
default = []
qa-views = []

[target.'cfg(windows)'.dependencies]
rightkit-win-ui = { version = "0.1.0", path = "../rightkit-win-ui" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
