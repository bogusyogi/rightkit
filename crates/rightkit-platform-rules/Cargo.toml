[package]
name = "rightkit-platform-rules"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Versioned catalog of per-platform limits and rules with a stable rule-revision hash and a check of planned values against sourced rules."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["social", "limits", "rules", "catalog"]
include = ["src/**", "assets/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[package.metadata.rightkit]
continuous = false
continuous_reason = "versioned platform-rule catalog: serde types, bundled JSON parsed on demand and merged by the caller; spawns no continuous work, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
