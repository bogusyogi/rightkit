[package]
name = "rightkit-fsindex"
version = "0.4.1"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Live whole-disk file index: fuzzy name search plus clone- and hard-link-aware folder size rollups on memory-mapped columns"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-fsindex"
documentation = "https://docs.rs/rightkit-fsindex"
keywords = ["filesystem", "file-index", "fsevents", "disk-usage", "search"]
categories = ["filesystem", "os::macos-apis", "os::windows-apis"]
include = ["src/**", "tests/*.rs", "tests/common/*.rs", "benches/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "THIRD-PARTY-NOTICES"]

[lib]
name = "rightkit_fsindex"
path = "src/lib.rs"

[dependencies]
memchr = "2"
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same `windows` line as rightkit-automation / rightkit-daemon (0.62), no new dependency.
# OLE DB (Win32_System_Search + Win32_Storage_IndexServer for DBID), the SCM probe for the
# WSearch service, and DeviceIoControl on a volume handle for the USN journal.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_IndexServer",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Search",
  "Win32_System_Services",
  "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3"
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }

[features]
default = []
# Opt-in content (trigram) search. Not compiled unless enabled, and even when
# compiled it stays off until `Config::content.enabled` is set at run time.
content = []

[[bench]]
name = "crawl"
harness = false

[[bench]]
name = "footprint"
harness = false

[[bench]]
name = "budget"
harness = false
