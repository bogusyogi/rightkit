[package]
name = "rightkit-media-fetch"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Media fetch: yt-dlp download and 16 kHz mono WAV normalize, playlist expansion, and a pure URL/file job classifier with a shared media-type table."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_media_fetch"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
url = { version = "2.5.8" }
rightkit-http = { version = "0.3.9", default-features = false, path = "../rightkit-http" }
rightkit-ffmpeg = { version = "0.3.0", path = "../rightkit-ffmpeg" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-fs = { version = "0.4.13", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-web-extract = { version = "0.1.1", path = "../rightkit-web-extract" }
scraper = { version = "0.29" }
serde_json = { version = "1.0.154" }
tracing = { version = "0.1.44" }
