[package]
name = "rightkit-automation"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral desktop automation: observe and act on any app (macOS AX, Windows UIA) through a four-tier input ladder with safety, focus guard, and evidence receipts."
license = "MIT OR Apache-2.0"
publish = false

# No third-party dependencies by default on macOS (direct framework FFI). Windows uses the
# `windows` crate already pinned in the workspace lock (UI Automation, GDI,
# clipboard, SendInput). No Python or Node at runtime. The `windows` crate is
# cfg(windows) only, so the Windows backend compiles on the Windows host.
# The optional `in-app` feature adds `rightkit-service` and `serde_json`.
[features]
default = []
# Tier 2 client (`in_app::ServiceBridge`) over `rightkit-service`, and the fail-closed app-data
# root helpers in `paths`. The `in_app::InApp` trait itself is always available.
in-app = ["dep:rightkit-service", "dep:serde_json"]

[dependencies]
rightkit-service = { version = "0.1.0", path = "../rightkit-service", optional = true }
serde_json = { version = "1.0.150", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Real-app gates. `harness = false`: the macOS gate must run on the main thread
# (NSWorkspace state is published through the main run loop).
[[test]]
name = "e2e_mac"
harness = false

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: fixed settle and key-delay pauses inside one automation action (engine.rs, delivery.rs, macos/events.rs, macos/appkit.rs, win/sys.rs); thread-spawn: FocusWatch sampler (focus.rs) started and joined by finish() around one action, caller-bounded but it has no Drop stop so a forgotten finish() would leak a sampler; element store is capped at STORE_CAP 8; no listener, timer or watcher (reviewed 2026-10-11)"
