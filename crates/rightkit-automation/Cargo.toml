[package]
name = "rightkit-automation"
version = "0.6.1"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral desktop automation: observe and act on any app (macOS AX, Windows UIA) through a four-tier input ladder with safety, focus guard, and evidence receipts."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["automation", "accessibility", "uia", "desktop", "input"]
categories = ["os", "accessibility"]
include = ["src/**", "tests/**", "examples/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

# No third-party dependencies by default on macOS (direct framework FFI). Windows uses the
# `windows` crate already pinned in the workspace lock (UI Automation, GDI,
# clipboard, SendInput). No Python or Node at runtime. The `windows` crate is
# cfg(windows) only, so the Windows backend compiles on the Windows host.
# The optional `paths` feature adds `rightkit-daemon`. There is no dependency on any QA
# crate: tier 2 is the `in_app::InApp` trait, implemented by the caller.
[features]
default = []
# The fail-closed app-data root helpers in `paths` (resolved through `rightkit-daemon::Suite`).
paths = ["dep:rightkit-daemon"]
# macOS only: lets `offscreen` call the WKWebView private SPI
# `_setWindowOcclusionDetectionEnabled:` so an off-screen window keeps animating. Default off, so
# shipping apps opt in explicitly; without it `offscreen` fails with a typed
# `OcclusionSpiNotCompiled` error on macOS.
offscreen-private-spi = []

[dependencies]
rightkit-daemon = { version = "0.4.0", path = "../rightkit-daemon", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Real-app gates. `harness = false`: the macOS gate must run on the main thread
# (NSWorkspace state is published through the main run loop).
[[test]]
name = "e2e_mac"
harness = false

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: fixed settle and key-delay pauses inside one automation action (engine.rs, delivery.rs, macos/events.rs, macos/appkit.rs, win/sys.rs); thread-spawn: FocusWatch sampler (focus.rs) started and joined by finish() around one action, caller-bounded but it has no Drop stop so a forgotten finish() would leak a sampler; element store is capped at STORE_CAP 8; offscreen.rs: resident-static ACTIVE is one Mutex<Option<Active>> holding at most the single current offscreen session (install refuses a second; cleared by end), and launch_offscreen spawns the driven app as a child owned by OffscreenLaunch (killed by end() and on Drop, and on a failed launch) and polls its report file with 50 ms sleeps until the caller timeout; macos/background.rs: waited short-lived lsappinfo, open, pgrep and screencapture children plus fixed event pauses; control/lease_store.rs: one small atomic file write per lease state change; no listener, timer or watcher (reviewed 2026-10-11, moved-in code reviewed 2026-10-15)"
