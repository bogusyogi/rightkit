[package]
name = "rightkit-logs"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Privacy-safe local JSONL logging and diagnostics for Right Suite desktop apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["logging", "diagnostics", "privacy", "jsonl"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
