[package]
name = "rightkit-logs"
version = "0.1.0"
edition = "2021"
description = "Privacy-safe local JSONL logging and diagnostics for Right Suite desktop apps."
license = "UNLICENSED"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
