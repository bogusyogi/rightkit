[package]
name = "rightkit-logs"
version = "0.3.5"
edition = "2021"
rust-version = "1.98.0"
description = "Privacy-safe local JSONL logging and diagnostics for Right Suite desktop apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["logging", "diagnostics", "privacy", "jsonl"]
categories = ["development-tools::debugging"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "runtime-history/**", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["http"]
# HTTPS transport for the consented outbox uploader. Without it the crate has no
# network dependency and callers supply their own `Transport`.
http = ["dep:ureq"]
# Loopback mock ingest server for app e2e tests.
testing = []
# Daily-rolling JSONL file logs for `tracing`: `install_tracing`, `tracing_layer`,
# and the diagnostics helpers that collect the daily files.
tracing = ["dep:tracing", "dep:tracing-subscriber"]
# Forward `log`-crate records (for example from dependencies and apps that use `log::`) into
# `tracing`, so they reach the `install_tracing` file logs: `init_log_bridge`.
log-bridge = ["tracing", "dep:tracing-log"]

[dependencies]
rightkit-fs = { version = "0.4.2", path = "../rightkit-fs", default-features = false, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
getrandom = "0.4"
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "json", "env-filter"], optional = true }
tracing-log = { version = "0.2", default-features = false, features = ["std", "log-tracer"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[[bench]]
name = "budget"
harness = false
required-features = ["tracing"]

[[bench]]
name = "budget_detached"
harness = false

[dev-dependencies]
rightkit-logs = { path = ".", features = ["testing"] }
tempfile = "3"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
