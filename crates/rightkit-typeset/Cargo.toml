[package]
name = "rightkit-typeset"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Typst rendering for titles, captions and math, with mitex LaTeX input, for Right Suite applications; no file access, no package fetching, explicit fonts"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-typeset"
documentation = "https://docs.rs/rightkit-typeset"
keywords = ["typst", "typesetting", "math", "captions"]
categories = ["text-processing", "multimedia::images"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY.md"]

[lib]
name = "rightkit_typeset"
path = "src/lib.rs"

[features]
default = []
# LaTeX input through mitex (`latex_to_typst`, `Source::Latex`).
latex = ["dep:mitex"]
# PNG output through typst-render.
png = ["dep:typst-render"]
# Typst's embedded fonts (typst-assets). Not bundled by default; see THIRD-PARTY.md.
embedded-fonts = ["dep:typst-assets"]

[dependencies]
thiserror = "2"
typst = "0.15.1"
typst-svg = "0.15.1"
typst-layout = "0.15.1"
typst-render = { version = "0.15.1", optional = true }
mitex = { version = "0.2.4", optional = true }
# Version tracks typst's minor; verify against the typst 0.15.1 lock when it is refreshed.
typst-assets = { version = "0.15", features = ["fonts"], optional = true }

[package.metadata.rightkit]
continuous = false
continuous_reason = "one-shot Typst compile and render per call over caller-provided source and fonts, no I/O loop; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"

# Patches every consuming app workspace must declare (a [patch.crates-io] applies only in the workspace that writes
# it, so a published rightkit-typeset does not carry it; rightkit#1346 item 7). The fork cannot be depended on under a
# RightKit name: typst and hayagriva name `citationberg` themselves, so only a patch replaces it. Release tooling
# checks the app's manifest and lock against this entry.
[[package.metadata.rightkit.consumer_patches]]
crate = "citationberg"
registry_version = "0.7.0"
source = "vendor/citationberg"
requires = { "quick-xml" = ">=0.41" }
advisories = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]
remove_when = "upstream citationberg releases with quick-xml >= 0.41"

# One Cargo workspace and lock per crate (rightkit#1285).
