[package]
name = "rightkit-owner-approvals"
version = "0.1.2"
edition = "2024"
rust-version = "1.98.0"
description = "Signed owner approvals for privileged and reserved actions: owner-check and approver keys, key bindings and the security audit trail."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_owner_approvals"
path = "src/lib.rs"

[features]
default = []

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials" }
rightkit-logs = { version = "0.4.0", default-features = false, path = "../rightkit-logs" }
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-device-link-types = { version = "0.1.0", path = "../rightkit-device-link-types" }
rightkit-approvals = { version = "0.2.0", default-features = false, path = "../rightkit-approvals" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography"] }
