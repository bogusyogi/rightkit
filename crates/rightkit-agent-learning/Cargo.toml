[package]
name = "rightkit-agent-learning"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Post-session learning for a coding agent (CodeRight): proposal extraction, evaluation and promotion, instincts, regression detection, evaluation-gated workflow proposals and skill optimisation."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_learning"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rightkit-agent-engine-storage = { version = "0.1.0", path = "../rightkit-agent-engine-storage" }
rightkit-db = { version = "0.5.3", features = ["bundled", "statement-cache"], path = "../rightkit-db" }
