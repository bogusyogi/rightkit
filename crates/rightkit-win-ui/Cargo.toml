[package]
name = "rightkit-win-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Win32 UI toolkit: RAII window and GDI wrappers, software canvas, GDI surface and text painter, vector glyphs, shell file icons. Empty on other systems."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_win_ui"
path = "src/lib.rs"

[features]
default = []
qa-views = []

[target.'cfg(windows)'.dependencies]
rightkit-overlay = { version = "0.2.0", path = "../rightkit-overlay" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
