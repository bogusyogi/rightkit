[package]
name = "rightkit-social-publish"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Social platform publish adapters (X, Bluesky, Mastodon, Threads, Instagram, Facebook, LinkedIn, Pinterest, TikTok, YouTube) with a no-retry HTTP layer, Retry-After parsing, media checks, pinned API versions and error-text redaction."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_social_publish"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-http = { version = "0.3.9", features = ["gzip", "untrusted"], path = "../rightkit-http" }
rightkit-logs = { version = "0.3.6", default-features = false, path = "../rightkit-logs" }
rightkit-cache = { version = "0.2.3", path = "../rightkit-cache" }
rightkit-fs = { version = "0.4.8", features = ["fs"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.0", path = "../rightkit-time" }
rightkit-platform-rules = { version = "0.1.0", path = "../rightkit-platform-rules" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
