[package]
name = "rightkit-evidence-commands"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Evidence, freeze, contract, decision, governance, key, state and run command logic as library modules for a host CLI"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_commands"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hex = { version = "0.4.3" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-code-audit-engine = { version = "0.1.0", path = "../rightkit-code-audit-engine" }
rightkit-evidence-application = { version = "0.1.0", path = "../rightkit-evidence-application" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
rightkit-evidence-decisions = { version = "0.1.0", path = "../rightkit-evidence-decisions" }
rightkit-evidence-governance = { version = "0.1.0", path = "../rightkit-evidence-governance" }
rightkit-policy-rules = { version = "0.1.0", path = "../rightkit-policy-rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11.1" }
tokio-util = { version = "0.7.20", features = ["rt"] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
