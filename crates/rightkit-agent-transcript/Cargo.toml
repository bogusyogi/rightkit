[package]
name = "rightkit-agent-transcript"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Deterministic agent transcript normalizer (TranscriptEventV1): Claude Code and Codex discovery, raw adapters, stable identities, source binding and provenance."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_transcript"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
regex = { version = "1" }
rightkit-fs = { version = "0.4.9", features = ["digest"], path = "../rightkit-fs" }
