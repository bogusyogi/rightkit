[package]
name = "rightkit-memory"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent memory: durable memory store, write screening and a typed backend over an external membrane CLI"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_memory"
path = "src/lib.rs"

[features]
agent_host = ["dep:axum", "dep:rightkit-agent-engine-runtime-resources", "dep:rightkit-agent-policy", "dep:rightkit-agent-tools", "dep:tracing"]

[dependencies]
axum = { version = "0.8", optional = true }
rightkit-agent-engine-runtime-resources = { version = "0.1.0", path = "../rightkit-agent-engine-runtime-resources", optional = true }
rightkit-agent-policy = { version = "0.1.0", path = "../rightkit-agent-policy", optional = true }
rightkit-agent-tools = { version = "0.3.1", path = "../rightkit-agent-tools", features = ["coding_tools"], optional = true }
tracing = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", features = ["tokio"] }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
async-trait = "0.1"
tokio-util = "0.7"
tokio = { version = "1", features = ["rt", "time", "macros"] }
