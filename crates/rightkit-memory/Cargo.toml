[package]
name = "rightkit-memory"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent memory: durable memory store, write screening, adaptive retrieval routing and a typed backend over an external membrane CLI"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_memory"
path = "src/lib.rs"

# Test double for the membrane CLI, used by tests/membrane_fake_binary.rs.
[[bin]]
name = "fake-membrane"
path = "src/bin/fake_membrane.rs"
test = false

[features]
agent_host = ["dep:axum", "dep:rightkit-agent-engine-runtime-resources", "dep:rightkit-agent-policy", "dep:rightkit-agent-tools", "dep:rightkit-app-settings", "dep:tracing"]

[dependencies]
axum = { version = "0.8", optional = true }
rightkit-agent-engine-runtime-resources = { version = "0.1.0", path = "../rightkit-agent-engine-runtime-resources", optional = true }
rightkit-agent-policy = { version = "0.1.0", path = "../rightkit-agent-policy", optional = true }
rightkit-agent-tools = { version = "0.3.1", path = "../rightkit-agent-tools", features = ["coding_tools"], optional = true }
rightkit-app-settings = { version = "0.3.1", path = "../rightkit-app-settings", features = ["agent_config"], optional = true }
tracing = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", features = ["tokio"] }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
async-trait = "0.1"
tokio-util = "0.7"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
