[package]
name = "rightkit-memory"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "The RightKit memory engine (Pulse's Cortex): memory tiers, retrieval, planning and review from rightkit-memory-core, the durable SQLite store from rightkit-memory-store."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_memory"
path = "src/lib.rs"

[dependencies]
rightkit-memory-core = { version = "0.1.1", path = "../rightkit-memory-core" }
rightkit-memory-store = { version = "0.1.1", path = "../rightkit-memory-store" }
