# How the PP-OCRv5/PP-OCRv6 conflict actually arose (2026-07-14):
#
# CodeRight fetched PP-OCRv5 from a pinned script (monkt/paddleocr-onnx, detection/v5 + english,
# 436-entry dict). ScrapeRight had NO fetch script at all -- its models were hand-placed, and on
# 2026-07-05 were deliberately upgraded to genuine PP-OCRv6 (official PaddlePaddle HF org). Only
# ScrapeRight's own PACKAGING.md recorded that upgrade; CodeRight never followed. So the two apps
# shipped DIFFERENT WEIGHTS for over a week. Both labels were true, of different files; neither was
# a mislabel.
#
# It went unnoticed because the phase 5 gate hashed shared Rust source (boxes/decode/preprocess)
# and read this file's `status` string, but never hashed the models this file records. The source
# genuinely was identical, so the parity check passed green while the weights differed.
#
# Resolved by taking ScrapeRight's PP-OCRv6 as canonical and migrating CodeRight onto it. Both apps
# now provision through digest-pinned fetch scripts that verify the digest of ALREADY-PRESENT files
# (presence was the trapdoor -- a present-but-wrong model was previously skipped), and the phase 5
# gate hashes the deployed artifacts in both apps (`inspectOcrArtifacts`) so any future divergence
# fails closed.
#
# en_dict.txt is NOT downloadable -- it is derived from the recognizer's inference.yml. It is now
# git-tracked in both apps: a dict that only exists on one laptop is how this drift started.
#
# The stale "PP-OCRv6" prose in both apps' comments and docs was never evidence, and is corrected.

[runtime.windows]
file = "onnxruntime.dll"
# The digest lives in one place: this record of crates/rightkit-media/catalog/native-libraries.json.
catalog_record = "onnxruntime-1.24.4-windows-x64-directml"
