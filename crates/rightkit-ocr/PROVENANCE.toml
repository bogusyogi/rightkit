# How the PP-OCRv5/PP-OCRv6 conflict actually arose (2026-07-14):
#
# CodeRight fetched its models from a pinned script (monkt/paddleocr-onnx, detection/v5 + english).
# ScrapeRight had NO fetch script at all -- its models were hand-placed, and at some point were
# hand-placed with genuine PP-OCRv6 (PP-OCRv6_medium_det + _small_rec, 18,708-entry unified dict,
# official PaddlePaddle HF org). So the two apps shipped DIFFERENT WEIGHTS. Both labels were true,
# of different files; neither was a mislabel.
#
# It went unnoticed because the phase 5 gate hashed shared Rust source (boxes/decode/preprocess)
# and read this file's `status` string, but never hashed the models this file records. The source
# genuinely was identical, so the parity check passed green while the weights differed.
#
# Fixed by: aligning ScrapeRight onto CodeRight's set; giving ScrapeRight a pinned fetch script;
# making BOTH scripts verify the digest of already-present files (presence was the trapdoor -- a
# present-but-wrong model was previously skipped); and making the phase 5 gate hash the deployed
# artifacts in both apps (`inspectOcrArtifacts`) so any future divergence fails closed.
#
# The stale "PP-OCRv6" prose in both apps' comments and docs was never evidence, and is corrected.

[runtime.windows]
file = "onnxruntime.dll"
sha256 = "0a49bb13573807ad309aa9967a46471c07d6495bab5b279d1fad474aefd8ef4b"
