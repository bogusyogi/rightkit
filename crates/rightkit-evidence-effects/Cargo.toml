[package]
name = "rightkit-evidence-effects"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Effect execution with sandboxed child processes and receipts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_effects"
path = "src/lib.rs"

[dependencies]
hex = { version = "0.4.3" }
libc = { version = "1.0.0-alpha.5" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
sha2 = { version = "0.11.1" }
thiserror = { version = "2.0.21" }
rightkit-sandbox = { version = "0.6.2", path = "../rightkit-sandbox" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
