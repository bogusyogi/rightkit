[package]
name = "rightkit-evidence-effects"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Effect execution with sandboxed child processes and receipts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_effects"
path = "src/lib.rs"

[dependencies]
hex = { version = "0.4.3" }
libc = { version = "1.0.0-alpha.5" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
sha2 = { version = "0.11" }
thiserror = { version = "2.0.20" }
rightkit-sandbox = { version = "0.6.3", path = "../rightkit-sandbox" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
