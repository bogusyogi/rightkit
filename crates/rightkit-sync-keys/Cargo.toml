[package]
name = "rightkit-sync-keys"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "End-to-end sync key management for Right Suite apps: account data key, versioned rotation, per-zone key derivation, OS credential storage, and device-approval key transfer (X25519 + short code + AEAD)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["sync", "e2ee", "key-management", "x25519", "xchacha20poly1305"]
categories = ["cryptography"]
# Parked 2026-10-16 (Adrian: own-cloud sync, CloudKit + Google Drive; no service of ours). Kept, not published.
publish = false
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-credentials = { version = "0.2.1", path = "../rightkit-credentials" }
thiserror = "2"
getrandom = "0.3"
zeroize = "1.9"
sha2 = "0.10.9"
hkdf = "0.12"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "none: no thread, task, sleep, timer, listener, watcher or resident static of this crate; every call is synchronous and bounded, key material lives only in values the caller holds and is zeroed on drop, and the OS credential calls run on rightkit-credentials worker threads that end when the OS call returns (reviewed 2026-10-16)"
