[package]
name = "rightkit-dictation-tauri"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation runtime for a desktop shell: recording state machine over the engine sidecar, history sequencing, transcribe watchdog and start-sequence liveness, behind a host trait."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_tauri"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
rightkit-dictation-core = { version = "0.3.0", path = "../rightkit-dictation-core" }
rightkit-dictation-app-runtime = { version = "0.2.0", path = "../rightkit-dictation-app-runtime" }
rightkit-dictation-telemetry = { version = "0.2.0", path = "../rightkit-dictation-telemetry" }
rightkit-dictation-models = { version = "0.2.0", path = "../rightkit-dictation-models" }
rightkit-dictation-command-host = { version = "0.2.0", path = "../rightkit-dictation-command-host" }
rightkit-transcript-library = { version = "0.1.0", path = "../rightkit-transcript-library" }
rightkit-text-polish = { version = "0.1.0", path = "../rightkit-text-polish" }
