[package]
name = "rightkit-dictation-tauri"
version = "0.3.5"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation runtime for a desktop shell: recording state machine over the engine sidecar, history sequencing, transcribe watchdog and start-sequence liveness, behind a host trait."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_tauri"
path = "src/lib.rs"

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2", default-features = false, optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rightkit-fs = { version = "0.5.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-crypto = { version = "0.1.3", path = "../rightkit-crypto" }
rightkit-dictation-core = { version = "0.3.5", path = "../rightkit-dictation-core" }
rightkit-dictation-app-runtime = { version = "0.3.1", path = "../rightkit-dictation-app-runtime" }
rightkit-dictation-telemetry = { version = "0.2.2", path = "../rightkit-dictation-telemetry" }
rightkit-dictation-models = { version = "0.3.0", path = "../rightkit-dictation-models" }
rightkit-dictation-command-host = { version = "0.3.0", path = "../rightkit-dictation-command-host" }
rightkit-transcript-library = { version = "0.1.4", path = "../rightkit-transcript-library" }
rightkit-text-polish = { version = "0.1.0", path = "../rightkit-text-polish" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rightkit-audio = { version = "0.4.0", default-features = false, features = ["capture"], path = "../rightkit-audio" }
rightkit-automation = { version = "0.7.1", path = "../rightkit-automation", features = ["desktop-context"] }

rightkit-hotkeys = { version = "0.1.7", path = "../rightkit-hotkeys" }
