[package]
name = "rightkit-license"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Right Suite license enforcement primitive — offline verification of server-signed Ed25519 entitlement tokens. The Rust (security) half of @rightkit/license."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["license", "ed25519", "offline", "entitlement"]
categories = ["authentication", "cryptography"]
include = ["src/**", "tests/**", "test-vectors/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
ed25519-dalek = "3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.rightkit]
continuous = false
continuous_reason = "offline Ed25519 entitlement-token verification per call; no refresh loop or background task in this crate; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
