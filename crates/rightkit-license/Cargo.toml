[package]
name = "rightkit-license"
version = "0.2.3"
edition = "2021"
rust-version = "1.98.0"
description = "Right Suite license enforcement primitive — offline verification of server-signed Ed25519 entitlement tokens. The Rust (security) half of @rightkit/license."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["license", "ed25519", "offline", "entitlement"]
categories = ["authentication", "cryptography"]
include = ["src/**", "tests/**", "test-vectors/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Entitlement source keyed to the Google subject, backed by the shared entitlement service
# (bogusyogi/rightsites#81). Adds `rightkit-http`; the default build is unchanged.
subject-entitlement = ["dep:rightkit-http"]
# Engine-side gate for app engines run outside their shell (bogusyogi/rightkit#182): maps a
# Google-subject entitlement decision (local cache or service, with offline grace) to an
# Allowed / Grace / Denied verdict, an exit code and a message. Implies `subject-entitlement`.
engine-gate = ["subject-entitlement"]

[dependencies]
ed25519-dalek = "3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rightkit-http = { version = "0.3.1", path = "../rightkit-http", optional = true }

[dev-dependencies]
# Loopback mock server for tests/subject_entitlement.rs (gated on the feature above).
rightkit-http = { version = "0.3.1", path = "../rightkit-http", features = ["testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "offline Ed25519 entitlement-token verification per call; no refresh loop or background task in this crate; resident-static: one empty process-wide Mutex serialises ledger access and holds no data; the file-backed clock store takes an OS file lock for the length of one read-compare-write and keeps nothing resident; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
