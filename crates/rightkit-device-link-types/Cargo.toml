[package]
name = "rightkit-device-link-types"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Record types of the device link: device reference, effect classes, principals, paired-device registry records and the signed device-circle records."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_device_link_types"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
