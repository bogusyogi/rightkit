[package]
name = "rightkit-media-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Named production pipelines on rightkit-media-gen: compose, dubbing with retiming, translation with terminology, fan-out multi-job steps, finishing hand-off and the campaign production stack"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_media_pipeline"
path = "src/lib.rs"

[features]
# HyperFrames motion render (`motion`): loopback project server, managed headless Chrome capture,
# encode through rightkit-motion. Adds rightkit-browser, rightkit-motion (encode, server) and tokio.
motion = ["dep:rightkit-browser", "dep:rightkit-motion", "dep:tokio", "dep:serde"]

[dependencies]
rightkit-media-gen = { version = "0.1.0", path = "../rightkit-media-gen" }
rightkit-local-gen = { version = "0.1.0", path = "../rightkit-local-gen" }
rightkit-approvals = { version = "0.1.0", path = "../rightkit-approvals" }
rightkit-contracts = { version = "0.1.8", path = "../rightkit-contracts" }
serde_json = { version = "1.0", features = ["preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
time = { version = "0.3", features = ["formatting", "macros"] }
rightkit-audio = { version = "0.3.1", default-features = false, path = "../rightkit-audio" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-ffmpeg = { version = "0.2.13", path = "../rightkit-ffmpeg" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }
rightkit-logs = { version = "0.3.7", default-features = false, path = "../rightkit-logs" }
rightkit-models = { version = "0.5.3", path = "../rightkit-models" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
rightkit-browser = { version = "0.3.7", path = "../rightkit-browser", optional = true }
rightkit-motion = { version = "0.2.0", default-features = false, features = ["encode", "server"], path = "../rightkit-motion", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
