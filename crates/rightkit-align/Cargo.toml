[package]
name = "rightkit-align"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Product-neutral script-to-ASR word alignment: pronunciation normalisation, edit-distance alignment with lexical and timing confidence, ambiguity and mismatch rejection, and control-name coverage"
repository = "https://github.com/Orthic-Labs/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_align"
path = "src/lib.rs"

[dependencies]
rightkit-transcript = { path = "../rightkit-transcript" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure computation: script-to-ASR word alignment over caller-provided data; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
