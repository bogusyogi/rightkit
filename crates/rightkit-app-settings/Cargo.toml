[package]
name = "rightkit-app-settings"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "Versioned per-app settings persistence: migrations, typed defaults, atomic writes, corruption recovery, change events."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["settings", "preferences", "migration", "atomic"]
categories = ["config"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
thiserror = "2"
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
# Fault hook around the replace call (debug and test builds only): proves the configured replace
# mode and flags reach the platform call.
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs", "testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: 5 ms file-lock poll bounded by LOCK_WAIT inside one load or save (backend.rs); no thread, task, timer, listener or watcher, the store holds one settings value and its subscriber callbacks (reviewed 2026-10-11)"
