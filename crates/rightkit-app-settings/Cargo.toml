[package]
name = "rightkit-app-settings"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
description = "Versioned per-app settings persistence: migrations, typed defaults, atomic writes, corruption recovery, change events."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["settings", "preferences", "migration", "atomic"]
categories = ["config"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# `SqlSettings`: settings in a SQL table through a borrowed `rusqlite::Connection` or
# `Transaction` (SQLCipher works when the app enables a rightkit-db `sqlcipher*` feature).
sql = ["dep:rightkit-db"]

[dependencies]
rightkit-db = { version = "0.5.0", path = "../rightkit-db", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2"
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
rightkit-db = { version = "0.5.0", path = "../rightkit-db", default-features = false, features = ["bundled"] }
# Fault hook around the replace call (debug and test builds only): proves the configured replace
# mode and flags reach the platform call.
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs", "testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: 5 ms file-lock poll bounded by LOCK_WAIT inside one load or save (backend.rs); no thread, task, timer, listener or watcher, the store holds one settings value and its subscriber callbacks (reviewed 2026-10-11); resident-static: PROCESS_WRITERS in src/backend.rs is a Mutex<()> that holds no data and only serialises writers inside one save (reviewed 2026-10-17)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
