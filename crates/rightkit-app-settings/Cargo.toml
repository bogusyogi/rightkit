[package]
name = "rightkit-app-settings"
version = "0.3.4"
edition = "2021"
rust-version = "1.98.0"
description = "Versioned per-app settings persistence: migrations, typed defaults, atomic writes, corruption recovery, change events."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["settings", "preferences", "migration", "atomic"]
categories = ["config"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# `SqlSettings`: settings in a SQL table through a borrowed `rusqlite::Connection` or
# `Transaction` (SQLCipher works when the app enables a rightkit-db `sqlcipher*` feature).
sql = ["dep:rightkit-db"]
agent_config-host-env = ["agent_config"]
# The `SecretProbe` presence adapter for `rightkit_credentials::Store` (moved from rightkit-credentials `settings-probe`, rightkit#1505).
credentials-probe = ["dep:rightkit-credentials"]
agent_config = ["dep:rightkit-daemon", "dep:rightkit-agent-policy", "dep:toml", "dep:dirs", "rightkit-fs/lock", "rightkit-fs/json", "rightkit-fs/digest", "rightkit-fs/transaction"]

[dependencies]
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials", optional = true }
rightkit-db = { version = "0.5.3", path = "../rightkit-db", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2"
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-daemon = {version = "0.5.1", default-features = false, features = ["local"], path = "../rightkit-daemon", optional = true}
rightkit-agent-policy = {version = "0.1.0", path = "../rightkit-agent-policy", optional = true}
toml = {version = "1.1", optional = true}
dirs = {version = "7", optional = true}

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: 5 ms file-lock poll bounded by LOCK_WAIT inside one load or save (backend.rs); sleep: 50 ms outcome-file poll bounded by the caller's timeout inside one ChangeRequestQueue::wait_outcome call (request.rs), no thread and no background work; no thread, task, timer, listener or watcher, the store holds one settings value and its subscriber callbacks (reviewed 2026-10-11); resident-static: PROCESS_WRITERS in src/backend.rs is a Mutex<()> that holds no data and only serialises writers inside one save (reviewed 2026-10-17)"

# One Cargo workspace and lock per crate (rightkit#1285).
