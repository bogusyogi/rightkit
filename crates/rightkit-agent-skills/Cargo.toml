[package]
name = "rightkit-agent-skills"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent skills and slash-command grammar: skill discovery, manifests, the shared command table and interactive effects"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_skills"
path = "src/lib.rs"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
globset = {version = "0.4"}
regex = {version = "1"}
toml = {version = "1.1"}
url = {version = "2"}

[features]
default = []
