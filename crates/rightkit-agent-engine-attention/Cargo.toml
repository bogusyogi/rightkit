[package]
name = "rightkit-agent-engine-attention"
version = "0.2.2"
edition = "2021"
rust-version = "1.98.0"
description = "Agent attention inbox: unread/needs-input items, snooze, density, quiet hours and deep links as axum routes"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_attention"
path = "src/lib.rs"

[features]
default = []
# The axum routes (`attention_routes`, `AttentionRouterState`). Off by default so a host that wants only the
# inbox, routing and store logic does not pull axum.
server = ["dep:axum"]

[dependencies]
rightkit-fs = { version = ">=0.4.15, <0.6", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-time = { version = "0.1.5", path = "../rightkit-time" }
rightkit-crypto = { version = "0.1.4", path = "../rightkit-crypto" }
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
