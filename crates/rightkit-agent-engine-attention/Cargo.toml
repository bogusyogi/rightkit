[package]
name = "rightkit-agent-engine-attention"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Agent attention inbox: unread/needs-input items, snooze, density, quiet hours and deep links as axum routes"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_attention"
path = "src/lib.rs"

[dependencies]
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs"] }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
