[package]
name = "rightkit-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "One localisation catalog source (a folder of JSON string catalogs, English as the reference) generated to TypeScript, Rust and Swift tables, with a completeness check: missing keys, extra keys, empty strings, placeholder mismatches."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["i18n", "localization", "catalog", "codegen"]
categories = ["internationalization", "command-line-utilities"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_catalog"
path = "src/lib.rs"

[[bin]]
name = "rightkit-catalog"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[package.metadata.rightkit]
continuous = false
continuous_reason = "Build-time catalog reader and code generator; no network, no background work, spawns nothing."

# One Cargo workspace and lock per crate (rightkit#1285).
