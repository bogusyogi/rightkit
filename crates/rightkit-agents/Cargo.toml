[package]
name = "rightkit-agents"
version = "0.2.4"
edition = "2021"
rust-version = "1.98.0"
description = "Supervised vendor agent sessions for Right Suite apps: shared agent event model, Claude Code stream-json and Codex app-server protocol clients, session lifecycle with approvals and tree teardown, recorded fixtures. No SDK, no HTTP, no MCP."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["agent", "claude", "codex", "json-rpc", "stream-json"]
categories = ["development-tools"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
agent_host = ["driver_host", "dep:rightkit-agent-engine-protocol", "dep:rightkit-mcp", "dep:tokio", "dep:tracing"]
default = []
claude = []
codex = []
# Session lifecycle: spawn, event stream, approvals, cancel, tree teardown. Pulls in both protocol clients.
session = ["claude", "codex"]
agent_acp = []
driver_host = ["claude", "codex", "dep:rightkit-crypto", "dep:async-trait", "dep:rightkit-agent-tools", "rightkit-child-process/tokio", "dep:rightkit-agent-config", "dep:rightkit-sandbox", "dep:rightkit-fs", "dep:rightkit-sidecar", "dep:rightkit-time", "dep:thiserror", "dep:tokio", "dep:libc"]

[dependencies]
rightkit-agent-engine-protocol = { version = "0.1.0", path = "../rightkit-agent-engine-protocol", optional = true }
rightkit-mcp = { version = "0.7.2", path = "../rightkit-mcp", optional = true }
tracing = { version = "0.1", optional = true }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-crypto = {version = "0.1.0", path = "../rightkit-crypto", optional = true}
async-trait = {version = "0.1", optional = true}
rightkit-agent-tools = {version = "0.3.1", path = "../rightkit-agent-tools", features = ["coding_tools"], optional = true}
rightkit-agent-config = { version = "0.1.0", path = "../rightkit-agent-config", features = ["host-env"], optional = true }
rightkit-sandbox = {version = "0.6.2", path = "../rightkit-sandbox", features = ["execution"], optional = true}
rightkit-fs = {version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs", optional = true}
rightkit-sidecar = {version = "0.3.0", path = "../rightkit-sidecar", optional = true}
rightkit-time = {version = "0.1.1", path = "../rightkit-time", optional = true}
thiserror = {version = "2", optional = true}
tokio = {version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time", "net"], optional = true}

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "Session::spawn"
file = "src/session.rs"
holds = ["child", "thread", "memory"]
scale = "one vendor agent CLI child tree (owned: killed with the session) plus up to two reader threads (stdout reader, stderr reader) blocked on the child pipes and the pending-request tables; fixed per session, independent of conversation length"
release = "Session::shutdown, or Drop of the Session (OwnedChild tears down the tree and the reader threads end when the pipes close)"

[[package.metadata.rightkit.resources]]
api = "detect"
file = "src/discovery.rs"
holds = ["memory"]
scale = "two process-wide OnceLock slots (one per vendor CLI: Claude, Codex), each one VendorCliStatus (installed flag, path, version line, sign-in flag) filled once by the first detect call for that vendor; fixed size, independent of conversation length or data"
release = "process exit (the statics have no release function; the cached snapshot is never re-probed)"
static_note = "fn detect's two OnceLock statics hold a bounded value: one snapshot per vendor, two slots in total, no collection and no data-scale growth. Nothing long-lived is spawned here: probe runs bounded child processes via rightkit_child_process::run and waits for each before returning. The cache has no per-caller hold, so it lasts for the process; it is reachable only through detect and list_models."

# One Cargo workspace and lock per crate (rightkit#1285).
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
libc = {version = "0.2", optional = true}
