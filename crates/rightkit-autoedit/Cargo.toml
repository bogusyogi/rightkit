[package]
name = "rightkit-autoedit"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Automatic editing for Right Suite video apps: transcript-driven cut engine (retakes, fillers, silences), editorial engine, named cut variants, and scoped editing rules with their resolution matrix."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_autoedit"
path = "src/lib.rs"

[dependencies]
blake3 = "1.8"
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline" }
rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project" }
rightkit-ffmpeg = { version = "0.2.10", default-features = false, features = ["native"], path = "../rightkit-ffmpeg" }
rightkit-fs = { version = "0.4.7", default-features = false, features = ["fs", "blake3"], path = "../rightkit-fs" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
rightkit-ffmpeg = { version = "0.2.10", default-features = false, features = ["native", "dev-overrides"], path = "../rightkit-ffmpeg" }
tempfile = "3"
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
