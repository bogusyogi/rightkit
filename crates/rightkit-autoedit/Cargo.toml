[package]
name = "rightkit-autoedit"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Automatic editing for Right Suite video apps: transcript-driven cut engine (retakes, fillers, silences), editorial engine, named cut variants, and scoped editing rules with their resolution matrix."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_autoedit"
path = "src/lib.rs"

[features]
default = []
# Engine command modules (`cmd`): autoedit, autonomy, rules, style and mic methods over JSON params, for an engine
# built on rightkit-engine-host. Adds rightkit-engine-host (with its `project-cmd` layer) and chrono.
engine-commands = ["dep:rightkit-engine-host", "dep:chrono", "rightkit-fs/lock"]

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"], optional = true }
rightkit-engine-host = { version = "0.1.1", path = "../rightkit-engine-host", features = ["project-cmd"], optional = true }
blake3 = "1.8"
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline" }
rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project" }
rightkit-ffmpeg = { version = "0.2.16", default-features = false, features = ["native"], path = "../rightkit-ffmpeg" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "blake3"], path = "../rightkit-fs" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# rightkit-typeset's citationberg 0.7.0 pins quick-xml 0.38.4 (RUSTSEC-2026-0194, RUSTSEC-2026-0195); a [patch] does not reach
# dependents, so every workspace that links rightkit-typeset carries the same vendored fix (vendor/citationberg/VENDORED.md).
[patch.crates-io]
citationberg = { path = "../../vendor/citationberg" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
