[package]
name = "rightkit-mail-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Mail store over SQLCipher: encrypted open with key candidates and lifetime lock, versioned schema and migration gate with backup, accounts, labels, threads, search adapter, outbox and pending queues, sync apply and the local semantic index."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_mail_store"
path = "src/lib.rs"

[dependencies]
rightkit-db = { version = "0.5.4", default-features = false, features = ["bundled", "statement-cache"], path = "../rightkit-db" }
rightkit-search = { version = "0.4.1", default-features = false, path = "../rightkit-search" }
rightkit-mail = { version = "0.1.1", path = "../rightkit-mail" }
rightkit-google-apis = { version = "0.1.0", path = "../rightkit-google-apis" }
rightkit-cache = { version = "0.2.3", path = "../rightkit-cache" }
rightkit-embed = { version = "0.6.2", path = "../rightkit-embed" }
rightkit-models = { version = "0.5.3", path = "../rightkit-models" }
rightkit-onnx = { version = "0.2.9", default-features = false, path = "../rightkit-onnx" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "app-dirs", "digest", "lock"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
rightkit-job-queue = { version = "0.5.1", features = ["store"], path = "../rightkit-job-queue" }
rightkit-app-settings = { version = "0.3.1", default-features = false, features = ["sql"], path = "../rightkit-app-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sqlite-vec = { version = "0.1" }
zerocopy = { version = "0.8" }

[dev-dependencies]
ctor = { version = "1.0" }
rightkit-models = { version = "0.5.3", features = ["test-mode"], path = "../rightkit-models" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
