[package]
name = "rightkit-app-update"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Native half of Right Suite app updates that the Tauri shell does not carry: the failed-boot sentinel and BootStage probation after an update, and an allowlisted, redacted fetch bridge over rightkit-http."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["updater", "probation", "fetch", "tauri"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-http = { version = "0.3.11", path = "../rightkit-http", default-features = false }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[package.metadata.rightkit]
continuous = false
continuous_reason = "synchronous library: a sentinel file read or write per app start and per stage report, and one blocking rightkit-http request per fetch call (bounded by the request timeout); spawns no thread, timer, listener or watcher, holds no static, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
