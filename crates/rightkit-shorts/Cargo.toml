[package]
name = "rightkit-shorts"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shorts finder for Right Suite video apps: candidate moments from a long video's transcript, scored and ranked (heuristics plus an optional BYOK LLM pass), with hooks, captions and edit plans per short."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_shorts"
path = "src/lib.rs"

[dependencies]
rightkit-captions = { version = "0.1.0", path = "../rightkit-captions" }
rightkit-autoedit = { version = "0.1.0", path = "../rightkit-autoedit" }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
rightkit-llm = { version = "0.4.0", path = "../rightkit-llm" }
rightkit-credentials = { version = "0.4.2", path = "../rightkit-credentials" }

[dev-dependencies]
rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project" }
tempfile = { version = "3" }

# rightkit-typeset's citationberg 0.7.0 pins quick-xml 0.38.4 (RUSTSEC-2026-0194, RUSTSEC-2026-0195); a [patch] does not reach
# dependents, so every workspace that links rightkit-typeset carries the same vendored fix (vendor/citationberg/VENDORED.md).
[patch.crates-io]
citationberg = { path = "../../vendor/citationberg" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
