[package]
name = "rightkit-shorts"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Shorts finder for Right Suite video apps: candidate moments from a long video's transcript, scored and ranked (heuristics plus an optional BYOK LLM pass), with hooks, captions and edit plans per short."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_shorts"
path = "src/lib.rs"

[features]
default = []
# Engine command handlers (`cmd`): `moments.ocr_index` and `moments.search`. Adds OCR, text search, ffmpeg and the engine host.
engine-commands = ["dep:rightkit-engine-host", "dep:chrono", "dep:rightkit-ocr", "dep:rightkit-search", "dep:rightkit-video-project", "dep:rightkit-ffmpeg", "dep:rightkit-fs"]

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"], optional = true }
rightkit-engine-host = { version = "0.1.1", path = "../rightkit-engine-host", features = ["project-cmd"], optional = true }
rightkit-ocr = { version = "0.2.3", path = "../rightkit-ocr", optional = true }
rightkit-search = { version = "0.4.1", path = "../rightkit-search", optional = true }
rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project", optional = true }
rightkit-ffmpeg = { version = "0.3.0", path = "../rightkit-ffmpeg", default-features = false, optional = true }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs", "digest"], optional = true }
rightkit-captions = { version = "0.1.0", path = "../rightkit-captions" }
rightkit-autoedit = { version = "0.1.0", path = "../rightkit-autoedit" }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
rightkit-llm = { version = "0.3.2", path = "../rightkit-llm" }
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials" }

# rightkit-typeset's citationberg 0.7.0 pins quick-xml 0.38.4 (RUSTSEC-2026-0194, RUSTSEC-2026-0195); a [patch] does not reach
# dependents, so every workspace that links rightkit-typeset carries the same vendored fix (vendor/citationberg/VENDORED.md).
