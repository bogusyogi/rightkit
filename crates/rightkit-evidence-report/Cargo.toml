[package]
name = "rightkit-evidence-report"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Evidence reports: findings report rendering to JSON, SARIF, Markdown and HTML"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_report"
path = "src/lib.rs"

[dependencies]
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
