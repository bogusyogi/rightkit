[package]
name = "rightkit-daemon"
version = "0.5.3"
edition = "2021"
rust-version = "1.98.0"
description = "One discovery/auth convention for Right Suite local services: service.json, ranking and takeover, current-user-only Unix socket / named pipe, per-app request allowlist."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "schemas/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs", "transaction"] }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
# Private per-run child service (`private`): constant-time secret check and the secret itself.
subtle = "2.6"
getrandom = "0.4"

# `link` (device client) and `remote` (daemon host) dependencies, all optional. Copied from the
# retired standalone daemon crate (M7 merge). `link` carries no tokio, axum or hyper.
base64 = { version = "0.23", optional = true }
blake3 = { version = "1", optional = true }
form_urlencoded = { version = "1", optional = true }
ring = { version = "0.17", optional = true }
rightkit-identity = { version = "0.1.1", path = "../rightkit-identity", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# `remote` only.
rightkit-contracts = { version = "0.1.8", path = "../rightkit-contracts", default-features = false, optional = true }
rightkit-oauth = { version = "0.10.0", path = "../rightkit-oauth", default-features = false, features = ["server"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-graceful"], optional = true }

# Windows named pipes with a current-user-only DACL. cfg(windows) only: this
# backend compiles on the Windows host (see API.md for the exact command).
rightkit-agent-engine-protocol = {version = "0.1.0", path = "../rightkit-agent-engine-protocol", optional = true}
async-trait = {version = "0.1", optional = true}
# Peer code-signature check (`peer_signature`, rightkit#1319): Security.framework on macOS,
# WinVerifyTrust on Windows.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
core-foundation = { version = "0.10" }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Threading"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
default = ["local"]
# The same-user local transport (service.json, Unix socket or named pipe, framed JSON). Today this
# marker feature compiles nothing extra: the local modules are always built.
local = []
# Blocking device client (enrol, signed requests, resumable upload) pinned to caller-supplied roots.
# No tokio, axum or hyper. Enables `remote::client` and `remote::signing`.
link = ["dep:base64", "dep:blake3", "dep:ring", "dep:rightkit-identity", "dep:rustls"]
# `rk-relay/1`: the blind relay and mailbox protocol (frames, relay state machine, device session).
# Transport-free; needs only what `link` already carries.
relay = ["link"]
# Daemon host: HTTPS listener, device enrolment and signed requests, OAuth callback and signed
# webhook route classes, durable state and lifecycle events (daemon-api v1). Implies `link`.
remote = [
  "link",
  "dep:axum",
  "dep:form_urlencoded",
  "dep:hyper",
  "dep:hyper-util",
  "dep:rightkit-contracts",
  "dep:rightkit-oauth",
  "dep:tokio",
  "dep:tokio-rustls",
]
# Loopback-only HTTP host with a bearer token, CodeRight's current wire (PK06-5, ruling D5): bounded
# parser, 127.0.0.1 bind, Host/Origin/CSRF policy, bearer and capability verification inside the
# owner, discovery record and client-presence routes. std threads only: no tokio, axum, hyper or
# rustls, no device state. A separate feature from `remote`: it neither enables `remote` nor is
# enabled by it. `releaseSwitches.remoteHost` stays false for
# desktop apps and `@rightkit/release` keeps refusing a desktop build with `remote`.
remote-loopback = []
agent_daemon_core = ["dep:axum", "dep:rightkit-agent-engine-protocol"]
agent_daemon_runtime = ["dep:async-trait", "dep:tokio", "tokio/rt"]

[[bench]]
name = "budget"
harness = false

[[bench]]
name = "remote_budget"
path = "benches/remote_budget.rs"
harness = false
required-features = ["remote"]

[dev-dependencies]
tempfile = "3"
rightkit-contracts = { version = "0.1.8", path = "../rightkit-contracts", features = ["schema"] }
