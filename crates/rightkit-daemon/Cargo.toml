[package]
name = "rightkit-daemon"
version = "0.7.0"
edition = "2021"
rust-version = "1.98.0"
description = "One discovery/auth convention for Right Suite local services: service.json, ranking and takeover, current-user-only Unix socket / named pipe, per-app request allowlist."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs", "transaction"] }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
# Private per-run child service (`private`): constant-time secret check and the secret itself.
subtle = "2.6"
getrandom = "0.4"

# Peer code-signature check (`peer_signature`, rightkit#1319): Security.framework on macOS,
# WinVerifyTrust on Windows.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
core-foundation = { version = "0.10" }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Threading"] }
# Windows named pipes with a current-user-only DACL. cfg(windows) only: this
# backend compiles on the Windows host (see API.md for the exact command).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
default = ["local"]
# The same-user local transport (service.json, Unix socket or named pipe, framed JSON). Today this
# marker feature compiles nothing extra: the local modules are always built.
local = []
# Loopback-only HTTP host with a bearer token, CodeRight's current wire (PK06-5, ruling D5): bounded
# parser, 127.0.0.1 bind, Host/Origin/CSRF policy, bearer and capability verification inside the
# owner, discovery record and client-presence routes. std threads only: no tokio, axum, hyper or
# rustls, no device state. The remote HTTPS host, the device link client and the relay (the
# `remote`, `link` and `relay` features until 0.7.0) are the `rightkit-daemon-remote` crate.
remote-loopback = []

[[bench]]
name = "budget"
harness = false

[dev-dependencies]
tempfile = "3"
