[package]
name = "rightkit-oauth"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "Shared OAuth 2.0 sign-in for Right Suite apps: loopback PKCE, RFC 8628 device flow, provider presets, and stored, refreshing credentials."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["oauth", "pkce", "loopback"]
categories = ["authentication"]
include = ["src/**", "tests/**", "README.md", "API.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["secrets", "system-sources"]
# Stored, refreshing credentials in the OS credential store.
secrets = ["dep:rightkit-secrets"]
# Fall back to sign-ins the GitHub CLI / Git credential helper already hold.
system-sources = ["dep:rightkit-process"]

[dependencies]
rightkit-http = { path = "../rightkit-http", version = "0.1.0" }
rightkit-secrets = { path = "../rightkit-secrets", version = "0.1.0", optional = true }
rightkit-process = { path = "../rightkit-process", version = "0.3.0", optional = true }
getrandom = "0.3"
serde_json = "1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
rightkit-http = { path = "../rightkit-http", version = "0.1.0", features = ["testing"] }
tempfile = "3"
