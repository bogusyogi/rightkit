[package]
name = "rightkit-oauth"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Loopback OAuth 2.0 authorization-code client with PKCE for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["oauth", "pkce", "loopback"]
categories = ["authentication"]
include = ["src/**", "tests/**", "README.md", "API.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-http = { path = "../rightkit-http" }
getrandom = "0.3"
serde_json = "=1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
rightkit-http = { path = "../rightkit-http", features = ["testing"] }
