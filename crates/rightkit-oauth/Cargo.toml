[package]
name = "rightkit-oauth"
version = "0.3.1"
edition = "2021"
rust-version = "1.98.0"
description = "Shared OAuth 2.0 sign-in for Right Suite apps: loopback PKCE, RFC 8628 device flow, provider presets, encrypted daemon persistence, and stored, refreshing credentials."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["oauth", "pkce", "loopback"]
categories = ["authentication"]
include = ["src/**", "tests/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["secrets", "system-sources"]
# Stored, refreshing credentials in the OS credential store.
secrets = ["dep:rightkit-secrets"]
# Fall back to sign-ins the GitHub CLI / Git credential helper already hold.
system-sources = ["dep:rightkit-process"]

# Framework-agnostic daemon flow plus encrypted file persistence (no desktop dependencies).
server = ["dep:ring", "dep:url", "dep:zeroize", "dep:serde", "dep:libc"]
# Axum route example; no HTTP listener is included in the library.
server-example = ["server", "dep:axum", "dep:tokio"]

[[example]]
name = "server_axum"
required-features = ["server-example"]

[[test]]
name = "signin"
required-features = ["secrets"]

[[test]]
name = "system_sources"
required-features = ["system-sources"]

[dependencies]
rightkit-http = { path = "../rightkit-http", version = "0.2.0" }
rightkit-secrets = { path = "../rightkit-secrets", version = "0.1.0", optional = true }
rightkit-process = { path = "../rightkit-process", version = "0.3.0", optional = true }
getrandom = "0.3"
serde_json = "1.0.150"
sha2 = "0.10.9"

ring = { version = "0.17", optional = true }
url = { version = "2.5", optional = true }
zeroize = { version = "1.8", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }

[target.'cfg(unix)'.dependencies]
# Sealed token store: euid and O_NOFOLLOW opens. Only the `server` feature enables it.
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Independent reference for the in-crate base64 encoders.
base64 = "0.22"
rightkit-http = { path = "../rightkit-http", version = "0.2.0", features = ["testing"] }
tempfile = "3"
