[package]
name = "rightkit-ownership"
version = "0.3.1"
edition = "2021"
rust-version = "1.98.0"
description = "RightKit ownership scanner, verdict and admission: the single Rust implementation the RustRight broker links."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
publish = true
include = ["src/**", "tests/**", "CHANGELOG.md", "README.md", "rightkit-ownership.json", "catalog/**"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# rsa 0.9 is built on digest 0.10, so its hash type must be sha2 0.10; used only for RSA verification.
sha2-rsa = { package = "sha2", version = "0.10", features = ["oid"] }
hex = "0.4"
url = "2"
sha1 = "0.11"
fancy-regex = "0.19"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
base64 = "0.23"
spki = { version = "0.8", features = ["pem", "std"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: per-call stdin writer and stdout and stderr reader threads for one git or scanner child (gitio.rs, runner.rs), ended at pipe EOF or when the child is killed at the deadline; sleep: 2 ms try_wait and POLL_INTERVAL scanner poll bounded by the call timeout; the admission verdict cache is capped at CACHE_LIMIT 128; no listener, timer or watcher (reviewed 2026-10-11)"
