[package]
name = "rightkit-ownership"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "RightKit ownership scanner, verdict and admission: the single Rust implementation the RustRight broker links."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
publish = true
include = ["src/**", "tests/**", "README.md", "rightkit-ownership.json", "catalog/**"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
sha1 = "0.10"
fancy-regex = "0.19"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
base64 = "0.22"
spki = { version = "0.7", features = ["pem", "std"] }

[dev-dependencies]
tempfile = "3"
