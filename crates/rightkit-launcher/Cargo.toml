[package]
name = "rightkit-launcher"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
description = "Portable command launcher core: calculator and unit conversion that never hand typed text to an evaluator, user items and snippets, word lookup, currency rates, notes, custom commands and the file search."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_launcher"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0" }
serde_json = { version = "1.0" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.3", path = "../rightkit-time" }

[target.'cfg(windows)'.dependencies]
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
