[package]
name = "rightkit-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Command launcher logic: arithmetic calculator and unit conversion parsers that never hand typed text to an evaluator."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
qa-views = []

[lib]
name = "rightkit_launcher"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0" }
serde_json = { version = "1.0" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.3", path = "../rightkit-time" }

[target.'cfg(windows)'.dependencies]
rightkit-hotkeys = { version = "0.1.2", path = "../rightkit-hotkeys" }
rightkit-overlay = { version = "0.2.0", path = "../rightkit-overlay" }
rightkit-win-ui = { version = "0.1.0", path = "../rightkit-win-ui" }
rightkit-clipboard-history = { version = "0.1.0", path = "../rightkit-clipboard-history" }
rightkit-automation = { version = "0.6.4", path = "../rightkit-automation" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
