[package]
name = "rightkit-spend"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Spend reservation, allowance and compare-and-swap ledger on SQLite: integer micro-units, idempotent reserve, atomic multi-cap reserve, carry-over, budgets, reconciliation, cap audit."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["spend", "budget", "ledger", "sqlite"]
categories = ["database"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-db = { version = "0.5.0", path = "../rightkit-db", default-features = false }
thiserror = "2"

[dev-dependencies]
rightkit-db = { version = "0.5.0", path = "../rightkit-db", default-features = false, features = ["bundled"] }
tempfile = "3"

[package.metadata.rightkit]
continuous = false
continuous_reason = "SQLite spend ledger called per reservation; no network, no background work, spawns no continuous work, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
