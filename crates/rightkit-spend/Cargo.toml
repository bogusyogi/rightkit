[package]
name = "rightkit-spend"
version = "0.2.3"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Spend reservation, allowance and compare-and-swap ledger on SQLite: integer micro-units, idempotent reserve, atomic multi-cap reserve, carry-over, budgets, reconciliation, cap audit."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["spend", "budget", "ledger", "sqlite"]
categories = ["database"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# `SealKey::from_keychain`: the approved-budget seal key held in the OS credential store.
keychain = ["dep:rightkit-credentials"]

[dependencies]
rightkit-db = { version = "0.5.3", path = "../rightkit-db", default-features = false }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials", optional = true }
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
# The library leaves the SQLite backend to the application (`default-features = false` above). The test build links one itself, so
# the crate's test build links on a host with no system SQLite (Windows: `LNK1181 sqlite3.lib`) and runs the same bundled version
# everywhere. Dev-dependencies do not reach the published library's features.
rightkit-db = { version = "0.5.3", path = "../rightkit-db", features = ["bundled"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "SQLite spend ledger called per reservation; no network, no background work, spawns no continuous work, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
