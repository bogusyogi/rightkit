[package]
name = "rightkit-channel-memory"
version = "0.2.2"
edition = "2021"
rust-version = "1.98.0"
description = "Channel memory for the content pipeline: the channel-memory.v1 schema with serde types, validation, version gate, proof citation rules, and scope checks for PostRight P3 and GenRight G7."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["json-schema", "memory", "validation", "content-pipeline"]
categories = ["data-structures", "development-tools"]
include = ["src/**", "schemas/**", "docs/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Same validator version as rightkit-contracts, so the workspace lock resolves one copy.
jsonschema = { version = "0.60", default-features = false }

[package.metadata.rightkit]
continuous = false
continuous_reason = "schema types and validation: serde types, JSON Schema validators initialised once, per-call checks; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs); resident-static: VALIDATOR, PROOF_RECORD and SCOPE_RECORD in src/schema.rs are OnceLocks of compiled JSON Schema validators, each built once on first use and fixed size (reviewed 2026-10-17)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
