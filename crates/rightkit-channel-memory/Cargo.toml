[package]
name = "rightkit-channel-memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Channel memory for the content pipeline: the channel-memory.v1 schema with serde types, validation, version gate, proof citation rules, and scope checks for PostRight P3 and GenRight G7."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["json-schema", "memory", "validation", "content-pipeline"]
categories = ["data-structures", "development-tools"]
include = ["src/**", "schemas/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Same validator version as rightkit-contracts, so the workspace lock resolves one copy.
jsonschema = { version = "0.58.6", default-features = false }

[package.metadata.rightkit]
continuous = false
continuous_reason = "schema types and validation: serde types, JSON Schema validators initialised once, per-call checks; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
