[package]
name = "rightkit-agent-engine-api-platform"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine platform HTTP API types"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_api_platform"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
