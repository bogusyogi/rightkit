[package]
name = "rightkit-contracts"
version = "0.1.5"
edition = "2021"
rust-version = "1.98.0"
description = "Versioned content-pipeline contracts for the Right Suite: content brief, delivery envelope, record session and event, demo plan and daemon API. JSON Schema validation, serde types, and major-version negotiation."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["json-schema", "contracts", "validation", "content-pipeline"]
categories = ["data-structures", "development-tools"]
include = ["src/**", "schemas/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rightkit-contracts"
path = "src/main.rs"
required-features = ["schema"]

[features]
default = ["schema"]
# JSON Schema validation (`validate`, `validate_str`, `parse`, `check_typed`, `fixtures`), the
# semantic cross-field rules, the `rightkit-contracts` CLI and the `jsonschema` dependency. Without
# it the typed structs in `types`, `Contract`, `ContractError` and version negotiation remain.
schema = ["dep:jsonschema"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Draft 2020-12 validation. Default features are off: the schemas are embedded
# and reference only themselves, so the crate never resolves a remote URI or
# pulls the HTTP or TLS stack.
jsonschema = { version = "0.58.6", default-features = false, optional = true }

[package.metadata.rightkit]
continuous = false
continuous_reason = "versioned content-pipeline contracts: serde types and JSON Schema validators initialised once, per-call checks; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
