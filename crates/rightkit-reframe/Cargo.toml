[package]
name = "rightkit-reframe"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Tracked 9:16 reframe for Right Suite video apps: ONNX face detection (YuNet; CoreML, DirectML or CPU), subject tracking, a smoothed crop path, and approval-gated crop plans."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_reframe"
path = "src/lib.rs"

[features]
test-mode = ["rightkit-ffmpeg/dev-overrides"]

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
rightkit-models = { version = "0.6.0", path = "../rightkit-models" }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
rightkit-ffmpeg = { version = "0.3.0", default-features = false, features = ["native"], path = "../rightkit-ffmpeg" }
rightkit-fs = { version = "0.4.7", default-features = false, features = ["fs", "blake3"], path = "../rightkit-fs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
rightkit-onnx = { version = "0.2.7", path = "../rightkit-onnx" }

[dev-dependencies]
rightkit-ffmpeg = { version = "0.3.0", default-features = false, features = ["dev-overrides"], path = "../rightkit-ffmpeg" }
sha2 = { version = "0.10" }
tempfile = { version = "3" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
