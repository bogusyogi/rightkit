[package]
name = "rightkit-reframe"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Tracked 9:16 reframe for Right Suite video apps: ONNX face detection (YuNet; CoreML, DirectML or CPU), subject tracking, a smoothed crop path, and approval-gated crop plans."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_reframe"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
rightkit-models = { version = "0.7.0", path = "../rightkit-models" }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
rightkit-ffmpeg = { version = "0.3.0", default-features = false, features = ["native"], path = "../rightkit-ffmpeg" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "blake3"], path = "../rightkit-fs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
rightkit-onnx = { version = "0.2.9", path = "../rightkit-onnx" }
