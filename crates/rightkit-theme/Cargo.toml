[package]
name = "rightkit-theme"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Resolved theme tokens for non-web UIs: the @rightkit/theme brand resolver (derived dark accent, WCAG contrast repair) in Rust, emitting per-mode W3C design-token JSON."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["theme", "design-tokens", "color", "contrast"]
categories = ["command-line-utilities", "graphics"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_theme"
path = "src/lib.rs"

[[bin]]
name = "rightkit-theme"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.rightkit]
continuous = false
continuous_reason = "Pure colour arithmetic and JSON emission, run once per build or app start; no network, no background work, spawns nothing."

# One Cargo workspace and lock per crate (rightkit#1285).
