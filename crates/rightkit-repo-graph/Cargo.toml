[package]
name = "rightkit-repo-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Repository skeletonization: compact structural outlines of source files for agent context"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_repo_graph"
path = "src/lib.rs"

[dependencies]
tree-sitter = {version = "0.27"}
tree-sitter-rust = {version = "0.24"}
tree-sitter-python = {version = "0.25"}
tree-sitter-javascript = {version = "0.25.0"}
tree-sitter-typescript = {version = "0.23"}

[features]
default = []

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
