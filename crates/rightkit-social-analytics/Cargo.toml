[package]
name = "rightkit-social-analytics"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Store-free social campaign analytics pieces: tracked short links with public-https destination checks, UTM tagging, deterministic link ids and redirect-route rules."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_social_analytics"
path = "src/lib.rs"

[features]
default = []
# Engine command handlers (`cmd`): retention feedback import, listing, proposals and apply, over a video project.
engine-commands = ["dep:rightkit-engine-host", "dep:rightkit-video-project", "dep:rightkit-timeline", "dep:rightkit-transcript", "dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }
rightkit-engine-host = { version = "0.1.1", path = "../rightkit-engine-host", features = ["project-cmd"], optional = true }
rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project", optional = true }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline", optional = true }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript", optional = true }
serde = { version = "1", features = ["derive"] }
rightkit-http = { version = "0.3.9", path = "../rightkit-http" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["digest"], path = "../rightkit-fs" }

# Citationberg is pulled by rightkit-typeset through rightkit-captions (video-project); see the vendored fix.
[patch.crates-io]
citationberg = { path = "../../vendor/citationberg" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
