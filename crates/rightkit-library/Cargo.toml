[package]
name = "rightkit-library"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Local artifact library: SQLite-backed history/search index (files stay the source of truth) and a deterministic non-LLM enrichment pass (keywords, links, tags, segmentation)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_library"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
regex = { version = "1.13.1" }
rightkit-db = { version = "0.5.3", features = ["bundled", "statement-cache"], path = "../rightkit-db" }
rightkit-media-fetch = { version = "0.1.0", path = "../rightkit-media-fetch" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-search = { version = "0.4.1", path = "../rightkit-search" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
tracing = { version = "0.1.44" }
rightkit-social-publish = { version = "0.1.1", path = "../rightkit-social-publish" }
rightkit-content-proof = { version = "0.1.1", path = "../rightkit-content-proof" }
serde_json = { version = "1.0.154" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
