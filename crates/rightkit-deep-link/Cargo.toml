[package]
name = "rightkit-deep-link"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Deep-link queue without Tauri: scheme validation, argv extraction and a bounded queue that holds links until the app is ready to take them."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["deep-link", "url-scheme"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_deep_link"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
