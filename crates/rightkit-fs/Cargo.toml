[package]
name = "rightkit-fs"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Safe state directories, atomic writes, cross-process locks, owner-only files, and stable file identity for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["filesystem", "atomic-write", "file-lock", "symlink", "permissions"]
categories = ["filesystem"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "rightkit-clonefile"
path = "src/bin/rightkit-clonefile.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "=0.30.1", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
