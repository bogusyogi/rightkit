[package]
name = "rightkit-fs"
version = "0.5.2"
edition = "2021"
rust-version = "1.98.0"
description = "Safe state directories, atomic writes, cross-process locks, owner-only files, and stable file identity for applications."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["filesystem", "atomic-write", "file-lock", "symlink", "permissions"]
categories = ["filesystem"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "rightkit-clonefile"
path = "src/bin/rightkit-clonefile.rs"
required-features = ["json"]

[[bin]]
name = "rightkit-swap"
path = "src/bin/rightkit-swap.rs"
required-features = ["fs"]

[features]
default = []
# Atomic writes, owner-only files, StateDir, netfs, clonefile, and the error type. Pulls
# libc (unix) and thiserror. `db` uses this layer and no more.
fs = ["dep:libc", "dep:thiserror", "dep:zeroize"]
# Cross-process locks (POSIX record locks via libc on unix) on top of `fs`. Also names the
# `write_locks` module: `KeyedWriteLocks`, in-process write locks keyed by destination with an
# optional cross-process lock file.
lock = ["fs"]
# Crash-recoverable multi-file publication (`transaction` module): `FileTransaction::prepare`,
# `PreparedTransaction::commit` and `recover_transactions`, with a journal under the root. Builds
# on `lock` (the operation lock) and adds no dependency.
transaction = ["lock"]
# Owner records for locks, the identity ledger, and the clonefile diagnostics binary. The
# identity ledger uses locks, so `json` implies `lock`.
json = ["lock", "dep:serde", "dep:serde_json"]
# `digest` module: streaming and in-memory SHA-256, lowercase hex. No other dependency.
digest = ["dep:sha2"]
# BLAKE3 hashing (independent of SHA-256); verified copy also needs `fs`.
blake3 = ["dep:blake3"]
# Names the `zip` module for consumers that ask for it (`write_zip`, `read_zip`). The module is
# compiled without it (std only, since `StoredZipWriter`), so this adds no code and no dependency.
zip = []
# `app_dirs` module: one per-user data/local/cache/home resolver with a dev namespace. Pulls thiserror (through `fs`) and nothing else.
app-dirs = ["fs"]
# `toolchain_lease` module: digest-bound immutable toolchain tree leases (rightkit#838). Uses the digest and json layers.
toolchain-lease = ["fs", "digest", "json"]

[dependencies]
blake3 = { version = "1.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
thiserror = { version = "2", optional = true }
zeroize = { version = "1.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[package.metadata.rightkit]
continuous = "held-resource"
[[package.metadata.rightkit.resources]]
api = "OrderedWriteQueue"
file = "src/ordered_write.rs"
holds = ["memory"]
scale = "One cancellation marker per dropped ticket waiting behind an unfinished earlier turn."
release = "Turn advancement or queue Drop."

[[package.metadata.rightkit.resources]]
api = "publish_file_with"
file = "src/atomic.rs"
holds = ["memory"]
scale = "One caller-owned atomic publish operation and a finite caller-configured number of retry delays."
release = "Publish call return."

[[package.metadata.rightkit.resources]]
api = "FileLock"
file = "src/lock.rs"
holds = ["memory"]
scale = "One record per active POSIX file identity. A raced alias may add one retained descriptor per attempt until the last holder drops. Lock acquisition polls on the calling thread up to LockOptions.timeout."
release = "Last matching FileLock Drop removes the entry and releases its descriptors."
static_note = "The process registry has entries only for active locks; no idle worker or timer."

[[package.metadata.rightkit.resources]]
api = "scan_file_with_timeout"
file = "src/malware_scan.rs"
holds = ["child", "memory"]
scale = "At most one Windows scanner child per call, polled every 50 ms. A finite deadline is checked for overflow before spawn; an unrepresentable deadline returns Unavailable without launching a child. None waits for child exit."
release = "Child exit or a failed or timed-out wait kills and reaps the child."

[[package.metadata.rightkit.resources]]
api = "ensure_private_dir"
file = "src/private.rs"
holds = ["memory"]
scale = "One caller-owned ACL operation with MAX_OPEN_TRIES attempts on a Windows sharing violation."
release = "ACL call return."

[[package.metadata.rightkit.resources]]
api = "PrivateDirCacheLease"
file = "src/private_cached.rs"
holds = ["memory"]
scale = "Acquire and Clone share at most 513 directory identities per shared cache; only held PrivateDirCacheLease values enable new cache calls, and in-flight helpers may briefly retain storage; reuse lasts at most 300 seconds and checks current identity. Without a lease, ACL checks are uncached."
release = "Last lease Drop, after in-flight helpers return, drops the map and its entries. forget_private_dir removes one entry; insertion over the limit clears entries."
static_note = "One process singleton holds only a mutex-protected Weak slot, never a strong cache owner. Serialized acquire/upgrade shares a live cache or creates an empty one; no background task or timer."

[[package.metadata.rightkit.resources]]
api = "FileTransaction"
file = "src/transaction.rs"
holds = ["memory"]
scale = "One operation lock held during transaction work and bounded delete retries for each file, with delay capped at one second."
release = "Commit or recovery return drops the operation lock."

[[package.metadata.rightkit.resources]]
api = "retry_transient"
file = "src/transient.rs"
holds = ["memory"]
scale = "One synchronous operation with a caller-configured finite retry count and delay."
release = "Operation return."
