[package]
name = "rightkit-fs"
version = "0.4.12"
edition = "2021"
rust-version = "1.98.0"
description = "Safe state directories, atomic writes, cross-process locks, owner-only files, and stable file identity for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["filesystem", "atomic-write", "file-lock", "symlink", "permissions"]
categories = ["filesystem"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "rightkit-clonefile"
path = "src/bin/rightkit-clonefile.rs"
required-features = ["json"]

[[bin]]
name = "rightkit-swap"
path = "src/bin/rightkit-swap.rs"
required-features = ["fs"]

[features]
default = []
# Atomic writes, owner-only files, StateDir, netfs, clonefile, and the error type. Pulls
# libc (unix) and thiserror. `db` uses this layer and no more.
fs = ["dep:libc", "dep:thiserror", "dep:zeroize"]
# Cross-process locks (POSIX record locks via libc on unix) on top of `fs`. Also names the
# `write_locks` module: `KeyedWriteLocks`, in-process write locks keyed by destination with an
# optional cross-process lock file.
lock = ["fs"]
# Crash-recoverable multi-file publication (`transaction` module): `FileTransaction::prepare`,
# `PreparedTransaction::commit` and `recover_transactions`, with a journal under the root. Builds
# on `lock` (the operation lock) and adds no dependency.
transaction = ["lock"]
# Owner records for locks, the identity ledger, and the clonefile diagnostics binary. The
# identity ledger uses locks, so `json` implies `lock`.
json = ["lock", "dep:serde", "dep:serde_json"]
# `digest` module: streaming and in-memory SHA-256, lowercase hex. No other dependency.
digest = ["dep:sha2"]
# BLAKE3 hashing (independent of SHA-256); verified copy also needs `fs`.
blake3 = ["dep:blake3"]
# Names the `zip` module for consumers that ask for it (`write_zip`, `read_zip`). The module is
# compiled without it (std only, since `StoredZipWriter`), so this adds no code and no dependency.
zip = []
# `app_dirs` module: one per-user data/local/cache/home resolver with a dev namespace. Pulls thiserror (through `fs`) and nothing else.
app-dirs = ["fs"]
# `toolchain_lease` module: digest-bound immutable toolchain tree leases (rightkit#838). Uses the digest and json layers.
toolchain-lease = ["fs", "digest", "json"]

[dependencies]
blake3 = { version = "1.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
thiserror = { version = "2", optional = true }
zeroize = { version = "1.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: bounded retry delay for a transient rename or sharing violation (atomic.rs, RetryPolicy attempts) and lock acquisition poll bounded by LockOptions.timeout (lock.rs); no thread, task, timer, listener, watcher or growing memory (reviewed 2026-10-11); resident-static: the thread_local cells in src/atomic.rs are per-thread fault-injection and sync-count seams (the test seams were removed with the test features), each a fixed-size Cell or a short Vec of steps recorded only while a test arms it; the COUNTER there is a single AtomicU64 (reviewed 2026-10-17); 0.4.6 additions, not yet reviewed: src/transaction.rs holds one ID_COUNTER AtomicU64 and, inside test-seams, one thread_local hook cell, its commit and recovery waits are the bounded operation-lock acquisition (LockOptions timeout, default 30 s) with no thread, timer or growing memory, and src/write_locks.rs keeps an in-process registry that holds one entry per destination with a holder or waiter and removes it with the last, each wait bounded by a Condvar timeout (unless the caller passes a timeout the clock cannot add, such as Duration::MAX, which asks for no deadline); the transaction cleanup delete retry (transaction.rs retry_while and remove_with_retry) sleeps a bounded number of RetryPolicy attempts for each file with doubling pauses capped at one second, on Windows errors 5 (access denied), 32 (sharing violation) and 33 (lock violation) only; 0.4.8 additions, not yet reviewed: src/transient.rs holds no state and sleeps a bounded RetryPolicy (20 retries of 100 ms by default) between attempts of one delete, rename or open that Windows refuses with those three codes, and the transaction directory removal in transaction.rs uses the same bounded retry"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
