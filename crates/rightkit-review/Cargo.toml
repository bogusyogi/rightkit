[package]
name = "rightkit-review"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shared review capability for the content pipeline: deterministic checks over a media or brief description, declared holds, a capped repair loop, an advisory judge interface, and versioned verdict records."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
