[package]
name = "rightkit-review"
version = "0.4.2"
edition = "2021"
rust-version = "1.98.0"
description = "Shared review capability for the content pipeline: deterministic checks over a media or text description, declared holds, a capped repair loop, an advisory judge interface, and versioned verdict records."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["review", "verdict", "content-pipeline", "qa"]
categories = ["development-tools"]
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
path = "src/lib.rs"

[features]
default = []
# Code review adjudication, normalization and receipts (moved from Legion's legion-review).
code = ["dep:rightkit-evidence-contracts", "dep:rightkit-code-audit-provider-sdk", "dep:regex", "dep:sha2", "dep:hex", "dep:thiserror", "dep:icu_normalizer", "serde_json/preserve_order"]
# Minimal-diff review receipts (moved from Legion's legion-minimize).
minimize = ["dep:regex", "dep:sha2", "dep:hex", "dep:thiserror", "serde_json/preserve_order"]

# Final-render QA gate and social packaging (moved from CutRight's cutright-qa): ffmpeg probes, a typed report bound to the
# render's BLAKE3, content-addressed receipts, per-platform packages and the out-of-process `rightkit-render-critic`.
render-qa = ["dep:rightkit-video-project", "dep:rightkit-timeline", "dep:rightkit-ffmpeg", "dep:rightkit-fs", "dep:rightkit-child-process", "dep:chrono", "dep:tempfile", "dep:thiserror"]
# Dev/test only: `render_qa::critic::default_critic_binary` honours RIGHTKIT_CRITIC_BIN. Never in a shipped build.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts", optional = true }
rightkit-code-audit-provider-sdk = { version = "0.1.0", path = "../rightkit-code-audit-provider-sdk", optional = true }
regex = { version = "1.13.1", optional = true }
sha2 = { version = "0.11.1", optional = true }
hex = { version = "0.4.3", optional = true }
thiserror = { version = "2.0.20", optional = true }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"], optional = true }
chrono = { version = "0.4", features = ["serde", "clock"], optional = true }
tempfile = { version = "3", optional = true }
rightkit-video-project = { version = "0.1.0", path = "../rightkit-video-project", optional = true }
rightkit-timeline = { version = "0.1.0", path = "../rightkit-timeline", optional = true }
rightkit-ffmpeg = { version = "0.2.13", path = "../rightkit-ffmpeg", default-features = false, optional = true }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs", "blake3", "zip"], optional = true }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", optional = true }

# Citationberg is pulled by rightkit-typeset through rightkit-captions (video-project); see the vendored fix.
[patch.crates-io]
citationberg = { path = "../../vendor/citationberg" }

[[bin]]
name = "rightkit-render-critic"
path = "src/bin/rightkit-render-critic.rs"
required-features = ["render-qa"]

[[test]]
name = "render_qa_critic_states"
path = "tests/render_qa_critic_states.rs"
required-features = ["render-qa"]

[package.metadata.rightkit]
continuous = false
continuous_reason = "deterministic checks and a capped repair loop run per call over caller-provided descriptions; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
