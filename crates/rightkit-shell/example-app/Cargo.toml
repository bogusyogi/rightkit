[package]
name = "shell-example-app"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (own workspace) so it never enters the RightKit workspace build.
[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde_json = "1.0.150"
rightkit-shell = { path = "..", features = ["engine"] }
rightkit-control = { path = "../../rightkit-control", features = ["qa-control", "wv2-0_38"] }
rightkit-process = { path = "../../rightkit-process", version = "0.4.0" }
rightkit-framed-sidecar = { path = "../../rightkit-framed-sidecar" }

[dev-dependencies]
rightkit-qa = { path = "../../rightkit-qa" }
serde_json = "1.0.150"
