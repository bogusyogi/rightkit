[package]
name = "rightkit-tauri-shell"
version = "0.8.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shared Tauri desktop shell for Right Suite apps: webview hardening, window state, native menu, tray, single instance, deep links, autostart, rich clipboard, watchdog and engine wiring."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["build.rs", "src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md"]

[features]
default = ["wv2-0_39"]
# Windows: which `windows` + `webview2-com` generation the app's Tauri resolves, so types cross the
# boundary (Tauri 2.12: 0.62/0.39, the default since 0.5.0; Tauri 2.11: 0.61/0.38).
# An app locked to Tauri 2.11 uses default-features = false, features = ["wv2-0_38"] (retain other features).
# Enabling both selects 0.39.
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039"]
# Engine sidecar wiring over rightkit-job-queue EngineClient + rightkit-child-process. Off by default: it pulls
# rightkit-job-queue (db, time, uuid); apps that run an engine sidecar opt in.
engine = ["dep:rightkit-job-queue"]
# Required by `DevToolsPolicy::ContentOnly`: compiles Tauri's devtools in so a registered content
# webview can be inspected. Every other webview stays non-inspectable. Only an app on the
# `right-release` allow-list (`packages/release/devtools-policy.json`, today only ViewRight) may
# ship a build with it; every other app must leave it off. Never a default feature.
content-devtools = ["tauri/devtools", "tauri/unstable"]
# DEVELOPMENT/QA BUILDS ONLY. Compiles the QA control-command helpers an app registers on its `rightkit-qa`
# control server: `clipboard::qa` (named-pasteboard paste and staging, which can only address a private
# board and refuse the `Apple CFPasteboard ...` system names) and `frameless::button_frames` (the read-only
# macOS traffic-light probe). Off by default and never a default
# feature; an app selects it from its own QA/dev feature. A release build must not enable it.
qa-probes = []
logs = ["dep:rightkit-logs"]
# Native event delivery rechecks each live webview; Tauri gates webview lookup behind unstable.
host-services = ["dep:rightkit-app-settings", "dep:sha2", "tauri/unstable"]
crash = ["dep:rightkit-crash"]
license = ["host-services", "dep:rightkit-license"]
dialog = ["dep:tauri-plugin-dialog"]
app-update = ["host-services", "dep:rightkit-app-update"]
update = ["host-services", "dep:tauri-plugin-updater", "dep:reqwest", "dep:sha2", "dep:tokio", "dep:rustls"]
update-license = ["update", "dep:rightkit-license", "dep:url"]
overlay = ["dep:rightkit-overlay"]
pdf-host = ["host-services", "dep:rightkit-pdf"]
models = ["host-services", "dep:rightkit-models"]
# Pro continuity across a person's Apple devices (macOS): iCloud-Keychain helper, local toggle state and launch
# algorithm over `LicenseClient::{bridge_publish, bridge_exchange}`. Compiles on every OS (the helper is only
# found on macOS). Adds `rightkit-credentials` and `rightkit-fs`.
pro-bridge = ["license", "dep:rightkit-credentials", "dep:rightkit-fs"]
app-lock = ["host-services", "dep:rightkit-credentials", "rightkit-credentials/os-auth"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
rightkit-daemon = { version = "0.9.0", path = "../rightkit-daemon" }
rightkit-job-queue = { version = "0.6.0", path = "../rightkit-job-queue", default-features = false, features = ["supervisor"], optional = true }
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }
rightkit-app-settings = { version = "0.4.0", path = "../rightkit-app-settings", default-features = false, optional = true }
rightkit-logs = { version = "0.4.0", path = "../rightkit-logs", default-features = false, optional = true }
rightkit-crash = { version = "0.4.0", path = "../rightkit-crash", default-features = false, features = ["window-errors"], optional = true }
rightkit-license = { version = "0.3.0", path = "../rightkit-license", default-features = false, features = ["update-auth"], optional = true }
rightkit-overlay = { version = "0.2.3", path = "../rightkit-overlay", optional = true }
rightkit-pdf = { version = "0.3.3", path = "../rightkit-pdf", default-features = false, features = ["host"], optional = true }
rightkit-models = { version = "0.7.0", path = "../rightkit-models", default-features = false, optional = true }
rightkit-autostart = { version = "0.1.0", path = "../rightkit-autostart" }
rightkit-clipboard = { version = "0.1.0", path = "../rightkit-clipboard" }
rightkit-deep-link = { version = "0.1.0", path = "../rightkit-deep-link" }
rightkit-instance = { version = "0.2.0", path = "../rightkit-instance" }
rightkit-presence = { version = "0.1.0", path = "../rightkit-presence" }
rightkit-notifications = { version = "0.1.0", path = "../rightkit-notifications" }
rightkit-signal = { version = "0.1.0", path = "../rightkit-signal" }
rightkit-app-update = { version = "0.2.0", path = "../rightkit-app-update", optional = true }
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials", optional = true }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-updater = { version = ">=2.10.1, <3", optional = true, default-features = true }
# The native file and folder pickers (#746). The app registers `tauri_plugin_dialog::init()`; without it
# the pickers answer `unsupported`.
tauri-plugin-dialog = { version = "2.7", optional = true }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls-no-provider"] }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "time"] }
# The release-status read builds its own client before any updater check has installed the ring provider.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
url = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL", "NSValue", "NSGeometry", "NSObject", "NSBundle", "NSDictionary", "NSError"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(windows)'.dependencies]
windows_061 = { package = "windows", version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }

[[bench]]
name = "budget"
harness = false

[[bench]]
name = "budget_native"
harness = false

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
tauri-utils = "2"

# One Cargo workspace and lock per crate (rightkit#1285).
