[package]
name = "rightkit-tauri-shell"
version = "0.5.0"
edition = "2021"
rust-version = "1.98.0"
description = "Shared Tauri desktop shell for Right Suite apps: webview hardening, window state, native menu, tray, single instance, deep links, autostart, rich clipboard, watchdog and engine wiring."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["build.rs", "src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md"]

[features]
default = ["wv2-0_39"]
# Windows: which `windows` + `webview2-com` generation the app's Tauri resolves, so types cross the
# boundary (Tauri 2.12: 0.62/0.39, the default since 0.5.0; Tauri 2.11: 0.61/0.38).
# An app locked to Tauri 2.11 uses default-features = false, features = ["wv2-0_38"] (retain other features).
# Enabling both selects 0.39.
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039"]
# Engine sidecar wiring over rightkit-job-queue EngineClient + rightkit-child-process. Off by default: it pulls
# rightkit-job-queue (db, time, uuid); apps that run an engine sidecar opt in.
engine = ["dep:rightkit-job-queue"]
# Required by `DevToolsPolicy::ContentOnly`: compiles Tauri's devtools in so a registered content
# webview can be inspected. Every other webview stays non-inspectable. Only an app on the
# `right-release` allow-list (`packages/release/devtools-policy.json`, today only ViewRight) may
# ship a build with it; every other app must leave it off. Never a default feature.
content-devtools = ["tauri/devtools", "tauri/unstable"]
# DEVELOPMENT/QA BUILDS ONLY. `NavPolicy::default()` allows loopback (localhost, 127.0.0.1, [::1]) http(s)
# navigation as internal, for dev servers and QA drivers. Off by default: a dev profile (debug_assertions on)
# no longer implies it. An app selects it from an optional QA/dev feature of its own. Never a default feature.
dev-overrides = []
# DEVELOPMENT/QA BUILDS ONLY. Compiles the QA control-command helpers an app registers on its `rightkit-qa`
# control server: `clipboard::qa` (named-pasteboard paste and staging, which can only address a private
# board and refuse the `Apple CFPasteboard ...` system names) and `frameless::button_frames` (the read-only
# macOS traffic-light probe). Off by default and never a default
# feature; an app selects it from its own QA/dev feature. Compiled only with debug_assertions: a release build that
# enables it fails with compile_error!.
qa-probes = []
logs = ["dep:rightkit-logs"]
# Native event delivery rechecks each live webview; Tauri gates webview lookup behind unstable.
host-services = ["dep:rightkit-app-settings", "tauri/unstable"]
crash = ["dep:rightkit-crash"]
license = ["host-services", "dep:rightkit-license"]
update = ["host-services", "dep:tauri-plugin-updater", "dep:reqwest", "dep:sha2", "dep:tokio"]
update-license = ["update", "dep:rightkit-license", "dep:url"]
overlay = ["dep:rightkit-overlay"]
pdf-host = ["host-services", "dep:rightkit-pdf"]
models = ["host-services", "dep:rightkit-models"]
app-lock = ["host-services", "dep:rightkit-credentials", "rightkit-credentials/os-auth"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
rightkit-daemon = { version = "0.4.0", path = "../rightkit-daemon" }
rightkit-job-queue = { version = "0.5.0", path = "../rightkit-job-queue", default-features = false, features = ["supervisor"], optional = true }
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }
rightkit-app-settings = { version = "0.3.0", path = "../rightkit-app-settings", default-features = false, optional = true }
rightkit-logs = { version = "0.3.4", path = "../rightkit-logs", default-features = false, optional = true }
rightkit-crash = { version = "0.3.4", path = "../rightkit-crash", default-features = false, features = ["window-errors"], optional = true }
rightkit-license = { version = "0.2.4", path = "../rightkit-license", default-features = false, features = ["update-auth"], optional = true }
rightkit-overlay = { version = "0.2.0", path = "../rightkit-overlay", optional = true }
rightkit-pdf = { version = "0.3.3", path = "../rightkit-pdf", default-features = false, features = ["host"], optional = true }
rightkit-models = { version = "0.5.0", path = "../rightkit-models", default-features = false, optional = true }
rightkit-credentials = { version = "0.4.0", path = "../rightkit-credentials", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-updater = { version = "=2.10.1", optional = true, default-features = true }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls-no-provider"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "time"] }
url = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL", "NSValue", "NSGeometry", "NSObject", "NSBundle", "NSDictionary", "NSError"] }
objc2-user-notifications = "0.3"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(windows)'.dependencies]
# Same toast backend as tauri-plugin-notification (via notify-rust): WinRT ToastNotificationManager.
tauri-winrt-notification = "0.8"
windows_061 = { package = "windows", version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }

[[bench]]
name = "budget"
harness = false

[[bench]]
name = "budget_native"
harness = false

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
# The redirect fixture builds a bare reqwest client (rustls-no-provider); production gets the ring provider installed by
# tauri-plugin-updater, so the test installs the same one (ring, already in the lock).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Workspace-lock constraint only (dev-dependencies are not published to consumers): keeps the shared Cargo.lock
# on the tauri-utils that Tauri 2.11 (the workspace line, wv2-0_38) ships with. tauri-plugin 2.7+ (a build
# dependency of tauri-plugin-updater) needs tauri-utils ~2.10.2, which adds AppConfig::app_directories_override
# that tauri 2.11 `test` code does not set (E0063 in tauri 2.11.5 src/test/mod.rs). Lift with the tauri 2.12 move.
tauri-utils = { version = ">=2.9.3, <2.10" }

[[example]]
name = "shell_engine_fixture"
path = "tests/support/shell_engine_fixture.rs"
required-features = ["engine"]
