[package]
name = "shell-example-app"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (own workspace) so it never enters the RightKit workspace build.
[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde_json = "1.0.150"
rightkit-tauri-shell = { path = "..", features = ["engine", "qa-probes"] }
# The standalone example lock resolves Tauri 2.12; match its shell & QA binding generations.
rightkit-qa = { path = "../../rightkit-qa", default-features = false, features = ["control", "wv2-0_39"] }
rightkit-child-process = { path = "../../rightkit-child-process", version = "0.5.0" }
rightkit-sidecar = { path = "../../rightkit-sidecar" }
