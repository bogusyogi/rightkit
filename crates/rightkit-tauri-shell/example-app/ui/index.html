<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>RkShellExample</title>
<style>
  body { font: 14px -apple-system, Segoe UI, sans-serif; margin: 0; padding: 16px; }
  .box { border: 1px solid #888; padding: 12px; margin: 8px 0; }
  #plain { height: 80px; background: #eef; }
  #own { height: 60px; background: #efe; }
  #appmenu { display: none; position: fixed; background: #fff; border: 1px solid #333; padding: 6px; z-index: 9; }
  #nativesurface { height: 40px; background: #fee; }
  #dropzone { height: 40px; background: #ffe; }
</style>
</head>
<body>
  <h1>rightkit-tauri-shell example</h1>
  <div id="plain" class="box">Plain surface: no native menu here.</div>
  <input id="inp" class="box" value="editable field" />
  <div id="own" class="box">App-owned context menu surface.</div>
  <div id="appmenu"><button id="appmenu-item">App menu item</button></div>
  <div id="nativesurface" class="box" data-rk-native-menu>Opted-in native menu surface.</div>
  <div id="dropzone" class="box" data-rk-dropzone>Drop zone.</div>
  <p>
    <a id="ext" href="https://example.com/rk-external">external</a>
    <a id="blank" target="_blank" href="https://example.org/rk-blank">blank</a>
    <a id="mail" href="mailto:rk@example.com">mail</a>
  </p>
  <script>
    window.__keys = [];
    window.addEventListener('keydown', function (e) { window.__keys.push({ key: e.key, prevented: e.defaultPrevented }); });
    document.getElementById('own').addEventListener('contextmenu', function (e) {
      e.preventDefault();
      var m = document.getElementById('appmenu');
      m.style.left = e.clientX + 'px'; m.style.top = e.clientY + 'px'; m.style.display = 'block';
      window.__ownMenu = true;
    });
  </script>
  <script type="module">
    import { createShell } from './shell.js';
    const rk = createShell();
    window.rk = rk;
    window.__events = [];
    const log = (kind) => (p) => window.__events.push({ kind, p });
    await rk.menu.onClick(log('menu'));
    await rk.tray.onEvent(log('tray'));
    await rk.deepLinks.on(log('deep-link'));
    await rk.onSecondInstance(log('second-instance'));
    await rk.onStall(log('stall'));
    await rk.engine.onEvent(log('engine'));
    window.__ready = await rk.ready();
  </script>
</body>
</html>
