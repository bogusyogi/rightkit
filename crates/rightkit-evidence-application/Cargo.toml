[package]
name = "rightkit-evidence-application"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "In-process evidence application: composes audit, orchestration, policy and report crates behind host-supplied catalog, report and run sources"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_application"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1.92" }
rightkit-code-audit-engine = { version = "0.2.0", path = "../rightkit-code-audit-engine" }
rightkit-code-audit-provider-sdk = { version = "0.1.0", path = "../rightkit-code-audit-provider-sdk" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
rightkit-evidence-report = { version = "0.1.0", path = "../rightkit-evidence-report" }
rightkit-agent-orchestration = { version = "0.1.1", path = "../rightkit-agent-orchestration" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = { version = "2.0.21" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
