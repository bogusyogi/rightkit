[package]
name = "rightkit-prompt-recipes"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Prompt contracts and validator, recipe composer and catalogue, character and LoRA lock, video quality templates, template swap, brand codes and the KDP workflow."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_prompt_recipes"
path = "src/lib.rs"

[dependencies]
rightkit-media-gen = { version = "0.1.0", path = "../rightkit-media-gen" }
rightkit-approvals = { version = "0.1.0", path = "../rightkit-approvals" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }
rightkit-logs = { version = "0.4.0", default-features = false, path = "../rightkit-logs" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = { version = "1" }
time = { version = "0.3", features = ["formatting", "macros"] }
