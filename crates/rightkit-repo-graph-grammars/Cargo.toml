[package]
name = "rightkit-repo-graph-grammars"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Vendored tree-sitter grammars (ql, systemrdl, vue) for the repository graph, with no crates.io equivalent for tree-sitter-language 0.1."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "grammars/**", "build.rs", "VENDORED.md"]

[lib]
name = "rightkit_repo_graph_grammars"
path = "src/lib.rs"

[dependencies]
tree-sitter-language = { version = "0.1" }

[build-dependencies]
cc = { version = "1" }
