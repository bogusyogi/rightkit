[package]
name = "rightkit-docs"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral DOCX, XLSX and PDF read and write: format detection from content, typed reads with caps, typed write ops through an atomic writer, honest loss receipts, hardened against hostile files"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["docx", "xlsx", "pdf", "office", "document"]
categories = ["parser-implementations", "filesystem"]
include = [
  "src/**",
  "tests/**",
  "BAKEOFF.md",
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
# PDF read and edit are rightkit-pdf's; this crate is the one-shot facade over it.
rightkit-pdf = { version = "0.3.2", path = "../rightkit-pdf", default-features = false, features = ["edit", "merge", "extract"] }
lopdf = { version = "0.46", default-features = false, features = ["rayon"] }
# The one writer behind every write (temp sibling, flush, rename, directory sync).
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }
# XLSX read (typed cells, cached formula results) and XLSX create. Both pull zip 9.x.
calamine = "0.37.0"
rust_xlsxwriter = "0.102"
# Package layer and in-place part edits. Same zip line as calamine and rust_xlsxwriter so one copy links.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The in-house walker's own copy. calamine 0.37.0 also uses quick-xml 0.42, so one copy links.
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
sha2 = "0.11.1"

[dev-dependencies]
serde_json = "1.0.154"
# Fault seam around the replace call (debug and test builds only).
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs", "testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure computation bounded per call: parse or rewrite one caller-supplied file under explicit size, entry, ratio and cell caps; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src; the only process-wide state is rightkit-pdf's shared font catalog, built once on first PDF text replace or add"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
