[package]
name = "rightkit-power"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Sleep, resume, session lock, battery, energy saver, display state and keep-awake for Right Suite apps: one owner of the device's power and session state."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["power", "sleep", "battery", "session-lock", "keep-awake"]
categories = ["os"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "Power::spawn"
file = "src/lib.rs"
holds = ["thread", "listener"]
scale = "macOS: four notification observers (two on the workspace center, two on the distributed center), no thread of our own. Windows: two OS power-notification registrations (suspend and resume; power settings) and one thread (rightkit-power-session) owning a message-only window that receives session lock and unlock; the OS calls the registrations back on its own threads. Linux: none, nothing is read. One Power per process is the intended use"
release = "Drop of the Power removes the observers, unregisters the callbacks, and on Windows posts WM_CLOSE to the session window and joins its thread"
static_note = "none: all state lives in the Power's own Arc<Shared>; the Windows callbacks hold a raw pointer to it that is reclaimed only after every registration is removed"

[dependencies]
log = "0.4"
rightkit-child-process = { version = "0.5.9", path = "../rightkit-child-process" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

# One Cargo workspace and lock per crate (rightkit#1285).
