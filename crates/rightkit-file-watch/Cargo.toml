[package]
name = "rightkit-file-watch"
version = "0.4.2"
edition = "2021"
rust-version = "1.98.0"
description = "Filesystem watching for Right Suite apps: ref-counted async subscribers, debounced file-set and directory watchers, and rename-storm coalescing."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["watcher", "notify", "filesystem", "debounce"]
categories = ["filesystem"]
include = ["src/**", "tests/**", "benches/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES"]

[features]
default = ["async"]
# The async multi-subscriber watcher (`subscribe`, `FileWatcher`, ...) over tokio. Off leaves the
# runtime-free `sync`, `typed`, `options` and `coalesce` layers with no tokio dependency.
async = ["dep:tokio"]

[dependencies]
notify = "8.2.1"
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"], optional = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[[bench]]
name = "budget"
harness = false

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
