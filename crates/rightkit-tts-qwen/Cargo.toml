[package]
name = "rightkit-tts-qwen"
version = "0.2.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/Orthic-Labs/rightkit"
description = "Qwen3 TTS inference (GGUF + GGML), vendored from yet-another-ai/qts v0.2.0 for RightKit"
readme = "README.md"
include = ["src/**", "proto/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "PINNED.md", "CHANGELOG.md", "testdata/**"]

[lib]
name = "qts"

[features]
default = []  # GenRight: backends are selected by genright-qts features
metal = ["rightkit-tts-qwen-sys/metal"]
vulkan = ["rightkit-tts-qwen-sys/vulkan"]
blas = ["rightkit-tts-qwen-sys/blas"]
native = ["rightkit-tts-qwen-sys/native"]
acl = ["rightkit-onnx/acl"]
armnn = ["rightkit-onnx/armnn"]
azure = ["rightkit-onnx/azure"]
cann = ["rightkit-onnx/cann"]
coreml = ["rightkit-onnx/coreml"]
cuda = ["rightkit-onnx/cuda"]
directml = ["rightkit-onnx/directml"]
migraphx = ["rightkit-onnx/migraphx"]
nnapi = ["rightkit-onnx/nnapi"]
nvrtx = ["rightkit-onnx/nvrtx"]
onednn = ["rightkit-onnx/onednn"]
openvino = ["rightkit-onnx/openvino"]
qnn = ["rightkit-onnx/qnn"]
rknpu = ["rightkit-onnx/rknpu"]
tensorrt = ["rightkit-onnx/tensorrt"]
tvm = ["rightkit-onnx/tvm"]
vitis = ["rightkit-onnx/vitis"]
webgpu = ["rightkit-onnx/webgpu"]
xnnpack = ["rightkit-onnx/xnnpack"]

[dependencies]
rightkit-tts-qwen-sys = { path = "../rightkit-tts-qwen-sys", version = "0.1.0", default-features = false }
thiserror = "2"
getrandom = "0.3"
hound = "3.5.1"
rustfft = "6.4.1"
prost = "0.14"
rightkit-onnx = { path = "../rightkit-onnx", version = "0.2.2", features = ["tracing"] }


