[package]
name = "rightkit-tts-qwen"
version = "0.2.7"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/bogusyogi/rightkit"
description = "Qwen3 TTS inference (GGUF + GGML), vendored from yet-another-ai/qts v0.2.0 for RightKit"
readme = "README.md"
include = ["src/**", "proto/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "PINNED.md", "CHANGELOG.md", "testdata/**"]

[lib]
name = "qts"

[features]
default = []  # GenRight: backends are selected by genright-qts features
metal = ["rightkit-tts-qwen-sys/metal"]
vulkan = ["rightkit-tts-qwen-sys/vulkan"]
blas = ["rightkit-tts-qwen-sys/blas"]
native = ["rightkit-tts-qwen-sys/native"]
acl = ["rightkit-onnx/acl"]
armnn = ["rightkit-onnx/armnn"]
azure = ["rightkit-onnx/azure"]
cann = ["rightkit-onnx/cann"]
coreml = ["rightkit-onnx/coreml"]
cuda = ["rightkit-onnx/cuda"]
directml = ["rightkit-onnx/directml"]
migraphx = ["rightkit-onnx/migraphx"]
nnapi = ["rightkit-onnx/nnapi"]
nvrtx = ["rightkit-onnx/nvrtx"]
onednn = ["rightkit-onnx/onednn"]
openvino = ["rightkit-onnx/openvino"]
qnn = ["rightkit-onnx/qnn"]
rknpu = ["rightkit-onnx/rknpu"]
tensorrt = ["rightkit-onnx/tensorrt"]
tvm = ["rightkit-onnx/tvm"]
vitis = ["rightkit-onnx/vitis"]
webgpu = ["rightkit-onnx/webgpu"]
xnnpack = ["rightkit-onnx/xnnpack"]

[dependencies]
rightkit-tts-qwen-sys = { path = "../rightkit-tts-qwen-sys", version = "0.1.0", default-features = false }
thiserror = "2"
getrandom = "0.4"
hound = "3.5.1"
rustfft = "6.4.1"
prost = "0.14"
rightkit-onnx = { path = "../rightkit-onnx", version = "0.2.6", features = ["tracing"] }



[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "Qwen3TtsEngine::load"
file = "src/lib.rs"
holds = ["memory", "thread"]
scale = "one loaded model: GGUF weights in ggml backend buffers, the vocoder ONNX session and the speaker encoder, sized by the model files; each synthesize call opens std::thread::scope threads (a vocoder worker beside the transformer) that are joined before the call returns"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "BackendSet::new"
file = "src/pipeline/backend.rs"
holds = ["memory"]
scale = "one ggml backend (CPU or accelerator) with its graph allocators and buffers; fixed per engine"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "TtsTransformer"
file = "src/pipeline/tts_transformer.rs"
holds = ["memory"]
scale = "talker and code-predictor weights in ggml buffers plus the KV cache, sized by the model; fixed per engine"
release = "Drop of the owning Qwen3TtsEngine"

[[package.metadata.rightkit.resources]]
api = "Vocoder"
file = "src/pipeline/vocoder.rs"
holds = ["memory", "thread"]
scale = "one ONNX Runtime session with its intra-op threads (parked when idle), sized by the vocoder model; fixed per engine"
release = "Drop of the owning Qwen3TtsEngine"

[[package.metadata.rightkit.resources]]
api = "TextTokenizer::load_from_gguf"
file = "src/pipeline/tokenizer.rs"
holds = ["memory"]
scale = "one vocabulary and merge table read from the GGUF file, sized by the model; fixed per engine"
release = "Drop of the owning Qwen3TtsEngine"
static_note = "REVERSE is one OnceLock<HashMap<char, u8>> with at most 256 byte-to-char entries, built once; it holds no thread and cannot grow"

[[package.metadata.rightkit.resources]]
api = "TestGguf"
file = "src/model/test_fixture.rs"
holds = ["memory"]
scale = "test-only fixture module, compiled under cfg(test); one 1 MiB ggml context and a temp GGUF file per test"
release = "function return"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
