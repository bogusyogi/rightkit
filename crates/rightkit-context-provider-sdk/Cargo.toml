[package]
name = "rightkit-context-provider-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Context provider SDK: the typed Provider trait, the canonical Fixture shape and the run_conformance harness for adapters implementing context operations."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_context_provider_sdk"
path = "src/lib.rs"

[dependencies]
rightkit-context-protocol = { version = "0.2.0", path = "../rightkit-context-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
async-trait = { version = "0.1" }
tokio-util = { version = "0.7" }
