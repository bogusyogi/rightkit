[package]
name = "rightkit-embed"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral local text embeddings and persistent cosine vector store."
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# `inference` = ONNX text embedder (ort, tokenizers, model digest checks).
# `vector` = persistent cosine vector store (rusqlite). Default keeps both.
[features]
default = ["inference", "vector"]
inference = ["dep:ort", "dep:rightkit-ort", "dep:tokenizers", "dep:sha2", "dep:serde_json"]
vector = ["dep:rusqlite"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24", "load-dynamic"], optional = true }
rightkit-ort = { version = "0.2.0", path = "../rightkit-ort", optional = true }
rusqlite = { version = "0.40.1", default-features = false, optional = true }
serde_json = { version = "1.0.150", optional = true }
sha2 = { version = "0.10.9", optional = true }
thiserror = "2"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3"
