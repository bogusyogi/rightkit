[package]
name = "rightkit-jobs"
version = "0.2.9"
edition = "2021"
rust-version = "1.98.0"
description = "Persistent job store, runner, and stdio/CLI command contract for Right Suite engines."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["jobs", "sidecar", "sqlite", "cli"]
categories = ["asynchronous"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# The default build compiles everything 0.2.7 did: all three optional layers are on.
default = ["service", "supervisor"]
# The stdio/CLI command contract: `Dispatcher`, `serve`, `run_cli`, `JobCommands`, `CommandSet`
# (gates `rightkit-framed-sidecar`). A consumer that only needs `JobStore` and `Runner` (the
# store, runner, locks, recovery classes, pruning, progress policy, cancel token) builds with
# `default-features = false`; one that serves or speaks the contract adds `contract`.
contract = ["dep:rightkit-framed-sidecar"]
# `EngineSupervisor` / `EngineClient` and the `rightkit-process` re-exports (gates
# `rightkit-process`). Implies `contract`.
supervisor = ["contract", "dep:rightkit-process"]
# `DispatcherHandler`: serve a `Dispatcher` over `rightkit-service` (gates `rightkit-service`).
# Implies `contract`.
service = ["contract", "dep:rightkit-service"]

[dependencies]
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["digest", "lock"] }
rightkit-db = { version = "0.4.0", path = "../rightkit-db" }
rightkit-framed-sidecar = { version = "0.2.0", path = "../rightkit-framed-sidecar", optional = true }
rightkit-process = { version = "0.4.0", path = "../rightkit-process", optional = true }
rightkit-service = { version = "0.1.0", path = "../rightkit-service", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Independent SHA-256 reference for tests (the crate itself hashes via rightkit-fs).
sha2 = "0.10"
tempfile = "3"
time = "0.3"

[[bench]]
name = "budget"
harness = false
required-features = ["supervisor"]

[[test]]
name = "e2e"
required-features = ["service"]

[[test]]
name = "dispatcher"
required-features = ["contract"]

[[test]]
name = "engine_contract"
required-features = ["contract"]

[[test]]
name = "genright"
required-features = ["contract"]

[[test]]
name = "v021"
required-features = ["contract"]

[[test]]
name = "supervisor"
required-features = ["supervisor"]

[[example]]
name = "job_engine"
required-features = ["service"]
