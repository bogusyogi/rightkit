[package]
name = "rightkit-jobs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Persistent job store, runner, and stdio/CLI command contract for Right Suite engines."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["jobs", "sidecar", "sqlite", "cli"]
categories = ["asynchronous"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-db = { version = "=0.2.0", path = "../rightkit-db" }
rightkit-framed-sidecar = { version = "=0.1.0", path = "../rightkit-framed-sidecar" }
rightkit-process = { version = "=0.2.1", path = "../rightkit-process" }
rightkit-service = { version = "=0.1.0", path = "../rightkit-service" }
rusqlite = { version = "0.40.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
