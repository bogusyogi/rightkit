[package]
name = "rightkit-adapt"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Governed behavioural learning from agent transcripts (Pulse's Membrane Adapt): taste preferences and insights, deterministic and model-free."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_adapt"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rightkit-fs = { version = "0.4.9", features = ["digest"], path = "../rightkit-fs" }
regex = { version = "1" }
ring = { version = "0.17" }
rightkit-agent-transcript = { version = "0.1.0", path = "../rightkit-agent-transcript" }
