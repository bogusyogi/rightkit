[package]
name = "rightkit-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Cross-process wake-up signals between a native companion and a host app: Darwin notifications on macOS, named events on Windows, plus a repeating visibility lease."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["ipc", "notification", "named-event", "signal"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_signal"
path = "src/lib.rs"

[package.metadata.rightkit]
continuous = true
continuous_reason = "a Watcher owns one thread blocked in poll (macOS) or WaitForMultipleObjects (Windows) until a signal or stop, and a Lease owns one timer thread that wakes once per interval while the app is visible; both are joined on drop"
