[package]
name = "rightkit-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Cross-process wake-up signals between a native companion and a host app: Darwin notifications on macOS, named events on Windows, plus a repeating visibility lease."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["ipc", "notification", "named-event", "signal"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_signal"
path = "src/lib.rs"

[package.metadata.rightkit]
continuous = true
continuous_reason = "a Watcher owns one thread blocked in poll (macOS) or WaitForMultipleObjects (Windows) until a signal or stop, and a Lease owns one timer thread that wakes once per interval while the app is visible; both are joined on drop"

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
