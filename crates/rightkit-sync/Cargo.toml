[package]
name = "rightkit-sync"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral desktop/mobile cloud sync engine: change tokens, tombstones, last-writer-wins conflicts, resumable batches, offline queue, retry/backoff."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["sync", "cloudkit", "tombstone", "offline"]
categories = ["data-structures"]
# The protocol fake and its process-level E2E test are repository-only fixtures.
include = ["src/**", "!src/bin/**", "tests/**", "!tests/helper_e2e.rs", "benches/*.rs", "README.md", "API.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rightkit-process = { version = "0.3.4", path = "../rightkit-process" }
rightkit-fs = { version = "0.3.3", path = "../rightkit-fs", default-features = false, features = ["fs"] }

[[bench]]
name = "budget"
harness = false
