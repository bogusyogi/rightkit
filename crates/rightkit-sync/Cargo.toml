[package]
name = "rightkit-sync"
version = "0.2.3"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral desktop/mobile cloud sync engine: change tokens, tombstones, last-writer-wins conflicts, resumable batches, offline queue, retry/backoff."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["sync", "cloudkit", "tombstone", "offline"]
categories = ["data-structures"]
include = ["src/**", "benches/*.rs", "README.md", "API.md", "HTTP-PROTOCOL.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["helper", "process-usage"]
# CloudKit-style helper-process backend (`helper` module, `rightkit-sync-helper/1`). Pure std +
# serde_json; off for hosts that only use an HTTP or in-process backend (Android).
helper = []
# Builds `tests/helper_e2e.rs`: the two proofs against the real signed Swift CloudKit helper, the app's real
# container and an iCloud account (RIGHTKIT_CLOUDKIT_*). Off by default, as `vault-s3` gates the real-bucket
# test: a default test build holds no test that can only be skipped. Adds no code to the library.
cloudkit-live = []
# `SyncStatus::process` and its `rightkit-child-process` dependency. Off for Android builds.
process-usage = ["dep:rightkit-child-process"]
# `cipher` module: `RecordCipher` and `EncryptingBackend`, end-to-end encryption of record
# payloads (ChaCha20-Poly1305 and HKDF-SHA256 from `ring`).
cipher = ["dep:ring", "dep:zeroize"]
# `http` module: blocking `HttpBackend` and `HttpAuth` for the `rightkit-sync-http/1` protocol,
# over `rightkit-http`'s blocking client (ureq, platform verifier).
# Supported (rightkit#967 ruling): `packages/sync-worker` is deployed for HeardRight and serves this protocol,
# so the feature is the client of the hosted sync service. Run it behind `cipher::EncryptingBackend`.
http = ["dep:rightkit-http", "rightkit-fs/digest"]
# `drive` module: blocking `DriveBackend` and `DriveAuth` over the Google Drive v3 REST API and the
# `drive.appdata` scope (own-cloud sync: the user's own Drive quota, no service of ours). The
# non-Apple own-cloud backend (CloudKit is the Apple one); `http` is the hosted-service client. Same `rightkit-http` client.
drive = ["dep:rightkit-http", "rightkit-fs/digest"]

# `vault` module: conditional-object vault sync (immutable sealed state objects, one head swapped with
# If-Match, a three-way merge policy, an encrypted ledger) for password-vault data that cannot use the
# last-writer-wins record engine (rightkit#966). Needs the same sealing as `cipher`.
vault = ["cipher"]
# `vault::s3::S3ConditionalStore`: the Cloudflare R2 / S3-compatible store (Signature V4 over rightkit-http).
vault-s3 = ["vault", "dep:rightkit-http"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", optional = true }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-http = { version = "0.3.9", path = "../rightkit-http", default-features = false, optional = true }
ring = { version = "0.17", optional = true }
zeroize = { version = "1.9", optional = true }

[[bench]]
name = "budget"
harness = false
required-features = ["process-usage"]

[[test]]
name = "helper_e2e"
required-features = ["helper", "cloudkit-live"]

[[test]]
name = "vault_race_real_bucket"
required-features = ["vault-s3"]

# One Cargo workspace and lock per crate (rightkit#1285).
