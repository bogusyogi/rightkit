[package]
name = "rightkit-models"
version = "0.7.1"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
description = "Shared local-model manifest and installer for Right Suite apps: one on-disk store (the suite layout), revisions and quantizations as manifests, resumable verified downloads, archive extraction, atomic activation, and hardware fit."
keywords = ["models","installer","download","onnx"]
categories = ["filesystem"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_models"
path = "src/lib.rs"

[features]
default = []
rightapps = ["dep:ed25519-dalek", "dep:base64", "dep:url", "dep:chrono"]
# DEVELOPMENT ONLY. Honours `ModelHttpOptions::allow_loopback_host`, which lets one named loopback
# host and port be reached for a local debug worker. Never enable it in a release build; without
# it the allowance is ignored and loopback stays refused.
dev-worker-override = []

[dependencies]
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["digest", "fs", "lock"] }
# One suite-root rule for every Right Suite crate: `Suite::resolve`, always the per-user default (no test mode).
rightkit-roots = { version = "0.1.0", path = "../rightkit-roots" }
# Every outbound request goes through rightkit-http: address policy, per-hop redirect vetting.
rightkit-http = { version = "0.3.9", path = "../rightkit-http", default-features = false }
ed25519-dalek = { version = "3", optional = true }
base64 = { version = "0.23", optional = true }
url = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
tar = "0.4"
flate2 = "1"
dirs = "7"
getrandom = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }


[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: download retry backoff bounded by ModelHttpOptions::retries and the optional total_timeout budget (download.rs, http.rs) and store-lock and lease acquisition polls inside one caller-initiated wait (lock.rs, suite/lease.rs); thread-spawn: one reader thread per download body for the idle-timeout wrapper (http.rs), ends at EOF, error or consumer drop, and socket read timeouts bound it; no listener, timer, watcher or resident cache (reviewed 2026-10-11)"

# One Cargo workspace and lock per crate (rightkit#1285).
