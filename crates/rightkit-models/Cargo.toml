[package]
name = "rightkit-models"
version = "0.5.1"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
description = "Shared local-model manifest and installer for Right Suite apps: revisions and quantizations, resumable verified downloads, archive extraction, atomic activation, rollback, and hardware fit."
keywords = ["models","installer","download","onnx"]
categories = ["filesystem"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_models"
path = "src/lib.rs"

[features]
default = []
rightapps = ["dep:ed25519-dalek", "dep:base64", "dep:url", "dep:chrono"]
# DEVELOPMENT ONLY. Honours `ModelHttpOptions::allow_loopback_host`, which lets one named loopback
# host and port be reached for a local debug worker. Never enable it in a release build; without
# it the allowance is ignored and loopback stays refused.
dev-worker-override = []
# Compiles the suite-root override switches (`RIGHTKIT_SUITE_ROOT`, `RIGHT_SUITE_DIR`,
# `ORTHIC_SHARED_DIR`) by forwarding `rightkit-daemon/test-mode`. Apps enable it from their own
# test-mode feature. Never enable it in a release build: without it no override is read.
test-mode = ["rightkit-daemon/test-mode"]

[dependencies]
rightkit-fs = { version = "0.4.3", path = "../rightkit-fs", default-features = false, features = ["digest", "fs", "lock"] }
# One suite-root rule for every Right Suite crate: `Suite::resolve`, overrides only with `test-mode`.
rightkit-daemon = { version = "0.4.0", path = "../rightkit-daemon", default-features = false }
# Every outbound request goes through rightkit-http: address policy, per-hop redirect vetting.
rightkit-http = { version = "0.3.0", path = "../rightkit-http", default-features = false }
ed25519-dalek = { version = "3", optional = true }
base64 = { version = "0.23", optional = true }
url = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
tar = "0.4"
flate2 = "1"
dirs = "7"
getrandom = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Independent SHA-256 reference for tests (the crate itself hashes via rightkit-fs).
sha2 = "0.11"
tempfile = "3"
# Existing HTTP testing owner provides transport; test support supplies model fixtures. 0.3.8 is the
# first rightkit-http with `MockServer::start_declared_length`.
rightkit-http = { version = "0.3.8", path = "../rightkit-http", default-features = false, features = ["testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: download retry backoff bounded by ModelHttpOptions::retries and the optional total_timeout budget (download.rs, http.rs) and store-lock and lease acquisition polls inside one caller-initiated wait (lock.rs, suite/lease.rs); thread-spawn: one reader thread per download body for the idle-timeout wrapper (http.rs), ends at EOF, error or consumer drop, and socket read timeouts bound it; no listener, timer, watcher or resident cache (reviewed 2026-10-11)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
