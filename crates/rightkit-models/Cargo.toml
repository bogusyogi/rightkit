[package]
name = "rightkit-models"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
description = "Shared local-model manifest and installer for Right Suite apps: revisions and quantizations, resumable verified downloads, archive extraction, atomic activation, rollback, and hardware fit."
keywords = ["models","installer","download","onnx"]
categories = ["filesystem"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_models"
path = "src/lib.rs"

[features]
default = []
rightapps = ["dep:ed25519-dalek", "dep:base64", "dep:url", "dep:chrono"]

[dependencies]
rightkit-fs = { version = "0.3", path = "../rightkit-fs", default-features = false, features = ["digest", "fs", "lock"] }
# Every outbound request goes through rightkit-http: address policy, per-hop redirect vetting.
rightkit-http = { version = "0.3.0", path = "../rightkit-http", default-features = false }
ed25519-dalek = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
url = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
tar = "0.4"
flate2 = "1"
dirs = "7"
getrandom = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Independent SHA-256 reference for tests (the crate itself hashes via rightkit-fs).
sha2 = "0.11"
tempfile = "3"
# Mock HTTP server (Range, dropped connections) for the end-to-end download
# tests. rightkit-qa does not depend on rightkit-models, so this is no publish
# cycle; it only orders publication (rightkit-qa 0.2.2 first).
rightkit-qa = { version = "0.2.8", path = "../rightkit-qa" }

[package.metadata.rightkit]
continuous = false
continuous_reason = "sleep: download retry backoff bounded by MAX_ATTEMPTS (download.rs) and store-lock and lease acquisition polls inside one caller-initiated wait (lock.rs, suite/lease.rs); thread-spawn: one reader thread per download body for the idle-timeout wrapper (http.rs), ends at EOF, error or consumer drop, and socket read timeouts bound it; no listener, timer, watcher or resident cache (reviewed 2026-10-11)"
