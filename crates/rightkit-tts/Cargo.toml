[package]
name = "rightkit-tts"
version = "0.2.3"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT OR Apache-2.0"
description = "Shared local text-to-speech for Right Suite apps: OS voices (say / SAPI) and a Qwen3-TTS QTS worker client"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-tts"
documentation = "https://docs.rs/rightkit-tts"
keywords = ["tts", "text-to-speech", "speech", "qwen3", "sapi"]
categories = ["multimedia::audio", "os"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lib]
name = "rightkit_tts"
path = "src/lib.rs"

[features]
# `system` = OS voice backend (say / SAPI) and word-timed transcript. `client` = QTS worker
# client (process spawn, chunking, model manifest verification). `engine` = vendored
# Qwen3-TTS worker, which implies `client`. Default keeps both pre-existing surfaces.
default = ["system", "client"]
system = ["dep:rightkit-transcript", "dep:thiserror"]
client = ["dep:rightkit-onnx", "dep:rightkit-child-process", "dep:rightkit-fs", "dep:serde", "dep:serde_json"]
engine = ["client", "dep:qts", "dep:libc"]
metal = ["engine", "qts/metal"]
vulkan = ["engine", "qts/vulkan"]
# DEVELOPMENT/QA BUILDS ONLY. Honors an inherited `ORT_DYLIB_PATH` as a developer ONNX Runtime override
# (client spawn, `bind_ort_runtime`, `find_onnxruntime`). Forwards to `rightkit-onnx/dev-overrides` when the
# client is on. Never implied by a build profile, never a default feature.
dev-overrides = ["rightkit-onnx?/dev-overrides"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
thiserror = { version = "2", optional = true }
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["digest"], optional = true }
rightkit-onnx = { version = "0.2.5", path = "../rightkit-onnx", default-features = false, optional = true }
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process", optional = true }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript", optional = true }
qts = { package = "rightkit-tts-qwen", version = "0.2.7", path = "../rightkit-tts-qwen", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "rightkit-tts-worker"
path = "src/bin/rightkit-tts-worker.rs"
required-features = ["engine"]

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "QtsClient::synthesize"
file = "src/client.rs"
holds = ["child", "thread", "memory"]
scale = "at most one warm worker process (the loaded TTS model: GPU or RAM sized by the model files) with its stdin, a reply channel and one stdout reader thread; the client sleeps only inside one synthesis call while polling for a reply"
release = "QtsClient Drop or the shutdown function; the worker also exits itself after its idle timeout"
static_note = "WORKER is one OnceLock<Mutex<Option<Worker>>> slot holding at most one warm worker handle; CANCEL and REQ_ID are atomics; none is a collection and none grows"

[[package.metadata.rightkit.resources]]
api = "run"
file = "src/worker.rs"
holds = ["thread", "memory"]
scale = "the worker process: one stdin reader thread and the loaded engine cache (model weights); blocks on a channel recv_timeout with the idle timeout and does no work between requests"
release = "a Quit request or the idle timeout, both ending the process"
