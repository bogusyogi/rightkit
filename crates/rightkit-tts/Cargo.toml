[package]
name = "rightkit-tts"
version = "0.0.0"
edition = "2021"
rust-version = "1.98.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Shared local QTS and operating-system speech synthesis for Right Suite apps"
repository = "https://github.com/adrdsouza/claude"
include = ["src/**", "tests/**", "Cargo.toml", "README.md"]

[lib]
name = "rightkit_tts"
path = "src/lib.rs"

[features]
# `system` = OS voice backend (say / SAPI) and word-timed transcript. `client` = QTS worker
# client (process spawn, chunking, model manifest verification). `engine` = vendored
# Qwen3-TTS worker, which implies `client`. Default keeps both pre-existing surfaces.
default = ["system", "client"]
system = ["dep:rightkit-transcript"]
client = ["dep:rightkit-process", "dep:sha2", "dep:serde", "dep:serde_json"]
engine = ["client", "dep:qts", "dep:libc"]
metal = ["engine", "qts/metal"]
vulkan = ["engine", "qts/vulkan"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = "2"
rightkit-process = { version = "0.3.0", path = "../rightkit-process", optional = true }
rightkit-transcript = { version = "0.0.0", path = "../rightkit-transcript", optional = true }
qts = { package = "rightkit-qts", version = "0.2.0", path = "../rightkit-qts", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "rightkit-tts-worker"
path = "src/bin/rightkit-tts-worker.rs"
required-features = ["engine"]
