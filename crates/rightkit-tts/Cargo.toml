[package]
name = "rightkit-tts"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT OR Apache-2.0"
description = "Shared local text-to-speech for Right Suite apps: OS voices (say / SAPI) and a Qwen3-TTS QTS worker client"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-tts"
documentation = "https://docs.rs/rightkit-tts"
keywords = ["tts", "text-to-speech", "speech", "qwen3", "sapi"]
categories = ["multimedia::audio", "os"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md"]

[lib]
name = "rightkit_tts"
path = "src/lib.rs"

[features]
# `system` = OS voice backend (say / SAPI) and word-timed transcript. `client` = QTS worker
# client (process spawn, chunking, model manifest verification). `engine` = vendored
# Qwen3-TTS worker, which implies `client`. Default keeps both pre-existing surfaces.
default = ["system", "client"]
system = ["dep:rightkit-transcript", "dep:thiserror"]
client = ["dep:rightkit-ort", "dep:rightkit-process", "dep:rightkit-fs", "dep:serde", "dep:serde_json"]
engine = ["client", "dep:qts", "dep:libc"]
metal = ["engine", "qts/metal"]
vulkan = ["engine", "qts/vulkan"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
thiserror = { version = "2", optional = true }
rightkit-fs = { version = "0.3.3", path = "../rightkit-fs", default-features = false, features = ["digest"], optional = true }
rightkit-ort = { version = "0.2.2", path = "../rightkit-ort", default-features = false, optional = true }
rightkit-process = { version = "0.3.0", path = "../rightkit-process", optional = true }
rightkit-transcript = { version = "0.3.0", path = "../rightkit-transcript", optional = true }
qts = { package = "rightkit-qts", version = "0.2.6", path = "../rightkit-qts", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "rightkit-tts-worker"
path = "src/bin/rightkit-tts-worker.rs"
required-features = ["engine"]
