[package]
name = "rightkit-github"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "GitHub App authority contracts, forge request specs, App state store, webhook verification, installation tokens and device-flow sign-in"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_github"
path = "src/lib.rs"

[dependencies]
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", features = ["tokio"] }
rightkit-credentials = { version = "0.4.3", path = "../rightkit-credentials" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", features = ["fs", "lock", "json", "digest", "transaction"] }
rightkit-http = { version = "0.3.9", path = "../rightkit-http", features = ["gzip", "untrusted", "async"] }
rightkit-oauth = { version = "0.10.0", path = "../rightkit-oauth", default-features = false, features = ["secrets", "system-sources"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rightkit-agent-orchestration = { version = "0.1.1", path = "../rightkit-agent-orchestration", optional = true }
rightkit-code-audit-provider-sdk = { version = "0.1.0", path = "../rightkit-code-audit-provider-sdk", optional = true }
rightkit-review = { version = "0.4.1", path = "../rightkit-review", features = ["code"], optional = true }
tokio-util = { version = "0.7.20", features = ["rt"], optional = true }

[features]
default = []
# Read-only delivery observation and engineering diagnostics (moved from Legion's github_observer.rs
# and engineering.rs).
observer = ["dep:rightkit-agent-orchestration", "dep:rightkit-code-audit-provider-sdk", "dep:rightkit-review", "dep:tokio-util"]

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
