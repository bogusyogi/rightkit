[package]
name = "rightkit-db"
version = "0.5.7"
edition = "2021"
rust-version = "1.98.0"
description = "Correct-by-default SQLite and SQLCipher connection bootstrap for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["sqlite", "sqlcipher", "wal", "database"]
categories = ["database"]
include = ["src/**", "build.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
bundled = ["rusqlite/bundled"]
# Prepared-statement cache (`prepare_cached`) through the rusqlite re-export. Off by default since 0.4.0.
statement-cache = ["rusqlite/cache"]
# SQLCipher built on LibTomCrypt, with no OpenSSL anywhere in the graph (rightkit#1447). The provider off Apple:
# `build.rs` compiles sqlcipher-src's SQLCipher and LibTomCrypt into one static `sqlcipher` library, and
# libsqlite3-sys (`sqlcipher` plus its bundled bindings, no bundled build) links it. SQLCipher 4's on-disk
# format is provider independent, so a database written under OpenSSL opens unchanged (proven on the Dell
# with a real HeardRight database, rightkit#1447). Replaces the removed `sqlcipher` (vendored OpenSSL) feature.
sqlcipher-libtomcrypt = ["cipher", "rusqlite/sqlcipher", "dep:libsqlite3-sys", "dep:cc", "dep:sqlcipher-src"]
# SQLCipher with the system crypto provider (CommonCrypto on Apple, libcrypto elsewhere).
# Use it where existing encrypted databases were created with system crypto; switching the
# provider is not a silent refactor.
sqlcipher-system = ["cipher", "rusqlite/bundled-sqlcipher"]
# Enabled by either SQLCipher feature; gates keyed-open and rekey code. Not meant to be named directly.
cipher = []
# The encrypted-store lifecycle (`rightkit_db::encrypted_lifecycle`): `ProtectedKeyStore`, `StoreTransition`,
# `EncryptedStore`, `rotate_key`, `recover_rotation`, backup/restore quiescence and `relocate`. It adds no
# dependency, and never one on rightkit-credentials or rightkit-daemon. It must be combined with `sqlcipher-libtomcrypt`
# or `sqlcipher-system`; alone it fails to compile rather than run against an unencrypted build.
encrypted-lifecycle = []
hooks = ["rusqlite/hooks"]

[dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["backup"] }
# Opts out of rightkit-fs `json` (serde) and `digest` (sha2): db needs atomic writes, sweeps, owner-only files, netfs and the store-wide advisory lock.
rightkit-fs = { version = "0.4.10", path = "../rightkit-fs", default-features = false, features = ["fs", "lock", "transaction"] }
thiserror = "2"
zeroize = "1.9"
# Only for `sqlcipher-libtomcrypt`: names the -sys crate so its `sqlcipher` link (against the library build.rs makes) is in the graph.
libsqlite3-sys = { version = "0.39.1", default-features = false, features = ["bundled_bindings"], optional = true }

[build-dependencies]
cc = { version = "1.2", optional = true }
# Exact, like libsqlite3-sys's own requirement: the SQLCipher/LibTomCrypt sources are the ones proven in rightkit#1447.
sqlcipher-src = { version = "=420.0.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.rightkit]
continuous = false
continuous_reason = "SQLite open, migrate, backup and restore helpers; sleep is a 25 ms back-off between retries of one busy or locked backup step, bounded by the call and its busy_timeout, and a 100 ms pause between at most 20 retries of one Windows sharing or access-denied file operation (backup publish, journal write, relocation cleanup; the retry loop is rightkit_fs::transient), and the crate spawns no thread or continuous work"

# One Cargo workspace and lock per crate (rightkit#1285).
