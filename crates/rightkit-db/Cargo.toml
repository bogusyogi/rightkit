[package]
name = "rightkit-db"
version = "0.3.2"
edition = "2021"
rust-version = "1.98.0"
description = "Correct-by-default SQLite and SQLCipher connection bootstrap for Right Suite apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["sqlite", "sqlcipher", "wal", "database"]
categories = ["database"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]
# SQLCipher with vendored OpenSSL (the same crypto provider on every OS).
sqlcipher = ["cipher", "rusqlite/bundled-sqlcipher-vendored-openssl"]
# SQLCipher with the system crypto provider (CommonCrypto on Apple, libcrypto elsewhere).
# Use it where existing encrypted databases were created with system crypto; switching the
# provider is not a silent refactor.
sqlcipher-system = ["cipher", "rusqlite/bundled-sqlcipher"]
# Enabled by either SQLCipher feature; gates keyed-open and rekey code. Not meant to be named directly.
cipher = []
hooks = ["rusqlite/hooks"]

[dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["backup"] }
# Opts out of rightkit-fs `lock` (nix), `json` (serde), and `digest` (sha2): db needs only atomic writes, sweeps, owner-only files, and netfs.
rightkit-fs = { version = "0.3.0", path = "../rightkit-fs", default-features = false, features = ["fs"] }
thiserror = "2"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
