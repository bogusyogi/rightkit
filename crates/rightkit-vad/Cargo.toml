[package]
name = "rightkit-vad"
version = "0.0.2"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Product-neutral voice activity detection: Silero scorer, hysteresis/padding/chunking policy, streaming frame carry"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-vad"
documentation = "https://docs.rs/rightkit-vad"
keywords = ["vad", "voice-activity", "silero", "onnx", "audio"]
categories = ["multimedia::audio"]
# Fixtures (tests/fixtures) are not packaged; the crate ships source, integration tests, and docs only.
include = ["src/**", "tests/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[[test]]
name = "e2e_silero"
path = "tests/e2e_silero.rs"
required-features = ["silero"]

[lib]
name = "rightkit_vad"
path = "src/lib.rs"

[dependencies]
rightkit-ort = { path = "../rightkit-ort", version = "0.2.2", optional = true }

[dev-dependencies]
hound = "3.5"
rightkit-media = { path = "../rightkit-media", version = "0.2.3" }

[features]
# Default: the Silero scorer over ONNX Runtime tracing only. The crate fetches and copies no
# runtime. Consumers supply ONNX Runtime through rightkit-ort. The API level is fixed by
# rightkit-ort: rc.13's own `default` raises it to ORT 1.27, which the suite's 1.24.4 cannot serve.
# `default-features = false` keeps only the pure policy layers (spans, chunking, frame carry,
# `FrameScorer`) and compiles no ONNX Runtime.
default = ["silero"]
# The `Silero` scorer and `SileroOptions`, over rightkit-ort.
silero = ["dep:rightkit-ort", "rightkit-ort/tracing"]
# Opt-in: fetch prebuilt ONNX Runtime during the build (needs tls-native to download).
download-binaries = ["silero", "rightkit-ort/download-binaries"]
# Opt-in: TLS backend used by download-binaries.
tls-native = ["silero", "rightkit-ort/tls-native"]
# Opt-in: copy the ONNX Runtime dylibs next to the build output.
copy-dylibs = ["silero", "rightkit-ort/copy-dylibs"]
