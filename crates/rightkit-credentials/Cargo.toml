[package]
name = "rightkit-credentials"
version = "0.2.2"
edition = "2021"
rust-version = "1.98.0"
description = "Per-app OS credential storage for Right Suite apps: Keychain / Credential Manager / Linux Secret Service / Android Keystore, passive presence checks, non-interactive mode, test guards, DB-key provisioning, and migration."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["keychain", "credentials", "secrets", "credential-manager"]
categories = ["os", "authentication"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# `impl rightkit_app_settings::SecretProbe for Store` (presence-only adapter).
settings-probe = ["dep:rightkit-app-settings"]
# TEST ONLY. Compiles the throwaway macOS test keychain (`IsolatedKeychain`,
# `KeychainBackend::open_isolated_file`) and the CLI's `--isolated-keychain`. Without it there is
# no write path to an explicit keychain. Never enable it in a shipped build; enable it only as
# `cargo test --features isolated-test-keychain` for the end-to-end suite.
isolated-test-keychain = []

[[bin]]
name = "rightkit-credentials"
path = "src/bin/rightkit-credentials.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
getrandom = "0.4"
zeroize = "1.9"
rightkit-app-settings = { version = "0.2.0", path = "../rightkit-app-settings", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dev-dependencies]
keyring-core = "1"
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tempfile = "3"

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: one thread per keychain or helper call so the call can time out (store.rs run), plus a writer thread and a reader thread per helper exchange (apple_helper.rs), each ends when the OS call, pipe or helper returns or is killed; resident-static: the in-flight table in store.rs holds one entry per credential mutation currently inside an OS call and drops it when that call returns, the process-wide MemoryBackend holds only the secrets the caller stores, and the mint, UI-policy and Windows target locks hold no data; on Linux each mutation waits on a per-user flock, and on Android on a per-directory flock (android.rs), that the holder releases when its call ends; no sleep, listener, timer or watcher (reviewed 2026-10-11)"
