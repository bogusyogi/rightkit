[package]
name = "rightkit-hooks"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Typed Claude Code and Codex hook payloads, a deadline-bound exit-0 dispatcher, exact output builders, and delivery receipts."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["hooks", "claude", "codex", "agents"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
