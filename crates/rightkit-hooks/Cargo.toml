[package]
name = "rightkit-hooks"
version = "0.2.6"
edition = "2021"
rust-version = "1.98.0"
description = "Typed Claude Code and Codex hook payloads, a deadline-bound exit-0 dispatcher, exact output builders, and delivery receipts."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["hooks", "claude", "codex", "agents"]
categories = ["development-tools"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
async-trait = {version = "0.1", optional = true}
rightkit-agent-engine-protocol = {version = "0.2.0", path = "../rightkit-agent-engine-protocol", optional = true}
rightkit-sandbox = {version = "0.6.3", path = "../rightkit-sandbox", features = ["execution"], optional = true}
rightkit-llm = {version = "0.3.2", path = "../rightkit-llm", features = ["agent_providers"], optional = true}
regex = {version = "1", optional = true}
rightkit-child-process = {version = "0.5.7", features = ["tokio"], path = "../rightkit-child-process", optional = true}
thiserror = {version = "2", optional = true}
tokio = {version = "1", features = ["full"], optional = true}

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: one short-lived thread per module per dispatch (dispatch.rs run_module), bounded by the per-module and total deadline and reporting through a result channel; a timed-out module's thread ends when the module returns. No pool, timer, listener, watcher or resident state; the process exits after one hook event"

# One Cargo workspace and lock per crate (rightkit#1285).
[features]
agent_hooks-host-env = ["agent_hooks"]
agent_hooks = ["dep:async-trait", "dep:rightkit-agent-engine-protocol", "dep:rightkit-sandbox", "dep:rightkit-llm", "dep:regex", "dep:rightkit-child-process", "dep:thiserror", "dep:tokio"]
