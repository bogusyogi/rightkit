[package]
name = "rightkit-crypto"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Neutral crypto primitives: SHA-256, HMAC, constant-time compare, base64/base64url, hex, BLAKE3, canonical JSON, approval tokens, Ed25519, ECDSA/RSA verify, AES-GCM and ChaCha20-Poly1305, HKDF, PBKDF2, TOTP, RNG and a wiped secret."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["hmac", "sha256", "ed25519", "aead", "token"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
blake3 = "1.8.7"
ring = "0.17.14"
serde_json = "1.0.154"

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure computation library: hashing, MAC, encoding and token mint/verify; spawns no continuous work, no pattern in the runtime-budgets.mjs set matches non-test src"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
