[package]
name = "rightkit-agent-demo"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Consented agent demo mode for Tauri hosts: an agent drives one catalog app through rightkit-automation while the host records that app's window into a sealed bundle, with an always-visible badge, a kill hotkey and a tray stop item."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["agent", "demo", "automation", "tauri", "recording"]
categories = ["development-tools", "gui"]
include = ["src/**", "examples/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_demo"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4"
rightkit-agent-tools = { version = "0.4.0", path = "../rightkit-agent-tools", default-features = false, features = ["demo"] }
rightkit-automation = { version = "0.7.0", path = "../rightkit-automation" }
rightkit-record = { version = "0.4.0", path = "../rightkit-record" }
rightkit-hotkeys = { version = "0.1.2", path = "../rightkit-hotkeys" }
rightkit-overlay = { version = "0.2.0", path = "../rightkit-overlay" }
rightkit-contracts = { version = "0.1.8", path = "../rightkit-contracts", default-features = false }
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials" }
rightkit-daemon = { version = "0.9.0", path = "../rightkit-daemon" }
rightkit-roots = { version = "0.2.0", path = "../rightkit-roots" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs"] }
rightkit-logs = { version = "0.4.0", path = "../rightkit-logs", default-features = false }
rightkit-tauri-shell = { version = "0.8.0", path = "../rightkit-tauri-shell", default-features = false, features = ["wv2-0_39"] }

[[example]]
name = "demo-fixture"
path = "examples/demo-fixture.rs"

# Class: held-resource (docs/RUNTIME-BUDGETS.md). A recording thread exists only between a consented session start and its stop,
# kill or seal; nothing runs while no demo session is live.
[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "RecorderHandle::spawn"
file = "src/recorder.rs"
holds = ["thread"]
scale = "one recorder worker thread per host process, respawned only if it dies; it drives at most one rightkit-record take at a time, whose memory is bounded by rightkit-record, and is idle between takes"
harness = false
