[package]
name = "rightkit-agent-policy"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent tool-use policy: permission modes, command classification, path and network rules for agent hosts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_policy"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
globset = { version = "0.4" }
thiserror = { version = "2" }
toml = { version = "1.1" }
tokio = { version = "1", features = ["net", "macros", "rt"] }
tree-sitter = { version = "0.27" }
tree-sitter-bash = { version = "0.25" }
rightkit-agent-engine-protocol = { version = "0.1.0", path = "../rightkit-agent-engine-protocol" }
rightkit-http = { version = "0.3.9", features = ["gzip", "untrusted", "async"], path = "../rightkit-http" }
rightkit-sandbox = {version = "0.6.2", path = "../rightkit-sandbox", features = ["execution"], optional = true}

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0

[features]
legion = ["dep:rightkit-sandbox"]

[dev-dependencies]
async-trait = {version = "0.1"}
tokio = {version = "1", features = ["macros", "rt"]}
[[test]]
name = "legion_conformance"
path = "tests/legion_conformance.rs"
required-features = ["legion"]
