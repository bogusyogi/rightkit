[package]
name = "rightkit-agent-policy"
version = "0.1.3"
edition = "2021"
rust-version = "1.98.0"
description = "Agent tool-use policy: permission modes, command classification, path and network rules for agent hosts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_policy"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
# The binding digest of an approval (`PayloadDigest::of`).
rightkit-approvals = { version = "0.2.0", default-features = false, path = "../rightkit-approvals" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
globset = { version = "0.4" }
thiserror = { version = "2" }
toml = { version = "1.1" }
tokio = { version = "1", features = ["net", "macros", "rt"] }
tree-sitter = { version = "0.27" }
tree-sitter-bash = { version = "0.25" }
rightkit-agent-engine-protocol = { version = "0.2.0", path = "../rightkit-agent-engine-protocol" }
rightkit-http = { version = "0.4.0", features = ["gzip", "untrusted", "async"], path = "../rightkit-http" }
rightkit-sandbox = {version = "0.6.3", path = "../rightkit-sandbox", features = ["execution"], optional = true}

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[features]
legion = ["dep:rightkit-sandbox"]
