[package]
name = "rightkit-dictation-core"
version = "0.2.2"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation core: engine wire protocol and validation, provider key handoff, recording session state machine and controller, wake word state, mic selection and audio conditioning."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_core"
path = "src/lib.rs"

[features]
# Compiles the test-only switches (`dev_var!`, `RIGHTKIT_APP_DATA_DIR`, the test-binary data root).
# Never enable it in a release build.
test-mode = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
rightkit-credentials = { version = "0.4.3", path = "../rightkit-credentials" }
rightkit-speech-client = { version = "=0.4.2", path = "../rightkit-speech-client" }
rightkit-transcript-library = { version = "0.1.0", path = "../rightkit-transcript-library" }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["app-dirs"] }
rightkit-logs = { version = "0.3.7", path = "../rightkit-logs", default-features = false }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
