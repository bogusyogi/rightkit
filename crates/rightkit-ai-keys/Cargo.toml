[package]
name = "rightkit-ai-keys"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Bring-your-own AI provider keys in the OS credential store: slot storage, save-time validation, live key check and read-state vocabulary."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md"]

[dependencies]
rightkit-credentials = { version = "0.5.7", path = "../rightkit-credentials" }
rightkit-http = { version = "0.4.0", path = "../rightkit-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.rightkit]
continuous = false
continuous_reason = "synchronous operations per host action; read_all_retrying delegates one 100 ms sleep after a failed slot read to rightkit-credentials; HTTP may perform deadline-bounded DNS, retry or body-reader work in rightkit-http; no background listener, watcher or resident state owned by this crate"
