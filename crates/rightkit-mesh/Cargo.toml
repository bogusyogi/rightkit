[package]
name = "rightkit-mesh"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
description = "Device mesh for Right Suite apps: iroh live sessions between paired devices, end-to-end encrypted mailbox, sync reconciliation and capped relayed transfers. The host supplies identity and trust through PeerTrust."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["mesh", "p2p", "iroh", "sync", "e2ee"]
categories = ["network-programming"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_mesh"
path = "src/lib.rs"

[[bin]]
name = "rightkit-mesh-mailbox"
path = "src/bin/rightkit-mesh-mailbox.rs"

[features]
default = ["fast-apple-datapath"]
# iroh's fast-apple-datapath (sendmsg_x/recvmsg_x batching on macOS); phone builds (FFI) turn it off: private syscalls fail App Store review.
fast-apple-datapath = ["iroh/fast-apple-datapath"]
# The device link (`devicelink` module): pairing, the paired-device registry, the device circle and per-request authorization,
# transport-agnostic. Off by default; the phone (FFI) builds do not need it.
devicelink = [
    "dep:rightkit-device-link-types",
    "dep:rightkit-owner-approvals",
    "dep:rightkit-credentials",
    "dep:rightkit-crypto",
    "dep:rightkit-sidecar",
    "rightkit-fs/lock",
]

[dependencies]
# Pinned: 1.4.1 (2026-10-22). 1.3.0 had upstream n0-computer/iroh#4390 (pending_open_paths grew without bound with two or more
# connections to one peer: a 58 GB engine, Pulse #501); fixed in 1.4.0/1.4.1. Do not go back below 1.4.1. iroh's defaults (metrics, fast-apple-datapath, portmapper, tls-ring) are
# listed explicitly, minus fast-apple-datapath, which is the rightkit-mesh feature of the same name. Presets::N0 is never used:
# no n0 relay, no n0 DNS or pkarr (src/endpoint.rs).
iroh = { version = "=1.4.1", default-features = false, features = ["metrics", "portmapper", "tls-ring"] }
# Local-network (mDNS) address lookup, so paired devices on one network connect directly with no relay. Depends on iroh ^1 (0.6.0 and 0.6.1 both declare ^1.0.0, so 0.6.0 stays).
iroh-mdns-address-lookup = "=0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.17"
# HKDF-SHA256, ChaCha20-Poly1305 and the system RNG for the seal (src/seal.rs): ring only, no second crypto family.
ring = "0.17"
# Wipes mailbox keys on drop; already in the lock through pulse-core.
zeroize = "1"
# Atomic store writes and hex (mailbox/store.rs, caps.rs, util.rs).
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["fs", "digest"] }
# Structured mailbox event lines (mailbox/server.rs, bin/rightkit-mesh-mailbox.rs).
rightkit-logs = { version = "0.3.7", path = "../rightkit-logs", default-features = false }

# Device link (src/devicelink), behind the `devicelink` feature.
rightkit-device-link-types = { version = "0.1.0", path = "../rightkit-device-link-types", optional = true }
rightkit-owner-approvals = { version = "0.1.0", path = "../rightkit-owner-approvals", optional = true }
# Device identity seed in the OS credential store.
rightkit-credentials = { version = "0.4.2", path = "../rightkit-credentials", optional = true }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto", optional = true }
# Bounded newline-delimited JSON frames for the pairing channel.
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar", optional = true }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
