[package]
name = "rightkit-dictation-app-runtime"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Dictation app runtime: the shell-side engine supervisor (spawn, launch frame, health, restart, sidecar logs) and engine process handle for a dictation app."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "examples/**", "build.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_app_runtime"
path = "src/lib.rs"

[features]
test-mode = ["rightkit-daemon/test-mode", "rightkit-dictation-core/test-mode", "rightkit-dictation-models/test-mode"]

[dependencies]
rightkit-dictation-core = { version = "0.2.0", path = "../rightkit-dictation-core" }
rightkit-transcript-library = { version = "0.1.0", path = "../rightkit-transcript-library" }
rightkit-dictation-models = { version = "0.1.0", path = "../rightkit-dictation-models" }
rightkit-dictation-telemetry = { version = "0.1.0", path = "../rightkit-dictation-telemetry" }
rightkit-daemon = { version = "0.5.1", default-features = false, path = "../rightkit-daemon" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "app-dirs"], path = "../rightkit-fs" }
rightkit-logs = { version = "0.3.7", default-features = false, path = "../rightkit-logs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rightkit-job-queue = { version = "0.5.1", default-features = false, features = ["supervisor"], path = "../rightkit-job-queue" }

[[example]]
name = "shared_store_smoke"
required-features = ["test-mode"]

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
