[package]
name = "rightkit-context-client"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Transport-injected client for canonical context v1 operation envelopes."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_context_client"
path = "src/lib.rs"

[dependencies]
rightkit-context-protocol = { version = "0.2.0", path = "../rightkit-context-protocol" }
serde_json = { version = "1" }
rightkit-daemon = { version = "0.8.0", path = "../rightkit-daemon" }
