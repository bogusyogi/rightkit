[package]
name = "rightkit-asr"
version = "0.0.1"
edition = "2021"
rust-version = "1.98.0"
publish = false
license = "MIT"
description = "Internal reconciled Parakeet ONNX + Whisper (CoreML / whisper.cpp) decoding runtime for Right Suite applications"
readme = "README.md"
repository = "https://github.com/adrdsouza/claude"
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "UPSTREAM.toml",
  "PATCHES.md",
  "tests/fixtures/**",
]

[lib]
name = "rightkit_asr"
path = "src/lib.rs"

[dependencies]
eyre = "0.6"
half = "2"
hound = "3.5"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-24", "half"] }
realfft = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.9"
rightkit-vad = { path = "../rightkit-vad" }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-ml = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
rightkit-media = { path = "../rightkit-media", version = "=0.2.0" }
rightkit-ort = { path = "../rightkit-ort", version = "=0.1.2" }

[features]
default = ["cpu", "ort-defaults"]
cpu = []
# ort rc.13's own `default` raises the API floor to 27 (ORT 1.27), which the
# suite's approved 1.24.4 runtime cannot serve. Keep rc.12's default set with
# the suite API level instead of `ort/default`.
ort-defaults = ["ort/std", "ort/ndarray", "ort/tracing", "ort/download-binaries", "ort/tls-native", "ort/copy-dylibs", "ort/api-24"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
migraphx = ["ort/migraphx"]
openvino = ["ort/openvino"]
webgpu = ["ort/webgpu"]
nnapi = ["ort/nnapi"]
sortformer = []
multitalker = ["sortformer"]
cohere = []
load-dynamic = ["ort/load-dynamic"]
preload-dylibs = ["ort/preload-dylibs"]
