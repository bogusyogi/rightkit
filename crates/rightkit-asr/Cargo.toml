[package]
name = "rightkit-asr"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Internal reconciled Parakeet ONNX runtime for Right Suite applications"
readme = "README.md"
repository = "https://github.com/adrdsouza/claude"
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "UPSTREAM.toml",
  "PATCHES.md",
]

[lib]
name = "rightkit_asr"
path = "src/lib.rs"

[dependencies]
eyre = "0.6"
half = "2"
hound = "3.5"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24", "half"] }
realfft = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[features]
default = ["cpu", "ort-defaults"]
cpu = []
ort-defaults = ["ort/default"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
migraphx = ["ort/migraphx"]
openvino = ["ort/openvino"]
webgpu = ["ort/webgpu"]
nnapi = ["ort/nnapi"]
sortformer = []
multitalker = ["sortformer"]
cohere = []
load-dynamic = ["ort/load-dynamic"]
preload-dylibs = ["ort/preload-dylibs"]
