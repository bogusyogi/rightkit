[package]
name = "rightkit-asr"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Parakeet ONNX + Whisper (CoreML / whisper.cpp) speech decoding runtime for Right Suite applications"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
homepage = "https://github.com/Orthic-Labs/rightkit/tree/main/crates/rightkit-asr"
documentation = "https://docs.rs/rightkit-asr"
keywords = ["speech-recognition", "asr", "parakeet", "whisper", "onnx"]
categories = ["multimedia::audio"]
include = [
  "src/**",
  "tests/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "UPSTREAM.toml",
  "PATCHES.md",
  "CHANGELOG.md",
]

[lib]
name = "rightkit_asr"
path = "src/lib.rs"

[dependencies]
half = "2"
hound = "3.5"
ndarray = "0.17"
realfft = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.9"
rightkit-onnx = { path = "../rightkit-onnx", version = "0.2.2", features = ["ndarray", "half"] }
rightkit-transcript = { version = "0.3.0", path = "../rightkit-transcript" }
rightkit-vad = { version = "0.1.0", path = "../rightkit-vad", default-features = false }
# Optional since 0.2.0: only the `whisper-tokenizers` feature pulls the HF tokenizers
# crate (and its C regex build). Parakeet CoreML and ONNX TDT paths do not need it.
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-ml = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
# The e2e_whisper test drives the Silero scorer, which rightkit-vad now gates behind `silero`.
rightkit-vad = { version = "0.1.0", path = "../rightkit-vad", features = ["silero"] }
rightkit-ffmpeg = { path = "../rightkit-ffmpeg", version = "0.2.3" }
rightkit-speech-client = { path = "../rightkit-speech-client", version = "0.3.3" }

[features]
default = ["cpu", "ort-defaults", "whisper-tokenizers"]
cpu = []
# HF tokenizers for the Whisper CoreML decoder, the CTC and EOU Parakeet decoders
# and Cohere. Off: the Parakeet CoreML and ONNX TDT paths build without the C
# tokenizers dependency (use `default-features = false`).
whisper-tokenizers = ["dep:tokenizers"]
# ort rc.13's own `default` raises the API floor to 27 (ORT 1.27), which the
# suite's approved 1.24.4 runtime cannot serve. Keep rc.12's default set with
# the suite API level instead of `ort/default`.
# Kept as a name for existing feature lists; it no longer enables ONNX Runtime log forwarding.
ort-defaults = []
# Opt-in: forward ONNX Runtime's own log lines into `tracing` (process-wide through feature
# unification; thousands of INFO lines per model load).
ort-tracing = ["rightkit-onnx/tracing"]
# Build-time ONNX Runtime fetch is opt-in (inventory 1.1); the suite loads ORT through rightkit-onnx.
ort-download = ["rightkit-onnx/download-binaries", "rightkit-onnx/tls-native", "rightkit-onnx/copy-dylibs"]
cuda = ["rightkit-onnx/cuda"]
tensorrt = ["rightkit-onnx/tensorrt"]
coreml = ["rightkit-onnx/coreml"]
directml = ["rightkit-onnx/directml"]
migraphx = ["rightkit-onnx/migraphx"]
openvino = ["rightkit-onnx/openvino"]
webgpu = ["rightkit-onnx/webgpu"]
nnapi = ["rightkit-onnx/nnapi"]
sortformer = []
multitalker = ["sortformer"]
cohere = ["whisper-tokenizers"]
# rightkit-onnx always loads ONNX Runtime dynamically; kept so existing feature lists resolve.
load-dynamic = []
preload-dylibs = ["rightkit-onnx/preload-dylibs"]
