[package]
name = "rightkit-asr"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Parakeet ONNX + Whisper (CoreML / whisper.cpp) speech decoding runtime for Right Suite applications"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-asr"
documentation = "https://docs.rs/rightkit-asr"
keywords = ["speech-recognition", "asr", "parakeet", "whisper", "onnx"]
categories = ["multimedia::audio"]
include = [
  "src/**",
  "tests/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "UPSTREAM.toml",
  "PATCHES.md",
  "CHANGELOG.md",
]

[lib]
name = "rightkit_asr"
path = "src/lib.rs"

[dependencies]
half = "2"
hound = "3.5"
ndarray = "0.17"
realfft = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.9"
rightkit-ort = { path = "../rightkit-ort", version = "0.2.2", features = ["ndarray", "half"] }
rightkit-transcript = { version = "0.2.0", path = "../rightkit-transcript" }
rightkit-vad = { version = "0.0.3", path = "../rightkit-vad", default-features = false }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-ml = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
# The e2e_whisper test drives the Silero scorer, which rightkit-vad now gates behind `silero`.
rightkit-vad = { version = "0.0.3", path = "../rightkit-vad", features = ["silero"] }
rightkit-media = { path = "../rightkit-media", version = "0.2.3" }
rightkit-speech-client = { path = "../rightkit-speech-client", version = "0.3.3" }

[features]
default = ["cpu", "ort-defaults"]
cpu = []
# ort rc.13's own `default` raises the API floor to 27 (ORT 1.27), which the
# suite's approved 1.24.4 runtime cannot serve. Keep rc.12's default set with
# the suite API level instead of `ort/default`.
ort-defaults = ["rightkit-ort/tracing"]
# Build-time ONNX Runtime fetch is opt-in (inventory 1.1); the suite loads ORT through rightkit-ort.
ort-download = ["rightkit-ort/download-binaries", "rightkit-ort/tls-native", "rightkit-ort/copy-dylibs"]
cuda = ["rightkit-ort/cuda"]
tensorrt = ["rightkit-ort/tensorrt"]
coreml = ["rightkit-ort/coreml"]
directml = ["rightkit-ort/directml"]
migraphx = ["rightkit-ort/migraphx"]
openvino = ["rightkit-ort/openvino"]
webgpu = ["rightkit-ort/webgpu"]
nnapi = ["rightkit-ort/nnapi"]
sortformer = []
multitalker = ["sortformer"]
cohere = []
# rightkit-ort always loads ONNX Runtime dynamically; kept so existing feature lists resolve.
load-dynamic = []
preload-dylibs = ["rightkit-ort/preload-dylibs"]
