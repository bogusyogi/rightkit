[package]
name = "rightkit-asr"
version = "0.2.4"
edition = "2021"
rust-version = "1.98.0"
publish = true
license = "MIT"
description = "Parakeet ONNX + Whisper (CoreML / whisper.cpp) speech decoding runtime for Right Suite applications"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
homepage = "https://github.com/Orthic-Labs/rightkit/tree/main/crates/rightkit-asr"
documentation = "https://docs.rs/rightkit-asr"
keywords = ["speech-recognition", "asr", "parakeet", "whisper", "onnx"]
categories = ["multimedia::audio"]
include = [
  "src/**",
  "tests/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "UPSTREAM.toml",
  "PATCHES.md",
  "CHANGELOG.md",
]

[lib]
name = "rightkit_asr"
path = "src/lib.rs"

[dependencies]
half = "2"
hound = "3.5"
ndarray = "0.17"
realfft = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rightkit-onnx = { path = "../rightkit-onnx", version = "0.2.2", features = ["ndarray", "half"] }
rightkit-transcript = { version = "0.3.0", path = "../rightkit-transcript" }
rightkit-vad = { version = "0.1.0", path = "../rightkit-vad", default-features = false }
# Optional since 0.2.0: only the `whisper-tokenizers` feature pulls the HF tokenizers
# crate (and its C regex build). Parakeet CoreML and ONNX TDT paths do not need it.
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }

# whisper.cpp is bound through dlopen; it is not compiled for Android (see `src/whisper/cpp_android.rs`).
[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 ={ version = "0.6", features = ["exception"] }
objc2-core-ml = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
# The e2e_whisper test drives the Silero scorer, which rightkit-vad now gates behind `silero`.
rightkit-vad = { version = "0.1.0", path = "../rightkit-vad", features = ["silero"] }
rightkit-ffmpeg = { path = "../rightkit-ffmpeg", version = "0.2.3" }
rightkit-speech-client = { path = "../rightkit-speech-client", version = "0.3.3" }

[features]
default = ["cpu", "ort-defaults", "whisper-tokenizers"]
cpu = []
# HF tokenizers for the Whisper CoreML decoder, the CTC and EOU Parakeet decoders
# and Cohere. Off: the Parakeet CoreML and ONNX TDT paths build without the C
# tokenizers dependency (use `default-features = false`).
whisper-tokenizers = ["dep:tokenizers"]
# ort rc.13's own `default` raises the API floor to 27 (ORT 1.27), which the
# suite's approved 1.24.4 runtime cannot serve. Keep rc.12's default set with
# the suite API level instead of `ort/default`.
# Kept as a name for existing feature lists; it no longer enables ONNX Runtime log forwarding.
ort-defaults = []
# Opt-in: forward ONNX Runtime's own log lines into `tracing` (process-wide through feature
# unification; thousands of INFO lines per model load).
ort-tracing = ["rightkit-onnx/tracing"]
# Build-time ONNX Runtime fetch is opt-in (inventory 1.1); the suite loads ORT through rightkit-onnx.
ort-download = ["rightkit-onnx/download-binaries", "rightkit-onnx/tls-native", "rightkit-onnx/copy-dylibs"]
cuda = ["rightkit-onnx/cuda"]
tensorrt = ["rightkit-onnx/tensorrt"]
coreml = ["rightkit-onnx/coreml"]
directml = ["rightkit-onnx/directml"]
migraphx = ["rightkit-onnx/migraphx"]
openvino = ["rightkit-onnx/openvino"]
webgpu = ["rightkit-onnx/webgpu"]
nnapi = ["rightkit-onnx/nnapi"]
# Android: ONNX Runtime XNNPACK provider on the CPU (`ExecutionProvider::Xnnpack`). Not verified on a device.
xnnpack = ["rightkit-onnx/xnnpack"]
sortformer = []
multitalker = ["sortformer"]
cohere = ["whisper-tokenizers"]
# rightkit-onnx always loads ONNX Runtime dynamically; kept so existing feature lists resolve.
load-dynamic = []
preload-dylibs = ["rightkit-onnx/preload-dylibs"]

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "ModelConfig::new"
file = "src/execution.rs"
holds = ["thread", "memory"]
scale = "no resource of its own: ModelConfig carries the intra-op and inter-op thread counts, execution provider and graph optimization level that apply_to_session_builder applies to every ORT session the model types in this crate build; the threads and arenas live in those sessions"
release = "Drop of the model or engine that was built from it"

[[package.metadata.rightkit.resources]]
api = "ParakeetModel::from_pretrained"
file = "src/model.rs"
holds = ["memory", "thread"]
scale = "one ONNX session: model weights, ORT arenas and the configured intra-op and inter-op threads; fixed per ParakeetModel, independent of audio length"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "CohereModel::from_pretrained"
file = "src/model_cohere.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder and merged decoder): weights, ORT arenas and the configured threads; fixed per model, independent of audio length. CohereModel is pub(crate); the public holder is CohereASR (cohere.rs)"
release = "Drop of the CohereASR that owns it"

[[package.metadata.rightkit.resources]]
api = "ParakeetEOUModel::from_pretrained"
file = "src/model_eou.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder and decoder-joint): weights, ORT arenas and the configured threads, plus a fixed-size EncoderCache per stream; fixed per model, independent of audio length"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "MultitalkerModel::from_pretrained"
file = "src/model_multitalker.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder with speaker-target inputs, and decoder-joint): weights, ORT arenas and the configured threads, plus a fixed-size MultitalkerEncoderCache; fixed per model, independent of audio length. MultitalkerModel is pub(crate); the public holder is MultitalkerASR (multitalker.rs)"
release = "Drop of the MultitalkerASR that owns it"

[[package.metadata.rightkit.resources]]
api = "NemotronModel::from_pretrained"
file = "src/model_nemotron.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder and decoder-joint): weights, ORT arenas and the configured threads, plus a fixed-size NemotronEncoderCache per stream; fixed per model, independent of audio length"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "ParakeetTDTModel::from_pretrained"
file = "src/model_tdt.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder and decoder-joint): weights, ORT arenas and the configured threads; fixed per model, independent of audio length"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "TransducerModel"
file = "src/model_transducer.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder and decoder-joint): weights, ORT arenas and the configured threads, plus optional context-bias tables; fixed per TransducerModel, independent of audio length"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "ParakeetUnifiedModel::from_pretrained"
file = "src/model_unified.rs"
holds = ["memory", "thread"]
scale = "two ONNX sessions (encoder and decoder-joint): weights, ORT arenas and the configured threads; fixed per model, independent of audio length"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "Sortformer::new"
file = "src/sortformer.rs"
holds = ["memory", "thread"]
scale = "one ONNX session plus streaming state: speaker cache, FIFO, silence embedding and mel basis sized by the model's chunk, FIFO and speaker-cache lengths, and an audio buffer that feed() drains to less than one window per call; fixed per Sortformer, independent of total audio fed"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "Transducer::load"
file = "src/transducer.rs"
holds = ["memory", "thread"]
scale = "the TransducerModel sessions (encoder and decoder-joint) plus an optional mel_nemo.onnx preprocessor session pinned to the CPU provider, with vocabulary and decoder tables; fixed per Transducer, independent of audio length"
release = "Drop"
