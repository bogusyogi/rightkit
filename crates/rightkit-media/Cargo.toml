[package]
name = "rightkit-media"
version = "0.2.4"
edition = "2021"
rust-version = "1.98.0"
description = "Verified FFmpeg artifact and lifecycle primitives for Right Suite media pipelines."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["ffmpeg", "audio", "media", "process"]
categories = ["multimedia::audio"]
include = ["src/**", "tests/**", "catalog/**", "recipes/**", "third-party/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-fs = { version = "0.3", path = "../rightkit-fs", default-features = false, features = ["digest"] }
rightkit-process = { path = "../rightkit-process", version = "0.3.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3"
