[package]
name = "rightkit-google-identity"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Deprecated, unpublished: re-exports the Google sign-in of rightkit-oauth (feature `google`). Use rightkit-oauth."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["google", "oauth", "pkce", "identity"]
# Deprecated and unpublished from 0.3.0 (shape matrix decision 9): its PKCE and ID-token verification duplicated
# rightkit-oauth (feature `google`), which rightkit-google-apis uses. No dependant; 0.1.0 stays on crates.io.
publish = false
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-oauth = { version = "0.10.5", path = "../rightkit-oauth", default-features = false, features = ["google"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "re-export only; the runtime behaviour is that of rightkit-oauth, whose own continuous_reason applies"

# One Cargo workspace and lock per crate (rightkit#1285).
