[package]
name = "rightkit-google-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Sign in with Google protocol pieces for Right Suite apps: OAuth PKCE request and redirect handling, token response and ID-token claim checks, and refresh-token storage in rightkit-credentials."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["google", "oauth", "pkce", "identity"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
getrandom = "0.4"
rightkit-credentials = { version = "0.3.0", path = "../rightkit-credentials" }

[package.metadata.rightkit]
continuous = false
continuous_reason = "protocol helpers: pure string and JSON functions plus one credential-store call per invocation; spawns no thread, timer, listener or watcher and performs no network I/O (the app owns the browser launch and the HTTP calls)"
