[package]
name = "rightkit-presence"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Meeting and fullscreen presence detection and Do-Not-Disturb state without Tauri: window observation, environment classification, automatic and manual preferences."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["presence", "do-not-disturb", "meeting"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_presence"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL", "NSValue", "NSGeometry", "NSObject", "NSBundle", "NSDictionary", "NSError"] }
