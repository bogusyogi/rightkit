[package]
name = "rightkit-approvals"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "In-app approval of paid drafts and deliveries: single-use challenges, launch-secret tokens minted by the shell and verified by the engine, parent binding, host-registered draft kinds"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_approvals"
path = "src/lib.rs"

[features]

[dependencies]
rightkit-media-gen = { version = "0.1.0", path = "../rightkit-media-gen" }
serde_json = { version = "1.0", features = ["preserve_order"] }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-contracts = { version = "0.1.8", path = "../rightkit-contracts" }
rightkit-daemon = { version = "0.8.0", path = "../rightkit-daemon" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }
time = { version = "0.3", features = ["formatting", "macros"] }
