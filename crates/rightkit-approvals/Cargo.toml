[package]
name = "rightkit-approvals"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "One approvals core for every app: a pending request bound to a digest of its exact arguments, destination, expiry and revision; one decision rule; single-use claims; a Store trait with in-memory and file stores; a Proof trait for who decided."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["approval", "authorization", "consent"]
categories = ["authentication"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_approvals"
path = "src/lib.rs"

[features]
default = ["file"]
# `FileStore`: one JSON file per request with marker files for its moves (atomic, owner-only).
file = ["rightkit-fs/fs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Request ids from the OS random source (no fallback: no source, no request).
getrandom = "0.4"
# SHA-256 and hex for the binding digests; `fs` (atomic, owner-only writes) only with `file`.
rightkit-fs = { version = "0.4.9", default-features = false, features = ["digest"], path = "../rightkit-fs" }
