[package]
name = "rightkit-approvals"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "In-app approval of paid drafts and deliveries: single-use challenges, launch-secret tokens minted by the shell and verified by the engine, parent binding, host-registered draft kinds"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_approvals"
path = "src/lib.rs"

[features]
# QA and dev builds only: the approval test secret (never against the user's real folder).
test-mode = ["rightkit-media-gen/test-mode"]

[dependencies]
rightkit-media-gen = { version = "0.1.0", path = "../rightkit-media-gen" }
serde_json = { version = "1.0", features = ["preserve_order"] }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-daemon = { version = "0.5.0", path = "../rightkit-daemon" }
rightkit-fs = { version = "0.4.8", default-features = false, features = ["fs", "lock", "digest", "app-dirs"], path = "../rightkit-fs" }

[dev-dependencies]
ctor = { version = "1.0" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
