[package]
name = "rightkit-app-icon"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Application icons as PNG bytes or data URLs, by executable path, process name or bundle: shell icon, App Paths, Start-menu shortcuts and packaged-app logos on Windows, NSWorkspace on macOS, with a bounded memory cache and a persistent PNG cache."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["icon", "png", "windows", "macos", "shell"]
categories = ["os", "multimedia::images"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-crypto = { version = "0.1.3", path = "../rightkit-crypto" }
rightkit-fs = { version = "0.5.0", path = "../rightkit-fs", default-features = false, features = ["fs", "digest"] }
# Bounded inflate of PNG IDAT data (src/decode.rs). Pure Rust, forbid(unsafe_code); already in the RightKit
# workspace lockfile (via png 0.18.1), so it adds no new package. Default features only (with-alloc).
miniz_oxide = "=0.8.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[package.metadata.rightkit]
continuous = false
continuous_reason = "Library of blocking calls a host makes on demand; no thread, no polling loop and no network."
