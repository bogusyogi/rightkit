[package]
name = "rightkit-agent-engine-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine command-line argument model"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
