[package]
name = "rightkit-autostart"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Launch at login without Tauri: LaunchAgent or SMAppService on macOS, HKCU Run on Windows, XDG autostart on Linux, with migration from tauri-plugin-autostart entries."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["autostart", "login-item", "launch-at-login"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_autostart"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL", "NSValue", "NSGeometry", "NSObject", "NSBundle", "NSDictionary", "NSError"] }
