[package]
name = "rightkit-qts"
version = "0.2.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/Orthic-Labs/rightkit"
description = "Qwen3 TTS inference (GGUF + GGML), vendored from yet-another-ai/qts v0.2.0 for RightKit"
readme = "README.md"
include = ["src/**", "proto/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "PINNED.md", "CHANGELOG.md", "testdata/**"]

[lib]
name = "qts"

[features]
default = []  # GenRight: backends are selected by genright-qts features
metal = ["rightkit-qts-ggml-sys/metal"]
vulkan = ["rightkit-qts-ggml-sys/vulkan"]
blas = ["rightkit-qts-ggml-sys/blas"]
native = ["rightkit-qts-ggml-sys/native"]
acl = ["rightkit-ort/acl"]
armnn = ["rightkit-ort/armnn"]
azure = ["rightkit-ort/azure"]
cann = ["rightkit-ort/cann"]
coreml = ["rightkit-ort/coreml"]
cuda = ["rightkit-ort/cuda"]
directml = ["rightkit-ort/directml"]
migraphx = ["rightkit-ort/migraphx"]
nnapi = ["rightkit-ort/nnapi"]
nvrtx = ["rightkit-ort/nvrtx"]
onednn = ["rightkit-ort/onednn"]
openvino = ["rightkit-ort/openvino"]
qnn = ["rightkit-ort/qnn"]
rknpu = ["rightkit-ort/rknpu"]
tensorrt = ["rightkit-ort/tensorrt"]
tvm = ["rightkit-ort/tvm"]
vitis = ["rightkit-ort/vitis"]
webgpu = ["rightkit-ort/webgpu"]
xnnpack = ["rightkit-ort/xnnpack"]

[dependencies]
rightkit-qts-ggml-sys = { path = "../rightkit-qts-ggml-sys", version = "0.1.0", default-features = false }
thiserror = "2"
getrandom = "0.3"
hound = "3.5.1"
rustfft = "6.4.1"
prost = "0.14"
rightkit-ort = { path = "../rightkit-ort", version = "0.2.2", features = ["tracing"] }


