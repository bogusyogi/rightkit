[package]
name = "rightkit-agent-orchestration"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent orchestration: multi-agent planning, worker dispatch, routing between cheap and capable models, and task graph execution"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_orchestration"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = {version = "0.1.0", path = "../rightkit-crypto"}
rightkit-agent-engine-tasks = {version = "0.1.0", path = "../rightkit-agent-engine-tasks"}
rightkit-cache = {version = "0.2.3", path = "../rightkit-cache"}
rightkit-agent-engine-protocol = {version = "0.1.0", path = "../rightkit-agent-engine-protocol"}
rightkit-agent-skills = {version = "0.1.0", path = "../rightkit-agent-skills"}
rightkit-llm = {version = "0.4.0", path = "../rightkit-llm", features = ["agent_providers", "agent_router"]}
rightkit-repo-graph = {version = "0.1.0", path = "../rightkit-repo-graph"}
rightkit-logs = {version = "0.4.0", path = "../rightkit-logs", features = ["agent_telemetry"]}
rightkit-sandbox = {version = "0.7.0", path = "../rightkit-sandbox", features = ["execution"]}
rightkit-agent-tools = {version = "0.4.0", path = "../rightkit-agent-tools", features = ["coding_tools"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
toml = {version = "1.1"}
tokio = {version = "1", features = ["full"]}
async-trait = {version = "0.1"}
rightkit-db = {version = "0.5.3", features = ["bundled", "statement-cache"], path = "../rightkit-db"}
rightkit-fs = {version = "0.4.8", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs"}

[features]
default = ["host", "os-keyring"]
host = ["rightkit-agent-tools/coding_tools-host"]
os-keyring = ["rightkit-llm/agent_providers-os-keyring", "rightkit-llm/agent_router-os-keyring"]

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0

[dev-dependencies]
tokio = {version = "1", features = ["full"]}
tempfile = {version = "3"}
[[test]]
name = "dispatch"
path = "tests/dispatch.rs"

[[test]]
name = "router_proof"
path = "tests/router_proof.rs"
