[package]
name = "rightkit-agent-orchestration"
version = "0.1.6"
edition = "2021"
rust-version = "1.98.0"
description = "Agent orchestration runtime: plans, routes, tasks, budgets, grants, escalation, scheduling, delivery, inventories and platform layers"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_orchestration"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1.92" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
rightkit-code-audit-provider-sdk = { version = "0.1.0", path = "../rightkit-code-audit-provider-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11" }
hex = { version = "0.4.3" }
regex = { version = "1.13.1" }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = { version = "1.1", optional = true }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto", optional = true }
rightkit-agent-engine-tasks = { version = "0.3.0", path = "../rightkit-agent-engine-tasks", optional = true }
rightkit-cache = { version = "0.2.3", path = "../rightkit-cache", optional = true }
rightkit-agent-engine-protocol = { version = "0.4.0", path = "../rightkit-agent-engine-protocol", optional = true }
rightkit-agent-policy = { version = "0.2.1", path = "../rightkit-agent-policy", optional = true }
rightkit-agent-host-traits = { version = "0.1.0", path = "../rightkit-agent-host-traits", optional = true }
rightkit-llm = { version = "0.7.0", path = "../rightkit-llm", features = ["agent_providers", "agent_router"], optional = true }
rightkit-repo-graph = { version = "0.3.1", path = "../rightkit-repo-graph", optional = true }
rightkit-agent-telemetry = { version = "0.1.0", path = "../rightkit-agent-telemetry", optional = true }
rightkit-sandbox = { version = "0.7.0", path = "../rightkit-sandbox", features = ["execution"], optional = true }
rightkit-agent-coding-tools = { version = "0.1.8", path = "../rightkit-agent-coding-tools", optional = true }
rightkit-db = { version = "0.5.3", path = "../rightkit-db", features = ["bundled", "statement-cache"], optional = true }
rightkit-fs = { version = "0.5.0", path = "../rightkit-fs", features = ["fs", "lock", "json", "digest", "transaction"], optional = true }

[features]
default = []
# Multi-agent orchestration for coding agents (module `coding`): registry, router, conductor,
# jury, governance, teams, recovery and the proof harnesses. Skills come from the host through
# `rightkit-agent-host-traits`, never from this crate.
#
# `coding` is the union of the three features below. A host that needs only the light core takes
# `coding-core`; the repository-map and skeletonization surface (`repo_map`, `SkeletonizeConfig`,
# the handoff brief's repository map, `host::set_skeleton_variant`) and the tree-sitter grammars
# behind it come with `coding-repo-graph`; the coding-tools and sandbox dependency edge comes
# with `coding-tools` (its only user, `supervision`, stays behind `coding-host`).
coding = ["coding-core", "coding-repo-graph", "coding-tools"]
coding-core = [
    "dep:toml",
    "dep:rightkit-crypto",
    "dep:rightkit-agent-engine-tasks",
    "dep:rightkit-cache",
    "dep:rightkit-agent-engine-protocol",
    "dep:rightkit-agent-policy",
    "dep:rightkit-agent-host-traits",
    "dep:rightkit-llm",
    "dep:rightkit-agent-telemetry",
    "dep:rightkit-db",
    "dep:rightkit-fs",
]
coding-repo-graph = ["coding-core", "dep:rightkit-repo-graph"]
coding-tools = ["coding-core", "dep:rightkit-agent-coding-tools", "dep:rightkit-sandbox"]
coding-host = ["coding", "coding-os-keyring", "rightkit-agent-coding-tools/host"]
# The OS credential store for the providers, the router and the MCP and provider secrets of the coding tools. Off by default: a host
# without one (an iOS app) takes `coding-core` and never links it. Implies the full `coding`, and `coding-host` implies it, so a host that
# named either before is unchanged.
coding-os-keyring = ["coding", "rightkit-agent-coding-tools/os-keyring", "rightkit-llm/agent_providers-os-keyring", "rightkit-llm/agent_router-os-keyring"]
