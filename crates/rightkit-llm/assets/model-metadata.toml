# Bundled model pricing + capability registry for CodeRight.
#
# One row per model slug. Ships compiled into the binary via `include_str!`
# (offline-safe default) and can be overridden wholesale by a matching file at
# `<config-dir>/model-metadata.toml` (see providers::model_metadata::load()).
#
# Fields:
#   slug                 — provider-native or OpenRouter-style "vendor/model" id
#   prompt_per_m         — USD per 1,000,000 prompt tokens
#   completion_per_m     — USD per 1,000,000 completion tokens
#   context_window_tokens — max context window in tokens
#   compaction_trigger_percent — automatic compaction ratio for this model
#   compaction_reserve_tokens — minimum context headroom retained before a turn
#   compaction_max_output_tokens — provider output cap for the summary request
#   tier                 — "cheap" | "capable" (coarse cost/capability bucket the
#                          router consults; NOT the same as escalation_tier)
#   reasoning            — 0-3, coarse reasoning-depth rating (higher = deeper)
#   tool_schema_class    — tool-calling schema family this model was verified
#                          against ("openai-tools" covers OpenAI-compatible
#                          function-calling used by every provider we route to
#                          today)
#   vision               — true if the model accepts image inputs
#
# CRA-10 (semantic-contracts.md "Model-aware capacity & final insertion"):
# `context_window_tokens` and `compaction_reserve_tokens` above are the exact
# two fields `ModelCapability::capacity_profile()` uses as H8
# `window_tokens`/`reserve_tokens` for the `o200k_base/1` Estimated capacity
# gate. `compaction_trigger_percent` and `compaction_max_output_tokens` never
# substitute for `context_window_tokens` as the effective limit.
#
# Pricing sources are cited in the commit that introduced/changed each row;
# where a provider publishes tiered pricing (e.g. context-length breakpoints),
# the flagship/most representative published rate is used and noted below.
# Unlisted models fall back to the conservative $1/$3 per-1M default in
# `pricing.rs` — never edit that fallback here.

