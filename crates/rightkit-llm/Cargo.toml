[package]
name = "rightkit-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral BYOK LLM clients: Anthropic Messages and OpenAI-compatible chat, streaming, tool use, route failover with circuit breaker, pricing, and prompt-cache discipline."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["llm", "anthropic", "openai", "streaming"]
categories = ["api-bindings"]
include = ["src/**", "tests/**", "assets/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-http = { version = "0.2.0", path = "../rightkit-http" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
rightkit-http = { version = "0.2.0", path = "../rightkit-http", features = ["testing"] }
