[package]
name = "rightkit-llm"
version = "0.3.2"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral BYOK LLM clients: Anthropic Messages and OpenAI-compatible chat, streaming, tool use, route failover with circuit breaker, pricing, and prompt-cache discipline, plus an opt-in provider for installed command-line assistants."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["llm", "anthropic", "openai", "streaming"]
categories = ["api-bindings"]
include = ["src/**", "assets/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Provider that drives an installed, signed-in CLI assistant as a bounded child process.
cli = ["dep:rightkit-child-process"]
agent_providers-os-keyring = ["agent_providers", "dep:rightkit-credentials", "rightkit-oauth/secrets"]
agent_providers-host-env = ["agent_providers", "rightkit-app-settings/agent_config-host-env"]
agent_providers-replay-record = ["agent_providers", "agent_providers-host-env"]
agent_providers = ["dep:rightkit-logs", "dep:rightkit-agent-engine-protocol", "dep:rightkit-agent-policy", "dep:rightkit-app-settings", "dep:thiserror", "dep:tokio", "dep:futures", "dep:rightkit-oauth", "rightkit-http/untrusted", "rightkit-http/async", "dep:rightkit-crypto", "dep:rightkit-fs", "dep:rightkit-time", "dep:url", "dep:bytes", "dep:async-stream", "dep:toml", "dep:dirs", "dep:tiktoken-rs", "agent_providers-os-keyring"]
agent_router-os-keyring = ["agent_router", "agent_providers-os-keyring"]
agent_router = ["agent_providers", "dep:thiserror", "dep:toml", "agent_router-os-keyring"]

[dependencies]
rightkit-http = { version = "0.3.9", path = "../rightkit-http", features = ["gzip"] }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-logs = {version = "0.3.7", default-features = false, features = ["tracing"], path = "../rightkit-logs", optional = true}
rightkit-agent-engine-protocol = {version = "0.1.0", path = "../rightkit-agent-engine-protocol", optional = true}
rightkit-agent-policy = {version = "0.1.0", path = "../rightkit-agent-policy", optional = true}
rightkit-app-settings = {version = "0.3.1", path = "../rightkit-app-settings", features = ["agent_config"], optional = true}
thiserror = {version = "2", optional = true}
tokio = {version = "1", features = ["full"], optional = true}
futures = {version = "0.3", optional = true}
rightkit-credentials = {version = "0.4.3", path = "../rightkit-credentials", optional = true}
rightkit-oauth = {version = "0.10.0", default-features = false, path = "../rightkit-oauth", optional = true}
rightkit-crypto = {version = "0.1.0", path = "../rightkit-crypto", optional = true}
rightkit-fs = {version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs", optional = true}
rightkit-time = {version = "0.1.1", path = "../rightkit-time", optional = true}
url = {version = "2", optional = true}
bytes = {version = "1", optional = true}
async-stream = {version = "0.3", optional = true}
toml = {version = "1.1", optional = true}
dirs = {version = "7", optional = true}
tiktoken-rs = {version = "0.12", optional = true}

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: one provider-stream thread per failover attempt (failover.rs) and per-CLI-call stdin writer and pipe reader threads (provider/cli.rs), each ends when the stream, pipe or child ends and is bounded by the policy timeouts; no listener, timer or resident model; on non-Linux Unix the child runs under a /bin/sh supervisor whose watcher polls once a second and exits with the child (reviewed 2026-10-16); resident-static: health.rs keeps one mutex-protected LRU registry with 256 fixed slots and at most 32 KiB of Box<str> route names, at most one exact-length allocation per occupied slot; inline mutex/slot storage is compile-time limited to 32 KiB; insertions evict oldest entries before allocating and oversized names are ignored, so retention cannot grow with route churn and no background work runs (reviewed 2026-10-18)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
