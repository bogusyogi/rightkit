[package]
name = "rightkit-llm"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Brand-neutral BYOK LLM clients: Anthropic Messages and OpenAI-compatible chat, streaming, tool use, route failover with circuit breaker, pricing, and prompt-cache discipline, plus an opt-in provider for installed command-line assistants."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["llm", "anthropic", "openai", "streaming"]
categories = ["api-bindings"]
include = ["src/**", "tests/**", "assets/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Provider that drives an installed, signed-in CLI assistant as a bounded child process.
cli = ["dep:rightkit-process"]

[dependencies]
rightkit-http = { version = "0.3.0", path = "../rightkit-http", features = ["gzip"] }
rightkit-process = { version = "0.4.0", path = "../rightkit-process", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
rightkit-http = { version = "0.3.0", path = "../rightkit-http", features = ["gzip", "testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: one provider-stream thread per failover attempt (failover.rs) and per-CLI-call stdin writer and pipe reader threads (provider/cli.rs), each ends when the stream, pipe or child ends and is bounded by the policy timeouts; no sleep, listener, timer, watcher or resident model or cache (reviewed 2026-10-11)"
