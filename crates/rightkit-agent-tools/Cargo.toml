[package]
name = "rightkit-agent-tools"
version = "0.1.4"
edition = "2021"
rust-version = "1.98.0"
description = "One typed tool interface for agents over rightkit-automation, rightkit-qa-driver, rightkit-browser and each app's engine commands (via rightkit-daemon), plus the `right-ctl <app> <command>` CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Orthic-Labs/rightkit"
readme = "README.md"
keywords = ["agents", "automation", "cli", "tools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["automation", "browser", "speech"]
automation = ["dep:rightkit-automation"]
browser = ["dep:rightkit-browser", "dep:tokio"]
speech = ["dep:rightkit-speech-client"]
# Agent demo mode (`demo.*` tools, `right-ctl demo`). Non-default: release builds omit it entirely.
demo = []

[dependencies]
rightkit-daemon = { version = "0.2.0", path = "../rightkit-daemon" }
rightkit-automation = { version = "0.4.0", path = "../rightkit-automation", optional = true }
rightkit-browser = { version = "0.3.0", path = "../rightkit-browser", optional = true }
rightkit-speech-client = { version = "0.3.0", path = "../rightkit-speech-client", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "right-ctl"
path = "src/bin/right-ctl.rs"
