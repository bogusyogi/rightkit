[package]
name = "rightkit-agent-tools"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
description = "One typed tool interface for agents over rightkit-automation, rightkit-browser and each app's engine commands (via rightkit-daemon), plus the `right-ctl <app> <command>` CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
keywords = ["agents", "automation", "cli", "tools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["automation", "browser", "speech"]
automation = ["dep:rightkit-automation"]
browser = ["dep:rightkit-browser", "dep:tokio"]
speech = ["dep:rightkit-speech-client"]
# Agent demo mode (`demo.*` tools, `right-ctl demo`). Non-default: release builds omit it entirely.
demo = []

[dependencies]
rightkit-daemon = { version = "0.4.0", path = "../rightkit-daemon" }
rightkit-automation = { version = "0.6.0", path = "../rightkit-automation", optional = true }
rightkit-browser = { version = "0.3.0", path = "../rightkit-browser", optional = true }
rightkit-speech-client = { version = "0.4.0", path = "../rightkit-speech-client", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "right-ctl"
path = "src/bin/right-ctl.rs"

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "BrowserTools::new"
file = "src/backends/web.rs"
holds = ["task", "child", "memory"]
scale = "one tokio multi-thread runtime with 2 worker threads (parked when idle) plus at most one browser session, a Chrome child opened by browser.open; fixed per BrowserTools instance"
release = "Drop of BrowserTools (BrowserTools::shutdown closes the browser now)"

[[package.metadata.rightkit.resources]]
api = "speech_tools"
file = "src/backends/speech.rs"
holds = ["thread"]
scale = "one cancellation-bridge thread per transcribe tool call, polling a flag every 50 ms while the call runs; none exist while idle"
release = "the tool call returns (the thread is joined before Transcribe::call returns)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
