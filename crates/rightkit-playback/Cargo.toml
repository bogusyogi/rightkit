[package]
name = "rightkit-playback"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Source-preserving FFmpeg compatibility playback preparation for Right Suite media apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["ffmpeg", "playback", "media", "remux"]
categories = ["multimedia::video"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
rightkit-media = { path = "../rightkit-media", version = "0.2.3" }
rightkit-process = { path = "../rightkit-process", version = "0.3.0" }
rightkit-fs = { path = "../rightkit-fs", version = "0.3.3", default-features = false, features = ["digest"] }
tauri = { version = "2", optional = true, default-features = false }
