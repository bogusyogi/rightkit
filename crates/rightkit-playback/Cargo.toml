[package]
name = "rightkit-playback"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Source-preserving FFmpeg compatibility playback preparation for Right Suite media apps."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
keywords = ["ffmpeg", "playback", "media", "remux"]
categories = ["multimedia::video"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
rightkit-media = { path = "../rightkit-media", version = "0.2.3", default-features = false }
rightkit-process = { path = "../rightkit-process", version = "0.4.0" }
rightkit-fs = { path = "../rightkit-fs", version = "0.4.0", default-features = false, features = ["digest"] }
tauri = { version = "2", optional = true, default-features = false }

[package.metadata.rightkit]
continuous = false
continuous_reason = "task-spawn: spawn_blocking inside the prepare_media_playback and prepare_registered_media_playback Tauri commands (lib.rs), one ffmpeg compatibility copy per command bounded by PREPARE_TIMEOUT and cancellation; sleep: PREPARE_POLL between try_wait calls inside that one copy; the SourceRegistry only holds paths the host registers and can revoke, no listener, timer or watcher (reviewed 2026-10-11)"
