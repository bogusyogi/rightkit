[package]
name = "rightkit-framed-sidecar"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Bounded JSON-lines transport primitives for Right Suite sidecars."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["sidecar", "ipc", "jsonl", "stdio"]
categories = ["encoding"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Deadline-bounded framing: poll(2) on Unix, overlapped I/O on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "bounded JSON-lines framing primitives driven by the caller's reads and writes; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"
