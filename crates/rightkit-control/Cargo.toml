[package]
name = "rightkit-control"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Background native input, accessibility reads, and a WebDriver bridge for driving real desktop apps without stealing focus."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

# Zero third-party dependencies by default: macOS paths use direct framework
# FFI. The optional `tauri-plugin` feature adds only `tauri` (already in the
# workspace lock) for the in-app control server.
[features]
default = []
# The embedded Tauri control server. On Windows it also needs exactly one `wv2-*` feature (enforced by
# a compile_error in `embedded/win_view.rs`); macOS needs none. Tauri 2.11: `features = ["tauri-plugin", "wv2-0_38"]`.
tauri-plugin = ["dep:tauri", "dep:rightkit-service", "dep:serde_json"]
# Windows: the `windows` + `webview2-com` generation the app's Tauri resolves, so WebView2 types cross the
# Tauri boundary. Tauri 2.11 (wry 0.55) = wv2-0_38; Tauri 2.12+ = wv2-0_39. Neither is default: enable one together with `tauri-plugin`.
# macOS only: calls WKWebView `_setWindowOcclusionDetectionEnabled:` (private SPI) for off-screen
# recording. Default off so shipping apps opt in explicitly; without it `offscreen` fails with a typed
# OcclusionSpiNotCompiled error on macOS.
offscreen-private-spi = []
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039"]

[dependencies]
tauri = { version = "2", optional = true }
rightkit-service = { version = "0.1.0", path = "../rightkit-service", optional = true }
serde_json = { version = "1.0.150", optional = true }

[target.'cfg(windows)'.dependencies]
windows_061 = { package = "windows", version = "0.61", optional = true }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }
[lib]
name = "rightkit_control"
path = "src/lib.rs"

[[example]]
name = "offscreen_fixture_win"
required-features = ["wv2-0_38"]

[[bin]]
name = "rightkit-control"
path = "src/bin/rightkit-control.rs"
