[package]
name = "rightkit-overlay-win"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Native Win32 layered-window overlays for Right Suite apps: software painter, DWM-paced animation, hover and hit regions, per-monitor DPI, no WebView."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
homepage = "https://github.com/bogusyogi/rightkit/tree/main/crates/rightkit-overlay-win"
documentation = "https://docs.rs/rightkit-overlay-win"
keywords = ["overlay", "win32", "layered-window", "dwm", "gdi"]
categories = ["os::windows-apis", "gui"]
include = ["src/**", "tests/**", "examples/**", "README.md", "CHANGELOG.md", "NOTICE", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
# Overlay policy: OverlayStyle, HoverGate, Rect/WorkArea placement, show_noactivate, topmost repair, monitor_at.
rightkit-overlay = { version = "0.2.0", path = "../rightkit-overlay" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# Only the ignored GDI handle-count test (tests/windows_gdi_handles.rs) needs these.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[package.metadata.rightkit]
continuous = "held-resource"

[[package.metadata.rightkit.resources]]
api = "OverlayWindow::create"
file = "src/window.rs"
holds = ["thread", "memory"]
scale = "one owner thread, one HWND, one DIB surface and one paint canvas per OverlayWindow; sized by the window's pixel area; the thread blocks in GetMessage while idle and is paced by DwmFlush only while an animation runs"
release = "Drop"

[[package.metadata.rightkit.resources]]
api = "spawn_owner"
file = "src/win/mod.rs"
holds = ["thread", "memory"]
scale = "one owner thread, one HWND, one DIB surface and one paint canvas per OverlayWindow; sized by the window's pixel area; the thread blocks in GetMessage while idle and is paced by DwmFlush only while an animation runs"
release = "Drop"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
