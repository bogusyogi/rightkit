[package]
name = "rightkit-compose"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral evaluated composition model: layered video, stills, cursor sprites, backgrounds, clipping, shadows, motion blur, overlays and keyframed tracks, with one pure per-frame evaluation shared by preview and export"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["composition", "video", "keyframes", "timeline"]
categories = ["multimedia::video", "data-structures"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_compose"
path = "src/lib.rs"

[features]
default = []
# Keyless still finishing: composite a PNG logo onto PNG stills and write them under a naming
# template (`still_finish`). Adds `image` (PNG only) and `rightkit-crypto` (output digests).
still-finish = ["dep:image", "dep:rightkit-crypto"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"


[package.metadata.rightkit]
continuous = false
continuous_reason = "pure composition model: one per-frame evaluation function over caller-provided state, no I/O loop; no thread-spawn, task-spawn, sleep, timer, listener or watcher in non-test src (checked by runtime-budgets.mjs)"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
