[package]
name = "rightkit-cache"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Disk cache primitive with a hard size cap, LRU eviction that survives restarts, atomic writes and group invalidation, plus stable-prefix prompt-cache keys."
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
sha2 = "0.11"
# Pid liveness for the temp-file sweep on open (`process_alive`).
rightkit-fs = { path = "../rightkit-fs", version = "0.4.0", default-features = false, features = ["fs"] }
rightkit-process = { version = "0.4.0", path = "../rightkit-process" }

[[bench]]
name = "budget"
harness = false

[dev-dependencies]
tempfile = "3"
