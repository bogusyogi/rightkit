[package]
name = "rightkit-cache"
version = "0.2.3"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Disk cache primitive with a hard size cap, LRU eviction that survives restarts, atomic writes and group invalidation, plus stable-prefix prompt-cache keys."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
sha2 = "0.11"
# Pid liveness for the temp-file sweep on open (`process_alive`).
rightkit-fs = { path = "../rightkit-fs", version = "0.4.2", default-features = false, features = ["fs"] }
rightkit-child-process = { version = "0.5.0", path = "../rightkit-child-process" }

[[bench]]
name = "budget"
harness = false

[dev-dependencies]
tempfile = "3"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
