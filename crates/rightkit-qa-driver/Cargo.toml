[package]
name = "rightkit-qa-driver"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.0"
description = "Background native input, accessibility reads, and a WebDriver bridge for driving real desktop apps without stealing focus."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Orthic-Labs/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

# Its one unconditional dependency is `rightkit-automation` (no third-party crate on macOS; the
# `windows` crate on Windows, through automation). macOS paths use direct framework
# FFI. `tauri-plugin` adds only `tauri` (already in the workspace lock) for the
# Tauri window helpers (`offscreen::start_for_window` / `start_from_env`). The in-app
# control SERVER is a separate, explicit opt-in: `qa-control`.
[features]
default = []
# Tauri window helpers only. It does NOT compile `embedded::Control`; no server, no control socket.
tauri-plugin = ["dep:tauri"]
# QA ONLY, NEVER SHIPPED. The embedded Tauri control server (`embedded` module): input injection, DOM and
# accessibility reads, screenshots, JS evaluate. Name it only from an app feature that is off by default
# (`qa-native = ["rightkit-qa-driver/qa-control", ...]`). A binary that carries it contains the marker
# `RIGHTKIT-QA-CONTROL-SERVER-PRESENT`, and `right-release` refuses to seal or upload a release or update
# tier build that contains it. On Windows it also needs exactly one `wv2-*` feature (enforced by a
# compile_error in `embedded/win_view.rs`); macOS needs none. Tauri 2.11: `features = ["qa-control", "wv2-0_38"]`.
qa-control = ["tauri-plugin", "dep:rightkit-daemon", "rightkit-daemon?/test-mode", "dep:serde_json"]
# Windows: the `windows` + `webview2-com` generation the app's Tauri resolves, so WebView2 types cross the
# Tauri boundary. Tauri 2.11 (wry 0.55) = wv2-0_38; Tauri 2.12+ = wv2-0_39. Neither is default: enable one together with `qa-control`.
# macOS only: calls WKWebView `_setWindowOcclusionDetectionEnabled:` (private SPI) for off-screen
# recording. Default off so shipping apps opt in explicitly; without it `offscreen` fails with a typed
# OcclusionSpiNotCompiled error on macOS.
offscreen-private-spi = ["rightkit-automation/offscreen-private-spi"]
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039"]

[dependencies]
rightkit-automation = { version = "0.4.0", path = "../rightkit-automation" }
tauri = { version = "2", optional = true }
rightkit-daemon = { version = "0.2.0", path = "../rightkit-daemon", optional = true }
serde_json = { version = "1.0.150", optional = true }

[target.'cfg(windows)'.dependencies]
windows_061 = { package = "windows", version = "0.61", optional = true }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }
[lib]
name = "rightkit_qa_driver"
path = "src/lib.rs"

[[example]]
name = "offscreen_fixture_win"
required-features = ["wv2-0_38"]

[[bin]]
name = "rightkit-qa-driver"
path = "src/bin/rightkit-qa-driver.rs"
