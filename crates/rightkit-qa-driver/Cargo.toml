[package]
name = "rightkit-qa-driver"
version = "0.7.0"
edition = "2021"
rust-version = "1.98.0"
description = "Deprecated shim: use rightkit-qa (`control` feature) for the in-app QA control server and rightkit-automation for background input. Keeps the old rightkit-qa-driver paths, the WebDriver bridge and the macOS CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

# DEPRECATED (0.5.0). The generic input code lives in `rightkit-automation`; the embedded Tauri control server
# (and its admission, lease and protocol code) lives in `rightkit-qa` behind its dev-only `control` feature.
# This crate re-exports both under the old paths so an app compiles unchanged after a version bump. Its one
# unconditional dependency is `rightkit-automation`. `rightkit-qa` is optional and pulled only by `qa-control`.
[features]
default = []
# Tauri window helpers only (`offscreen::start_for_window` / `start_from_env`). It does NOT compile
# `embedded::Control`; no server, no control socket.
tauri-plugin = ["dep:tauri"]
# QA ONLY, NEVER SHIPPED. Maps onto `rightkit-qa/control`: the `embedded` module is re-exported from
# `rightkit-qa`. Name it only from an app feature that is off by default
# (`qa-native = ["rightkit-qa-driver/qa-control", ...]`). A binary that carries it contains the marker
# `RIGHTKIT-QA-CONTROL-SERVER-PRESENT`, and `right-release` refuses to seal or upload a release or update
# tier build that contains it. On Windows it also needs exactly one `wv2-*` feature; macOS needs none.
# Tauri 2.11: `features = ["qa-control", "wv2-0_38"]`.
qa-control = ["tauri-plugin", "dep:rightkit-qa", "rightkit-qa/control"]
# macOS only: calls WKWebView `_setWindowOcclusionDetectionEnabled:` (private SPI) for off-screen
# recording. Default off so shipping apps opt in explicitly; without it `offscreen` fails with a typed
# OcclusionSpiNotCompiled error on macOS.
offscreen-private-spi = ["rightkit-automation/offscreen-private-spi"]
# Windows: the `windows` + `webview2-com` generation the app's Tauri resolves (the `offscreen_fixture_win`
# example uses them directly, and `rightkit-qa/wv2-*` is enabled together with `qa-control`).
# Tauri 2.11 (wry 0.55) = wv2-0_38; Tauri 2.12+ = wv2-0_39. Neither is default.
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038", "rightkit-qa?/wv2-0_38"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039", "rightkit-qa?/wv2-0_39"]

[dependencies]
rightkit-automation = { version = "0.6.0", path = "../rightkit-automation" }
rightkit-qa = { version = "0.10.0", path = "../rightkit-qa", optional = true, default-features = false }
tauri = { version = "2", optional = true }

# tests/offscreen_macos.rs talks to the embedded server's service directly.
[dev-dependencies]
rightkit-daemon = { version = "0.5.0", path = "../rightkit-daemon" }
serde_json = "1.0.154"
# Lock pin, not a use (the same pin as rightkit-qa and rightkit-tauri-shell): keeps this crate's own Cargo.lock on the Tauri 2.11 graph
# (tauri 2.11.6 needs tauri-utils ^2.9.3, wry 0.55.1, webview2-com 0.38 / windows 0.61) that the `qa-control,wv2-0_38` gate row compiles
# against. Without it a fresh lock resolves Tauri 2.12 (tauri-utils ~2.10.2, wry 0.57, webview2-com 0.39 / windows 0.62) and
# rightkit-qa's `wv2-0_38` code meets 0.39 types on Windows. A dev-dependency is never part of a consumer's resolve, so apps stay free to
# pick Tauri 2.12. Lift with the Tauri 2.12 move, and then switch the row to `wv2-0_39`.
tauri-utils = { version = ">=2.9.3, <2.10" }

[target.'cfg(windows)'.dependencies]
windows_061 = { package = "windows", version = "0.61", optional = true }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }

[lib]
name = "rightkit_qa_driver"
path = "src/lib.rs"

[[example]]
name = "offscreen_fixture_win"
required-features = ["wv2-0_38"]

[[bin]]
name = "rightkit-qa-driver"
path = "src/bin/rightkit-qa-driver.rs"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
