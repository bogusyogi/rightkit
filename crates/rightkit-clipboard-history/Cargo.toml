[package]
name = "rightkit-clipboard-history"
version = "0.4.0"
edition = "2024"
rust-version = "1.98.0"
description = "Clipboard history logic: classify copied text (colour, link, code, plain) and spot whole-text secrets."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_clipboard_history"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
rightkit-fs = { version = "0.5.0", default-features = false, features = ["fs", "digest", "lock"], path = "../rightkit-fs", optional = true }
rightkit-time = { version = "0.1.1", path = "../rightkit-time", optional = true }
rightkit-launcher = { version = "0.2.0", path = "../rightkit-launcher", optional = true }

[features]
# Default keeps the complete existing API. Disable defaults for portable text detection only.
default = ["history"]
history = [
    "dep:serde", "dep:serde_json", "dep:rightkit-fs", "dep:rightkit-time", "dep:rightkit-launcher",
    "dep:rightkit-win-ui", "dep:rightkit-automation",
    "dep:rightkit-child-process", "dep:rightkit-overlay", "dep:windows",
]
# Clipboard fixture injection for application QA. Keep disabled in production.
qa-views = ["history"]

[target.'cfg(windows)'.dependencies]
rightkit-win-ui = { version = "0.1.0", path = "../rightkit-win-ui", optional = true }
rightkit-automation = { version = "0.7.0", path = "../rightkit-automation", optional = true }
rightkit-child-process = { version = "0.5.9", path = "../rightkit-child-process", optional = true }
rightkit-overlay = { version = "0.2.2", path = "../rightkit-overlay", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Imaging", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }
