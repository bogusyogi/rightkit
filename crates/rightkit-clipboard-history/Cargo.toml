[package]
name = "rightkit-clipboard-history"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Clipboard history logic: classify copied text (colour, link, code, plain) and spot whole-text secrets."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_clipboard_history"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0" }
serde_json = { version = "1.0" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest", "lock"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography"] }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
