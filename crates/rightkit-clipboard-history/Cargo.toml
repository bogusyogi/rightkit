[package]
name = "rightkit-clipboard-history"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.0"
description = "Clipboard history logic: classify copied text (colour, link, code, plain) and spot whole-text secrets."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_clipboard_history"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0" }
serde_json = { version = "1.0" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest", "lock"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
rightkit-launcher = { version = "0.2.0", path = "../rightkit-launcher" }

[features]
default = []
# QA view renderer and screenshot hooks (capture.rs, strip.rs, strip/popover.rs); never in a shipped build.
qa-views = []

[target.'cfg(windows)'.dependencies]
rightkit-notch-ui = { version = "0.2.0", path = "../rightkit-notch-ui" }
rightkit-hotkeys = { version = "0.1.2", path = "../rightkit-hotkeys" }
rightkit-win-ui = { version = "0.1.0", path = "../rightkit-win-ui" }
rightkit-automation = { version = "0.7.0", path = "../rightkit-automation" }
rightkit-child-process = { version = "0.5.9", path = "../rightkit-child-process" }
rightkit-overlay = { version = "0.2.2", path = "../rightkit-overlay" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Imaging", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
