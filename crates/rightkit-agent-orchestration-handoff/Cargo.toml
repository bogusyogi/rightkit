[package]
name = "rightkit-agent-orchestration-handoff"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Agent handoff packets, continuity gate and live state"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_orchestration_handoff"
path = "src/lib.rs"

[dependencies]
regex = { version = "1.13.1" }
async-trait = { version = "0.1.92" }
hex = { version = "0.4.3" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11.1" }
thiserror = { version = "2.0.20" }
tiktoken-rs = { version = "0.12.0" }
