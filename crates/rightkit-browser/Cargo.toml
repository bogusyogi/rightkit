[package]
name = "rightkit-browser"
version = "0.2.1"
edition = "2021"
rust-version = "1.98.0"
description = "Shared Chrome DevTools Protocol browser runtime for Right Suite: multi-page sessions, named profiles, real CDP input, observations with stale-ref checks."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/claude"
keywords = ["browser", "cdp", "chrome", "automation", "qa"]
categories = ["development-tools::testing"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
chromiumoxide = "0.9"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
url = "2"
rightkit-process = { path = "../rightkit-process", version = "=0.2.1" }
