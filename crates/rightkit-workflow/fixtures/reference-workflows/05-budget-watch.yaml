# Reference workflow: budget watch.
# - Triggered hourly by a cron schedule.
# - Reads accumulated workflow cost from the local ledger.
# - If the rolling 24h spend exceeds $5.00, stages a desktop draft
#   alert to the operator. Otherwise the run terminates without an
#   effect.

kind: coderight-workflow/v1
schema_version: 1
id: wfd-budget-watch
name: Budget watch
description: >
  Run hourly. Read the accumulated workflow cost from the local
  ledger. If the rolling 24-hour spend exceeds $5.00, stage a desktop
  draft alert summarizing the top contributors. Otherwise terminate
  without producing any effect.

trigger:
  schedule:
    cron: "0 * * * *"
    tz: "UTC"

inputs: {}

capabilities:
  - Capability::ReadFiles

nodes:
  - id: read-cost-ledger
    kind: Transform
    label: Read the last 24h of workflow cost
    capabilities:
      - Capability::ReadFiles
    attempt:
      max_attempts: 2
      backoff:
        kind: exponential
        base_ms: 250
        max_ms: 4000
        jitter: 0.1
      retry_on:
        - TransientNetwork
        - TransientProvider
    payload:
      transform: read-ledger-window
      ledger: coderight://ledger/workflow-cost
      window_seconds: 86400
      template: |
        Return a structured record: `{ last_24h_cost_usd, top_workflows:
        [{ id, cost_usd }] }`. Read-only.

  - id: cond-over-threshold?
    kind: Condition
    label: Check whether spend exceeds threshold
    capabilities: []
    attempt:
      max_attempts: 1
      backoff:
        kind: fixed
        base_ms: 0
      retry_on: []
    test: "read-cost-ledger.output.last_24h_cost_usd > 5.00"

  - id: alert-operator
    kind: Effect
    label: Stage a desktop draft budget alert
    capabilities:
      - Capability::SendUnattendedMessage
    attempt:
      max_attempts: 2
      backoff:
        kind: exponential
        base_ms: 250
        max_ms: 4000
        jitter: 0.1
      retry_on:
        - TransientNetwork
        - LeaseLost
    when: "read-cost-ledger.output.top_workflows != []"
    effects:
      - kind: draft
        destination: coderight://desktop-draft
        idempotency_key: "budget-watch:${run.window_start_iso}"
        payload:
          last_24h_cost_usd: read-cost-ledger.output.last_24h_cost_usd
          top_workflows: read-cost-ledger.output.top_workflows
        approval_required: false
        reconcile: lookup desktop draft by idempotency key before retry

edges:
  - { from: "start",                to: "read-cost-ledger" }
  - { from: "read-cost-ledger",     to: "cond-over-threshold?" }
  - { from: "cond-over-threshold?", to: "alert-operator",    when: "true" }
  - { from: "cond-over-threshold?", to: "end",               when: "false" }
  - { from: "alert-operator",       to: "end" }

budgets:
  cost_usd: 0.01
  tokens: 200
  wall_time_seconds: 10
  depth: 1