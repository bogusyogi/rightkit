[package]
name = "rightkit-workflow"
version = "0.2.3"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Shared scenario interpreter and durable state machine for the RightKit scenario runtime (RK8): perform separated from observe_until, idempotency keys, append-only fsync journal, leases with fencing tokens, cooperative cancellation, retake replay, and a remote worker transport trait boundary"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
keywords = ["scenario", "state-machine", "journal", "lease", "idempotency"]
categories = ["development-tools"]
include = ["src/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_workflow"
path = "src/lib.rs"

[dependencies]
blake3 = "1.8.7"
getrandom = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rightkit-fs = {version = "0.4.9", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs", optional = true}
rightkit-crypto = {version = "0.1.0", path = "../rightkit-crypto", optional = true}
rightkit-time = {version = "0.1.1", path = "../rightkit-time", optional = true}
serde_yaml = {version = "0.9", optional = true}
thiserror = {version = "2", optional = true}
tracing = {version = "0.1", optional = true}

[features]
# Generic linear, resumable run over non-GUI steps (SequenceRun, Gate, ReplayPolicy).
sequence = []
control_plane = ["dep:rightkit-fs", "dep:rightkit-crypto", "dep:rightkit-time", "dep:serde_yaml", "dep:thiserror", "dep:tracing"]
control_plane_host = []

[package.metadata.rightkit]
continuous = false
continuous_reason = "workflow state machine and sequence runner driven by the caller; sleep is SystemClock::sleep_ms, one bounded thread::sleep the caller asks for inside a step, and listener is net::bind, which returns a TcpListener the caller owns and accepts on (the crate runs no accept loop and no thread of its own); spawns no continuous work"

# One Cargo workspace and lock per crate (rightkit#1285).
