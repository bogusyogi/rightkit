[package]
name = "rightkit-speech-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Client and contract for the Orthic Labs shared speech service (one resident engine per machine), built on rightkit-service. Wire-compatible with HeardRight's v1 host."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/claude"
publish = false

[dependencies]
rightkit-service = { version = "=0.1.0", path = "../rightkit-service" }
rightkit-framed-sidecar = { version = "=0.1.0", path = "../rightkit-framed-sidecar" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[dev-dependencies]
tempfile = "3"
