[package]
name = "rightkit-speech-client"
version = "0.3.3"
edition = "2021"
rust-version = "1.98.0"
description = "Client and contract for the Orthic Labs shared speech service (one resident engine per machine), built on rightkit-service. Wire-compatible with HeardRight's v1 host."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-service = { version = "0.1.3", path = "../rightkit-service" }
rightkit-framed-sidecar = { version = "0.1.0", path = "../rightkit-framed-sidecar" }
rightkit-transcript = { version = "0.3.0", path = "../rightkit-transcript" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3"

# The Windows named-pipe round-trip test (tests/windows_pipe.rs) hosts a raw pipe server.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
