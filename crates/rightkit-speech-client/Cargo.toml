[package]
name = "rightkit-speech-client"
version = "0.3.6"
edition = "2021"
rust-version = "1.98.0"
description = "Client and contract for the Orthic Labs shared speech service (one resident engine per machine), built on rightkit-daemon. Wire-compatible with HeardRight's v1 host."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "API.md", "INDEX.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-daemon = { version = "0.2.0", path = "../rightkit-daemon" }
rightkit-sidecar = { version = "0.2.0", path = "../rightkit-sidecar" }
rightkit-transcript = { version = "0.4.0", path = "../rightkit-transcript" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"

# The Windows named-pipe round-trip test (tests/windows_pipe.rs) hosts a raw pipe server.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "speech service client driven by the caller; thread-spawn is the single reader thread of one connected SpeechClient (blocked on the socket, ends when the connection closes or the client drops), sleep is bounded back-off waiting for a handoff or a retry inside one transcribe call, and detached-child is start_installed_engine, which launches the installed engine app on the caller's request: that engine is a separate process with its own budget and this crate runs no continuous work of its own"
