[package]
name = "rightkit-transcript-library"
version = "0.1.8"
edition = "2021"
rust-version = "1.98.0"
description = "Transcript library: delivery records (outcome, target, timings, source), history store contract with filters, paging, retention, scoped deletes and an in-memory store."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_transcript_library"
path = "src/lib.rs"

[features]
store = ["dep:rightkit-db"]
# History on an `EncryptedStore`'s managed writer (`DeliveryHistoryStore::open_managed`). The host picks the
# SQLCipher provider on rightkit-db itself (`sqlcipher-libtomcrypt` or `sqlcipher-system`).
managed-store = ["store", "rightkit-db/encrypted-lifecycle"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rightkit-time = { version = "0.1.4", path = "../rightkit-time" }
http = "1"
rightkit-db = { path = "../rightkit-db", version = "0.5.11", default-features = false, optional = true }
