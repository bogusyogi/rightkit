[package]
name = "rightkit-agent-engine-api-workflows"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine workflow HTTP API: request/response types, error mapping and OpenAPI fragments"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_api_workflows"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8" }
rightkit-agent-engine-storage = { version = "0.1.0", path = "../rightkit-agent-engine-storage" }
rightkit-agent-learning = { version = "0.1.0", path = "../rightkit-agent-learning" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
