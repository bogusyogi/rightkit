[package]
name = "rightkit-mail"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Mail-domain building blocks: Gmail-style search query compiler, SQL predicates and keyset paging, rank fusion, anti-phishing trust heuristics, and remote-image safety checks with a tracker blocklist."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_mail"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
rightkit-search = { version = "0.4.1", default-features = false, path = "../rightkit-search" }
