[package]
name = "rightkit-agent-engine-api-integrations"
version = "0.1.4"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine integrations HTTP API: plugin discovery, manifest projection and plugin middleware wiring"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_api_integrations"
path = "src/lib.rs"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
rightkit-agent-plugins = {version = "0.1.0", path = "../rightkit-agent-plugins"}
rightkit-agent-config = { version = "0.1.0", path = "../rightkit-agent-config", features = ["host-env"] }
rightkit-agent-engine-runtime-middleware = {version = "0.1.0", path = "../rightkit-agent-engine-runtime-middleware"}

[features]
default = []
