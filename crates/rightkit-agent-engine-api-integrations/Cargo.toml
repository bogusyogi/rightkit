[package]
name = "rightkit-agent-engine-api-integrations"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine integrations HTTP API: plugin discovery, manifest projection and plugin middleware wiring"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_api_integrations"
path = "src/lib.rs"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
rightkit-agent-plugins = {version = "0.1.0", path = "../rightkit-agent-plugins"}
rightkit-app-settings = {version = "0.3.1", path = "../rightkit-app-settings", features = ["agent_config", "agent_config-host-env"]}
rightkit-agent-engine-runtime-middleware = {version = "0.1.0", path = "../rightkit-agent-engine-runtime-middleware"}

[features]
default = []

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
