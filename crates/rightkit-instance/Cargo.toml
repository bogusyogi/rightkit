[package]
name = "rightkit-instance"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Single instance and second-launch forwarding without Tauri over rightkit-daemon, with the legacy tauri-plugin-single-instance socket and window handoff."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["single-instance", "ipc", "second-launch"]
categories = ["os"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_instance"
path = "src/lib.rs"

[dependencies]
rightkit-daemon = { version = "0.5.0", path = "../rightkit-daemon" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
