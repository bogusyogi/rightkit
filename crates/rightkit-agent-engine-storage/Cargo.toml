[package]
name = "rightkit-agent-engine-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine SQLite storage: session event journal, transcripts, tasks, artifacts, goals and migrations"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_storage"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-time = { version = "0.1.0", path = "../rightkit-time" }
rightkit-agent-engine-protocol = { version = "0.1.0", path = "../rightkit-agent-engine-protocol" }
rightkit-db = { version = "0.5.3", features = ["bundled", "statement-cache"], path = "../rightkit-db" }
rightkit-search = { version = "0.4.1", default-features = false, path = "../rightkit-search" }
rightkit-fs = { version = "0.4.8", features = ["fs", "lock", "json", "digest", "transaction"], path = "../rightkit-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
tracing = { version = "0.1" }
rightkit-workflow = { version = "0.3.0", path = "../rightkit-workflow", features = ["control_plane"], optional = true }

[features]
# Durable storage for the agent workflow control plane (journal writer, repository, triggers).
workflow = ["dep:rightkit-workflow"]

[dev-dependencies]
tempfile = { version = "3" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
