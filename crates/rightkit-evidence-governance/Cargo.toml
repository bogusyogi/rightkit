[package]
name = "rightkit-evidence-governance"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Evidence governance: certification, judgment dispatch and lifecycle receipts over evidence contracts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_governance"
path = "src/lib.rs"

[dependencies]
hmac = { version = "0.13.0" }
hex = { version = "0.4.3" }
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = { version = "0.11.1" }
thiserror = { version = "2.0.20" }
subtle = { version = "2.6.1" }
