[package]
name = "rightkit-scheduler"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Agent schedule model: bot profiles, schedule specs (cron, once, interval, monitor), due-minute computation in IANA time zones"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_scheduler"
path = "src/lib.rs"

[dependencies]
rightkit-agent-engine-protocol = { version = "0.2.0", path = "../rightkit-agent-engine-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
