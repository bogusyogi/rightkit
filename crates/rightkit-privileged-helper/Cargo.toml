[package]
name = "rightkit-privileged-helper"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
description = "Elevation broker for root-owned uninstall moves: parks paths for a trusted UI that asks the owner and the privileged helper, with bounded waits and in-memory state."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_privileged_helper"
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1" }

[target.'cfg(unix)'.dependencies]
rightkit-app-manager = { version = "0.2.0", path = "../rightkit-app-manager" }
