[package]
name = "rightkit-feed"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "RSS 2.0, RSS 1.0 and Atom feed parser: tolerant, bounded, DOCTYPE skipped, only the five predefined and numeric entities, guid/link/title/date/summary extraction."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["rss", "atom", "feed", "xml"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rightkit-time = { version = "0.1.3", path = "../rightkit-time" }

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure parsing library over a byte slice the caller supplies; spawns no continuous work"

# One Cargo workspace and lock per crate (rightkit#1285).
