[package]
name = "rightkit-policy-rules"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent policy rules: policy model, evaluator, precedence, frozen scopes and explanations"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_policy_rules"
path = "src/lib.rs"

[dependencies]
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = { version = "1.13.1" }
hex = { version = "0.4.3" }
sha2 = { version = "0.11" }
thiserror = { version = "2.0.20" }
