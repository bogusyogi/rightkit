[package]
name = "rightkit-policy-rules"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent policy rules: policy model, evaluator, precedence, frozen scopes and explanations"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_policy_rules"
path = "src/lib.rs"

[dependencies]
rightkit-evidence-contracts = { version = "0.1.0", path = "../rightkit-evidence-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = { version = "1.13.1" }
hex = { version = "0.4.3" }
sha2 = { version = "0.11.1" }
thiserror = { version = "2.0.20" }

[dev-dependencies]
proptest = { version = "1.12.0" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
