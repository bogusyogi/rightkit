[package]
name = "rightkit-context"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Context, memory and repository-graph commands for coding agents: the membrane CLI, hook entry points and the resident a host app supervises."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_context"
path = "src/lib.rs"

[[bin]]
name = "membrane"
path = "src/main.rs"

[dependencies]
rightkit-context-runtime = { version = "0.1.0", path = "../rightkit-context-runtime" }
rightkit-context-protocol = { version = "0.1.0", path = "../rightkit-context-protocol" }
rightkit-context-client = { version = "0.1.0", path = "../rightkit-context-client" }
rightkit-fs = { version = "0.4.9", features = ["lock"], path = "../rightkit-fs" }
rightkit-crash = { version = "0.3.6", default-features = false, path = "../rightkit-crash" }
serde_json = { version = "1" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = { version = "3" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-db = { version = "0.5.3", path = "../rightkit-db" }
rightkit-memory-core = { version = "0.1.0", path = "../rightkit-memory-core" }
