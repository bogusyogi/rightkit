[package]
name = "rightkit-qa"
version = "0.10.7"
edition = "2021"
rust-version = "1.98.0"
description = "Rust QA harness for Right Suite apps: engine black-box scenarios, hidden native UI driving (the in-app control server is the dev-only `control` feature), Rust-test scenario wrapper, dynamic paid-provider mocks, loudness/WAV/PNG/frame validators, run lock, orphan sweep, hashed evidence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Android journeys (`android` module): `adb`-backed install, launch, logcat capture, control-server
# port forward and teardown for an emulator or USB device. No dependencies beyond the crate's own.
android = []
# Chrome (CDP) targets through rightkit-browser. Off by default: it pulls tokio + chromiumoxide.
browser = ["dep:rightkit-browser", "dep:tokio"]
# QA ONLY, NEVER SHIPPED. The embedded Tauri control server (`embedded` module): input injection, DOM and
# accessibility reads, screenshots, JS evaluate, and `rightkit_automation::in_app::InApp` for tier 2.
# Moved from `rightkit-qa-driver/qa-control`. Name it only from an app feature that is off by default
# (`qa-native = ["dep:rightkit-qa", "rightkit-qa/control", ...]`). A binary that carries it contains the
# marker `RIGHTKIT-QA-CONTROL-SERVER-PRESENT` (`embedded::QA_CONTROL_MARKER`), and `right-release`
# refuses to seal or upload a release or update tier build that contains it. On Windows it also needs
# exactly one `wv2-*` feature (compile_error in `embedded/win_view.rs`); macOS needs none.
# Tauri 2.11: `features = ["control", "wv2-0_38"]`.
# `rightkit-daemon` has no `test-mode` any more (0.5.3): the server compiles into a dev build whose data
# roots are the real ones, and listens only when the QA runner's launch environment names
# `RIGHTKIT_CONTROL_SERVICE`. A journey run protects the real data with the snapshot and restore of
# the `snapshot` module (rightkit#1437), not with a throwaway root.
control = ["dep:tauri"]
# Windows: the `windows` + `webview2-com` generation the app's Tauri resolves, so WebView2 types cross the
# Tauri boundary. Tauri 2.11 (wry 0.55) = wv2-0_38; Tauri 2.12+ = wv2-0_39. Neither is default: enable one with `control`.
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039"]

[dependencies]
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", default-features = false, features = ["digest", "fs", "app-dirs"] }
# The real OS credential store, read and written by the snapshot and restore (`snapshot` module).
rightkit-credentials = { version = "0.5.0", path = "../rightkit-credentials" }
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
rightkit-daemon = { version = "0.9.0", path = "../rightkit-daemon" }
# The suite root (`Suite`, `ENV_SUITE_ROOT`); `valid_service_name` is rightkit-daemon's again.
rightkit-roots = { version = "0.2.0", path = "../rightkit-roots" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-browser = { version = "0.3.7", path = "../rightkit-browser", optional = true }
# Generic input, admission, lease and key code (and `macos::background::frontmost_*` for the guard).
rightkit-automation = { version = "0.7.0", path = "../rightkit-automation" }
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4"
toml = "1"

[[bench]]
name = "budget"
harness = false

[lib]
name = "rightkit_qa"
path = "src/lib.rs"

[[bin]]
name = "rightkit-qa"
path = "src/bin/rightkit-qa.rs"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows_061 = { package = "windows", version = "0.61", optional = true }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }

# One Cargo workspace and lock per crate (rightkit#1285).
