[package]
name = "rightkit-qa"
version = "0.2.9"
edition = "2021"
rust-version = "1.98.0"
description = "Rust QA harness for Right Suite apps: engine black-box scenarios, hidden native UI driving through rightkit-control, Rust-test scenario wrapper, dynamic paid-provider mocks, loudness/WAV/PNG/frame validators, run lock, orphan sweep, hashed evidence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/claude"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Chrome (CDP) targets through rightkit-browser. Off by default: it pulls tokio + chromiumoxide.
browser = ["dep:rightkit-browser", "dep:tokio"]

[dependencies]
rightkit-control = { version = "0.1.7", path = "../rightkit-control" }
rightkit-framed-sidecar = { version = "0.1.0", path = "../rightkit-framed-sidecar" }
rightkit-service = { version = "0.1.0", path = "../rightkit-service" }
rightkit-process = { version = "0.3.0", path = "../rightkit-process" }
rightkit-browser = { version = "0.2.2", path = "../rightkit-browser", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
png = "0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[lib]
name = "rightkit_qa"
path = "src/lib.rs"

[[bin]]
name = "rightkit-qa"
path = "src/bin/rightkit-qa.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
