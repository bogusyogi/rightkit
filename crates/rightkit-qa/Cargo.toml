[package]
name = "rightkit-qa"
version = "0.10.0"
edition = "2021"
rust-version = "1.98.0"
description = "Rust QA harness for Right Suite apps: engine black-box scenarios, hidden native UI driving (the in-app control server is the dev-only `control` feature), Rust-test scenario wrapper, dynamic paid-provider mocks, loudness/WAV/PNG/frame validators, run lock, orphan sweep, hashed evidence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bogusyogi/rightkit"
readme = "README.md"
include = ["src/**", "tests/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# Android journeys (`android` module): `adb`-backed install, launch, logcat capture, control-server
# port forward and teardown for an emulator or USB device. No dependencies beyond the crate's own.
android = []
# Chrome (CDP) targets through rightkit-browser. Off by default: it pulls tokio + chromiumoxide.
browser = ["dep:rightkit-browser", "dep:tokio"]
# QA ONLY, NEVER SHIPPED. The embedded Tauri control server (`embedded` module): input injection, DOM and
# accessibility reads, screenshots, JS evaluate, and `rightkit_automation::in_app::InApp` for tier 2.
# Moved from `rightkit-qa-driver/qa-control`. Name it only from an app feature that is off by default
# (`qa-native = ["dep:rightkit-qa", "rightkit-qa/control", ...]`). A binary that carries it contains the
# marker `RIGHTKIT-QA-CONTROL-SERVER-PRESENT` (`embedded::QA_CONTROL_MARKER`), and `right-release`
# refuses to seal or upload a release or update tier build that contains it. On Windows it also needs
# exactly one `wv2-*` feature (compile_error in `embedded/win_view.rs`); macOS needs none.
# Tauri 2.11: `features = ["control", "wv2-0_38"]`.
# It does NOT enable `rightkit-daemon/test-mode`: the server compiles into a dev build whose data
# roots stay the real ones, and listens only when the QA runner's launch environment names
# `RIGHTKIT_CONTROL_SERVICE` (isolation is chosen per launch by that environment, never by the build).
control = ["dep:tauri"]
# Windows: the `windows` + `webview2-com` generation the app's Tauri resolves, so WebView2 types cross the
# Tauri boundary. Tauri 2.11 (wry 0.55) = wv2-0_38; Tauri 2.12+ = wv2-0_39. Neither is default: enable one with `control`.
wv2-0_38 = ["dep:windows_061", "dep:webview2_com_038"]
wv2-0_39 = ["dep:windows_062", "dep:webview2_com_039"]

[dependencies]
rightkit-fs = { version = "0.4.4", path = "../rightkit-fs", default-features = false, features = ["digest", "fs"] }
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
rightkit-daemon = { version = "0.5.0", path = "../rightkit-daemon" }
rightkit-child-process = { version = "0.5.6", path = "../rightkit-child-process" }
rightkit-browser = { version = "0.3.0", path = "../rightkit-browser", optional = true }
# Generic input, admission, lease and key code (and `macos::background::frontmost_*` for the guard).
rightkit-automation = { version = "0.6.0", path = "../rightkit-automation" }
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4"
toml = "1"

[[bench]]
name = "budget"
harness = false

[lib]
name = "rightkit_qa"
path = "src/lib.rs"

[[bin]]
name = "rightkit-qa"
path = "src/bin/rightkit-qa.rs"

[dev-dependencies]
rightkit-fs = { version = "0.4.4", path = "../rightkit-fs", default-features = false, features = ["test-mode"] }
# Lock pin, not a use (the same pin as rightkit-tauri-shell): keeps this crate's own Cargo.lock on the Tauri 2.11 graph
# (tauri 2.11.6 needs tauri-utils ^2.9.3, wry 0.55.1, webview2-com 0.38 / windows 0.61) that the `control,wv2-0_38` gate rows compile
# against. Without it a fresh lock resolves Tauri 2.12 (tauri-utils ~2.10.2, wry 0.57, webview2-com 0.39 / windows 0.62) and the
# `wv2-0_38` code in `embedded/win_view.rs` meets 0.39 types (E0277 `&HSTRING: Param<PCWSTR>`, E0308 `*mut RECT`) on Windows. The
# `wv2-0_39` generation is compiled on a Tauri 2.12 lock by the ci/consumers/wv2-0_39 `qa` row. A dev-dependency is never part of a
# consumer's resolve, so apps stay free to pick Tauri 2.12. Lift with the Tauri 2.12 move, and then switch the rows to `wv2-0_39`.
tauri-utils = { version = ">=2.9.3, <2.10" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows_061 = { package = "windows", version = "0.61", optional = true }
webview2_com_038 = { package = "webview2-com", version = "0.38", optional = true }
windows_062 = { package = "windows", version = "0.62", optional = true }
webview2_com_039 = { package = "webview2-com", version = "0.39", optional = true }

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]
exclude = ["examples/control-test-app"]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
