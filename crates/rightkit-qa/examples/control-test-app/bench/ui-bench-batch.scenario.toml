# Same action mix as ui-bench.scenario.toml (20 clicks, 200 typed characters, 10 screenshots,
# 5 condition waits) sent as ONE `batch` round trip. Compare its single step against the sum of the
# per-action steps of ui-bench.scenario.toml. Run like that file does.
name = "control-test-app UI latency bench (batch)"
tier = "fast"
target = "ui"
# Screenshots inside the batch: a visual scenario. (ui-bench.scenario.toml has the same steps; run it with --kind visual.)
kind = "visual"

[[step]]
kind = "ui_launch"
mode = "hidden"

[[step]]
