# Fixed UI QA latency benchmark (rightkit-qa 0.4.0). Not part of the default scenario
# directory: run it explicitly, e.g.
#   rightkit-qa run --config examples/control-test-app/rightkit-qa.toml --tier fast \
#     examples/control-test-app/bench/ui-bench.scenario.toml
# Per-step wall time is in the run's results JSON (`steps[].ms`). Mix: launch, 20 clicks, 200 typed
# characters, 10 screenshots, 5 condition waits, stop. Compare per kind, never the total.
name = "control-test-app UI latency bench"
tier = "fast"
target = "ui"
# Takes screenshots: a visual scenario.
kind = "visual"

[[step]]
kind = "ui_launch"
mode = "hidden"

[[step]]
kind = "ui_click"
selector = "#btn"

