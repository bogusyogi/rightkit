[package]
name = "rightkit-ffmpeg"
version = "0.2.11"
edition = "2021"
rust-version = "1.98.0"
description = "Verified FFmpeg artifact and lifecycle primitives for Right Suite media pipelines."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["ffmpeg", "audio", "media", "process"]
categories = ["multimedia::audio"]
include = ["src/**", "tests/**", "catalog/**", "recipes/**", "third-party/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["native"]
# `native` module: the suite-wide native-library catalog (`catalog/native-libraries.json`).
# Consumed by asr/ort/vad tests; FFmpeg-only consumers can opt out.
native = []
# DEVELOPMENT/QA BUILDS ONLY. `BuildMode::from_build_features()` and `DevFfmpeg::try_unverified` allow
# UNVERIFIED (non-catalog) binaries, and `DevFfmpeg::unverified` (no mode check) is compiled only with it.
# Never implied by a build profile (a dev profile has debug_assertions on and still refuses) and never a
# default feature. An app enables it only from its QA/test configuration.
dev-overrides = []

[dependencies]
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["digest", "fs"] }
rightkit-child-process = { path = "../rightkit-child-process", version = "0.5.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "native_catalog_e2e"
required-features = ["native"]

[package.metadata.rightkit]
continuous = false
continuous_reason = "thread-spawn: per-call pipe-reader and child-exit threads (lib.rs build probe, runner.rs run), joined or ended with the child before the call returns; sleep: child poll interval inside one run, bounded by timeout and cancellation; the only process-lifetime memory is verify_cache (one entry per verified ffmpeg binary, not data-scale); no listener, timer or watcher (reviewed 2026-10-11); resident-static: CACHE in src/verify_cache.rs is a LazyLock Mutex HashMap of two booleans per verified ffmpeg binary state (path, size, mtime, identity, artifact id, expected hash); an entry is added only when a binary is first verified or its file changes, so growth follows binary installs and updates, not calls or data, and verify_cache_clear empties it; there is no size cap or eviction (reviewed 2026-10-17); INVENTORIES in src/encoders.rs caches one encoder-name set per immutable binary path for the process lifetime; encoder_cache_clear empties it, probe and probe_uncached bypass it, failures are not cached & size follows distinct binary installs (reviewed 2026-10-17); DIGEST_COMPUTATIONS is a per-thread counter"

# One Cargo workspace and lock per crate (rightkit#1285).
[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
