[package]
name = "rightkit-agent-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Agent server host: HTTP/daemon API routes, CLI and interactive-session runtime, session hosting and orchestration glue for coding-agent applications"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[workspace]

[lib]
name = "rightkit_agent_server"
path = "src/lib.rs"

[features]
default = []
test-mode = []
qualification = ["rightkit-agent-engine-core/qualification"]
fastembed = ["rightkit-onnx/session", "rightkit-agent-tools/coding_tools-embeddings"]

[dependencies]
rightkit-agent-host-traits = { version = "0.1.1", path = "../rightkit-agent-host-traits" }
rightkit-agent-plugins = { version = "0.1.0", path = "../rightkit-agent-plugins" }
rightkit-agent-recipes = { version = "0.1.0", path = "../rightkit-agent-recipes" }
rightkit-onnx = { version = "0.2.9", path = "../rightkit-onnx", features = ["agent_ort"], default-features = false }
rightkit-agent-engine-protocol = { version = "0.1.0", path = "../rightkit-agent-engine-protocol" }
rightkit-agent-engine-core = { version = "0.1.0", path = "../rightkit-agent-engine-core" }
rightkit-hooks = { version = "0.2.1", path = "../rightkit-hooks", features = ["agent_hooks", "agent_hooks-host-env"] }
rightkit-llm = { version = "0.3.2", path = "../rightkit-llm", features = ["agent_providers", "agent_providers-host-env", "agent_router"] }
rightkit-memory = { version = "0.1.1", path = "../rightkit-memory", features = ["agent_host"] }
rightkit-agent-policy = { version = "0.1.0", path = "../rightkit-agent-policy" }
rightkit-logs = { version = "0.3.7", path = "../rightkit-logs", features = ["agent_telemetry", "tracing"], default-features = false }
rightkit-agent-tools = { version = "0.3.1", path = "../rightkit-agent-tools", features = ["coding_tools"] }
rightkit-app-settings = { version = "0.3.1", path = "../rightkit-app-settings", features = ["agent_config", "agent_config-host-env"] }
rightkit-agent-orchestration = { version = "0.1.1", path = "../rightkit-agent-orchestration" }
rightkit-adapt = { version = "0.1.0", path = "../rightkit-adapt" }
rightkit-terminal-ui = { version = "0.1.0", path = "../rightkit-terminal-ui" }
rightkit-agent-engine-tasks = { version = "0.1.0", path = "../rightkit-agent-engine-tasks" }
rightkit-evidence = { version = "0.1.0", path = "../rightkit-evidence" }
rightkit-sandbox = { version = "0.6.2", path = "../rightkit-sandbox", features = ["execution"] }
rightkit-models = { version = "0.5.3", path = "../rightkit-models", features = ["agent_local_models"] }
rightkit-agent-engine-runtime-middleware = { version = "0.1.0", path = "../rightkit-agent-engine-runtime-middleware" }
rightkit-agent-engine-runtime-resources = { version = "0.1.0", path = "../rightkit-agent-engine-runtime-resources" }
rightkit-agent-engine-storage = { version = "0.1.0", path = "../rightkit-agent-engine-storage" }
rightkit-workflow = { version = "0.2.1", path = "../rightkit-workflow" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-fs = { version = "0.4.9", path = "../rightkit-fs", features = ["digest", "fs", "json", "lock", "transaction"] }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
rightkit-file-watch = { version = "0.4.2", path = "../rightkit-file-watch" }
rightkit-oauth = { version = "0.10.0", path = "../rightkit-oauth", features = ["secrets", "system-sources"], default-features = false }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process", features = ["tokio"] }
rightkit-daemon = { version = "0.5.1", path = "../rightkit-daemon", features = ["agent_daemon_core", "agent_daemon_runtime", "local", "remote-loopback"], default-features = false }
rightkit-sidecar = { version = "0.3.0", path = "../rightkit-sidecar" }
rightkit-license = { version = "0.2.6", path = "../rightkit-license", features = ["client"] }
rightkit-device = { version = "0.4.0", path = "../rightkit-device", features = ["credentials"] }
rightkit-crash = { version = "0.3.6", path = "../rightkit-crash", features = ["support-bundle"], default-features = false }
rightkit-http = { version = "0.3.10", path = "../rightkit-http", features = ["agent_host", "async", "gzip", "untrusted"] }
rightkit-credentials = { version = "0.4.3", path = "../rightkit-credentials" }
rightkit-db = { version = "0.5.3", path = "../rightkit-db", features = ["bundled", "statement-cache"] }
rightkit-job-queue = { version = "0.5.1", path = "../rightkit-job-queue", default-features = false }
rightkit-bot-messaging = { version = "0.1.0", path = "../rightkit-bot-messaging" }
rightkit-mcp = { version = "0.7.2", path = "../rightkit-mcp", features = ["agent_mcp", "agent_mcp-host-env"] }
rightkit-agents = { version = "0.2.2", path = "../rightkit-agents", features = ["agent_acp", "agent_host"] }
rightkit-agent-engine-attention = { version = "0.1.0", path = "../rightkit-agent-engine-attention" }
rightkit-agent-engine-api-sessions = { version = "0.1.0", path = "../rightkit-agent-engine-api-sessions" }
rightkit-agent-engine-api-workflows = { version = "0.1.0", path = "../rightkit-agent-engine-api-workflows" }
rightkit-agent-engine-api-integrations = { version = "0.1.0", path = "../rightkit-agent-engine-api-integrations" }
rightkit-agent-engine-api-platform = { version = "0.1.0", path = "../rightkit-agent-engine-api-platform" }
rightkit-agent-engine-cli = { version = "0.1.0", path = "../rightkit-agent-engine-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = { version = "0.9" }
toml = { version = "1.1" }
thiserror = { version = "2" }
jsonschema = { version = "0.59", default-features = false }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tokio-stream = { version = "0.1" }
tower-http = { version = "0.7", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4" }
url = { version = "2" }
async-trait = { version = "0.1" }
async-stream = { version = "0.3" }
getrandom = { version = "0.4" }
futures-util = { version = "0.3" }
tokio-util = { version = "0.7", features = ["rt"] }
flate2 = { version = "1" }
tar = { version = "0.4" }
tracing = { version = "0.1" }
ed25519-dalek = { version = "3.0" }
tempfile = { version = "3" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
base64 = { version = "0.23" }
rightkit-app-settings = { version = "0.3.1", path = "../rightkit-app-settings", features = ["agent_config", "agent_config-test-mode"] }
rightkit-mcp = { version = "0.7.2", path = "../rightkit-mcp", features = ["agent_mcp", "agent_mcp-test-loopback"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = { version = "0.1" }
mockito = { version = "1" }
tiny_http = { version = "0.12" }
portable-pty = { version = "0.9" }
vt100 = { version = "0.16" }
