[package]
autotests = false
autobins = false
name = "rightkit-agent-server"
version = "0.3.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent server host: HTTP/daemon API routes, CLI and interactive-session runtime, session hosting and orchestration glue for coding-agent applications"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_server"
path = "src/lib.rs"

[features]
default = ["state-store-env", "workflow-a2a-env"]
# The environment may move the state stores: `<PREFIX>_{TEAM,MESSAGE,INSTINCTS,PERMISSION_RULE,
# PERMISSION_DENIAL,WORKSPACE_TRUST}_STORE`, `<PREFIX>_RUN_CHANGES_DIR`, `<PREFIX>_TELEGRAM_BINDINGS`
# and `<PREFIX>_PEER_TEAM_STORE_ROOT` (still subject to the `state_store_paths_from_environment`
# host option). Turn it off and the code that reads those variables, and their names, are not
# compiled in: every store sits under the state root.
state-store-env = []
# The environment may configure a remote A2A workflow executor: `<PREFIX>_A2A_TRUST_ROOT_PUBKEY`,
# `<PREFIX>_A2A_DESCRIPTOR_JSON` and `<PREFIX>_A2A_EXECUTOR_URL`. Turn it off and the reads, their
# names, the trust-root verifier and the remote transport are not compiled in: workflows never
# get an A2A adapter.
workflow-a2a-env = []
# The evaluation harness (benchmark, compare, terminal-bench, executed and corpus bake-offs, soak).
benchmarks = []
qualification = ["rightkit-agent-engine-core/qualification"]
fastembed = ["rightkit-onnx/session", "rightkit-agent-coding-tools/embeddings"]

[dependencies]
rightkit-doctor = { version = "0.2.0", path = "../rightkit-doctor" }
rightkit-agent-plugins = { version = "0.1.4", path = "../rightkit-agent-plugins" }
rightkit-agent-recipes = { version = "0.1.3", path = "../rightkit-agent-recipes" }
rightkit-onnx = { version = "0.3.0", path = "../rightkit-onnx", features = ["agent_ort"], default-features = false }
rightkit-agent-engine-protocol = { version = "0.4.1", path = "../rightkit-agent-engine-protocol" }
rightkit-agent-engine-core = { version = "0.2.1", path = "../rightkit-agent-engine-core" }
rightkit-hooks = { version = "0.3.1", path = "../rightkit-hooks", features = ["agent_hooks", "agent_hooks-host-env"] }
rightkit-llm = { version = "0.7.2", path = "../rightkit-llm", features = ["agent_providers", "agent_providers-os-keyring", "agent_providers-host-env", "agent_router", "agent_router-os-keyring"] }
rightkit-memory-client = { version = "0.1.1", path = "../rightkit-memory-client", features = ["agent_host"] }
rightkit-agent-policy = { version = "0.2.4", path = "../rightkit-agent-policy" }
rightkit-logs = { version = "0.4.5", path = "../rightkit-logs", features = ["tracing"], default-features = false }
rightkit-agent-telemetry = { version = "0.1.1", path = "../rightkit-agent-telemetry" }
rightkit-agent-coding-tools = { version = "0.2.1", path = "../rightkit-agent-coding-tools", features = ["host"] }
rightkit-agent-config = { version = "0.1.6", path = "../rightkit-agent-config", features = ["host-env"] }
rightkit-agent-orchestration = { version = "0.1.8", path = "../rightkit-agent-orchestration" , features = ["coding", "coding-host"] }
rightkit-agent-learning = { version = "0.1.2", path = "../rightkit-agent-learning" }
rightkit-terminal-ui = { version = "0.2.0", path = "../rightkit-terminal-ui" }
rightkit-agent-engine-tasks = { version = "0.3.0", path = "../rightkit-agent-engine-tasks" }
rightkit-evidence = { version = "0.1.1", path = "../rightkit-evidence" }
rightkit-sandbox = { version = "0.7.0", path = "../rightkit-sandbox", features = ["execution"] }
rightkit-agent-local-models = { version = "0.1.3", path = "../rightkit-agent-local-models" }
rightkit-agent-engine-runtime-middleware = { version = "0.1.4", path = "../rightkit-agent-engine-runtime-middleware" }
rightkit-agent-engine-runtime-resources = { version = "0.1.2", path = "../rightkit-agent-engine-runtime-resources" }
rightkit-agent-engine-storage = { version = "0.3.1", path = "../rightkit-agent-engine-storage", features = ["workflow"] }
rightkit-workflow = { version = "0.2.4", path = "../rightkit-workflow" , features = ["control_plane", "control_plane_host"] }
rightkit-crypto = { version = "0.1.4", path = "../rightkit-crypto" }
rightkit-fs = { version = "0.5.2", path = "../rightkit-fs", features = ["digest", "fs", "json", "lock", "transaction"] }
rightkit-time = { version = "0.1.5", path = "../rightkit-time" }
rightkit-file-watch = { version = "0.4.4", path = "../rightkit-file-watch" }
rightkit-oauth = { version = "0.11.1", path = "../rightkit-oauth", features = ["secrets", "system-sources"], default-features = false }
rightkit-child-process = { version = "0.5.17", path = "../rightkit-child-process", features = ["tokio"] }
rightkit-daemon = { version = "0.9.4", path = "../rightkit-daemon", features = ["local", "remote-loopback", "lan-discovery"], default-features = false }
rightkit-agent-daemon = { version = "0.2.0", path = "../rightkit-agent-daemon" }
rightkit-sidecar = { version = "0.3.4", path = "../rightkit-sidecar", features = ["tokio"] }
rightkit-license = { version = "0.3.5", path = "../rightkit-license", features = ["engine-snapshot", "client"] }
rightkit-crash = { version = "0.4.3", path = "../rightkit-crash", features = ["support-bundle"], default-features = false }
rightkit-http = { version = "0.4.1", path = "../rightkit-http", features = ["async", "gzip", "untrusted"] }
rightkit-credentials = { version = "0.5.10", path = "../rightkit-credentials" }
rightkit-db = { version = "0.5.11", path = "../rightkit-db", features = ["bundled", "statement-cache"] }
rightkit-job-queue = { version = "0.6.2", path = "../rightkit-job-queue", default-features = false, features = ["supervisor"] }
rightkit-github = { version = "0.2.1", path = "../rightkit-github" }
rightkit-scheduler = { version = "0.3.1", path = "../rightkit-scheduler" }
rightkit-context-protocol = { version = "0.2.1", path = "../rightkit-context-protocol" }
rightkit-bot-messaging = { version = "0.3.2", path = "../rightkit-bot-messaging" }
rightkit-mcp = { version = "0.10.1", path = "../rightkit-mcp", features = ["agent_mcp", "agent_mcp-os-keyring", "agent_mcp-host-env", "advanced-http"] }
rightkit-agents = { version = "0.3.0", path = "../rightkit-agents", features = ["agent_acp", "agent_host"] }
rightkit-agent-engine-attention = { version = "0.2.2", path = "../rightkit-agent-engine-attention", features = ["server"] }
rightkit-agent-engine-api-workflows = { version = "0.2.0", path = "../rightkit-agent-engine-api-workflows" }
rightkit-agent-engine-api-integrations = { version = "0.1.6", path = "../rightkit-agent-engine-api-integrations" }
rightkit-agent-engine-api-platform = { version = "0.1.3", path = "../rightkit-agent-engine-api-platform" }
rightkit-agent-skills = { version = "0.2.0", path = "../rightkit-agent-skills" }
rightkit-agent-engine-history = { version = "0.1.6", path = "../rightkit-agent-engine-history" }
rightkit-agent-tools = { version = "0.4.4", path = "../rightkit-agent-tools", default-features = false }
rightkit-agent-engine-cli = { version = "0.1.1", path = "../rightkit-agent-engine-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = { version = "0.9" }
toml = { version = "1.1" }
thiserror = { version = "2" }
jsonschema = { version = "0.60", default-features = false }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tokio-stream = { version = "0.1" }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4" }
url = { version = "2" }
async-trait = { version = "0.1" }
async-stream = { version = "0.3" }
getrandom = { version = "0.4" }
futures-util = { version = "0.3" }
tokio-util = { version = "0.7", features = ["rt"] }
flate2 = { version = "1" }
tar = { version = "0.4" }
tracing = { version = "0.1" }
ed25519-dalek = { version = "3.0" }
tempfile = { version = "3" }
base64 = { version = "0.23" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { version = "0.6" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
