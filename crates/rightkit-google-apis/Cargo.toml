[package]
name = "rightkit-google-apis"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Async Google Workspace REST clients: Gmail (sync, history, batch fetch, MIME, compose, labels, filters, settings, drafts, attachments), Calendar, Drive, People, Tasks and Meet, with desktop OAuth and shared retry/backoff."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_google_apis"
path = "src/lib.rs"

[dependencies]
base64 = { version = "0.22" }
getrandom = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
rightkit-http = { version = "0.3.9", features = ["gzip", "untrusted", "async"], path = "../rightkit-http" }
rightkit-oauth = { version = "0.10.0", default-features = false, features = ["google"], path = "../rightkit-oauth" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["digest"], path = "../rightkit-fs" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }


[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
