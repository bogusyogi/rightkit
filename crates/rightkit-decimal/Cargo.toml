[package]
name = "rightkit-decimal"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Exact decimal owner: parse a decimal string, canonical form, total ordering and lt/le/eq/ge/gt comparison with no floats, bounded input, std only."
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["decimal", "compare", "exact", "threshold"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]

[package.metadata.rightkit]
continuous = false
continuous_reason = "pure computation library: decimal parsing and comparison; spawns no continuous work"

# One Cargo workspace and lock per crate (rightkit#1285).
