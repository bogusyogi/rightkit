[package]
name = "rightkit-evidence-contracts"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Evidence contracts: plans, providers, findings reports, receipts, traces, source anchors and canonical JSON digests"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence_contracts"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = { version = "2.0.20" }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
