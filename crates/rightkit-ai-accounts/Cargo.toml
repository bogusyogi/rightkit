[package]
name = "rightkit-ai-accounts"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
description = "AI assistant account management for Claude: Desktop login slots and switching, chat sync and mirroring between accounts, command-line account folders, and account names."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_ai_accounts"
path = "src/lib.rs"

[dependencies]
rightkit-app-host = { version = "0.1.0", path = "../rightkit-app-host" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "lock", "digest"], path = "../rightkit-fs" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sysinfo = { version = "=0.39.6" }
thiserror = { version = "2" }
