[package]
name = "rightkit-pdf"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral PDF engine: inspect, compose (source-text replace / add text / OCR correction), font subsetting, staged atomic save, plus optional page merge/select and text extraction"
readme = "README.md"
repository = "https://github.com/Orthic-Labs/rightkit"
include = [
  "src/**",
  "assets/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[features]
# Default keeps every pre-existing surface: merge, edit (compose/save/commit) and fonts.
default = ["merge", "edit", "fonts"]
# Font catalog (fontdb), parsing (ttf-parser), subsetting (subsetter) and WOFF2 (wuff).
fonts = ["dep:fontdb", "dep:ttf-parser", "dep:subsetter", "dep:wuff"]
# Compose, staged save and atomic commit (getrandom tokens; the replacement is rightkit-fs's
# AtomicWriter). Add-text needs `fonts`.
edit = ["fonts", "dep:getrandom", "dep:rightkit-fs"]
# Page merge / selection built on lopdf (Legion deck export donor, hardened for inherited page attributes).
merge = []
# Whole-document and per-page text extraction (ScrapeRight donor; pdf-extract, no PDFium).
extract = ["dep:pdf-extract"]
# Page rasterization of scanned (image) pages to gray/RGBA buffers or PNG, for OCR. Draws image
# XObjects only (no PDFium); JPEG and PNG through `image` with just those two codecs.
raster = ["dep:image"]

[dependencies]
lopdf = { version = "0.44.0", default-features = false, features = ["rayon"] }
thiserror = "2.0.20"
fontdb = { version = "0.24.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
subsetter = { version = "0.2.6", optional = true }
wuff = { version = "0.2.8", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
getrandom = { version = "0.4.3", optional = true }
pdf-extract = { version = "0.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# The one writer behind a commit (temp sibling, flush, rename, directory sync). `fs` is the smallest
# feature set that has `AtomicWriter`; `json`, `lock` and `digest` are not needed.
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"], optional = true }

# Windows file identity (volume serial + file id) read from an opened handle; see `commit.rs`. Only
# that: the file replacement itself is rightkit-fs's.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1.0.150"
image = { version = "0.25", default-features = false, features = ["png"] }
# Fault seam around the replace call (debug and test builds only; a release build with it fails to
# compile): proves a failed publish leaves the original file. Same pattern as rightkit-app-settings.
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs", "testing"] }
