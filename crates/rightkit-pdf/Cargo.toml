[package]
name = "rightkit-pdf"
version = "0.3.4"
edition = "2021"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
description = "Product-neutral PDF engine: inspect, compose (source-text replace / add text / OCR correction), font subsetting, staged atomic save, plus optional page merge/select and text extraction"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = [
  "src/**",
  "assets/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[features]
# Default keeps every pre-existing surface: merge, edit (compose/save/commit) and fonts.
default = ["merge", "edit", "fonts"]
# Font catalog (fontdb), parsing (ttf-parser), subsetting (subsetter) and WOFF2 (wuff).
fonts = ["dep:fontdb", "dep:ttf-parser", "dep:subsetter", "dep:wuff"]
# Compose, staged save and atomic commit (getrandom tokens; the replacement is rightkit-fs's
# AtomicWriter). Add-text needs `fonts`.
edit = ["fonts", "dep:getrandom", "dep:rightkit-fs"]
# Page merge / selection built on lopdf (Legion deck export donor, hardened for inherited page attributes).
merge = []
# Whole-document and per-page text extraction (ScrapeRight donor; pdf-extract, no PDFium).
extract = ["dep:pdf-extract"]
# Page rasterization of scanned (image) pages to gray/RGBA buffers or PNG, for OCR. Draws image
# XObjects only (no PDFium); JPEG and PNG through `image` with just those two codecs.
raster = ["dep:image"]
# Redaction: remove text, images, paths and annotations under marked areas, fail closed, full rewrite (`src/redact.rs`).
redact = []
# AcroForm: list fields, set values, generate appearances, typed refusals (`src/forms.rs`).
forms = []
# Size reduction: unused-object clean-up, stream compression, measured image downsampling (`src/optimize.rs`).
optimize = []
# Native PDF view host (`src/host`): one PDFKit view per window with owner isolation, a bounded cache
# of suspended views, find, print and typed events. macOS builds the PDFKit backend (the objc2 crates
# below); every other platform builds no native code and answers `HostError::Unsupported`. Needs no
# window system: the caller (rightkit-tauri-shell's `pdf-host` feature) hands in the native parent view.
host = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-pdf-kit", "dep:block2"]

[dependencies]
lopdf = { version = "0.46", default-features = false, features = ["rayon"] }
thiserror = "2.0.21"
fontdb = { version = "0.24.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
subsetter = { version = "0.2.6", optional = true }
wuff = { version = "0.2.9", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
getrandom = { version = "0.4.3", optional = true }
pdf-extract = { version = "0.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# The one writer behind a commit (temp sibling, flush, rename, directory sync). `fs` is the smallest
# feature set that has `AtomicWriter`; `json`, `lock` and `digest` are not needed.
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs"], optional = true }

# The PDFKit backend of the `host` feature (macOS only; the target table keeps them out of every other
# platform's build even with the feature on). Versions match rightkit-tauri-shell's objc2 family.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-pdf-kit = { version = "0.3.2", optional = true }
block2 = { version = "0.6.2", optional = true }

# Windows file identity (volume serial + file id) read from an opened handle; see `commit.rs`. Only
# that: the file replacement itself is rightkit-fs's.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1.0.154"
image = { version = "0.25", default-features = false, features = ["png"] }
# Fault seam around the replace call (debug and test builds only; a release build with it fails to
# compile): proves a failed publish leaves the original file. Same pattern as rightkit-app-settings.
rightkit-fs = { version = "0.4.0", path = "../rightkit-fs", default-features = false, features = ["fs", "testing"] }

[package.metadata.rightkit]
continuous = false
continuous_reason = "PDF render and font listing per call; resident-static is FontCatalog::shared, one OnceLock font catalog built once per process (fontdb system-font metadata, sized by the installed fonts, never grown afterwards), and the crate spawns no thread, timer or other continuous work. Feature host adds held native views: at most one active PDFKit view per window plus at most HostConfig::parked_limit (default 8) suspended views kept for at most parked_max_age (default 30 s, expired by calls and by an explicit PdfHost::sweep, never by a timer in this crate), one local key monitor per active view removed on suspend and close, and a bounded 256-entry event outbox"
