[package]
name = "rightkit-web-extract"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Article extraction with an optional rightkit-http transport: readable-text parsing, title and redirect resolution, blocked-page detection, BM25 fit filtering, and extraction-ladder decisions."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_web_extract"
path = "src/lib.rs"

[features]
# `transport` module: `HttpNet`, an `ArticleNet` over rightkit-http's strict public-web policy.
transport = ["dep:rightkit-http"]

[dependencies]
rightkit-http = { version = "0.3.10", path = "../rightkit-http", optional = true }
regex = { version = "1.13.1" }
scraper = { version = "0.29" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
libloading = { version = "0.9" }


[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
