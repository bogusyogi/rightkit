[package]
name = "rightkit-web-extract"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Article extraction without transport: readable-text parsing, title and redirect resolution, blocked-page detection, BM25 fit filtering, and extraction-ladder decisions."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_web_extract"
path = "src/lib.rs"

[dependencies]
regex = { version = "1.13.1" }
scraper = { version = "0.27" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
libloading = { version = "0.9" }
