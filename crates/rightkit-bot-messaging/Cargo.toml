[package]
name = "rightkit-bot-messaging"
version = "0.1.2"
edition = "2021"
rust-version = "1.98.0"
description = "Bot messaging bridge: remote chat channels (Telegram, Slack, Discord style) relaying agent sessions with policy-checked commands"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_bot_messaging"
path = "src/lib.rs"

[dependencies]
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-agent-engine-protocol = { version = "0.2.0", path = "../rightkit-agent-engine-protocol" }
rightkit-agent-policy = { version = "0.1.0", path = "../rightkit-agent-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1" }
async-trait = { version = "0.1" }
rightkit-http = { version = "0.3.9", features = ["gzip", "untrusted", "async"], path = "../rightkit-http" }
rightkit-agent-daemon = { version = "0.1.0", path = "../rightkit-agent-daemon" }
url = { version = "2" }
