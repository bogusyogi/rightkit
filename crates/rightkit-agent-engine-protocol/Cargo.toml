[package]
name = "rightkit-agent-engine-protocol"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Agent engine protocol: events, envelopes, tool calls, trust wrapping and settlement types shared by agent hosts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_agent_engine_protocol"
path = "src/lib.rs"

[dependencies]
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
