[package]
name = "rightkit-passkeys"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Passkey authenticator adapter over passkey-rs for Right Suite apps: a CredentialStore trait the consumer implements, request normalisation, and truthful user-presence and user-verification flags."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
keywords = ["passkey", "webauthn", "ctap2", "authenticator"]
categories = ["authentication"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.rightkit]
continuous = false
continuous_reason = "adapter types over passkey-rs: no thread, task, timer, listener, watcher or resident static; every call is driven by the caller's authenticator request"

[dependencies]
async-trait = "0.1"
passkey-authenticator = "0.6"
passkey-crypto = "0.1"
passkey-types = "0.6"

# One Cargo workspace and lock per crate (rightkit#1285).
