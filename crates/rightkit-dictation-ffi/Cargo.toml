[package]
name = "rightkit-dictation-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Stable C surface for native shells over the dictation text pipeline, ASR audio conditioning and Parakeet detokenization."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_dictation_ffi"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
serde_json = "1"
rightkit-text-polish = { version = "0.1.0", path = "../rightkit-text-polish" }
rightkit-dictation-core = { version = "0.2.0", path = "../rightkit-dictation-core" }
rightkit-asr = { version = "0.3.4", default-features = false, path = "../rightkit-asr" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
