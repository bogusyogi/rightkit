[package]
name = "rightkit-evidence"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.0"
description = "Evidence and spec records: requirement specs, acceptance evidence and verification status for agent work"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_evidence"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
