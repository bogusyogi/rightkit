[package]
name = "rightkit-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Benchmark harness building blocks: warmup-and-percentile timing, SQLite EXPLAIN QUERY PLAN probes, and article-quality corpus scoring with a reference extractor."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_bench"
path = "src/lib.rs"

[features]
default = []
# EXPLAIN QUERY PLAN probes; the caller's rightkit-db features pick the SQLite build.
sqlite = ["dep:rightkit-db"]

[dependencies]
scraper = { version = "0.27" }
serde = { version = "1.0.229", features = ["derive"] }
rightkit-db = { version = "0.5.3", optional = true, path = "../rightkit-db" }
[dev-dependencies]
rightkit-db = { version = "0.5.3", features = ["bundled"], path = "../rightkit-db" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
