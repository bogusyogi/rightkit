[package]
name = "rightkit-local-gen"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Keyless local image generation: managed sd.cpp server runtime, memory modes, model profiles, durable job store and artifacts"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bogusyogi/rightkit"
include = ["src/**", "tests/**", "data/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rightkit_local_gen"
path = "src/lib.rs"

[dependencies]
rightkit-http = { version = "0.3.9", default-features = false, features = ["gzip"], path = "../rightkit-http" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
rightkit-crypto = { version = "0.1.0", path = "../rightkit-crypto" }
rightkit-fs = { version = "0.4.9", default-features = false, features = ["fs", "digest"], path = "../rightkit-fs" }
rightkit-time = { version = "0.1.1", path = "../rightkit-time" }
rand = { version = "0.10" }
time = { version = "0.3", features = ["formatting"] }
rightkit-db = { version = "0.5.3", features = ["bundled", "statement-cache"], path = "../rightkit-db" }
rightkit-logs = { version = "0.3.7", path = "../rightkit-logs" }
rightkit-models = { version = "0.5.3", path = "../rightkit-models" }
rightkit-job-queue = { version = "0.5.1", features = ["store", "service", "supervisor"], path = "../rightkit-job-queue" }
rightkit-child-process = { version = "0.5.7", path = "../rightkit-child-process" }
rightkit-daemon = { version = "0.5.1", path = "../rightkit-daemon" }
rightkit-app-settings = { version = "0.3.1", path = "../rightkit-app-settings" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
rightkit-models = { version = "0.5.3", features = ["test-mode"], path = "../rightkit-models" }

[workspace]

# Canonical build profiles, one copy per crate workspace (rightkit#1285); the managed broker forbids
# .cargo/config.toml, so manifest profiles are the only place build cost is shaped.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
