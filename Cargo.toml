[workspace]
resolver = "2"
members = ["crates/*"]
# Hook receipt directories (`.audit`) can appear under crates/ when an agent works there.
# vendor/tauri-runtime-wry is a patched third-party crate consumed by apps as a git `[patch]` source
# (docs/design/tauri-runtime-wry-windows-rc.md); it must never build with this workspace.
exclude = ["crates/.audit", "vendor/tauri-runtime-wry"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Build-time profile tuning. The managed broker forbids `.cargo/config.toml`
# (it rejects any workspace config that redirects tools, outputs, or flags), so
# manifest profiles are the only place workspace-wide build cost can be shaped.
#
# This host is 8 cores / 8.6 GB, and the broker admits one concurrent build at
# up to 4 jobs — so peak memory, not core count, is the binding constraint.
# Every setting below reduces per-compile memory and link time rather than
# adding parallelism, which is what actually makes builds finish here.

[profile.dev]
# Line tables keep file/line in backtraces and panics; they drop the type,
# variable, and scope DWARF that dominates both object size and link time.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not debugged from source, so they need no debug info at all.
# With 275 crates in the lock this is the single largest dev-build saving.
debug = false

[profile.dev.build-override]
# Build scripts and proc macros run on the host and are never stepped through.
debug = false
opt-level = 0

[profile.test]
debug = "line-tables-only"

# rightkit-record's capture hot path (readback, BLAKE3 over every kept frame, BGRA to NV12) is
# per-pixel code. At opt-level 0 it ran at about 8 fps for a 2000x1300 window on the Dell
# (2026-10-15), so a debug-profile helper dropped most frames to backpressure. Optimise these
# packages in dev and test builds; everything else keeps the cheap profile above.
[profile.dev.package.rightkit-record]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.test.package.rightkit-record]
opt-level = 3
[profile.test.package.blake3]
opt-level = 3

[profile.test.package."*"]
debug = false

# Optimised local profile the build brokers allow (they build development profiles only, never `release`).
# Runtime-budget benches run here: `rightkit cargo test --profile release-iterate -p <crate> --bench budget`.
[profile.release-iterate]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.release-iterate.package."*"]
incremental = false

[profile.test.build-override]
debug = false
opt-level = 0
