packages:
  - packages/*
  # Parked 2026-10-16 (own-cloud sync): kept in the tree, not installed, built or published.
  - '!packages/sync-worker'

# Internal development uses canonical sources; consumer manifests keep registry pins.
linkWorkspacePackages: true
preferWorkspacePackages: true

overrides:
  '@wdio/native-utils': 2.5.0
  # GHSA-238p-pmpm-9mq7 (katex <0.18.2): micromark-extension-math 3.1.0 still asks for ^0.16.
  katex: ^0.18.2

allowBuilds:
  # Transitive WDIO browser drivers. The native lane drives Tauri's own WebDriver,
  # never Edge or Firefox, so their download postinstalls stay off.
  # node-canvas (fabric transitive) is unused — media-ui renders on the DOM
  # canvas only, so its native postinstall stays off.
  canvas: false
  edgedriver: false
  esbuild: true
  geckodriver: false

minimumReleaseAgeExclude:
  # Registry releases exist only under the old names (renamed to app-update / ci in the tree).
  - '@rightkit/updates@0.2.2 || 0.2.3'
  - '@rightkit/git@0.2.37'
