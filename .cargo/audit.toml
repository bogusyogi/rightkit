# reason, owner and reviewBy live in that file and packages/release/advisory-exceptions.mjs
# fails when this list differs.
[advisories]
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0235",
  "RUSTSEC-2024-0429",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
