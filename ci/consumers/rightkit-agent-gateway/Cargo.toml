[package]
name = "rightkit-agent-gateway-registry-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rightkit-agent-gateway = { version = "=0.1.1" }
serde_json = "1"
# Windows has no system SQLite: the consumer links the bundled one, as the crate's own tests do.
rightkit-db = { version = "0.5.2", default-features = false, features = ["bundled"] }
