[package]
name = "rightkit-credentials-r2-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rightkit-credentials = { version = "=0.4.2", default-features = false, features = ["db-adapter"] }
rightkit-db = { version = "=0.5.1", default-features = false, optional = true }

[features]
# The sealed plain build resolves db-adapter, which deliberately selects no provider in the
# credentials crate; the consumer selects the system provider so that build compiles.
default = ["sqlcipher-system"]
db-session = ["rightkit-credentials/db-adapter", "dep:rightkit-db", "rightkit-db/encrypted-lifecycle"]
sqlcipher = ["db-session", "rightkit-db/sqlcipher"]
sqlcipher-system = ["db-session", "rightkit-db/sqlcipher-system"]
