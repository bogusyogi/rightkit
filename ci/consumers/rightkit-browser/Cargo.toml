[package]
name = "rightkit-browser-r2-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
chromiumoxide = { version = "=0.9.1", default-features = false }
rightkit-browser = { version = "=0.3.5", default-features = false, features = ["cookie-export"] }
rightkit-fs = { version = "=0.4.6", default-features = false, features = ["fs"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
