[package]
name = "rightkit-record-windows"
version = "0.1.0"
edition = "2021"
publish = false
description = "RK3 Windows recorder helper: Windows.Graphics.Capture for one HWND, writing frames and record-event NDJSON"

[[bin]]
name = "rightkit-record-windows"
path = "src/main.rs"

[dependencies]
rightkit-contracts = { path = "../../crates/rightkit-contracts" }
serde_json = "1.0.150"
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Metadata",
    "Security_Authorization_AppCapabilityAccess",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Standalone: not a member of the RightKit workspace.
[workspace]
